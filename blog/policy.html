<!-- pc:block b0001 -->
# Predicate Chess

<!-- pc:block b0002 -->
*Policies and Merger*

<!-- pc:block b0003 -->
**Priyomes · October 5, 2026**

<!-- pc:block b0004 -->
A good policy should do well on two axes; it should solve the position at hand efficiently if it's in its cover, and it should minimize overall effort across the cover. We would be glad to trade a few extra thoughts for a more efficient global strategy, or a wider cover.

<!-- pc:block b0005 -->
When two policies are merged, the result should be one policy. We need to define what it means to merge two different policies. That's how we can combine our experience across multiple puzzles into a coherent system of thinking. You learn once when finding the best move, a second time when anticipating and classing opponent repairs, and a third time when consolidating what you've learned.

<!-- pc:block b0006 -->


<!-- pc:block b0007 -->
## 1. What a policy contains

<!-- pc:block b0008 -->
Consider a two-player, perfect-information game. A game state s contains everything required to determine the legal moves and the result of making one.

<!-- pc:block b0009 -->
Write L(s) for the legal moves at s and s·m for the state after move m. An Oracle supplies named predicates about a state, or about a legal move and its resulting state. For example:

<!-- pc:block b0010 -->
```text
in_check(s, Black)
attacks(s, white_knight, black_queen)
gives_check(s, m)
captures_queen(s, m)
```

<!-- pc:block b0011 -->
.

<!-- pc:block b0012 -->
A policy is defined to be a finite set of cards, explicit transition rules, a move stack, a budget, and an objective. A bounded plan stack can remember a small number of unfinished ideas. Each frame must say which plan is active and which pieces or squares it concerns. An objective is a collection of predicates. Each card C has a list of predicates which class the order to search moves at the next ply, and transition rules for when to move to the next card.

<!-- pc:block b0013 -->
Strictly speaking, this is a **finite controller with stack memory**. The controller is deterministic: given its current card, stored information, and predicate values, its next instruction is fixed.

<!-- pc:block b0014 -->
A queue is first-in, first-out. A stack is last-in, first-out. Either can hold pending moves, but the choice changes the search order. The examples below use a stack and a fixed move order.

<!-- pc:block b0015 -->
### The basic cycle

<!-- pc:block b0016 -->
At the player to move's turn, enumerate every legal move and put it in the current position's candidate list. Take one candidate, inspect the relevant current-board and next-board predicates, and apply the card's rules. Those rules can attach a plan, try the move, move to another card, or reject that candidate.

<!-- pc:block b0017 -->
“Every legal move was listed” does not mean “every continuation was searched.” Even a rejected candidate may require a one-ply observation. Those observations count toward the position budget.

<!-- pc:block b0018 -->
At the opponent's turn, a proof of a forced result must handle every legal defense. A card may group equivalent defenses, but it needs an argument for that grouping. We may dismiss certain opponent defenses soon consideration as insufficiently addressing the problem at hand. That may speed up calculation but might also change puzzle coverage for a given policy.

<!-- pc:block b0019 -->
The halting results should distinguish **objective proved**, **bounded alternatives exhausted**, and **budget exhausted**. Running out of budget does not prove that a position is lost.

<!-- pc:block b0020 -->


<!-- pc:block b0021 -->
### Objective and quiet

<!-- pc:block b0022 -->
The default objective here is **ahead in material**:

<!-- pc:block b0023 -->
```text
O(s) := White's material − Black's material > 0
```

<!-- pc:block b0024 -->
Use pawn = 1, knight = bishop = 3, rook = 5, and queen = 9. This is a deliberately simple accounting rule. “Ahead” is an absolute comparison at s; it is not the same as improving the material balance from the starting position.

<!-- pc:block b0025 -->
The forcing class discussed earlier was **checks, captures, and promotions**. At a state where Black has the move:

<!-- pc:block b0026 -->
```text
F(s) := Black's legal checks, captures, and promotions
Q(s) := F(s) is empty
```

<!-- pc:block b0027 -->
The examples also exclude terminal draws from successful stopping positions. They accept a material result only at a Black-to-move state satisfying O and Q. An extra one-ply inspection may be needed to establish Q, and that inspection counts.

<!-- pc:block b0028 -->
These definitions establish a bounded tactical objective. They do not establish that White wins the entire game. In particular, a quiet move that creates a mating threat is outside this chosen F.

## 2. Coordinate free policy

<!-- pc:block b0030 -->
A benefit of the predicate approach is that the same search strategy can immediately apply to a range of different puzzles, simply because the abstraction from board to predicates assigns multiple different positions to the same predicates.   
  
To get out of chess a second, we observe The same controller can navigate a bakery. Suppose the stock and prices are visible and remain fixed during the visit. The objective is to leave with a nice paid-for item. Sweets are preferred; bread is the fallback.

<!-- pc:block b0031 -->
| Card | Predicate | Next action or card |
| --- | --- | --- |
| Enter | The shop is open | Inspect the counter. |
| Enter | The shop is closed | Leave; objective not reached. |
| Choose sweets | Sweets are available and affordable | Select sweets; go to Pay. |
| Choose sweets | Otherwise | Go to Choose bread. |
| Choose bread | Bread is available and affordable | Select bread; go to Pay. |
| Choose bread | Otherwise | Leave; objective not reached. |
| Pay | The selected item is still available and payment is accepted | Receive the item; go to Finish. |
| Pay | Otherwise | Return to the remaining alternative, within the retry budget. |
| Finish | The item is received and paid for | Halt successfully. |

<!-- pc:block b0035 -->
## 3. Three small chess plans

<!-- pc:block b0036 -->
For a first experiment, use three narrow plans:

<!-- pc:block b0037 -->
| Plan | Facts that suggest it | Intended follow-up |
| --- | --- | --- |
| Knight fork | The moved knight checks the king and attacks a queen. | Examine every legal defense, then try to take the queen. |
| Discovered check | Moving a piece uncovers a sliding check, and the moved piece attacks a queen. | Examine every legal defense, then try to take the queen. |
| Take the queen | A legal move captures a queen. | Test the resulting material and quiet conditions. |

<!-- pc:block b0038 -->
These are plans to investigate, not conclusions that the tactic works. A checking response, recapture, or defended target can still spoil the line.

<!-- pc:block b0039 -->
Moves supported by a plan get attention before unsupported moves. But the number of labels is not a sensible score. “Royal fork,” “knight fork of king and queen,” and “check plus attack on the queen” may all describe the same move and the same follow-up. Renaming one idea three times must not move it up the queue.

<!-- pc:block b0040 -->
### Position A: a royal fork

<!-- pc:block b0041 -->
```chess
[Schema "predicate-chess/1"]
[Id "policy-royal-fork"]
[Title "A knight check leaves the queen attacked"]
[View "line"]
[Orientation "white"]
[Objective "White is ahead in material at a position with no Black check, capture, or promotion."]
[SetUp "1"]
[FEN "3q3k/8/3N4/8/8/8/P7/K7 w - - 0 1"]

{White starts five material points behind. The proposed plan must actually find a gain, not merely name the pattern.}
1. Nf7+ {The knight checks h8 and attacks d8. [%cal Gf7h8,Gf7d8]}
1... Kh7 {One of Black's three legal replies.}
(1... Kg8 2. Nxd8 {The same capture works here.})
(1... Kg7 2. Nxd8 {The same capture works here too.})
2. Nxd8 {White is now four material points ahead. Black has no legal check, capture, or promotion.}
*
```

<!-- pc:block b0042 -->
Work backward from the last position. The objective holds after Nxd8. Immediately before it, White needs a legal queen capture that leaves O and Q true. Before Black's reply, White needs that follow-up to survive **every** legal defense. At the first move, the board facts suggest a knight fork.

<!-- pc:block b0043 -->
This suggests a four-card program:

<!-- pc:block b0044 -->
```text
ENTRY:     Try a knight check that attacks a queen, or a queen capture.
DEFEND:    Examine every legal Black reply.
FOLLOWUP:  Try legal queen captures.
STOP:      Accept only when O and Q hold.
```

<!-- pc:block b0045 -->
A failed STOP test rejects that line. It does not rewrite the board fact to say the queen was never attacked.

<!-- pc:block b0046 -->
### Position B: a discovered check

<!-- pc:block b0047 -->
```chess
[Schema "predicate-chess/1"]
[Id "policy-discovered-check"]
[Title "The bishop moves; the rook checks"]
[View "line"]
[Orientation "white"]
[Objective "White is ahead in material at a position with no Black check, capture, or promotion."]
[SetUp "1"]
[FEN "4k3/8/8/8/4B3/8/P7/K3R2q w - - 0 1"]

{The sides start level in material. Bc6 is the chosen exemplar, not the only move that gains material.}
1. Bc6+ {The rook checks along the e-file. The bishop also checks e8 and attacks h1. [%cal Ge1e8,Gc6h1]}
1... Kf8 {The king moves; the queen remains attacked.}
(1... Kd8 2. Bxh1 {White reaches the same material objective.})
(1... Kf7 2. Bxh1 {White reaches the same material objective.})
2. Bxh1 {White is nine material points ahead and Black has no legal check, capture, or promotion.}
*
```

<!-- pc:block b0048 -->
The last three cards are the same. The different first step is a discovered check rather than a knight fork.

<!-- pc:block b0049 -->
The solution suggests the rule **uncover a check while attacking the queen**. It does not suggest a rule saying “on this exact FEN, play Bc6.” The first is a proposed chess policy. The second is a remembered answer.

<!-- pc:block b0050 -->
A single solution does not uniquely determine its policy.  Negative examples are useful here. So are positions where the proposed first move works but the policy's stopping test is too optimistic.

## 4. Coverage: reproduce which line, within which budget?

<!-- pc:block b0053 -->
A puzzle record x contains an initial state s₀ and an exemplar line ℓ. Let the policy run under a budget B = (μ, ν), where μ limits declared microsteps and ν limits observed positions. The accounting convention must be the same for every policy being compared.

<!-- pc:block b0054 -->
**Exemplar coverage** means that the policy reproduces the supplied line before exceeding the budget. A set is covered when every record in it is covered. Finding a different winning move does not establish exemplar coverage.

<!-- pc:block b0055 -->
In symbols:

<!-- pc:block b0056 -->
```text
Cover(P, B) = { (s₀, ℓ) : P reproduces ℓ from s₀ within B }
```

<!-- pc:block b0057 -->
A completed tactical proof is a separate, stronger requirement: the endpoint must satisfy O and Q, and every required defense must be answered. The demonstration below checks both exemplar coverage and that stronger proof condition. A single reproduced line is not silently treated as a forced win.

<!-- pc:block b0058 -->
The exemplar is used to check the result, not to choose the moves. The runtime must not consult the answer while deciding what to search.

<!-- pc:block b0059 -->
For these demonstrations, the search records all successful alternatives in its bounded three-ply search. It does not halt as soon as it finds any successful root move. That distinction matters: in Position B, a direct queen capture also works. A policy can reach the material objective without reproducing Bc6.

<!-- pc:block b0060 -->
For a deterministic program that returns exactly one line, it may be impossible to preserve two different required outputs for the same initial state. A proof graph can record both. The coverage definition must say which output is being judged.

<!-- pc:block b0061 -->
## 5. A merger should produce one policy

<!-- pc:block b0062 -->


<!-- pc:block b0063 -->
A **policy merger** is a compilation from two compatible card programs into one card program with a shared predicate vocabulary, shared operations, and one deterministic search controller. The result has one move stack and one shared work table. There should be no requirement to remember the original policy. Another way to consider the problem is as a fusion of subgraph on an abstract predicate space. \[To-do: explain more\].

<!-- pc:block b0064 -->
The inputs must agree on the rules of the game, the objective, quiet, terminal outcomes, relevant history, and the meaning of each card interface.

<!-- pc:block b0065 -->
There are three distinct kinds of sharing.

<!-- pc:block b0066 -->
### Share predicate definitions

<!-- pc:block b0067 -->
Two names can mean the same fact. In the demonstration, `check` and `blackChecked` both mean that the legal candidate's resulting position puts Black in check. They become one definition and one cached test for that candidate.

<!-- pc:block b0068 -->
Equality must come from the definitions, not the spelling. “Attacked,” “legally capturable,” and “profitable to capture” are different predicates. Negation must also be explicit: an unevaluated predicate is not false.

<!-- pc:block b0069 -->


<!-- pc:block b0070 -->
### Share identical work inside different plans

<!-- pc:block b0071 -->
The knight plan and the discovered-check plan both need the same legal move list, some of the same board facts, and the same tests after a queen capture. Those computations can be shared even when the initial plans are different.

<!-- pc:block b0072 -->
Two compound conditions can share part of their expression:

<!-- pc:block b0073 -->
```text
check AND knight_checks_king AND queen_attacked
check AND uncovered_line AND queen_attacked
```

<!-- pc:block b0074 -->
The `check` and `queen_attacked` tests are common. The two remaining tests are not.

<!-- pc:block b0075 -->
### Share a continuation only when its meaning agrees

<!-- pc:block b0076 -->
Suppose two rules both lead to **examine every legal defense, then try a queen capture under the same O and Q**. That continuation can be stored once.

<!-- pc:block b0077 -->
But a plan to attack the queen on d8 and a plan to attack a rook on a8 are not interchangeable merely because both have a card called “Take the target.” They can share the card's code while keeping different target arguments in their plan frames.

<!-- pc:block b0078 -->
Ordinary DFA minimization combines states with identical future acceptance behavior, not states with similar names. [3] A policy needs the analogous stronger discipline for its actions, plan arguments, and stopping conditions.

<!-- pc:block b0079 -->
.

<!-- pc:block b0080 -->
## 6. The merge algorithm

<!-- pc:block b0081 -->
Use a normal form in which a rule has a current card, a guard, and an explicit action. The action includes its next card, bindings, and any plan-stack effect. A card declares whether it is choosing an attacking alternative, checking every defense, or testing an endpoint.

<!-- pc:block b0082 -->
```text
merge(P₁, P₂):
    Check that their game and proof contracts agree.
    Normalize predicate definitions and binders.
    Assign one identifier to each established equivalent definition.
    Rewrite both policies using those identifiers.
    Factor shared pure expressions and common card code.
    Combine exactly duplicate guarded actions.
    Retain different guarded actions as different alternatives.
    Choose and record one deterministic priority rule.
    Emit one card table, one entry card, and one search controller.
```

<!-- pc:block b0083 -->
For compatible rules with the **same complete action**, the guards may be combined:

<!-- pc:block b0084 -->
```text
(g₁ → a) and (g₂ → a) become ((g₁ OR g₂) → a)
```

<!-- pc:block b0085 -->
The common tests can still be evaluated once. If the actions differ, keep both:

<!-- pc:block b0086 -->
```text
(g₁ → a) and (g₂ → b)
```

<!-- pc:block b0087 -->
When both guards hold, both alternatives are eligible. The priority rule decides which is tried first. Do not arbitrarily let the later rule overwrite the earlier one.

<!-- pc:block b0088 -->
This is where two sorted lists are a useful analogy. Once the meanings and ordering agree, duplicate entries collapse and the remaining entries form one list. If one input insists on trying x before y and the other insists on y before x, both orders cannot be preserved. The merger needs a new stated order.

<!-- pc:block b0089 -->
### Rejection belongs to the question it answers

<!-- pc:block b0090 -->
A failed knight-fork test does not reject a discovered-check plan. A failed attempt against d8 does not reject an attempt against a8. Retiring one plan must not delete a move or a calculation still needed by another plan.

<!-- pc:block b0091 -->
The shared task ends when its result is available to every caller. Its result can be reused without repeating its work. Distinct incoming move edges must remain in the proof graph so that sharing a position does not erase an exemplar line.

<!-- pc:block b0092 -->
A rule that depends on “no other plan has been found yet,” deletes another plan's work, or changes behavior when the queue is reordered needs special treatment. Such a rule is not a harmless addition to a shared rule table.

<!-- pc:block b0093 -->
## 7. The merger theorem: shared work, plus new work

<!-- pc:block b0094 -->


<!-- pc:block b0095 -->
Call W₁(x) and W₂(x) the sets of distinct, fully specified work items required by the two normalized policies on x. These are their complete bounded searches, not just the prefixes they happened to inspect before an early success.

<!-- pc:block b0096 -->
A work item might be a particular board observation, a predicate evaluation with fixed arguments, a guard evaluation, a card task, or a particular proof edge. Its cost is specified by the chosen machine model. Identical names without identical arguments do not count as shared work.

<!-- pc:block b0097 -->
After compilation and complete evaluation, let Wₘ(x) be the merged set. Define:

<!-- pc:block b0098 -->
```text
I(x) = W₁(x) ∩ W₂(x)                 shared work
H(x) = Wₘ(x) \ (W₁(x) ∪ W₂(x))       new work enabled by combining the policies
```

<!-- pc:block b0099 -->
Under the stated preservation conditions, the old work remains represented in the merged graph. Therefore:

<!-- pc:block b0100 -->
```text
|Wₘ| = |W₁| + |W₂| − |I| + |H|
```

<!-- pc:block b0101 -->
With a fixed nonnegative cost w(t) for each work item t, define C(W) = Σ w(t). The weighted version is:

<!-- pc:block b0102 -->
```text
C(Wₘ) = C(W₁) + C(W₂) − C(I) + C(H)
```

<!-- pc:block b0103 -->
This equality compares a common decomposition into canonical operations and a merger that retains those operations, evaluating duplicates once. A stronger compiler may remove additional redundant work. If D is the set of old-union operations it removes, subtract C(D) as well; without taking that extra saving, the displayed expression remains an upper bound. New dispatcher or Boolean work not present in the old union must be counted in H or in the explicitly separate bookkeeping cost.

<!-- pc:block b0104 -->
That is the basic accounting theorem. The separate runtime cost of finding, scheduling, and looking up those items must still be added. Shared logical work is not free bookkeeping.

<!-- pc:block b0105 -->
**Proof.** The merged work separates into the union of the two original sets and the genuinely new items H. The union counts the common items I twice unless one copy is subtracted. The weighted identity follows by summing the cost of each distinct item once. Preservation of a successful proof follows because its rules, legal moves, and required defense branches remain available under the same objective and stopping tests.

<!-- pc:block b0106 -->
This is a precise theorem, but not a magic speedup. The important question is how large H can become.

<!-- pc:block b0107 -->
### The closed-merger case

<!-- pc:block b0108 -->
Call a merger **closed** when the union of the old work is already closed under the merged rules: applying a merged rule to that union generates no additional work. Then H is empty.

<!-- pc:block b0109 -->
```text
C(Wₘ) = C(W₁) + C(W₂) − C(I)
```

<!-- pc:block b0110 -->
For a finite explicit graph, closure can be checked by applying the merged rule generator at every task in the union and checking that every dependency is already present. For reusable symbolic cards, an interface or dependency argument may establish it in advance. Agreement on two tests alone does not establish closure on every position.

<!-- pc:block b0111 -->
This is the right setting for the merge-sort-like bound. There is one output program and one execution of each common operation. No source machine needs to survive at runtime.

<!-- pc:block b0112 -->
### Why unrestricted addition can be much worse

<!-- pc:block b0113 -->
Consider a full binary search tree of depth d. Policy A follows only left continuations. Policy B follows only right continuations. Each expands d + 1 search tasks, including the root.

<!-- pc:block b0114 -->
If the merged card makes both continuations available at every level, it can expand:

<!-- pc:block b0115 -->
```text
1 + 2 + 4 + … + 2ᵈ = 2ᵈ⁺¹ − 1 tasks
```

<!-- pc:block b0116 -->
At d = 10, the two inputs expand 11 tasks each and share the root. Their old union has 21 tasks. The merged search can have 2,047 tasks: **2,026 are new mixed continuations**.

<!-- pc:block b0117 -->
These counts concern expanded search tasks. Charging one-ply inspections of rejected moves adds work to the two inputs as well, but does not remove the exponential gap.

<!-- pc:block b0118 -->
The extra work is not caused by running two policies separately. It is caused by allowing their choices to combine. A theorem that always promises the sum of the original search costs would miss exactly the behavior a genuine merger introduces.

<!-- pc:block b0119 -->
## 8. Compilation cost and execution cost are different

<!-- pc:block b0120 -->
Let S be the total length of the normalized input descriptions, and let R be the number of rule rows. Predicate names and expressions must be inspected before they can be shared.

<!-- pc:block b0121 -->
When canonical identifiers and one ordering are already established, merging two sorted rule lists costs O(R₁ + R₂) identifier comparisons. Producing those canonical identifiers, sorting unsorted inputs, checking aliases, and proving stronger equivalences are separate compilation costs.

<!-- pc:block b0122 -->
A practical deterministic implementation can intern expression nodes in balanced search structures and sort normalized rows. With bounded-arity nodes and fixed-size identifiers, the bookkeeping is O(S log S), plus the cost of reading and normalizing literals and any requested semantic equivalence checks. This is not a claim that arbitrary plan equivalence can be decided cheaply.

<!-- pc:block b0123 -->
For execution, let K be the number of distinct tasks, E the number of dependency or proof edges, and A the set of distinct Oracle queries. A bounded-worklist implementation can use the following conservative form:

<!-- pc:block b0124 -->
```text
T ≤ T_compile + Σ(query cost over A)
                  + c · (K + E) log(K + E + 2)
```

<!-- pc:block b0125 -->
Here guards and their Boolean expression nodes must be counted as work, and all deterministic lookup and ordering operations are included in the bookkeeping term. A cheaper stack implementation may improve that term. An Oracle call that scans many moves cannot silently become a unit of real elapsed time.

<!-- pc:block b0126 -->
A coarse independent bound comes from the finite search space. With maximum branching b and line depth d, there are at most Σ₀ᵈ bʲ move histories. One-ply observations at the stopping boundary may extend that to d + 1. Multiply by the bounded number of distinct card questions and plan-frame configurations allowed per history, then count the bounded rules and predicate work for each. The result may be large, but it is an actual upper bound.

<!-- pc:block b0127 -->
### A bound that can be calculated before the merged run

<!-- pc:block b0128 -->
The shared-work equation explains a completed run. A worst-case theorem also needs a bound that does not wait to discover H afterward.

<!-- pc:block b0129 -->
Assume a finite depth d, bounded plan memory, and a declared bound on all same-position helper work. Treat a complete expansion at one game position as one search task. A helper loop that can run forever needs its own fuel limit; a bounded stack alone does not stop a push–pop loop.

<!-- pc:block b0130 -->
Let the finite task types include the current card, bound plan arguments, and remaining plan frames. For each pair of types u and v, construct a nonnegative integer matrix B such that:

<!-- pc:block b0131 -->
```text
B[u,v] ≥ the number of distinct child tasks of type v
         that one task of type u can generate across one legal ply.
```

<!-- pc:block b0132 -->
Build these counts from the **merged** guarded actions. The same move with the same next question is one child. The same move with a genuinely different question can be another child. False or mutually exclusive guards may tighten the bound when that exclusion is proved.

<!-- pc:block b0133 -->
At each particular state, the outgoing alternatives are a union, so duplicates are subtracted there. Do not subtract an independently maximized “overlap count” from two independently maximized branch counts: those maxima may concern different positions. B must be a valid uniform upper bound on the actual union.

<!-- pc:block b0134 -->
Let e be the row vector with a 1 at the starting task type. If nⱼ counts tasks at depth j, then:

<!-- pc:block b0135 -->
```text
n₀ = e
nⱼ₊₁ ≤ nⱼ B
nⱼ ≤ e Bʲ
N_merged(d) ≤ e (I + B + B² + … + Bᵈ) 1
```

<!-- pc:block b0136 -->
Here I is the identity matrix, and 1 is a column of ones; neither is the shared-work set used earlier. Each inequality follows by counting the children of the previous level. Reusing a task can only reduce the count.

<!-- pc:block b0137 -->
If c[u] bounds all local work at a task of type u, including Oracle work and the bounded same-position helpers, then the corresponding local-work bound is:

<!-- pc:block b0138 -->
```text
T_local ≤ e (I + B + B² + … + Bᵈ) c
```

<!-- pc:block b0139 -->
Add compilation and the chosen work-table/queue costs. Observed boards can be bounded separately by charging every legal successor inspected at each counted task, including the one-ply quiet tests at leaves.

<!-- pc:block b0140 -->
This calculation explicitly counts mixed plans. In the binary example, each original policy has B = [1]. The merged policy has B = [2]. The sum becomes 2ᵈ⁺¹ − 1 immediately; no timing experiment is needed to discover the problem.

<!-- pc:block b0141 -->
A sufficient merged coverage budget is any budget large enough for this complete finite search and its observations. Under the preservation conditions, every original accepted exemplar remains in that graph. There is no corresponding promise that the original first-success budgets can simply be added.

<!-- pc:block b0142 -->
The key budget rule is simple: **the old first-success times are not automatically the new budget**. The merged queue may reach an old winning line later. A cap of 50 positions remains a cap of 50, but coverage under that cap must be tested or proved again.

<!-- pc:block b0143 -->
## 9. Merge the two chess policies

<!-- pc:block b0144 -->
The following experiment uses the two positions above. Policy A recognizes the knight-fork plan and a direct queen capture. Policy B recognizes the discovered-check plan and a direct queen capture. Both use the same DEFEND, FOLLOWUP, and STOP behavior.

The shared card interfaces are declared as part of this small policy language. The compiler normalizes predicate aliases, shares identical guard expressions and rules, and produces one ENTRY table and one set of later cards. The runner receives that compiled object only. It has no pair of source-policy states.

<!-- pc:block b0146 -->
This merger is closed: the only different rules select the first White move. Once a move is selected, the rest of its plan has the same meaning in both inputs. The search cannot start a new imported plan after Black's reply, because the FOLLOWUP card only permits queen captures. Consequently, every continuation of the merged policy already belongs to one of the original bounded searches.

The input policies are run separately only to measure the comparison. Their answers, queues, and caches are not passed into the merged run.

<!-- pc:block b0155 -->
### Worst case performance on a merged policy

<!-- pc:block b0156 -->
The instrumented machine charges one abstract step for each operation request and one additional step for each operation's first computation. Its counted operations are board observations, legal-move enumeration, primitive predicates, complete guard tests, card expansion, and proof-edge recording. The implementation also reports the number of requests, including requests served from the cache.

<!-- pc:block b0157 -->
For this closed, four-stage language, merging adds no operation requests absent from the two complete input executions; the shared request total can therefore be bounded by their sum. Without taking credit for any shared request overhead, this gives:

<!-- pc:block b0158 -->
```text
Royal fork:
    merged steps ≤ 248 + 285 + 124 = 657
    measured declared steps = 593

Discovered check:
    merged steps ≤ 2,102 + 240 + 2,552 = 4,894
    measured declared steps = 4,746
```

<!-- pc:block b0161 -->
## 10. The rules worth remembering

<!-- pc:block b0162 -->
**Share meanings, not names.** Alias two predicates only when their definitions agree. Share a plan's code without throwing away its target or unfinished follow-up.

<!-- pc:block b0163 -->
**Share a move without erasing its reasons.** The same move may support several genuinely different ideas. Inspect its board once, but retain the distinct follow-ups. A specialized label for the same follow-up does not earn another priority point.

<!-- pc:block b0164 -->
**Keep incompatible decisions visible.** One rule can reject a particular plan without rejecting every plan for that move. Different objectives, quiet tests, stack effects, or caller assumptions must be reconciled explicitly.

<!-- pc:block b0165 -->
**Count new combinations.** The general bound is old work, minus shared work, plus newly enabled work, plus bookkeeping. The linear closed-merger case is valuable precisely because its no-new-work condition can be stated and checked.

<!-- pc:block b0166 -->
**Measure coverage again.** Preserving a proof in the full search does not preserve its old position in the queue. For an exact exemplar budget, the line must still appear before the merged budget expires.

<!-- pc:block b0167 -->
The purpose of merging is not to preserve two separate thinkers. It is to leave the player with one smaller, clearer set of cards—and an honest account of what those cards may make the search do.

Browser-local drafts are optional; HTML download is the portable saved copy.
No service, account, build step or network request is used.

GRAPH AND CARD EXAMPLES
A fenced policy-explorer section uses schema predicate-policy-explorer/1.
Graph mode supplies positions (id, predicates, children, optional x/y), a
card program and scenarios. The shared interpreter executes that program.
Chess-policy mode references an existing policy-merge id and chess-block
ids. The adapter reads their FENs and cards, then visualizes the actual
runner trace. Do not add detached choreography or a second copy of the FEN.
Playback, stack display, predicates, graph edges and active cards must agree.
Display steps group low-level operations; they are NOT a new timing theorem.

VOICE
Friendly, simple, mathematical textbook prose. Use White, Black, or the
player to move. Name the chess result and avoid artificial tactical jargon.

POLICY MERGER EXTENSION
The fenced policy-merge JSON in the Markdown defines the input policies and
the test references. Its examples refer to chess-block Ids. FENs and exemplar
PGN lines are read from those chess blocks, so each is authored only once.
The shared runtime below compiles one merged policy and runs the comparison
on page load. Editing prose needs no JavaScript changes. Editing a chess
block updates both its board viewer and the corresponding policy test.
The numerical discussion in the prose describes the supplied version.


1. Edit only the Markdown block directly above (id="pc-markdown"). It contains
   the article AND every chess example. The first H1 is the title, the italic
   paragraph below it is the subtitle, and the next bold paragraph is the byline.
2. Save this .html file and open or reload it in a browser. The bundled renderer
   rebuilds the page from that block on every load. No build command, server,
   internet connection, or separate data file is needed.
3. Each fenced chess section contains PGN with [Schema "predicate-chess/1"], a
   unique [Id], [Title], [SetUp "1"], and [FEN "..."] starting position. Use
   [View "line"] or [View "proof"], [Orientation "white"] or "black", and
   [Objective "..."] for display metadata. The moves below the tags are SAN;
   parenthesized PGN variations keep their branches. A block with no moves
   renders its starting position. Adjacent line blocks sharing [Group "..."]
   become one gallery, in Markdown order.
4. Write captions in PGN brace comments. A comment before the first mainline
   move belongs to the starting board; a comment after SAN belongs to the
   resulting board. Plain comments before a variation's first move introduce
   that branch; put position directives after SAN so their timing is explicit.
   [%csl Ye7,Ye8] marks squares; [%cal Gd1e1] draws an arrow. A directive such as
   [%fact pinned e7 | Be7 is absolutely pinned] computes a fact from that board.
   [%stable ...], [%created ...], [%removed ...], and [%note ...] are authored
   explanations. They do not supply the proof checker's truth values.
5. Proof blocks also specify [Goal "mate"], [Prover "white"] or "black", and
   [MaxPlies "3"] (or another nonnegative bound). The renderer checks legal
   moves, checkmate, distinct defense coverage, and that bound. [%node alias]
   names a position; optional [OmitNode "alias"] enables withholding its
   continuation. All lines, labels, highlights, and notes stay in this block.

    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) html += `<rect x="${32 + col * 56}" y="${16 + row * 56}" width="56" height="56" fill="${(row + col) % 2 ? '#8daf9e' : '#eeeede'}"/>`;
    if (/^[a-h][1-8][a-h][1-8]/.test(node.uci || '')) for (const square of [node.uci.slice(0,2), node.uci.slice(2,4)]) {
      const p = point(square); html += `<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`;
    }
    for (const mark of annotation.highlights.squares || []) {
      const item = typeof mark === 'string' ? {square:mark} : mark, p = point(item.square || item.sq);
      if (p) html += `<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${paint(item.color,'#b58740')}" fill-opacity=".12" stroke="${paint(item.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for (const p of pieces) {
      const pt = point(p.square), white = p.piece === p.piece.toUpperCase();
      html += `<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()]}</text>`;
    }
    for (const arrow of annotation.highlights.arrows || []) {
      const p = point(arrow.from), q = point(arrow.to);
      if (!p || !q) continue;
      const dx = q.x-p.x, dy = q.y-p.y, len = Math.hypot(dx,dy);
      if (!len) continue;
      const ux = dx/len, uy = dy/len, end = {x:q.x-ux*17,y:q.y-uy*17}, base = {x:end.x-ux*11,y:end.y-uy*11};
      html += `<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${paint(arrow.color)}" stroke-width="5" stroke-linecap="round" opacity=".88"/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${paint(arrow.color)}" opacity=".95"/>`;
    }
    html += '</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for (let i = 0; i < 8; i++) html += `<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(orientation==='black'?104-i:97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${orientation==='black'?i+1:8-i}</text>`;
    return html + '</svg>';
  }

  function normalizeGame(raw, source) {
    const headers = raw.headers || raw.tags || {};
    if (headers.Schema !== VERSION) throw new Error(`Unsupported Schema ${JSON.stringify(headers.Schema || '(missing)')}; expected ${VERSION}.`);
    const view = (headers.View || 'line').toLowerCase();
    if (!['line','proof'].includes(view)) throw new Error(`Unsupported View ${JSON.stringify(headers.View)}.`);
    const orientation = (headers.Orientation || 'white').toLowerCase();
    if (!['white','black'].includes(orientation)) throw new Error('Orientation must be "white" or "black".');
    const inputNodes = Array.isArray(raw.nodes) ? raw.nodes : raw.nodes instanceof Map ? Array.from(raw.nodes.values()) : Object.values(raw.nodes || {});
    const rawMap = new Map(inputNodes.map(n => [String(n.id),n]));
    const rootValue = raw.root || raw.rootId || inputNodes[0];
    const sourceRoot = typeof rootValue === 'object' ? rootValue : rawMap.get(String(rootValue));
    if (!sourceRoot) throw new Error('The PGN loader returned no starting position.');
    const nodes = [], nodeMap = new Map(), aliases = new Map(), active = new Set();
    function visit(value, parent, index) {
      const input = typeof value === 'object' ? value : rawMap.get(String(value));
      if (!input) throw new Error('The PGN tree contains an unknown child.');
      const id = String(input.id == null ? parent ? parent.id + '.' + index : 'root' : input.id);
      if (active.has(id) || nodeMap.has(id)) throw new Error(`The PGN tree reuses node ${id}.`);
      const branchIntro = (input.startingComments || []).join('\n\n');
      if (/\[%/.test(branchIntro)) throw new Error('Place board annotations after SAN; initial comments belong before the first mainline move.');
      const node = {id,fen:input.fen,san:input.san || input.move && input.move.san || null,uci:input.uci || input.move && moveKey(input.move) || null,
        ply:parent ? parent.ply+1 : 0,parent,children:[],comments:input.rawComments || input.comments || [],branchIntro,nags:input.nags || [],annotations:null};
      if (!node.fen) throw new Error(`Node ${id} has no replayed FEN.`);
      const annotationAPI = global.PredicateChessAnnotationsV1;
      if (!annotationAPI) throw new Error('The embedded PGN annotation interpreter is unavailable.');
      node.annotations = annotationAPI.parse(node.comments,{fen:node.fen,engine:rules(node.fen)});
      node.annotations.highlights ||= {squares:[],arrows:[]};
      node.annotations.facts ||= []; node.annotations.stable ||= node.annotations.invariants || [];
      node.annotations.created ||= []; node.annotations.removed ||= [];
      if (node.annotations.alias) {
        if (aliases.has(node.annotations.alias)) throw new Error(`Repeated node alias ${node.annotations.alias}.`);
        aliases.set(node.annotations.alias,node);
      }
      nodeMap.set(id,node); nodes.push(node); active.add(id);
      node.children = (input.children || []).map((child,i) => visit(child,node,i));
      active.delete(id); return node;
    }
    const root = visit(sourceRoot,null,0);
    const game = {headers,view,orientation,root,nodes,nodeMap,aliases,source,sourceId:headers.Id || `block-${++serial}`};
    if (view === 'proof') {
      if ((headers.Goal || '').toLowerCase() !== 'mate') throw new Error('Proof View currently requires Goal "mate".');
      if (!/^(white|black)$/i.test(headers.Prover || '')) throw new Error('Proof View requires Prover "white" or "black".');
      if (!/^\d+$/.test(headers.MaxPlies || '') || Number(headers.MaxPlies) > 1000) throw new Error('Proof View requires MaxPlies as an integer from 0 to 1000.');
      game.prover = headers.Prover.toLowerCase() === 'white' ? 'w' : 'b';
      game.maxPlies = Number(headers.MaxPlies);
      if (headers.OmitNode && !aliases.has(headers.OmitNode)) throw new Error(`OmitNode refers to missing node alias ${headers.OmitNode}.`);
      game.omitNode = headers.OmitNode ? aliases.get(headers.OmitNode) : null;
    }
    return game;
  }

  function state(node) {
    if (!node.positionState) {
      const engine = rules(node.fen), moves = engine.moves({verbose:true});
      node.positionState = {engine,moves,keys:new Set(moves.map(moveKey)),check:engine.isCheck(),mate:engine.isCheckmate(),side:engine.turn()};
    }
    return node.positionState;
  }

  function numberedMove(node) {
    if (!node.parent) return 'Start';
    const fields = node.parent.fen.split(/\s+/), fullmove = fields[5] || Math.floor((node.ply+1)/2);
    const symbols = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',10:'=',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+−',19:'−+'};
    const nags = node.nags.length ? ' ' + node.nags.map(n => symbols[n] || '$' + n).join(' ') : '';
    return `${fullmove}${fields[1] === 'w' ? '.' : '…'} ${node.san}${nags}`;
  }

  function factsMarkup(facts, kind) {
    if (!facts || !facts.length) return '';
    return `<ul class="pc-facts">${facts.map(fact => {
      if (typeof fact === 'string') return `<li class="pc-fact ${kind==='created'?'pc-created':kind==='removed'?'pc-absent':''}"><span>${escape(fact)}</span></li>`;
      const value = fact.value, detail = typeof value === 'boolean' ? value ? 'True' : 'False' : Array.isArray(value) ? value.join(', ') : value;
      return `<li class="pc-fact ${value===false?'pc-absent':''}"><span class="pc-label-value">${escape(fact.label || fact.predicate)}${detail == null ? '' : `: <strong>${escape(detail)}</strong>`}</span></li>`;
    }).join('')}</ul>`;
  }

  function selectedDetails(game,node,proofResult) {
    const a = node.annotations, p = state(node);
    const basic = [{label:'Side to move',value:sideName(p.side)},{label:`${sideName(p.side)} is in check`,value:p.check},
      {label:'Legal moves',value:p.moves.length}];
    if (p.mate) basic.push({label:`${sideName(p.side)} is checkmated`,value:true});
    let html = `<div class="pc-move-label">${node.parent?'After the replayed move':'At the starting node'}</div><div class="pc-move"><span class="pc-san">${node.parent?escape(numberedMove(node)):'Before'}</span><span class="pc-ply">Ply ${node.ply}</span></div>`;
    if (node.branchIntro) html += `<div class="pc-observation pc-comment-lines"><strong>Variation note.</strong> ${escape(node.branchIntro)}</div>`;
    if (a.caption) html += `<p class="pc-caption pc-comment-lines">${escape(a.caption)}</p>`;
    html += `<section class="pc-fact-section"><h4 class="pc-fact-title">Computed position facts</h4>${factsMarkup([...basic,...a.facts])}</section>`;
    for (const [key,title] of [['stable',node.parent?'What stays fixed':'Already in place'],['created','What this move creates'],['removed','What this move removes']]) {
      if (a[key].length) html += `<section class="pc-fact-section"><h4 class="pc-fact-title">${title}<span class="pc-authored-label">Author’s temporal notes</span></h4>${factsMarkup(a[key],key)}</section>`;
    }
    if (a.note || a.observation) html += `<div class="pc-observation pc-comment-lines">${escape(a.note || a.observation)}</div>`;
    if (proofResult) html += `<div class="pc-proof-node-reason"><strong>${escape(proofResult.status[0].toUpperCase()+proofResult.status.slice(1))}.</strong> ${escape(proofResult.reason)}</div>`;
    return html;
  }

  function fenMarkup(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sourceMarkup(source) { return `<details class="pc-source"><summary>Source PGN &amp; annotations</summary><pre>${escape(source)}</pre></details>`; }
  function metadata(game,includeDescription) {
    return `${includeDescription&&game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}${game.headers.Objective?`<div class="pc-metadata"><span class="pc-objective">${escape(game.headers.Objective)}</span></div>`:''}${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}`;
  }
  function metaMarkup(node,orientation) {
    return `<span class="pc-side" data-side="${sideOf(node.fen)}">${sideName(sideOf(node.fen))} to move</span><button class="pc-control pc-flip" data-action="flip" aria-label="Flip board orientation" title="${escape(orientation)} at bottom">Flip board</button>`;
  }
  const controls = '<nav class="pc-controls" aria-label="Position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav>';

  function lineWidget(mount,games,uid) {
    let gameIndex = 0, game = games[0], selected = game.root, orientation = game.orientation;
    const choices = new Map();
    const gallery = games.length > 1;
    mount.dataset.pcWidget = 'line';
    mount.innerHTML = `<header class="pc-header"><div class="pc-eyebrow">Worked positions · replayed PGN</div><h3>${escape(gallery?game.headers.GroupTitle || game.headers.Group:game.headers.Title || 'Worked position')}</h3>${(gallery?game.headers.GroupDescription:game.headers.Description)?`<p class="pc-intro">${escape(gallery?game.headers.GroupDescription:game.headers.Description)}</p>`:''}${gallery?`<div class="pc-selection"><label class="pc-select-label" for="${uid}-example">Explore</label><select id="${uid}-example" data-action="example" aria-label="Choose a tactical example">${games.map((g,i)=>`<option value="${i}">${escape(g.headers.Title || g.sourceId)}</option>`).join('')}</select></div>`:''}<div data-role="objective"></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<nav class="pc-step-nav" data-role="steps" aria-label="Positions on the selected line"></nav><div class="pc-branches" data-role="branches"></div><div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><div data-role="variations"></div><div data-role="source"></div><footer class="pc-footer">Moves are replayed from the Markdown PGN under the rules of chess. Position facts are computed from the displayed board; temporal notes are written by the author.</footer>`;
    const get = role => mount.querySelector(`[data-role="${role}"]`);
    function choose(node) {
      selected = node;
      for (let n = node; n.parent; n = n.parent) choices.set(n.parent.id,n.id);
      draw();
    }
    function nextChild(node) { return node.children.find(c => c.id === choices.get(node.id)) || node.children[0]; }
    function route() {
      const path = [], visited = new Set();
      for (let n=game.root;n && !visited.has(n.id);n=nextChild(n)) { path.push(n); visited.add(n.id); }
      return path;
    }
    function tree(node) {
      return `<li><button class="pc-node" data-node="${escape(node.id)}" aria-current="${selected===node?'true':'false'}" aria-label="Go to ${escape(numberedMove(node))}"><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-kind">${node.parent?'PLY '+node.ply:'ROOT'}</span></button>${node.children.length?`<ul class="pc-children">${node.children.map(tree).join('')}</ul>`:''}</li>`;
    }
    function draw() {
      mount.dataset.example=game.sourceId;mount.dataset.step=String(selected.ply);mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.orientation=orientation;
      get('objective').innerHTML=metadata(game,gallery);
      get('meta').innerHTML=metaMarkup(selected,orientation);
      get('board').innerHTML=board(selected,uid,orientation);
      get('detail').innerHTML=selectedDetails(game,selected);
      get('fen').innerHTML=fenMarkup(selected.fen);
      const path=route();mount.dataset.stepCount=String(path.length);
      get('steps').innerHTML=path.map(n=>`<button class="pc-step" data-node="${escape(n.id)}" ${n===selected?'aria-current="step"':''} aria-label="Go to ${escape(numberedMove(n))}">${escape(numberedMove(n))}</button>`).join('');
      get('branches').innerHTML=selected.children.length>1?`<label for="${uid}-branch">Choose the next move</label><select id="${uid}-branch" data-action="branch" aria-label="Choose the next variation">${selected.children.map(child=>`<option value="${escape(child.id)}" ${nextChild(selected)===child?'selected':''}>${escape(numberedMove(child))}</option>`).join('')}</select>`:game.nodes.length===1?'<p class="pc-empty-line">Starting position · no moves in this block</p>':'';
      const hadOpen=get('variations').querySelector('details')?.open;
      get('variations').innerHTML=game.nodes.some(n=>n.children.length>1)?`<details class="pc-source pc-branch-tree" ${hadOpen?'open':''}><summary>All lines &amp; variations</summary><div class="pc-tree pc-tree-list"><ul>${tree(game.root)}</ul></div></details>`:'';
      const sourceOpen=get('source').querySelector('details')?.open;
      get('source').innerHTML=sourceMarkup(game.source);if(sourceOpen)get('source').querySelector('details').open=true;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!selected.children.length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.node){const node=game.nodeMap.get(button.dataset.node);if(node)choose(node);return;}
      if(button.dataset.action==='previous'&&selected.parent)choose(selected.parent);
      else if(button.dataset.action==='next'&&selected.children.length)choose(nextChild(selected));
      else if(button.dataset.action==='reset'){choices.clear();choose(game.root);}
      else if(button.dataset.action==='flip'){orientation=orientation==='white'?'black':'white';draw();}
    });
    mount.addEventListener('change',event=>{
      if(event.target.matches('[data-action="example"]')){gameIndex=Number(event.target.value);game=games[gameIndex];selected=game.root;orientation=game.orientation;choices.clear();draw();}
      else if(event.target.matches('[data-action="branch"]')){choices.set(selected.id,event.target.value);draw();}
    });
    draw();mount.dataset.pcReady='true';
  }

  /* Evaluate only the authored proof tree plus an exhaustive one-ply mate test.
     A missing subtree is unresolved. Duplicate PGN edges never count as different defenses. */
  function evaluateProof(game,omitted) {
    const results=new Map();
    function visit(node) {
      if(results.has(node.id))return results.get(node.id);
      const p=state(node),remaining=game.maxPlies-node.ply;
      let result={status:'unproved',reason:'This position has no completed continuation for the objective.'};
      const finish=()=>{results.set(node.id,result);return result;};
      if(omitted&&node===game.omitNode){result.reason='This continuation has been deliberately withheld.';return finish();}
      if(node.ply>game.maxPlies){result={status:'refuted',reason:'This node is beyond the stated ply deadline.'};return finish();}
      if(p.mate){result=p.side!==game.prover?{status:'proved',reason:`Checkmate is verified at ply ${node.ply}, within the stated deadline.`}:{status:'refuted',reason:'The proving side is checkmated.'};return finish();}
      if(remaining===0){result={status:'refuted',reason:'The ply deadline has been reached without the required checkmate.'};return finish();}
      if(!p.moves.length){result={status:'refuted',reason:'There are no legal moves, and the position is not checkmate.'};return finish();}
      const groups=new Map();
      for(const child of node.children){
        if(!p.keys.has(child.uci))throw new Error(`The replayed move ${child.san || child.uci} is not a legal child of ${node.id}.`);
        if(!groups.has(child.uci))groups.set(child.uci,[]);
        groups.get(child.uci).push(visit(child));
      }
      const moveStates=new Map();
      for(const [uci,entries]of groups)moveStates.set(uci,entries.some(x=>x.status==='proved')?'proved':entries.some(x=>x.status==='refuted')?'refuted':'unproved');
      const states=Array.from(moveStates.values()),covered=states.filter(s=>s==='proved').length;
      result.total=p.keys.size;result.recorded=groups.size;result.covered=covered;
      if(p.side===game.prover){
        if(states.includes('proved')){result.status='proved';result.reason='One legal choice has a completed proof of the objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='refuted')){result.status='refuted';result.reason='Every legal choice is covered and fails the bounded objective.';}
        else if(remaining===1){
          if(node.immediateMates===undefined){
            let mates=0;
            for(const move of p.moves){const next=rules(node.fen);next.move({from:move.from,to:move.to,promotion:move.promotion});if(next.isCheckmate())mates++;}
            node.immediateMates=mates;
          }
          result.checked=p.moves.length;result.matingMoves=node.immediateMates;
          if(node.immediateMates===0){result.status='refuted';result.reason=`The complete one-ply check examined all ${p.moves.length} legal moves. Immediate mating moves: 0. The deadline cannot be met.`;}
          else result.reason=`${node.immediateMates} immediate mating move${node.immediateMates===1?' exists':'s exist'}, but no completed authored continuation proves this node.`;
        }else result.reason='The shown choices do not prove the objective. Unwritten legal choices remain unresolved.';
      }else{
        if(states.includes('refuted')){result.status='refuted';result.reason='A legal opponent reply has a completed refutation of the bounded objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='proved')){result.status='proved';result.reason=`All ${p.keys.size} distinct legal opponent replies have a completed answer.`;}
        else result.reason=`${covered} of ${p.keys.size} distinct legal opponent replies have a completed answer. Every remaining defense must still be covered.`;
      }
      return finish();
    }
    visit(game.root);
    for (const node of game.nodes) visit(node);
    return {status:results.get(game.root.id).status,results};
  }

  function proofWidget(mount,game,uid) {
    let selected=game.root,orientation=game.orientation,omitted=false,evaluation;
    mount.dataset.pcWidget='proof';mount.dataset.example=game.sourceId;
    mount.innerHTML=`<header class="pc-header"><div class="pc-eyebrow">A bounded AND / OR proof · replayed PGN</div><h3>${escape(game.headers.Title || 'Trace every defense')}</h3>${game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}<div class="pc-proof-options"><span class="pc-objective">${escape(game.headers.Objective || `Mate within ${game.maxPlies} plies`)}</span>${game.omitNode?'<label class="pc-switch-label"><input type="checkbox" data-action="omit-defense" aria-label="Leave one defense open"><span>Leave one defense open</span></label>':''}</div>${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}<p class="pc-limits">${sideName(game.prover)} proves the objective. One choice suffices on its turn (OR); every legal opposing reply needs an answer (AND). Deadline: ${game.maxPlies} plies.</p></header><div class="pc-proof-verdict" data-role="verdict" aria-live="polite"></div><div class="pc-main pc-proof-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<div class="pc-proof-selection" data-role="selection" aria-live="polite"></div><div data-role="fen"></div></div><div class="pc-tree-panel"><div class="pc-tree-title"><span>Select a node</span><span class="pc-inline-count" data-role="count"></span></div><div class="pc-tree pc-tree-list" data-role="tree"></div><div class="pc-coverage" data-role="coverage"></div></div></div>${sourceMarkup(game.source)}<footer class="pc-footer">The proof checker verifies the replayed positions, actual checkmate, and unique legal reply coverage. It also exhausts legal moves when the proving side has one ply left. An unwritten continuation stays unproved; the PGN result and author’s notes do not establish a proof.</footer>`;
    const get=role=>mount.querySelector(`[data-role="${role}"]`);
    function hidden(node){for(let n=node.parent;n;n=n.parent)if(omitted&&n===game.omitNode)return true;return false;}
    function kind(node){const p=state(node);if(p.mate)return 'MATE';if(node.ply>=game.maxPlies)return 'BOUND';return p.side===game.prover?'OR':'AND';}
    function visibleChildren(node){return omitted&&node===game.omitNode?[]:node.children;}
    function tree(node){
      const result=evaluation.results.get(node.id)||{status:'unproved'},label=node.annotations.alias || node.id,k=kind(node),open=omitted&&node===game.omitNode;
      let subtitle=open?'Continuation withheld':state(node).mate?'Checkmate verified':k==='AND'?`${result.covered || 0} / ${state(node).keys.size} legal replies proved`:k==='OR'?'One completed choice suffices':'Ply deadline';
      const kids=visibleChildren(node);
      return `<li><button class="pc-node ${state(node).mate?'pc-leaf':''} ${open?'pc-omitted':''}" data-node="${escape(label)}" data-internal-node="${escape(node.id)}" data-proof-node-status="${result.status}" aria-current="${selected===node?'true':'false'}" aria-label="Inspect ${escape(numberedMove(node))}${open?', continuation withheld':''}"><span><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-subtitle">${escape(subtitle)}</span></span><span class="pc-node-kind">${open?'OPEN':k}</span></button>${kids.length?`<ul class="pc-children">${kids.map(tree).join('')}</ul>`:''}</li>`;
    }
    function focusDefense(){
