<!-- pc:block t0001 -->
# Theorems and Proofs

<!-- pc:block t0002 -->
*Predicate Chess · Trees, fusions, and the replies that matter*

<!-- pc:block t0003 -->
**Priyomes · October 7, 2026**

<!-- pc:block t0004 -->
A theorem is a small, reusable tree. Its edges describe moves, and its nodes describe the positions those moves produce. Solving a puzzle means fitting one of these trees—or a fusion of several trees—to the board.

<!-- pc:block t0005 -->
That gives the player something concrete to look for. An undefended bishop suggests a skewer. A queen with only the king defending it suggests moving that king. The policy chooses which tree to try; the theorem explains why the fitted line works.

<!-- pc:block t0006 -->
## 1. Draw the theorem first

<!-- pc:block t0007 -->
Start at the current position, then draw the branches downward. An edge can be specific, like `N@f7+`, or abstract, like `N@s+`. `A×B` means piece A captures piece B. In a move label, `P@s` means piece P moves to square s; P is a bound piece, not necessarily a pawn.

<!-- pc:block t0008 -->
The nodes contain chess facts: `attacks(N,A)`, `loose(A)`, `check(K)`. The piece names keep their identity through the tree even when the pieces move.

<!-- pc:block t0010 -->
A root match is a reason to try the theorem. The full fit includes the reply branches and the facts needed by the follow-up. If a reply takes the knight, the player needs another subtree there. The drawing keeps that work in its proper place.

<!-- pc:block t0011 -->
We use `loose(X)` broadly here: X has at most one geometric defender. `undefended(X)` means none. `sole_defender_of(Q,K)` means the defender set of Q is exactly {K}. A defended piece is not necessarily safe to recapture with; legality is checked separately.

<!-- pc:block t0012 -->
The predicate `line(R,p,Q)` places those pieces in order on an otherwise clear line. `aligned(R,p,Q)` keeps only the geometry, so other blockers may still be present. `mate(Black)` means Black is checkmated.

<!-- pc:block t0013 -->
A leaf can simply say `captured(A)`. Material and quiet are additional conditions, not synonyms for taking a piece.

<!-- pc:block t0014 -->
## 2. How to class the replies

<!-- pc:block t0015 -->
A reply class is a set of legal moves that can use the same next subtree. Two things have to be established: the classes cover the legal replies, and each member preserves what its next subtree needs.

<!-- pc:block t0016 -->
Checks give a useful first split. Against a single checking piece C, classify king moves first, including king captures. The remaining legal replies either capture C with another piece or block its checking line. This makes the classes disjoint. The underlying rule is that a legal move must leave the moving side’s king out of check. [1]

<!-- pc:block t0018 -->
Write L(p) for the legal replies at position p. For a single sliding check:

<!-- pc:block t0019 -->
`L(p) = king moves ⊎ non-king captures of C ⊎ non-king blocks`

<!-- pc:block t0020 -->
The symbol ⊎ means there is no overlap. For a single knight check, the block class is empty. The reason is geometric: placing another piece somewhere does not interrupt a knight attack. Capturing the checker includes an en passant capture when the checker is a pawn; a king capture belongs to the king class. “Recapture” is appropriate only when there was a preceding capture. [1]

<!-- pc:block t0021 -->
### Same move type, same follow-up?

<!-- pc:block t0022 -->
Not always. A king move may also defend the target. A block may pin the attacking piece. A capture of the checker may expose a queen. Start with the move type, then split by the facts needed at the next node.

<!-- pc:block t0023 -->
The rule for sharing a branch is:

<!-- pc:block t0024 -->
`For every r in class C: the next node’s predicates hold after r, and its next subtree fits there.`

<!-- pc:block t0025 -->
One representative board illustrates a class; it does not prove the other members. On a concrete puzzle, list the legal replies and check the required facts for each. For a reusable theorem, prove that its entry facts and move template preserve those facts for every member. The same bound follow-up, such as `N×R`, may instantiate to different squares after different replies.

<!-- pc:block t0026 -->
### The reply-class rule

<!-- pc:block t0027 -->
Suppose the current node has predicates Φ, and the next theorem is already proved whenever its entry predicates Ψ hold. A class C can use that theorem when:

<!-- pc:block t0028 -->
`Φ(p) and r ∈ C(p) imply Ψ(p·r), for every legal r in C(p).`

<!-- pc:block t0029 -->
If the displayed classes cover L(p), and each class meets its next theorem’s entry conditions, the reply node is proved. To see why, take any legal reply. It belongs to a class; that class establishes Ψ; the next theorem applies. The argument covers whichever reply is chosen.

<!-- pc:block t0030 -->
This is stronger than observing that a few positions share some predicates. The next theorem must actually be valid under those predicates. Once it is, the player can reuse that proof instead of recalculating its descendants.

<!-- pc:block t0031 -->
The useful savings come from reusing the argument and stopping at its boundary. If one reply changes a required fact or makes the follow-up illegal, split it into another class.

<!-- pc:block t0032 -->
## 3. Fit a tree, then fuse trees

<!-- pc:block t0033 -->
A **graft** binds the abstract pieces and squares to a concrete position. A class edge may unfold into several concrete replies. Each resulting position must satisfy the node’s predicates, and every legal opponent reply must have a branch or an explicitly open boundary.

<!-- pc:block t0034 -->
A **fusion** joins a leaf of one tree to the root of another. The first tree must establish the second tree’s entry facts under compatible bindings. Match the actual roles: the square occupied by the king must match the next theorem’s king square, not a similarly named square occupied by the rook.

<!-- pc:block t0035 -->
We can state the joining rule simply:

<!-- pc:block t0036 -->
`facts at the first tree’s leaf ⇒ facts required at the next tree’s root`

<!-- pc:block t0037 -->
A join is a position, not an extra move. The first tree ends there and the next begins there. If the next tree needs another fact, check it at that position. The composition view collapses each theorem to a box and labels its joins; selecting a box opens the underlying tree. Two theorems may also overlap on the same move, as in the king-attraction example.

<!-- pc:block t0038 -->
## 4. Fusion: mate threat → forced king move → skewer

<!-- pc:block t0039 -->
[Puzzle 7oDbd](https://lichess.org/training/7oDbd) · White to move

<!-- pc:block t0040 -->
The bishop on d6 is undefended. A rook on h6 would skewer it through a king on g6, and the g5-pawn would defend that rook. Those are the desired entry facts for the skewer. White first has to put the king on g6.

<!-- pc:block t0041 -->
`42.Kf3` threatens `Rh1#`. Of Black’s 17 legal replies, 15 leave that mate available. `42…Kh5` stops it, but `43.Rh1+` then has exactly one answer: `43…Kg6`. Now `44.Rh6+` is the skewer. Both king replies, Kf7 and Kg7, leave `Rxd6` legal and the bishop undefended.

## 6. Add an attacker with check

<!-- pc:block t0055 -->
The f6-pawn has two jobs. It stands between White’s rook on f4 and Black’s queen on f8, and it alone defends the rook on g5. White’s queen already attacks that rook.

<!-- pc:block t0056 -->
The first idea is to take on g5 with the queen and answer `…fxg5` with `Rxf8+`. That line does collect the back piece of the alignment, but it spends White’s queen to do so. In this FEN, g5 contains a rook, not a pawn.

The cheaper attacker begins with `31.Nf7+`. **A: check and add an attacker** ends at two reply classes. `Kg8 / Kg7` lead to **J1**, where **B: take the rook with the knight** applies. `Qxf7` leads to **J2**, where **C: take the capturing queen** applies instead. The composition view shows this as a branch, not a single chain.

        "label": "Other reply class",
        "note": "White is +1; further objective work remains."
      },
      {
        "box": "E",
        "at": "p5",
        "label": "After the pawn recapture",
        "note": "White is +6 on this branch; boundary counters remain to inspect."
      }
    ],
    "notation": "CheckAttack[king := Take(N,T), capture := Take(A,Q)]   |   J3: on p×N, OpenLine(p;R,Q) ; Take(R,Q)",
    "note": "Each gold join is a position from the same underlying tree. D and E are the recapture continuation, not additional moves after every Black reply."

```

<!-- pc:block t0060 -->
After either king move, `Nxg5` takes the rook and clears f7. **J3 is the position after that capture.** The f-file now contains only the f6-pawn between Rf4 and Qf8. If Black chooses `…fxg5`, **D: the pawn leaves the line** establishes **J4**, where **E: take the back queen** applies as `Rxf8`. D and E describe that recapture branch; they do not stand for all of Black’s replies.

<!-- pc:block t0061 -->
Thus there are two ways to finish the first check’s reply node, and one possible extension of the rook-capture branch. Every join is a shared position with named facts. No move has been added just to connect the boxes.

<!-- pc:block t0062 -->
The **Queen-first attempt** tab shows where calculation went wrong: `31.Qxg5 fxg5 32.Rxf8+ Kg7 33.Rf7+ Kxh6`. The queen exchange had only restored material equality. Continuing with another check then lost the knight. The natural stopping point was the end of the first subtree, where `attacks(K,N)` should have started a new inspection. After Rf7+, Kh8, Kg6, and Kxh6 all belong to the king-move class. If the follow-up needs the knight, Kxh6 must be split off by its effect.

<!-- pc:block t0063 -->
White begins this puzzle five points behind. Taking the rook with the knight restores equality; the queen-for-knight branch reaches +1. Those are precise local results, not yet the optional +2 material objective. The tree records what has actually been established and where another graft may be needed.

## 7. An obstruction is a place to attach another tree

<!-- pc:block t0065 -->

<!-- pc:block t0070 -->
## 8. Where a theorem stops

<!-- pc:block t0071 -->
A theorem’s boundary should be a position the player understands: the bishop has been taken, the king has left the queen, or the knight attacks both targets. That is a good moment to check the local result and decide whether the proof needs another tree.

<!-- pc:block t0072 -->
For the **Standard Tactical Objective**, let O mean that the attacking side is at least two material points ahead. For this article, the **Standard Forcing Counters** F are legal checks, captures, and promotions by the defender. Immediate mate is already included among checks. Define `quiet` to mean that no such reply exists.

<!-- pc:block t0073 -->
A leaf satisfying O but not `quiet` gets an F boundary with the actual remaining moves. An examined counter is not an absent counter: answering every listed move does not change the meaning of quiet. A one-ply test also says nothing by itself about a later quiet threat.

<!-- pc:block t0074 -->
A mate threat needs its own reply classes. Unlike check, it does not make ignoring the threat illegal. The branches must show what happens: allow mate, stop the mate, or force an interruption. The Kf3 example illustrates that distinction with real legal replies rather than assuming the defender cooperates.

<!-- pc:block t0075 -->
## 9. An algebra of theorem composition

<!-- pc:block t0076 -->
A composition can be written on one line as well as drawn. Read `T ; U` from left to right: fit T, then graft U at the indicated exit. Give each exit a name when different reply classes need different follow-ups.

<!-- pc:block t0077 -->
The notation names trees and their joins. It should retain the same information as the picture: bound pieces, the position at the join, whose turn it is, and any reply branches still open.

<!-- pc:block c0081 -->
### A tree has an entry and named exits

<!-- pc:block c0082 -->
Write `T: Φ ⇒ {j₁: Ψ₁, …, jₖ: Ψₖ}`. Φ gives the entry conditions. Each j is an exit of the tree, and Ψ describes the position there. The piece bindings and the player to move are part of these conditions. A proved, finite tree accounts for every legal opposing reply until it reaches one of its exits. An exit may meet the objective, or it may need another tree.

<!-- pc:block c0083 -->
For example, the knight-check tree has a `king` exit where the knight can take the rook, and a `capture` exit where the queen can take the checking knight’s capturer. We can write its two attachments as:

<!-- pc:block c0084 -->
```text
CheckAttack(N,K,T;s)[
    king    := Take(N,T),
    capture := Take(A,Q)
]
```

<!-- pc:block c0085 -->
The brackets replace the named exits with their next trees. They do not choose Black’s reply. Black chooses its move; White uses the subtree attached to that class. Each move in a class must reach the entry required by its attached tree.

<!-- pc:block c0086 -->
### Joining two trees

<!-- pc:block c0087 -->
`T ; U` is the short form when the intended exit is unambiguous. More explicitly, `T[j := Uθ]` grafts U onto exit j, using a binding θ for U’s pieces and squares. The join is valid when:

<!-- pc:block c0088 -->
```text
Ψⱼ ⇒ Φᵤθ
```

<!-- pc:block c0089 -->
Every position reaching j must satisfy U’s entry conditions under that binding. The join preserves the actual position and whose turn it is. It costs no ply. If a square is chosen differently after different replies, θ may depend on the reply already played, but not on a future reply.

<!-- pc:block c0090 -->
**Why the rule works.** Follow any legal reply path through T. If it reaches j, its position satisfies Ψⱼ, so U applies there. Continue through U. Every other exit of T remains exactly as it was. Attaching a tree at one exit does not close an unrelated F branch. This is the same entry-to-exit discipline used in sequential program proofs; here the exits also retain chess turns and reply classes. [2]

<!-- pc:block c0091 -->
For hsCHk, the short form is:

<!-- pc:block c0092 -->
```text
ClearWithCheck(A,p) ; Fork(N,s;Q,R)
```

<!-- pc:block c0093 -->
The first tree ends after Kh1 or Kh2. The second starts there with the same knight, square, and two targets. `captured(p)` is useful at the join, but it is not the whole entry: `N@s` must still be legal, and s must still attack both target squares. The output is a fork, not yet a captured piece.

<!-- pc:block c0094 -->
### Alignment composed with a fork

<!-- pc:block c0095 -->
The sketch `align(a,b,c) compose fork(c,d)` captures the idea: one pattern supplies something the next uses. To make the notation precise, distinguish the **fact** `align(a,b,c)` from a **tree** `Align(a,b,c)` that establishes that fact. We can then write:

<!-- pc:block c0096 -->
```text
Align(a,b,c) ; Fork(N,s;c,d)
```

<!-- pc:block c0097 -->
`Fork(N,s;c,d)` means the tree which plays the knight to s and establishes attacks on c and d. The shared c is the same piece in both trees. It is not enough for the two expressions merely to contain the same letter: Align’s exit must also establish the knight’s legal route and the geometry of both attacks. Otherwise this is a proposed composition with missing entry facts.

<!-- pc:block c0098 -->
If the alignment is already on the board, no move is needed to create it. Write `[align(a,b,c)]` for a test of that fact. A test consumes no chess ply and does not let either player pass. The bracketed expression can therefore cue a fork search without pretending that alignment alone proves a fork.

<!-- pc:block c0099 -->
### Sharing a move rather than adding one

<!-- pc:block c0100 -->
Use `T ⊗ₛ U` when T and U explain a shared subtree S. For the king-defended queen:

<!-- pc:block c0101 -->
```text
(Attract(R,K;s) ⊗ₛ MoveDefender(Q,K)) ; Take(A,Q)
S = the K×R edge and its two positions
```

<!-- pc:block c0102 -->
The attraction tree and the defender tree both contain K×R. Identify that edge once, together with its before-and-after positions. Both explanations must use the same piece identities and legal move, and their node predicates must hold together. Then their common exit feeds Take(A,Q). The concrete line still contains only Rh1+, Kxh1, and Qxf2.

<!-- pc:block c0103 -->
This overlap operation is defined only when the shared parts agree and the resulting tree still accounts for its replies. Matching a king square while silently changing the rest of the board is not a join. Nor may a fact such as `undefended(Q)` be carried through a shared move if that move changes it.

<!-- pc:block c0104 -->
### A few useful algebraic rules

<!-- pc:block c0105 -->
For valid joins with fixed exit routing, sequential grafting is associative:

<!-- pc:block c0106 -->
```text
(T ; U) ; V  ≅  T ; (U ; V)
1 ; T  ≅  T  ≅  T ; 1
[φ] ; [ψ]  =  [φ ∧ ψ]
```

<!-- pc:block c0107 -->
Here `≅` means the same expanded tree, apart from local node and variable names. The identity 1 is a zero-ply tree that leaves the position unchanged. The last equation combines two tests at the same position. Associativity follows because either grouping attaches the same trees at the same exits; it does not promise that two implementations search them in the same time.

<!-- pc:block c0108 -->
Composition is generally not commutative. Removing the pawn before making the fork differs from making the fork while the pawn can take the knight. Bound pieces also keep their identities: a captured queen cannot be reused as a living piece in the next tree merely because the variable name still exists.

<!-- pc:block c0109 -->
Reply-dependent choice matters too. “After every reply, choose a fitting tree” is different from “choose one fixed tree that fits after every reply.” The p6lJI branches show why: the knight capture works after the king moves, while the queen capture works after Q×N. An algebra must retain that branch structure rather than flattening both into an unlabeled list.

<!-- pc:block c0110 -->
This gives a practical composition method: bind the pieces, compare the exit facts with the next entry, attach the next tree, and keep every unmatched exit visible. For an overlap, also identify the shared moves so they are counted once. The short expression and the expanded tree should always describe the same work.

<!-- pc:block c0111 -->
## 10. Why looking only for checks falls short

<!-- pc:block c0112 -->
A check theorem is useful because it narrows the replies. Its output may be just `check(K)`, or a set of positions reached by king moves, captures, and blocks. None of those facts says that the objective has been reached. A chain of checks can keep supplying narrower trees without ever supplying a winning leaf.

<!-- pc:block c0113 -->
A **mate-in-one theorem** is different. Its leaf is `mate(opponent)`, which ends a task whose objective allows mate. A **completed skewer theorem** can also reach an objective leaf: its assumptions cover the king’s replies, the capture, and whatever material and safety conditions the task requires. Those are stronger outputs than “this move gives check.”

<!-- pc:block c0114 -->
The little skewer tree above ends at `captured(B)`. In that puzzle the main skewer branch also leaves White +3, so the material threshold holds, but the listed F boundary still needs its stated treatment. Likewise, mate is not a claim that White has two extra material points: a material-only objective must explicitly admit mate as an alternative before a mating leaf closes it.

<!-- pc:block c0115 -->
This changes the search question. Instead of “What checks are available?”, ask “Which theorem could reach the objective, and what is missing from its entry?” Then look for a smaller tree that supplies the missing facts. Checks are often good connectors. They are not the only connectors: Kf3 in the skewer puzzle is a quiet move which supplies a mate threat and the next useful reply classes.

<!-- pc:block c0116 -->
```text
Preparation ; Forcing reply classes ; Objective-reaching theorem
```

<!-- pc:block c0117 -->
The theorem boundary is a natural stopping point for calculation because the remaining claim is explicit. If all legal reply paths end at leaves meeting the chosen objective and boundary rule, stop. If a leaf only says `check(K)` or `attacks(N,Q)`, look for the next fitting tree. If it has an F branch, fill that branch rather than restarting the whole line.

<!-- pc:block c0118 -->
A small library of these trees could cover many puzzles through composition. Learning the library means learning both the patterns and their joins. The policy then has a clearer job: spot the cues, choose a plausible objective-reaching tree, and assemble the missing preparations with as little calculation as possible.

  const colors = {green:'#167567',teal:'#167567',accent:'#167567',gold:'#b58740',amber:'#b58740',red:'#b36b50',blue:'#3c7d96',ink:'#152e35',G:'#167567',Y:'#b58740',R:'#b36b50',B:'#3c7d96'};
  const paint = (value, fallback = '#167567') => colors[value] || (/^#[a-fA-F0-9]{6}$/.test(value || '') ? value : fallback);
  const glyphs = {p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
  const pieceNames = {p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
  const sideName = side => side === 'w' ? 'White' : 'Black';
  const sideOf = fen => fen.split(/\s+/)[1];
  const moveKey = move => typeof move === 'string' ? move : move.uci || (move.from + move.to + (move.promotion || ''));

  function rules(fen) {
    const api = global.PredicateChessDataV1;
    if (api && typeof api.engine === 'function') return api.engine(fen);
    const Chess = api && api.Chess || global.PredicateChessRulesV1 && global.PredicateChessRulesV1.Chess || global.Chess;
    if (!Chess) throw new Error('The embedded chess rules library is unavailable.');
    return new Chess(fen);
  }

  function boardPieces(fen) {
    const pieces = [];
    fen.split(/\s+/)[0].split('/').forEach((rank, row) => {
      let file = 0;
      for (const item of rank) {
        if (/[1-8]/.test(item)) file += Number(item);
        else { pieces.push({piece:item, square:String.fromCharCode(97 + file) + (8 - row)}); file++; }
      }
    });
    return pieces;
  }

  function board(node, uid, orientation) {
    const pieces = boardPieces(node.fen), side = sideOf(node.fen), annotation = node.annotations;
    const point = square => {
      if (!/^[a-h][1-8]$/.test(square || '')) return null;
      const file = square.charCodeAt(0) - 97, rank = Number(square[1]) - 1;
      return {x:32 + (orientation === 'black' ? 7 - file : file) * 56 + 28,
        y:16 + (orientation === 'black' ? rank : 7 - rank) * 56 + 28};
    };
    const label = pieces.map(p => `${p.piece === p.piece.toUpperCase() ? 'White' : 'Black'} ${pieceNames[p.piece.toLowerCase()]} ${p.square}`).join(', ');
    let html = `<svg viewBox="0 0 500 490" role="img" aria-label="${escape(label)}. ${sideName(side)} to move. ${escape(orientation)} at bottom." xmlns="http://www.w3.org/2000/svg"><title>${escape(node.san || 'Starting position')}</title><defs><clipPath id="${uid}-clip"><rect x="32" y="16" width="448" height="448" rx="5"/></clipPath></defs><g clip-path="url(#${uid}-clip)">`;
    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) html += `<rect x="${32 + col * 56}" y="${16 + row * 56}" width="56" height="56" fill="${(row + col) % 2 ? '#8daf9e' : '#eeeede'}"/>`;
    if (/^[a-h][1-8][a-h][1-8]/.test(node.uci || '')) for (const square of [node.uci.slice(0,2), node.uci.slice(2,4)]) {
      const p = point(square); html += `<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`;
    }
    for (const mark of annotation.highlights.squares || []) {
      const item = typeof mark === 'string' ? {square:mark} : mark, p = point(item.square || item.sq);
      if (p) html += `<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${paint(item.color,'#b58740')}" fill-opacity=".12" stroke="${paint(item.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for (const p of pieces) {
      const pt = point(p.square), white = p.piece === p.piece.toUpperCase();
      html += `<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()]}</text>`;
    }
    for (const arrow of annotation.highlights.arrows || []) {
      const p = point(arrow.from), q = point(arrow.to);
      if (!p || !q) continue;
      const dx = q.x-p.x, dy = q.y-p.y, len = Math.hypot(dx,dy);
      if (!len) continue;
      const ux = dx/len, uy = dy/len, end = {x:q.x-ux*17,y:q.y-uy*17}, base = {x:end.x-ux*11,y:end.y-uy*11};
      html += `<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${paint(arrow.color)}" stroke-width="5" stroke-linecap="round" opacity=".88"/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${paint(arrow.color)}" opacity=".95"/>`;
    }
    html += '</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for (let i = 0; i < 8; i++) html += `<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(orientation==='black'?104-i:97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${orientation==='black'?i+1:8-i}</text>`;
    return html + '</svg>';
  }

  function normalizeGame(raw, source) {
    const headers = raw.headers || raw.tags || {};
    if (headers.Schema !== VERSION) throw new Error(`Unsupported Schema ${JSON.stringify(headers.Schema || '(missing)')}; expected ${VERSION}.`);
    const view = (headers.View || 'line').toLowerCase();
    if (!['line','proof'].includes(view)) throw new Error(`Unsupported View ${JSON.stringify(headers.View)}.`);
    const orientation = (headers.Orientation || 'white').toLowerCase();
    if (!['white','black'].includes(orientation)) throw new Error('Orientation must be "white" or "black".');
    const inputNodes = Array.isArray(raw.nodes) ? raw.nodes : raw.nodes instanceof Map ? Array.from(raw.nodes.values()) : Object.values(raw.nodes || {});
    const rawMap = new Map(inputNodes.map(n => [String(n.id),n]));
    const rootValue = raw.root || raw.rootId || inputNodes[0];
    const sourceRoot = typeof rootValue === 'object' ? rootValue : rawMap.get(String(rootValue));
    if (!sourceRoot) throw new Error('The PGN loader returned no starting position.');
    const nodes = [], nodeMap = new Map(), aliases = new Map(), active = new Set();
    function visit(value, parent, index) {
      const input = typeof value === 'object' ? value : rawMap.get(String(value));
      if (!input) throw new Error('The PGN tree contains an unknown child.');
      const id = String(input.id == null ? parent ? parent.id + '.' + index : 'root' : input.id);
      if (active.has(id) || nodeMap.has(id)) throw new Error(`The PGN tree reuses node ${id}.`);
      const branchIntro = (input.startingComments || []).join('\n\n');
      if (/\[%/.test(branchIntro)) throw new Error('Place board annotations after SAN; initial comments belong before the first mainline move.');
      const node = {id,fen:input.fen,san:input.san || input.move && input.move.san || null,uci:input.uci || input.move && moveKey(input.move) || null,
        ply:parent ? parent.ply+1 : 0,parent,children:[],comments:input.rawComments || input.comments || [],branchIntro,nags:input.nags || [],annotations:null};
      if (!node.fen) throw new Error(`Node ${id} has no replayed FEN.`);
      const annotationAPI = global.PredicateChessAnnotationsV1;
      if (!annotationAPI) throw new Error('The embedded PGN annotation interpreter is unavailable.');
      node.annotations = annotationAPI.parse(node.comments,{fen:node.fen,engine:rules(node.fen)});
      node.annotations.highlights ||= {squares:[],arrows:[]};
      node.annotations.facts ||= []; node.annotations.stable ||= node.annotations.invariants || [];
      node.annotations.created ||= []; node.annotations.removed ||= [];
      if (node.annotations.alias) {
        if (aliases.has(node.annotations.alias)) throw new Error(`Repeated node alias ${node.annotations.alias}.`);
        aliases.set(node.annotations.alias,node);
      }
      nodeMap.set(id,node); nodes.push(node); active.add(id);
      node.children = (input.children || []).map((child,i) => visit(child,node,i));
      active.delete(id); return node;
    }
    const root = visit(sourceRoot,null,0);
    const game = {headers,view,orientation,root,nodes,nodeMap,aliases,source,sourceId:headers.Id || `block-${++serial}`};
    if (view === 'proof') {
      if ((headers.Goal || '').toLowerCase() !== 'mate') throw new Error('Proof View currently requires Goal "mate".');
      if (!/^(white|black)$/i.test(headers.Prover || '')) throw new Error('Proof View requires Prover "white" or "black".');
      if (!/^\d+$/.test(headers.MaxPlies || '') || Number(headers.MaxPlies) > 1000) throw new Error('Proof View requires MaxPlies as an integer from 0 to 1000.');
      game.prover = headers.Prover.toLowerCase() === 'white' ? 'w' : 'b';
      game.maxPlies = Number(headers.MaxPlies);
      if (headers.OmitNode && !aliases.has(headers.OmitNode)) throw new Error(`OmitNode refers to missing node alias ${headers.OmitNode}.`);
      game.omitNode = headers.OmitNode ? aliases.get(headers.OmitNode) : null;
    }
    return game;
  }

  function state(node) {
    if (!node.positionState) {
      const engine = rules(node.fen), moves = engine.moves({verbose:true});
      node.positionState = {engine,moves,keys:new Set(moves.map(moveKey)),check:engine.isCheck(),mate:engine.isCheckmate(),side:engine.turn()};
    }
    return node.positionState;
  }

  function numberedMove(node) {
    if (!node.parent) return 'Start';
    const fields = node.parent.fen.split(/\s+/), fullmove = fields[5] || Math.floor((node.ply+1)/2);
    const symbols = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',10:'=',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+−',19:'−+'};
    const nags = node.nags.length ? ' ' + node.nags.map(n => symbols[n] || '$' + n).join(' ') : '';
    return `${fullmove}${fields[1] === 'w' ? '.' : '…'} ${node.san}${nags}`;
  }

  function factsMarkup(facts, kind) {
    if (!facts || !facts.length) return '';
    return `<ul class="pc-facts">${facts.map(fact => {
      if (typeof fact === 'string') return `<li class="pc-fact ${kind==='created'?'pc-created':kind==='removed'?'pc-absent':''}"><span>${escape(fact)}</span></li>`;
      const value = fact.value, detail = typeof value === 'boolean' ? value ? 'True' : 'False' : Array.isArray(value) ? value.join(', ') : value;
      return `<li class="pc-fact ${value===false?'pc-absent':''}"><span class="pc-label-value">${escape(fact.label || fact.predicate)}${detail == null ? '' : `: <strong>${escape(detail)}</strong>`}</span></li>`;
    }).join('')}</ul>`;
  }

  function selectedDetails(game,node,proofResult) {
    const a = node.annotations, p = state(node);
    const basic = [{label:'Side to move',value:sideName(p.side)},{label:`${sideName(p.side)} is in check`,value:p.check},
      {label:'Legal moves',value:p.moves.length}];
    if (p.mate) basic.push({label:`${sideName(p.side)} is checkmated`,value:true});
    let html = `<div class="pc-move-label">${node.parent?'After the replayed move':'At the starting node'}</div><div class="pc-move"><span class="pc-san">${node.parent?escape(numberedMove(node)):'Before'}</span><span class="pc-ply">Ply ${node.ply}</span></div>`;
    if (node.branchIntro) html += `<div class="pc-observation pc-comment-lines"><strong>Variation note.</strong> ${escape(node.branchIntro)}</div>`;
    if (a.caption) html += `<p class="pc-caption pc-comment-lines">${escape(a.caption)}</p>`;
    html += `<section class="pc-fact-section"><h4 class="pc-fact-title">Computed position facts</h4>${factsMarkup([...basic,...a.facts])}</section>`;
    for (const [key,title] of [['stable',node.parent?'What stays fixed':'Already in place'],['created','What this move creates'],['removed','What this move removes']]) {
      if (a[key].length) html += `<section class="pc-fact-section"><h4 class="pc-fact-title">${title}<span class="pc-authored-label">Author’s temporal notes</span></h4>${factsMarkup(a[key],key)}</section>`;
    }
    if (a.note || a.observation) html += `<div class="pc-observation pc-comment-lines">${escape(a.note || a.observation)}</div>`;
    if (proofResult) html += `<div class="pc-proof-node-reason"><strong>${escape(proofResult.status[0].toUpperCase()+proofResult.status.slice(1))}.</strong> ${escape(proofResult.reason)}</div>`;
    return html;
  }

  function fenMarkup(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sourceMarkup(source) { return `<details class="pc-source"><summary>Source PGN &amp; annotations</summary><pre>${escape(source)}</pre></details>`; }
  function metadata(game,includeDescription) {
    return `${includeDescription&&game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}${game.headers.Objective?`<div class="pc-metadata"><span class="pc-objective">${escape(game.headers.Objective)}</span></div>`:''}${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}`;
  }
  function metaMarkup(node,orientation) {
    return `<span class="pc-side" data-side="${sideOf(node.fen)}">${sideName(sideOf(node.fen))} to move</span><button class="pc-control pc-flip" data-action="flip" aria-label="Flip board orientation" title="${escape(orientation)} at bottom">Flip board</button>`;
  }
  const controls = '<nav class="pc-controls" aria-label="Position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav>';

  function lineWidget(mount,games,uid) {
    let gameIndex = 0, game = games[0], selected = game.root, orientation = game.orientation;
    const choices = new Map();
    const gallery = games.length > 1;
    mount.dataset.pcWidget = 'line';
    mount.innerHTML = `<header class="pc-header"><div class="pc-eyebrow">Worked positions · replayed PGN</div><h3>${escape(gallery?game.headers.GroupTitle || game.headers.Group:game.headers.Title || 'Worked position')}</h3>${(gallery?game.headers.GroupDescription:game.headers.Description)?`<p class="pc-intro">${escape(gallery?game.headers.GroupDescription:game.headers.Description)}</p>`:''}${gallery?`<div class="pc-selection"><label class="pc-select-label" for="${uid}-example">Explore</label><select id="${uid}-example" data-action="example" aria-label="Choose a tactical example">${games.map((g,i)=>`<option value="${i}">${escape(g.headers.Title || g.sourceId)}</option>`).join('')}</select></div>`:''}<div data-role="objective"></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<nav class="pc-step-nav" data-role="steps" aria-label="Positions on the selected line"></nav><div class="pc-branches" data-role="branches"></div><div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><div data-role="variations"></div><div data-role="source"></div><footer class="pc-footer">Moves are replayed from the Markdown PGN under the rules of chess. Position facts are computed from the displayed board; temporal notes are written by the author.</footer>`;
    const get = role => mount.querySelector(`[data-role="${role}"]`);
    function choose(node) {
      selected = node;
      for (let n = node; n.parent; n = n.parent) choices.set(n.parent.id,n.id);
      draw();
    }
    function nextChild(node) { return node.children.find(c => c.id === choices.get(node.id)) || node.children[0]; }
    function route() {
      const path = [], visited = new Set();
      for (let n=game.root;n && !visited.has(n.id);n=nextChild(n)) { path.push(n); visited.add(n.id); }
      return path;
    }
    function tree(node) {
      return `<li><button class="pc-node" data-node="${escape(node.id)}" aria-current="${selected===node?'true':'false'}" aria-label="Go to ${escape(numberedMove(node))}"><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-kind">${node.parent?'PLY '+node.ply:'ROOT'}</span></button>${node.children.length?`<ul class="pc-children">${node.children.map(tree).join('')}</ul>`:''}</li>`;
    }
    function draw() {
      mount.dataset.example=game.sourceId;mount.dataset.step=String(selected.ply);mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.orientation=orientation;
      get('objective').innerHTML=metadata(game,gallery);
      get('meta').innerHTML=metaMarkup(selected,orientation);
      get('board').innerHTML=board(selected,uid,orientation);
      get('detail').innerHTML=selectedDetails(game,selected);
      get('fen').innerHTML=fenMarkup(selected.fen);
      const path=route();mount.dataset.stepCount=String(path.length);
      get('steps').innerHTML=path.map(n=>`<button class="pc-step" data-node="${escape(n.id)}" ${n===selected?'aria-current="step"':''} aria-label="Go to ${escape(numberedMove(n))}">${escape(numberedMove(n))}</button>`).join('');
      get('branches').innerHTML=selected.children.length>1?`<label for="${uid}-branch">Choose the next move</label><select id="${uid}-branch" data-action="branch" aria-label="Choose the next variation">${selected.children.map(child=>`<option value="${escape(child.id)}" ${nextChild(selected)===child?'selected':''}>${escape(numberedMove(child))}</option>`).join('')}</select>`:game.nodes.length===1?'<p class="pc-empty-line">Starting position · no moves in this block</p>':'';
      const hadOpen=get('variations').querySelector('details')?.open;
      get('variations').innerHTML=game.nodes.some(n=>n.children.length>1)?`<details class="pc-source pc-branch-tree" ${hadOpen?'open':''}><summary>All lines &amp; variations</summary><div class="pc-tree pc-tree-list"><ul>${tree(game.root)}</ul></div></details>`:'';
      const sourceOpen=get('source').querySelector('details')?.open;
      get('source').innerHTML=sourceMarkup(game.source);if(sourceOpen)get('source').querySelector('details').open=true;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!selected.children.length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.node){const node=game.nodeMap.get(button.dataset.node);if(node)choose(node);return;}
      if(button.dataset.action==='previous'&&selected.parent)choose(selected.parent);
      else if(button.dataset.action==='next'&&selected.children.length)choose(nextChild(selected));
      else if(button.dataset.action==='reset'){choices.clear();choose(game.root);}
      else if(button.dataset.action==='flip'){orientation=orientation==='white'?'black':'white';draw();}
    });
    mount.addEventListener('change',event=>{
      if(event.target.matches('[data-action="example"]')){gameIndex=Number(event.target.value);game=games[gameIndex];selected=game.root;orientation=game.orientation;choices.clear();draw();}
      else if(event.target.matches('[data-action="branch"]')){choices.set(selected.id,event.target.value);draw();}
    });
    draw();mount.dataset.pcReady='true';
  }

  /* Evaluate only the authored proof tree plus an exhaustive one-ply mate test.
     A missing subtree is unresolved. Duplicate PGN edges never count as different defenses. */
  function evaluateProof(game,omitted) {
    const results=new Map();
    function visit(node) {
      if(results.has(node.id))return results.get(node.id);
      const p=state(node),remaining=game.maxPlies-node.ply;
      let result={status:'unproved',reason:'This position has no completed continuation for the objective.'};
      const finish=()=>{results.set(node.id,result);return result;};
      if(omitted&&node===game.omitNode){result.reason='This continuation has been deliberately withheld.';return finish();}
      if(node.ply>game.maxPlies){result={status:'refuted',reason:'This node is beyond the stated ply deadline.'};return finish();}
      if(p.mate){result=p.side!==game.prover?{status:'proved',reason:`Checkmate is verified at ply ${node.ply}, within the stated deadline.`}:{status:'refuted',reason:'The proving side is checkmated.'};return finish();}
      if(remaining===0){result={status:'refuted',reason:'The ply deadline has been reached without the required checkmate.'};return finish();}
      if(!p.moves.length){result={status:'refuted',reason:'There are no legal moves, and the position is not checkmate.'};return finish();}
      const groups=new Map();
      for(const child of node.children){
        if(!p.keys.has(child.uci))throw new Error(`The replayed move ${child.san || child.uci} is not a legal child of ${node.id}.`);
        if(!groups.has(child.uci))groups.set(child.uci,[]);
        groups.get(child.uci).push(visit(child));
      }
      const moveStates=new Map();
      for(const [uci,entries]of groups)moveStates.set(uci,entries.some(x=>x.status==='proved')?'proved':entries.some(x=>x.status==='refuted')?'refuted':'unproved');
      const states=Array.from(moveStates.values()),covered=states.filter(s=>s==='proved').length;
      result.total=p.keys.size;result.recorded=groups.size;result.covered=covered;
      if(p.side===game.prover){
        if(states.includes('proved')){result.status='proved';result.reason='One legal choice has a completed proof of the objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='refuted')){result.status='refuted';result.reason='Every legal choice is covered and fails the bounded objective.';}
        else if(remaining===1){
          if(node.immediateMates===undefined){
            let mates=0;
            for(const move of p.moves){const next=rules(node.fen);next.move({from:move.from,to:move.to,promotion:move.promotion});if(next.isCheckmate())mates++;}
            node.immediateMates=mates;
          }
          result.checked=p.moves.length;result.matingMoves=node.immediateMates;
          if(node.immediateMates===0){result.status='refuted';result.reason=`The complete one-ply check examined all ${p.moves.length} legal moves. Immediate mating moves: 0. The deadline cannot be met.`;}
          else result.reason=`${node.immediateMates} immediate mating move${node.immediateMates===1?' exists':'s exist'}, but no completed authored continuation proves this node.`;
        }else result.reason='The shown choices do not prove the objective. Unwritten legal choices remain unresolved.';
      }else{
        if(states.includes('refuted')){result.status='refuted';result.reason='A legal opponent reply has a completed refutation of the bounded objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='proved')){result.status='proved';result.reason=`All ${p.keys.size} distinct legal opponent replies have a completed answer.`;}
        else result.reason=`${covered} of ${p.keys.size} distinct legal opponent replies have a completed answer. Every remaining defense must still be covered.`;
      }
      return finish();
    }
    visit(game.root);
    for (const node of game.nodes) visit(node);
    return {status:results.get(game.root.id).status,results};
  }

  function proofWidget(mount,game,uid) {
    let selected=game.root,orientation=game.orientation,omitted=false,evaluation;
    mount.dataset.pcWidget='proof';mount.dataset.example=game.sourceId;
