# Predicate Chess

## Pawn structures: what stays the same, and what each side tries to achieve

A pawn structure is a set of relationships. The position of every pawn in a sample diagram is not part of its definition. An isolated d-pawn can reach the fifth or sixth rank and remain isolated. A Carlsbad minority attack can advance several queenside pawns before an exchange changes the structure. A locked centre is less flexible: changing the squares where its chains touch can change the available breaks completely.

This atlas turns the 28 structures in Mauricio Flores Rios’s *Chess Structures — A Grandmaster Guide* into explicit recognition rules and illustrated plans for both sides. It covers the main chapter plans, important transformations, and refinements from the model games. The diagrams are newly drawn teaching schematics. Short replayable examples are identified separately as positions from the book.

### Four kinds of information on a structure board

| Mark | Meaning | What it does not require |
|---|---|---|
| **Gold outline around a pawn** | A pawn of that colour belongs on that exact square in the named profile. | The other pieces do not have to occupy any particular squares. |
| **Blue file band; W ↕ or B ↕** | At least one pawn of the marked colour must be somewhere on that file. The diagram chooses one representative rank. | It does not fix the pawn to the displayed square. Written rules can impose additional count, ordering or contact requirements. |
| **Red W × or B × beside a file** | That colour has no pawn anywhere on that file. | A pawn of the other colour may still be there. |
| **Faded pawn** | A useful sample pawn from the book’s skeleton. | Its precise placement, or sometimes its survival, is not essential to the core recognition rule. Count and majority conditions in the text still apply. |

The masks deliberately leave irrelevant details open. A faded a-pawn is not an instruction to erase the a-pawn. A red **W ×** on the c-file is not a claim that the entire c-file is empty. The board and the written relations form one definition; the coloured marks alone are not a complete position classifier.

### The isolated-pawn test

An isolated White d-pawn has a particularly simple definition:

```text
Exactly one White pawn somewhere on the d-file, on ranks 2–7.
No White pawn anywhere on the c-file.
No White pawn anywhere on the e-file.
```

A White pawn on c6 still prevents the d-pawn from being isolated in the formal sense, even if it cannot currently defend it. Black’s pawn locations do not determine that isolation. They do determine whether White can advance, attack, or expect a difficult ending. The familiar middlegame plans therefore need more context than the word “isolated” supplies.

The same test applies to Black. Swapping colours and reflecting the ranks preserves the idea: White’s d4–d5 advance corresponds to Black’s ...d5–d4. The d-file remains the d-file; rotating the board through 180 degrees alone would also exchange the files and would not preserve that coordinate description.

### The Carlsbad test

In the book’s usual orientation, White has the d4 pawn, an e-file pawn and no c-file pawn. Black has the d5 pawn, a c-file pawn and no e-file pawn. The supporting e- and c-pawns need not stay on e3 and c6: the book itself starts with Black’s pawn on c7. Queenside advances are part of the minority attack, not a new structure merely because b2 has become b4.

The central contact and the surviving pawn groups matter. If ...c5 is met by dxc5 and the central pawn is recaptured, the position can become an isolated-pawn structure. If both central pawns advance into new contact or are exchanged, the original label needs qualification or replacement. A useful name should survive harmless advances while still noticing a change in the mechanism of the position.

### How to read a plan diagram

Each plan has its own board. A diagram may show the pawn break before it occurs, the desired outpost after a piece has arrived, or the structure produced by a capture. Its caption says which. Arrows show intended pawn advances, piece routes or pressure; a long arrow is not a claim that a pawn can jump several ranks in one move. An arrow towards an occupied square can mean an attack or a future capture after preparation.

Kings and other pieces appear only when they explain the plan. An empty square in a schematic does not promise that it is empty in a real game. These boards do not assert a legal complete position, a forced continuation, an engine evaluation or a guaranteed win. The replayable book examples below use complete legal positions and actual move sequences.

For each plan, the text states **the aim**, **the conditions that make it useful**, and **the other side’s answer**. A structural advantage only creates an opportunity. Checks, captures, king safety and move order decide whether that opportunity can be used now.

## 1. The isolani / isolated queen’s pawn


**d4 and …d5.** Source: Flores Rios, printed pp. 12–35. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-mask"]
[Title "Recognition: The isolani / isolated queen’s pawn"]
[FEN "8/pp3ppp/4p3/8/3P4/8/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteFiles "d"]
[WhiteAbsent "c e"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 12–35."]

{  }
*
```


**Required relationships**


- An isolated queen’s pawn is a pawn on the d-file with no friendly pawn anywhere on the c- or e-file. Its original identity is irrelevant: a pawn that recaptured onto d counts.
- The displayed position assigns the isolani to White; reflect the board vertically and swap colours for Black’s version.


**What may move or vary**


- The isolated pawn may be on any legal pawn rank, 2–7. A white pawn on d5 is still an IQP; it often gains space and is less easy to attack.
- The a-, b-, f-, g- and h-pawns shown are context, not square requirements. The opposing e6-pawn is a common arrangement, not part of the definition.
- Blockade plans refer to the square immediately in front of the actual pawn: d5 against a white pawn on d4, d6 against one on d5.


**Which pawns must be absent**


- No White pawn on any c-file or e-file square in the White-IQP version. A friendly pawn far behind on c2 still prevents the label isolated.


**When the label changes**


- Capturing the isolated pawn removes the motif. If it captures off the d-file it is no longer an IQP, though it may remain an isolated pawn.
- A friendly pawn arriving on the c- or e-file ends strict isolation.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **Advanced isolani.** An isolani on its fifth rank can restrict enemy pieces and prepare another advance; do not automatically attach the weak-d4-pawn evaluation. (Printed pp. 34–35.)

- **Opponent has a c-pawn instead of an e-pawn.** The same isolation motif persists, but the e-file and diagonals toward the king become more open. The defender’s second-front break changes from …e5/f-file play to …c5/b-file play. (Printed pp. 20–25.)



### White’s plans


#### Build the kingside battery


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-white-1"]
[Title "Build the kingside battery"]
[FEN "6k1/pp3ppp/4p3/4N1B1/3P4/3Q4/PPB2PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 12, 25–34."]

{ [%csl Ge5,Rh7] [%cal Gc2d3,Gd3h7] }
*
```


**Aim.** Place a knight on e5, a bishop on c2 and queen on d3; the other bishop may reach g5. Coordinate threats against h7 and the king.


**When it works.** Keep enough attacking pieces and preserve the light-squared bishop when it is the main source of activity.


**The other side’s answer.** Black blocks d5 and exchanges the attacking bishop before grabbing material.


#### Lift a rook through the third rank


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-white-2"]
[Title "Lift a rook through the third rank"]
[FEN "6k1/pp3ppp/4p3/8/3P4/7R/PPB2PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 12, 14, 25–28."]

{ [%csl Rh7] [%cal Ge1e3,Ge3h3,Gh3h7] }
*
```


**Aim.** A rook travels from e1 to e3 and across to h3 or g3, adding a heavy piece to the attack.


**When it works.** The third rank must be clear and the centre must remain tactically secure. The rook lift is often enabled by a d5 break.


**The other side’s answer.** Black creates a forcing central reaction or trades the active rook; a pawn shield alone may not suffice.


#### Break with d4–d5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-white-3"]
[Title "Break with d4–d5"]
[FEN "8/pp3ppp/4p3/3P4/2B5/5N2/PP3PPP/4R3 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 12–17."]

{ [%csl Gd5] [%cal Gd4d5,Ge1e6] }
*
```


**Aim.** Advance the isolani to open files and diagonals; recapture with active pieces or sacrifice the pawn for a concrete initiative.


**When it works.** Development and control of the opened lines matter more than retaining the pawn. Check the tactical consequences of …exd5.


**The other side’s answer.** Black maintains the blockade or prepares enough exchanges to neutralize the opening of the centre.


#### Keep an advanced isolani and squeeze


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-white-4"]
[Title "Keep an advanced isolani and squeeze"]
[FEN "8/pp3ppp/4p3/3P4/8/2N5/PP3PPP/4R3 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "Advanced IQP: d5 remains isolated; d6 is now the relevant forward square."]
[Source "Flores Rios, printed pp. 34–35."]

{ [%csl Gd5,Gd6] [%cal Gd5d6,Ge1e6] }
*
```


**Aim.** Keep the pawn on d5 when it gains space without becoming a target, use the e-file and prepare d5–d6 if possible.


**When it works.** This is the White-colour version of the chapter’s advanced black d4-pawn. A further push needs concrete support.


**The other side’s answer.** Black blockades immediately in front of the pawn and contests the active file rather than relying on the old d5 blockade square.


### Black’s plans


#### Blockade before attacking the pawn


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-black-1"]
[Title "Blockade before attacking the pawn"]
[FEN "3r4/pp3ppp/4p3/3n4/3P4/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "The knight on d5 blockades the pawn; the rook supports the blockader. Other pieces can attack d4, or the rook can attack it after the knight moves under favorable conditions."]
[Source "Flores Rios, printed pp. 12–17."]

{ [%csl Rd4,Gd5] [%cal Rd8d5] }
*
```


**Aim.** Install a stable knight immediately in front of the pawn. It stops the pawn advance and restrains White's pieces; prepare pressure on the pawn without abandoning the blockade.


**When it works.** The blockader must be stable; a rook, bishop or king can replace a knight in suitable simplified positions.


**The other side’s answer.** White removes or distracts the blockader, then opens the centre.


#### Exchange the active bishop and simplify


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-black-2"]
[Title "Exchange the active bishop and simplify"]
[FEN "8/pp3ppp/4p3/n2n4/3P4/1B6/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "The knight on a5 threatens to remove the bishop supporting the kingside and d5 break."]
[Source "Flores Rios, printed pp. 12, 28–34."]

{ [%csl Rb3,Gd5] [%cal Ra5b3] }
*
```


**Aim.** Seek the exchange of White’s light-squared bishop and other attacking pieces, retaining a good blockader.


**When it works.** Choose exchanges by function. Removing all pieces mechanically can leave a favourable rook ending for the pawn holder.


**The other side’s answer.** White preserves the good bishop and uses the remaining tempi for active threats.


#### Tie down the defence, then create a second front


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-black-3"]
[Title "Tie down the defence, then create a second front"]
[FEN "3q4/pp3ppp/4pk2/3r4/3P4/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "Pressure on d4 fixes White’s pieces; kingside expansion supplies another problem."]
[Source "Flores Rios, printed pp. 17–22."]

{ [%csl Rd4] [%cal Rd5d4,Rf7f5,Rg7g5] }
*
```


**Aim.** Attack the isolated pawn until enemy pieces defend it, improve the king, then advance a wing majority or create another weakness.


**When it works.** First eliminate counterplay. The second front may be a passed wing pawn, an exposed b-pawn or a kingside weakness.


**The other side’s answer.** White seeks rook activity and a timely pawn break before becoming tied down.


#### Use a central lever to force wing weaknesses


```chess
[Schema "pawn-schematic/1"]
[Id "structure-1-black-4"]
[Title "Use a central lever to force wing weaknesses"]
[FEN "3q4/pp3ppp/4p3/3r4/3P1P2/8/PP4PP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "White f4 restrains …e5, but gives Black a new target for …h5 and kingside pressure."]
[Source "Flores Rios, printed pp. 20–23."]

{ [%csl Rf4,Re5] [%cal Re6e5,Rh7h5] }
*
```


**Aim.** Prepare …e6–e5 against d4; if White must play f4 to stop it, attack the new fixed kingside with …h5. With an opposing c-pawn instead, use …c5 and …a5 against a forced b4.


**When it works.** This is a slow endgame method when White lacks active piece play. The two versions are alternatives.


**The other side’s answer.** White keeps rooks active, avoids unnecessary fixes, and calculates whether the central trade releases the defence.


### What decides between these plans


- The pawn pattern does not establish an evaluation. The attacking bishop, piece activity, blockade and available trades determine whether the pawn is a strength or a target.
- The book’s endgame wins demonstrate methods, not a theorem that every IQP endgame is lost.

- **Zvjaginsev–Vasquez** (2013): The d5 break punishes Black’s slow queenside expansion. Printed p. 13.

- **Wojtaszek–Fressinet** (2011): Simplified IQP: immobilize the defenders, gain space, then create a second front. Printed p. 17.

## 2. Hanging pawns


**d4 and …d5.** Source: Flores Rios, printed pp. 36–50. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-mask"]
[Title "Recognition: Hanging pawns"]
[FEN "8/pp3ppp/4p3/8/2PP4/8/P4PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteFiles "c d"]
[WhiteAbsent "b e"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 36–50."]

{  }
*
```


**Required relationships**


- The characteristic pair consists of White pawns on adjacent c- and d-files, detached from friendly pawns on b and e.
- The mobile classical position has the pair side by side on c4 and d4. That alignment is a state of the pair, not a requirement that every related position must retain forever.


**What may move or vary**


- Ranks can change within the hanging-pawn family. Record separately whether the pair is abreast, staggered, blockaded or becoming passed.
- White c3+d4 is the common precursor after bxc3. White c4+d5 is an advanced, connected chain; its plans differ from the mobile abreast pair.
- Wing-pawn squares and Black’s e6/b7 placements are contextual.


**Which pawns must be absent**


- No friendly pawn on the b- or e-file can support the c/d pair from outside. Do not call c4+d4 an isolated hanging pair if a white b3 or e3 pawn belongs to a larger chain.


**When the label changes**


- An exchange that leaves one central pawn produces an isolated-pawn position. A d-pawn recapture onto e5 produces a new c/e structure.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **c3+d4 precursor.** Advance c3–c4 when safe; otherwise the pair may be blockaded before its dynamic potential appears. (Printed pp. 37, 44–50.)

- **dxe5 transformation.** Recapturing on e5 trades central support for attacking space. White c4 becomes weaker, so the initiative becomes urgent. (Printed pp. 42–44.)



### White’s plans


#### Attack with the central space


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-white-1"]
[Title "Attack with the central space"]
[FEN "6k1/pp3ppp/4p3/4N3/2PP4/3Q3R/P1B2PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 36–39."]

{ [%csl Ge5,Rh7] [%cal Gc2d3,Gd3h7,Gh3h7] }
*
```


**Aim.** Use Ne5, Bc2 and Qd3, with an optional rook lift along rank three. The pawns restrict defenders while the pieces attack.


**When it works.** Retain enough active pieces. The bishop pair is especially useful when a pawn break opens the position.


**The other side’s answer.** Black exchanges attackers and presses the central pawns.


#### Open lines with d4–d5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-white-2"]
[Title "Open lines with d4–d5"]
[FEN "8/pp3ppp/4p3/3P4/2P5/5N2/PB3PPP/4R3 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 36–39."]

{ [%csl Gd5] [%cal Gd4d5,Gb2g7] }
*
```


**Aim.** Time d5 to release the bishops and rooks, sometimes while accepting structural liquidation.


**When it works.** Check who gains the move after the central captures; the pawn push is powerful when White’s pieces are already active.


**The other side’s answer.** Black removes the tactical support or trades pieces before allowing the break.


#### Create a supported passed d-pawn


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-white-3"]
[Title "Create a supported passed d-pawn"]
[FEN "8/pp3ppp/8/3P4/2P5/8/PQ3PPP/3R4 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "The c4-pawn protects a passer on d5. After the supporter reaches c5, d5-d6 can preserve the pawn chain."]
[Source "Flores Rios, printed pp. 40–41."]

{ [%csl Gd5] [%cal Gd4d5,Gc4c5,Gd5d6] }
*
```


**Aim.** Create a protected passer on d5, supported by c4. To keep it pawn-protected after d5-d6, advance the supporting pawn to c5 when safe.


**When it works.** No enemy pawn may remain ahead on the d-file or either adjacent file if the pawn is to be called passed. Check the timing of the supporting c-pawn advance.


**The other side’s answer.** Before the conversion, Black tries to retain a pawn that prevents passed status. Against the passer shown here, Black blockades the square in front and attacks its supporting pawns.


#### Use the dxe5 transformation for an attack


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-white-4"]
[Title "Use the dxe5 transformation for an attack"]
[FEN "8/pp3ppp/4pn2/4P1B1/2P5/3B4/P4PPP/3R4 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 42–44."]

{ [%csl Ge5,Rc4] [%cal Gd4e5,Ge5f6] }
*
```


**Aim.** After a piece exchange on e5, a pawn from d4 recaptures on e5 and helps drive the kingside attack.


**When it works.** The c4-pawn loses support. This is a calculated transformation whose success depends on retaining the initiative.


**The other side’s answer.** Black seeks an immediate threat on the long diagonal or against c4 rather than a routine retreat.


### Black’s plans


#### Reduce the attacking force


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-black-1"]
[Title "Reduce the attacking force"]
[FEN "8/pp3ppp/3bp3/3n4/2PP1B2/8/P4PPP/3R4 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "A representative exchange of an active bishop on f4 reduces White's attacking force while Black retains its central blockader."]
[Source "Flores Rios, printed pp. 36–41."]

{ [%csl Rc4,Rd4] [%cal Rd6f4] }
*
```


**Aim.** Trade useful attacking pieces, making it harder for the two central pawns to justify their long-term exposure.


**When it works.** Trade selectively: giving the opponent a powerful passed pawn may outweigh the gain from simplification.


**The other side’s answer.** White uses the next free tempo to advance d5 or improve the bishop pair.


#### Force an advance, then blockade both pawns


```chess
[Schema "pawn-schematic/1"]
[Id "structure-2-black-2"]
[Title "Force an advance, then blockade both pawns"]
[FEN "2rr4/pp3ppp/4p3/3n4/2nP4/2P5/P4PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "Knights blockade c3 and d4 from c4 and d5. The rooks support the blockaders; direct attacks on the pawns require additional pieces or a later rearrangement."]
[Source "Flores Rios, printed pp. 44–50."]

{ [%csl Rc3,Rd4] [%cal Rc8c4,Rd8d5] }
*
```


**Aim.** Pressure one pawn until it must move, occupy the squares in front of the pair, and add attacks along the c- and d-files.


**When it works.** The strongest version catches the c-pawn on c3 before it reaches c4. An advanced pawn is only a weakness if the blockade is sustainable.


**The other side’s answer.** White prepares a pawn break while pieces can still support it.


#### Undermine with …b6–b5

**Required relationships**


- The chapter’s intact centre has White d4 against Black c6 and e6, with Black’s d-pawn and White’s e-pawn absent.
- White retains a c-file pawn; this distinguishes the pattern from the Slav formation.


**What may move or vary**


- The white c-pawn may be on c2, c3, c4 or c5; these are strategically different states of the same family.
- The a-, b-, f-, g- and h-pawns may advance. Their exact starting squares are not required.
- A broader family search can admit the black e-pawn on e7, tagging the missing …e6 step. The chapter’s c6/e6 position is the standard state.


**Which pawns must be absent**


- No White e-file pawn and no Black d-file pawn in the intact structure.


**When the label changes**


- …c5 followed by dxc5 usually gives a 3–3 versus 4–2 structure. …e5 followed by dxe5 often removes the asymmetry.
- If White’s d-pawn leaves the d-file, classify the resulting position explicitly rather than carrying all d4-based plans forward.

**Required relationships**


- The intact White-minority core has opposing pawns locked on d4 and d5, a White e-file support pawn and a Black c-file support pawn.
- White has no c-file pawn and Black no e-file pawn. The familiar a/b against a/b/c minority is a common remaining material arrangement, not an exact a2-b2/a7-b7-c6 template.


**What may move or vary**


- The Black c-pawn may be on c7 or c6 before the freeing …c5 break. The chapter explicitly compares a7-b6-c7 with a6-b7-c6.
- The White e-pawn may be on e2, e3, or e4 while central tension remains unresolved. Advancing a-, b-, f-, g- or h-pawns does not by itself destroy the structure.
- After the minority attack exchanges b- and c-pawns, a residual backward c-pawn with d4/d5 locked is a Carlsbad descendant. Keep the residual-pawn state, rather than requiring the original flank counts.


**Which pawns must be absent**


- No White c-file pawn and no Black e-file pawn in the intact structure. Their absence is more significant than the precise wing-pawn ranks.


**When the label changes**


- Central captures after e4 or …c5 can produce hanging pawns, an IQP or another centre. Do not retain the intact Carlsbad plans after this structural change.

### Important versions and transformations


- **a6-b7-c6 setup.** The standard target for a b4–b5 minority attack. …a6 may help Black protect the eventual c6 weakness. (Printed pp. 86, 89–94.)

- **a7-b6-c7 setup.** A simple minority attack is less direct. White often combines b5 with e4 after contesting e4, exploiting c7 and c6 weaknesses. (Printed pp. 86, 94–97.)

- **White bishop on g2.** The central e4 break becomes especially important; the bishop is less well suited to the standard minority-attack script. (Printed pp. 86, 97–102.)

**d4 and …d5.** Source: Flores Rios, printed pp. 103–121. All coordinates below use the displayed colour orientation.

[Source "Flores Rios, printed pp. 103–121."]

{  }
*
```


**Required relationships**


- Black's characteristic wall consists of pawns on d5, e6 and f5. The d5 and f5 pawns do not control e5; in the usual undoubled formation that leaves e5 as a potential outpost for White.
- A pawn on c6 is common support, but c7 and versions after a c-file exchange also occur. White’s d4 is the chapter’s usual opposing centre.


**What may move or vary**


- Black’s c-pawn and all wing pawns are contextual rather than fixed-square requirements. White often has c4, e3, g3 or f4 depending on the system.
- The defining central ranks matter: d5/e6/f5 is a locked wall; advancing …f4 or exchanging on e4 creates a related but different state.


**Which pawns must be absent**


- No additional file-wide absence is required by the basic Stonewall motif. In particular the c-file need not be empty.


**When the label changes**


- …c5 opens central tension and changes the safety of a kingside pawn storm. Captures on e4/e5 may replace outposts by fixed pawns.
- A white Stonewall is the colour-reversed structure, not merely the same three coordinates painted white.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **Bad bishop already on b7.** The bishop may become active after …dxc4, so the label bad bishop cannot be inferred solely from the pawns. (Printed pp. 113–115.)

- **c5 restraint and e5 pawn.** A white c5 clamp can prevent Black’s freeing …c5; after a capture on e5 the structure needs new evaluation. (Printed pp. 108–112.)

- The book explicitly separates the kingside-attack plan from opening the centre with …c5. Combining them indiscriminately can destroy the basis of the attack.

**d4 and …d5.** Source: Flores Rios, printed pp. 122–137. All coordinates below use the displayed colour orientation.

*
```


**Required relationships**


- White owns a central d/e pawn majority while Black has a queenside majority. White’s b-file pawn is absent; Black’s d-file pawn is absent.
- There are two main states: White c3/d4/e4 versus Black c5 before the central exchange, or White d4/e4 with no c-pawns after …cxd4 and cxd4.


**What may move or vary**


- Track the actual d- and e-pawn ranks: d5 creates space or a passer; e5 changes the attack and weakens d5. These remain Grünfeld-family states, not identical positions.
- Black’s e-pawn may stand on e7 or e6. A bishop on g7 is common but not required; the chapter includes a structure reached from a different opening.
- Wing-pawn ranks and the a/b majority’s advances are flexible. The two c-pawn states should be recorded explicitly.


**Which pawns must be absent**


- No White b-file pawn and no Black d-file pawn in the chapter’s characteristic centre. In the exchanged state, neither side has a c-file pawn.


**When the label changes**


- Trading away the central majority or producing a locked e5/d4 versus e6/d5 centre requires a different structural description.
- A passed pawn must be verified against the remaining enemy c-, d- and e-pawns; the structure name alone does not prove it.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **Before …cxd4.** The c3 and c5 pawns retain central tension. The c-file is not yet open. (Printed pp. 122, 134.)

- **After …cxd4 cxd4.** The open c-file becomes a major strategic contest; both sides can use it to support their majority or suppress the other. (Printed pp. 122–131.)

- **After e5.** White gains kingside attacking space but gives up the e-pawn’s control of d5 and may lose the option of a supported passed d-pawn. (Printed pp. 131–137.)

**Required relationships**


- The characteristic fixed centre is White d5 against Black d6 and e5, with no White e-file pawn and no Black c-file pawn.
- White normally has a c-file pawn and a queenside majority; Black has the e/f central and kingside majority. The d5-pawn often arrived by exd5.


**What may move or vary**


- The white c-pawn may advance from c2 toward c5/c6. The a- and b-pawns may also advance; these moves are central to White’s plan.
- Black’s f-pawn may move from f7 to f5/f4 and the wings vary. The d5/d6/e5 arrangement is rank-sensitive; arbitrary ranks would describe a different centre.
- The opening name is not a recognition condition: Sveshnikov and other Sicilian move orders can reach this pattern.


**Which pawns must be absent**


- No White e-file pawn and no Black c-file pawn in the characteristic position.


**When the label changes**


- …e4, dxc5 or exchanges after a c5 break change the central geometry; retain a labelled descendant instead of assuming every original bishop rule still holds.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### White’s plans


#### Advance the queenside majority


```chess

[Source "Flores Rios, printed pp. 138–148."]

{ [%csl Gc5] [%cal Gb2b4,Gc2c4,Gc4c5] }
*
```


**Aim.** Prepare b4 and c4–c5, then open a file or create a passed pawn before Black’s kingside attack becomes dangerous.


**When it works.** White needs an available queenside and active pieces. Castling there or allowing …b4/…a5 can make this plan unavailable.


**The other side’s answer.** Black prevents b4 with …a5, attacks c4 with …b5, or races with …f5.


#### Use c6 before b5 to create a passer

[Source "Flores Rios, printed pp. 139–141."]

{ [%csl Gc6,Ga5] [%cal Gc5c6,Gb4b5] }
*
```


**Aim.** Advance c5-c6 first, then use b4-b5 to challenge Black's a6/b7 pawns and create a passed pawn on the queenside.


**When it works.** This is a tactical move-order motif: check captures and the promotion race. It is not a forced sequence in every example.


**The other side’s answer.** Black seeks an earlier central or kingside threat rather than waiting for the queenside to open.


#### Switch to Bc2 and g4 against …f5


```chess

{ [%csl Rf5] [%cal Gd1c2,Gg2g4,Gg4f5] }
*
```


**Aim.** Place the bishop on the b1–h7 diagonal and use g4 to undermine the advanced f5-pawn and open attacking lines.


**When it works.** This works when the kingside can be opened safely and the bishop has a useful diagonal. The book treats it as a potent but less frequent option.


**The other side’s answer.** Black keeps the centre active with …e4 or prevents the bishop transfer.

**Aim.** Advance …f5, bring a knight toward f4 and a rook along the third rank, and create kingside threats.


**When it works.** Clear f6 first if a knight blocks the pawn. Count the tempos in the race against c5 and the passed pawns.


**The other side’s answer.** White advances the queenside with tempo or meets the attack with a well-timed g4.

**Aim.** Push …e5–e4, sometimes as a pawn sacrifice, then …f5–f4 to open routes for the bishop and rooks.


**When it works.** The sacrifice requires a concrete attack. Without active pieces it can simply surrender the centre.


**The other side’s answer.** White checks whether a king retreat, including giving up material, permits the passed pawns to decide the race.

*
```


**Aim.** Use …b5 to attack c4, or …a5 to make b4 difficult, while improving the pieces for kingside play.


**When it works.** Choose the pawn move according to White’s current majority. Unnecessary wing moves can instead hand White an extra attacking tempo.


**The other side’s answer.** White finds a favourable c5 break or avoids the pawn recapture on d5 until a queenside plan is available.


#### Exploit the bishop imbalance


```chess
[Schema "pawn-schematic/1"]
[Id "structure-8-black-4"]
[Title "Exploit the bishop imbalance"]
[FEN "8/pp3p1p/1b1p2p1/3Pp3/2B5/8/PPP2PPP/6K1 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "Black's bishop has reached b6 by going around its own e5 pawn and now pressures f2. White's bishop on c4 remains restricted by d5."]
[Source "Flores Rios, printed pp. 138, 149–154."]

{ [%csl Rd5] [%cal Rf6d8,Rd8b6,Rb6f2] }
*
```


**Aim.** Reroute the dark-squared bishop to an active diagonal, often via f6-d8-b6, while White's light-squared bishop remains restricted by d5.


**When it works.** The advantage is strongest when White cannot open the queenside. Do not call Black’s bishop bad merely because e5 is on its colour.


**The other side’s answer.** White should avoid an unfavourable exd5 recapture or find activity before simplifying to the bishop imbalance.


### What decides between these plans


- White’s light-squared bishop can be worse than Black’s dark-squared bishop even though both share a colour with an advanced own pawn. Mobility and useful diagonals matter.
- White queenside castling may make the normal minority/majority expansion unsafe; it is a major qualifier, not a small detail.


### Model positions to revisit


- **Grischuk–Zhang Zhong** (2001): White’s c5–c6 and b5 sequence creates a winning passer, while Black still develops dangerous counterplay. Printed p. 139.

- **Bologan–Esen** (2012): White combines queenside expansion with Bc2 and g4. Printed p. 141.

- **Polgar–Dominguez Perez** (2011): An unfavourable exd5 leaves White without a queenside plan and with the worse bishop. Printed p. 149.

**Required relationships**


- White retains e4 while Black has d6 and e5. White’s d-pawn and Black’s c-pawn are absent: d5 is the central contested square.
- The d6/e5 ranks are essential to the hole on d5; a file-only description would merge different Sicilian structures.


**What may move or vary**


- White’s c-pawn can remain on c2 or reach c4. White’s f-pawn can stay on f2/f3 or advance to f4/f5; tag these versions separately.
- The a-pawn need not be on a6 and the position need not come from the Najdorf opening. Flank-pawn squares are not fixed requirements.


**Which pawns must be absent**


- No White d-file pawn and no Black c-file pawn.


**When the label changes**


- A White pawn recapture onto d5 converts the position to Type I. A successful …d5 changes the centre, often toward 3–3 versus 4–2.
- After …e4 with White’s f-pawn already on f5, new pawn chains and tactical targets require reassessment.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **c4 bind.** The extra c4 pawn reinforces d5 but gives Black a target for …b5; d5 control alone does not guarantee an advantage. (Printed pp. 155–156, 163–169.)

- **f5 wedge.** The f5 pawn keeps the light-squared bishop away from e6 and supports kingside play, while weakening e4. (Printed pp. 155–156, 169–177.)

**Aim.** Arrange several pieces to support d5 so that a trade there can be answered by a piece, keeping the central pawn structure.


**When it works.** A knight far from d5 is not equivalent to one already occupying it. Judge the time needed to bring it there.


**The other side’s answer.** Black removes supporting pieces, fights for d5 or makes a favourable Type I transformation.

**Required relationships**

**What may move or vary**


- White’s a- and b-pawns may advance, and its f-pawn may stand on f2, f3 or f4. Black’s g- and h-pawns can advance while the shell remains intact.
- Some model games include …a5 or a delayed …a6. Use a broader Hedgehog-family label for these variants while preserving their altered b5-square geometry.
- White’s bishop on g2 versus on the f1–a6 diagonal is a decisive piece-placement qualifier, not a change to the pawn-family name.


**Which pawns must be absent**


- No White d-file pawn and no Black c-file pawn.


**When the label changes**


- A successful …d5 or …b5 releases the shell. A successful c5, b5 or a5 break produces a new set of open files and fixed pawns.
- The same plan should not remain selected after its target pawn has been traded.


*Recognition scope: Necessary core of the named position or stated starting subtype; prose defines additional relations and labelled transitions. It is not an exhaustive legal-position recognizer.*


### Important versions and transformations


- **White bishop on the f1–a6 diagonal.** White’s queenside breaks are prominent, Black emphasizes …d5 and may prepare …Kh8/…Rg8/…g5. (Printed pp. 178–199.)

- **White bishop on g2.** …d5 is harder, …b5 becomes more attractive, and White often plays f4–f5 rather than forcing a queenside expansion. (Printed pp. 179, 192–194, 200–202.)

- **Simplified Hedgehog.** A few minor-piece exchanges can reduce Black’s tactical release and make d6 a real target; exchanging pieces does not always cure the space disadvantage. (Printed pp. 191–194.)

### Model positions to revisit


- **Pruijssers–Izsak** (2012): White’s ideal piece arrangement makes c5 powerful. Printed p. 180.

- **Flores Rios–Hayrapetian** (2013): The b5 break works despite apparent weakening of White’s own pawns. Printed p. 183.

- **Predojevic–Nestorovic** (2013): An early a5 break fixes Black’s a6/d6 weaknesses. Printed p. 188.

- **Dominguez Perez–Andreikin** (2011): The …d5 release combines with h-pawn threats and active pieces. Printed p. 194.

- **Munoz Pantoja–Granda Zuniga** (2013): White’s Bg2 changes the priorities: Black uses …b5 while White should seek f5. Printed p. 200.

- **Bartholomew–Gareev** (2009): Black prepares several plans and waits for a favourable opportunity. Printed p. 202.

**Required relationships**


- White has pawns on c4 and e4 controlling d5; White has no pawn on the d-file and Black has none on the c-file.
- For this chapter’s base version Black has d6 and e7, usually g6 with the dark-squared bishop developed to g7. The bishop placement distinguishes the chapter’s plans from a Hedgehog with ...e6 and ...Be7.


**What may move or vary**


- The a-, b-, f-, g- and h-pawns may advance without destroying the c4/e4 bind. Black’s a-pawn often reaches a6 or a5, and the b-pawn b6.
- Black can play ...e6 while keeping the broad bind; this changes the availability of d5 and the choice of breaks. Record that as a variant rather than silently treating e6 and e7 as identical.


**Which pawns must be absent**


- No White pawn anywhere on the d-file; no Black pawn anywhere on the c-file.


**When the label changes**


- A capture onto d5 replaces the bind by one of the two recapture structures below.
- White e4-e5 or c4-c5, and successful ...b5 or ...f5 exchanges, require the plan to be reassessed.

## 12. Asymmetric Benoni


**Benoni.** Source: Flores Rios, printed pp. 226–241. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-mask"]
[Title "Recognition: Asymmetric Benoni"]
[FEN "8/pp3ppp/3p4/2pP4/4P3/8/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteExact "d5 e4"]
[BlackExact "c5 d6"]
[WhiteAbsent "c"]
[BlackAbsent "e"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 226–241."]

{  }
*
```


**Required relationships**


- White has a d5/e4 central majority against Black’s c5/d6 chain.
- White has no pawn on the c-file; Black has no pawn on the e-file. The resulting queenside-versus-centre majority is the defining imbalance.


**What may move or vary**


- Wing pawns are not fixed: ...g6, ...a6, a4, f4 and ...b5 are common stages.
- The source diagram leaves Black’s g-pawn on g7; g6/Bg7 is the usual practical arrangement and does not change the basic structure.


**Which pawns must be absent**


- No White pawn anywhere on the c-file; no Black pawn anywhere on the e-file.


**When the label changes**


- A successful e5 exchange changes the central majority, often creating a passed d-pawn.
- Successful ...b5 or ...c4 play produces an advanced Benoni phase; captures that remove the d5/e4 versus c5/d6 relationship require fresh classification.


### White’s plans


#### Break with e5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-white-1"]
[Title "Break with e5"]
[FEN "8/pp3ppp/3p4/2pP4/2N1PB2/8/PP3PPP/4R3 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 226–229."]

{ [%cal Ge4e5] }
*
```


**Aim.** Prepare e4-e5 to open the centre, create attacking lines or obtain a passed d-pawn.


**When it works.** A bishop on the h2-b8 diagonal and active central rooks help; unnecessary exchanges reduce the break’s force.


**The other side’s answer.** Black pressures e4, trades supporting pieces and prepares its own queenside break.


#### Follow e5 with f5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-white-2"]
[Title "Follow e5 with f5"]
[FEN "8/pp3p1p/3p2p1/2pP4/4PP2/3B4/PP4PP/4R3 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 226, 229–231."]

{ [%cal Ge4e5,Gf4f5] }
*
```


**Aim.** After e5 disrupts Black’s centre, use f4-f5 to open the kingside and increase pressure on the king.


**When it works.** Both breaks require accurate timing; a premature f4 can loosen e4 before White is ready.


**The other side’s answer.** Black attacks e4 and looks for tactical ...c4 or ...f5 resources.


#### Prepare an f-file attack with f5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-white-3"]
[Title "Prepare an f-file attack with f5"]
[FEN "8/pp3p1p/3p2p1/2pP4/4PP2/6N1/PP4PP/5R2 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "The f5 push prepares a confrontation with g6. The f-file is not clear for the rook until the white f-pawn leaves it or is captured."]
[Source "Flores Rios, printed pp. 226, 232–234."]

{ [%cal Gf4f5] }
*
```


**Aim.** White can sometimes play f4–f5 before e5. A later capture off the f-file or pawn sacrifice can clear a line for the rook while the minor pieces join the attack.


**When it works.** Check whether the centre remains defended and whether Black can gain decisive queenside activity.


**The other side’s answer.** Black seeks ...b5, ...c4 and pressure on e4.


#### Restrain the queenside majority


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-white-4"]
[Title "Restrain the queenside majority"]
[FEN "8/pp3ppp/3p4/2pP4/2N1P3/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 226, 228, 234–235."]

{ [%csl Gb4] [%cal Gb2b4] }
*
```


**Aim.** Use b2–b4 to stop …b5–b4. In suitable positions a4–a5 can also meet the two-square advance …b7–b5 with axb6 en passant, reducing Black’s mobile queenside majority.


**When it works.** Check the e4 pawn, …c4 and all recaptures. En passant is available only immediately after …b7–b5, not after …b6–b5.


**The other side’s answer.** Black repositions pieces or switches to ...f5 and kingside pressure.


### Black’s plans


#### Advance the queenside majority


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-black-1"]
[Title "Advance the queenside majority"]
[FEN "1r6/1p3pbp/p2p2p1/2pP4/4P3/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 226, 235–241."]

{ [%cal Rb7b5,Rc5c4,Rb5b4] }
*
```


**Aim.** Prepare ...b5, ...c4 and ...b4 to gain space and create a remote passed pawn.


**When it works.** The bishop on g7 and active rooks help the majority advance; Black often welcomes simplification.


**The other side’s answer.** White uses a4 or b4 and races with e5.


#### Use the e-file to restrain e5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-black-2"]
[Title "Use the e-file to restrain e5"]
[FEN "4r3/pp3ppp/3p1n2/2pP4/4P3/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "The e8 rook has a clear line to e4; the knight on f6 adds pressure to e4. The e5 push must be supported before White can release the centre."]
[Source "Flores Rios, printed pp. 226, 227–230."]

{ [%csl Re4] [%cal Re8e4] }
*
```


**Aim.** Place a rook on e8 and coordinate supporting pieces to pressure e4 and prevent the central e5 break.


**When it works.** Pressure must be active enough to stop the central break; an idle rook does not compensate for lack of space.


**The other side’s answer.** White supports e4, preserves useful bishops and times e5.


#### Drive the g3 knight away with ...h4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-black-3"]
[Title "Drive the g3 knight away with ...h4"]
[FEN "8/pp3p1p/3p2p1/2pP4/4P3/6N1/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 226, 229–230."]

{ [%cal Rh7h5,Rh5h4,Rh4g3] }
*
```


**Aim.** Use ...h5-h4 when White’s knight on g3 supports e4; displacing it can make the centre vulnerable.


**When it works.** The h-pawn can itself become weak if White meets the idea with Ng3-f1 or a well-timed central break.


**The other side’s answer.** White recalculates the e4 defense and may attack the h4 pawn.


#### Attack the centre with ...f5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-black-4"]
[Title "Attack the centre with ...f5"]
[FEN "4r3/pp3p1p/3p2p1/2pP4/4PP2/8/PP4PP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 226, 238–241."]

{ [%cal Rf7f5,Rf5e4] }
*
```


**Aim.** Challenge e4 and loosen the support of d5, especially after White’s f3 pawn has moved to f4.


**When it works.** The break opens Black’s king as well; the tactical outcome matters more than the general motif.


**The other side’s answer.** White may capture exf5 and establish a knight on f4 or e6.


#### Undermine f4 with ...g5 to restrain e5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-12-black-5"]
[Title "Undermine f4 with ...g5 to restrain e5"]
[FEN "4r1k1/pp1n1pbp/3p2p1/2pP4/4PP2/5B2/PP4PP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption "...g5 attacks the pawn that supports e5; ...Ne5 is a possible consequence. This is a conditional Benoni counterplan, separate from the usual ...b5 queenside advance."]
[Source "Flores Rios, printed pp. 450, 451."]

{ [%csl Re5,Rf4] [%cal Rg6g5,Rg5f4,Rd7e5] }
*
```


**Aim.** Attack the f4-pawn with ...g5 so White’s e5 break loses support. A knight can then use e5 or other dark squares while the white bishop remains ineffective.


**When it works.** White must have committed f4, and Black must judge the cost of advancing the g-pawn near the king. The exercise works because White cannot create effective central or kingside play.


**The other side’s answer.** White should keep an effective e5 or g5 break available and improve the restricted bishop before the clamp becomes permanent.


### What decides between these plans


- Black’s light-squared bishop is often the least useful piece because the a6/b5/c4 majority can block it. White should not help Black exchange it without a reason.
- A majority is not automatically a passed pawn: the diagram shows the direction of the plan, while captures and opposition determine whether it succeeds.


### Model positions to revisit


- **Akopian – Pantsulaia** (2013): A well-prepared e5 break, and the cost of exchanging a useful dark-squared bishop. Printed p. 227.

- **Gabriel – Kekelidze** (1999): The e5/f5 attacking combination and Black’s pressure on e4. Printed p. 229.

**Required relationships**


- White’s c4/d5 chain faces Black’s c5/d6 chain. Both sides lack an e-file pawn.
- The contact geometry is rank-sensitive: White’s extra rank of space and the e4 square drive the plans.


**What may move or vary**


- The wing pawns may advance; f4, ...f5, g4, ...g6 and queenside pawn moves are stages within the structure.


**Which pawns must be absent**


- No White or Black pawn anywhere on the e-file.


**When the label changes**


- A c- or d-pawn exchange that dissolves one of the chains changes the structure.
- The same diagram shifted arbitrarily up or down the board is not this position: d6 weakness and e4 access would change.


### White’s plans


#### Expand with f4 and g4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-white-1"]
[Title "Expand with f4 and g4"]
[FEN "8/pp3p1p/3p2p1/2pP4/2P5/3B4/PP3PPP/8 w - - 0 1"]

[Source "Flores Rios, printed pp. 242–251."]

{ [%cal Gf2f4,Gg2g4,Gg4g5,Gh2h4] }
*
```


**Aim.** Use f2-f4 and g2-g4 to gain kingside space, then choose g5, h4-h5-h6 or an opening of the g/h-files.


**When it works.** White needs enough control of e4 and must avoid helpful exchanges for Black.


**The other side’s answer.** Black replies ...f5, keeps a knight on f6 and a bishop on c8 to make g4 difficult.


#### Attack the d6 pawn


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-white-2"]
[Title "Attack the d6 pawn"]
[FEN "8/pp3ppp/3p4/2pP4/2P1NB2/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 242, 251–253."]

{ [%csl Rd6] [%cal Gf4d6,Ge4d6] }
*
```


**Aim.** Combine a bishop on f4 or another h2-b8 square with a knight on e4 and pressure on d6.


**When it works.** Prefer this plan when the pieces already point at d6 and a knight on f3 obstructs a kingside pawn expansion.


**The other side’s answer.** Black seeks ...Ne4 exchanges and tactical activity rather than passive defense.


#### Use b4 only when it serves a target


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-white-3"]
[Title "Use b4 only when it serves a target"]
[FEN "8/pp3ppp/3p4/2pP4/2P5/8/PP3PPP/1R6 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 242."]

{ [%csl Yb4] [%cal Gb2b4] }
*
```


**Aim.** A queenside expansion can gain space, but the main play normally lies on the kingside.


**When it works.** Opening queenside lines without a concrete benefit may give Black exactly the counterplay it lacks.


**The other side’s answer.** Black uses the opened files and attacks d5.


### Black’s plans


#### Claim and occupy e4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-black-1"]
[Title "Claim and occupy e4"]
[FEN "4r3/pp5p/3p2p1/2pP1p2/2P1n3/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 242, 253–255."]

{ [%csl Re4] [%cal Rf6e4,Re8e4] }
*
```


**Aim.** Arrange a knight on e4, supported by ...f5 and major pieces on the e-file. This disrupts White’s coordination and can force useful exchanges.


**When it works.** The square must be supported and White must not gain a stronger attack by exchanging the knight.


**The other side’s answer.** White retains control of e4 and avoids unnecessary concessions to Black’s minor pieces.


#### Meet f4 with ...f5 and restrain g4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-black-2"]
[Title "Meet f4 with ...f5 and restrain g4"]
[FEN "2b5/pp3p1p/3p1np1/2pP4/2P2P2/8/PP4PP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 242, 247–251."]

{ [%cal Rf7f5,Rf6g4,Rc8g4] }
*
```


**Aim.** Gain kingside space before White can fix a clamp. Keep the f6 knight and c8 bishop available to discourage g4.


**When it works.** This is a defensive restriction plan; premature exchanges of these controllers can leave Black helpless.


**The other side’s answer.** White maneuvers to support g4, sometimes with a knight via h2.


#### Break or sacrifice with ...b5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-black-3"]
[Title "Break or sacrifice with ...b5"]
[FEN "8/ppn2p1p/1q1p2p1/2pP4/2P5/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 242, 255–258."]

{ [%cal Rb7b5,Rb5c4] }
*
```


**Aim.** Open the queenside with ...b5, sometimes at the cost of a pawn, to attack d5 or exploit White’s uncastled king.


**When it works.** The sacrifice requires immediate targets and active lines; without them White can consolidate the extra pawn.


**The other side’s answer.** White calculates captures carefully and keeps the d5 pawn securely supported.


#### Trade pieces through ...Qb6, ...Bf5 and ...Ne4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-13-black-4"]
[Title "Trade pieces through ...Qb6, ...Bf5 and ...Ne4"]
[FEN "8/pp3p1p/1q1p2p1/2pP1b2/2P1n3/8/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 242, 259–260."]

{ [%csl Rb2] [%cal Rb6b2,Rf5e4] }
*
```


**Aim.** Coordinate pressure on b2 while seeking a minor-piece exchange on e4.


**When it works.** Capturing b2 can backfire if b7 and d6 become more important targets or White’s d5 pawn dominates the endgame.


**The other side’s answer.** White can tolerate the pawn raid if it gains more valuable activity.


### Model positions to revisit


- **Spassky – Fischer** (1992): White’s f4/g4 expansion gradually confines Black’s army. Printed p. 243.

- **Zherebukh – Flores Rios** (2013): An active ...b5 pawn sacrifice interrupts White’s spatial squeeze. Printed p. 255.

- **Carlsen – Van Wely** (2013): A raid on b2 exposes the more important d6 and b7 weaknesses. Printed p. 259.

**Required relationships**


- White’s d5/e4 chain faces Black’s d6/e5 chain, and the c-file contains no pawns of either color.
- The open c-file is an identity-defining relationship: it gives White a much faster route into the queenside than in a closed KID.


**What may move or vary**


- The remaining wing pawns can be advanced; a4-a5, ...b5, f3, ...g6 and ...f5 are common stages.
- The full board may contain pieces on c-file squares; “open file” means no pawns, not no pieces.


**Which pawns must be absent**


- No White or Black pawn anywhere on the c-file.


**When the label changes**


- A central capture after ...f5 changes the chain and requires a fresh assessment.
- Black ...c6 or ...c5 belongs to another KID subtype before exchanges remove those pawns.

**Required relationships**


- White has c4/d5/e4 against Black c5/d6/e5. The c-pawns are locked directly in front of one another.
- The fixed centre slows White’s queenside play relative to Type III, giving Black time for a kingside attack.


**What may move or vary**


- Flank pawns may advance; f3, g3, ...g6, ...f5, ...h5 and queenside space moves do not alone change the subtype.
- A c-pawn’s rank is not freely variable: c7, c6 and c5 are materially different KID cases.


**When the label changes**


- exf5 followed by a pawn or piece recapture creates the A or B transformation below.
- Opening the c-file changes the position toward Type I; a successful c- or d-pawn exchange requires reassessment.

**When it works.** The resulting open e/f-files and e6 square can favor White, but the move must be timed against ...exf4 and ...e4.

**When it works.** A closed kingside is useful only if Black cannot create effective central or queenside play. Timing before or after ...f4 matters.


**The other side’s answer.** Black keeps ...f5 tension when possible and seeks queenside space rather than being completely confined.

**Required relationships**


- White has c4/d5/e4 against Black’s d6/e5 chain; Black’s c-pawn remains on c7.
- White can attack the base d6 with c4-c5. This distinguishes the starting subtype from the locked c4/c5 version.


**What may move or vary**


- Wing-pawn advances and ...g6 are free within the structure. Black’s f-pawn can advance to f5 or f4 without changing the broad closed KID family.


**When the label changes**


- ...c5 creates Type II; ...c6 introduces new central tension and may lead to Type I after exchanges.
- exf5 and a recapture create the A/B transformations, which have different square control.
- cxd6 cxd6 is a recognizable later phase but no longer has the exact original c7/d6 configuration.

**The other side’s answer.** White must assess the whole board before closing its own kingside.


### What decides between these plans


- The arrows in multi-stage attacks show strategic routes. They are not a legal-move sequence and do not show that an attack wins.
- Type III covers a family of later closed phases; the exact base mask intentionally distinguishes c7 from the c5 subtype.

- **Bercys – Flores Rios** (2009): The ...h5/...Bh6 setup and a Type III-A struggle over g3. Printed p. 300.

- **Taimanov – Najdorf** (1953): The typical ...g3 pawn sacrifice after the defensive ...Rf7/...Bf8 arrangement. Printed p. 309.

- White retains c4/e4 but has no pawn on the d-file. Black has d6, a c-file pawn on c7 or c6, and no pawn on the e-file.
- The d6 pawn is backward against White’s half-open d-file. This distinguishes the position from a Maróczy with Black e7 and no c-pawn.


**What may move or vary**


- Black’s c-pawn can be c7 or c6; ...c6 prevents Nd5 and prepares ...b5.
- The g-pawn may be g7 or g6; the fianchetto and all wing-pawn advances are practical modifiers rather than mandatory original squares.


**Which pawns must be absent**


- No White pawn anywhere on the d-file; no Black pawn anywhere on the e-file.


**When the label changes**


- ...d5, successful ...f5 exchanges, or a central e5 breakthrough changes the structure.
- Allowing Black’s c-pawn anywhere without a rank restriction would include substantially different centres.

**Required relationships**


- White has c4/d4/e4 against Black d6/e5, with Black’s c-pawn on c6 in the base complex.
- The d4/e5 tension remains unresolved. The structure is a branching point, not a single fixed middlegame plan.


**What may move or vary**


- The c7 precursor can lead directly to Type III after d5; record it separately from the base c6 diagram.
- Wing-pawn advances and a fianchetto do not settle the central tension.


**When the label changes**


- d5, ...exd4, dxe5 or c5 selects a new central structure; the recapture determines which one.


### Important versions and transformations


```chess

{  }

```


- **d5, ...cxd5, exd5.** The e-pawn recaptures onto d5: a Najdorf Type I structure results. (Printed pp. 338.)

- **d5, ...cxd5, piece recapture.** Recapturing with a piece leaves the e4/e5 opposition: Najdorf Type II. (Printed pp. 338.)

- **d5, ...cxd5, cxd5.** The c-pawn recaptures and the c-file opens: KID Type I. (Printed pp. 338.)

- **d5 followed by ...c5.** The c4/c5 lock produces KID Type II. (Printed pp. 338.)

- **d5 while Black’s c-pawn is still c7.** The structure is KID Type III. (Printed pp. 338.)

- **...exd4 followed by a piece recapture.** Black’s e-pawn and White’s d-pawn disappear, giving the Open KID. (Printed pp. 338.)

## 19. French Type I


**French.** Source: Flores Rios, printed pp. 353–363. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-19-mask"]
[Title "Recognition: French Type I"]
[FEN "8/ppp3pp/4p3/3p4/3P4/8/PPP2PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteExact "d4"]
[BlackExact "d5 e6"]
[WhiteAbsent "e"]
[BlackAbsent "f"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 353–363."]

{  }
*
```


**Required relationships**


- The defining centre is White d4 against Black d5/e6. White has a half-open e-file; Black’s f-file is half-open if a White f-pawn remains, and fully open if it does not. The square e5, directly supported by d4, is the strategic hinge.


**What may move or vary**


- The c-pawns may still be on their original files, may have advanced, or may have exchanged on d4. A white pawn on d4 counts regardless of which pawn originally occupied it.
- White’s f-pawn and both wings may advance without changing this central identity. Their actual positions govern whether f4 or h4-h5 is useful.
- The f-pawn is a frequent attacking resource, not a requirement for the central structure to retain its identity. Plans using f4–f5 require it to be available.


**Which pawns must be absent**


- No White pawn remains on the e-file; no Black pawn remains on the f-file in the basic post-exchange structure.


**When the label changes**


- ...e6-e5 and d4xe5 remove the defining centre and can leave Black an isolated passed d-pawn.
- White e5 returning by f4xe5 creates a French III centre again. Moving a required central pawn changes the exact structure; the historical opening label is irrelevant.


### Important versions and transformations


- **Isolated passed d-pawn.** After ...e5 and dxe5 the pawn on d5 may have no enemy pawn ahead on the c-, d-, or e-file. Its passed status changes the usual IQP endgame judgment. (Printed pp. 360, 363.)

**Required relationships**


- White has an advanced e5-pawn facing Black’s d5/e6 chain. White has no pawn on the d-file; Black has no pawn on the c-file. The d4-square is a potential white piece outpost.


**What may move or vary**


- The supporting white c-pawn can remain on c2 or move to c3. A pawn on c3 supports d4; c2 does not yet do so.
- The white f-pawn may be on f2, f3, f4, or further advanced. King placement and the location of the light-squared bishops are separate plan conditions.
- The f-pawn is a frequent attacking resource, not a requirement for the central structure to retain its identity. Plans using f4–f5 require it to be available.


**Which pawns must be absent**


- The basic structure has no White d-file pawn and no Black c-file pawn.


**When the label changes**


- A white c-pawn recapture on d4 creates a French III centre.
- ...f6 and exf6 may produce French I-like activity, but the d4 hole remains unless filled by a pawn.
- Removing e5 or changing the d5/e6 chain changes this exact structure.


### Important versions and transformations


- **Reversed colours.** Van Wely–Karjakin illustrates the mirrored structure: Black’s knight dominates d5 while White’s dark-squared bishop is trapped. Colour names and target ranks must be reflected, not merely relabelled. (Printed pp. 371, 374.)

- **Exchange on d4.** If a white pawn recaptures on d4, the d4-hole classification ends and French III’s pawn chain returns. The resulting bishop and rook placements still matter. (Printed pp. 366, 367, 380.)

**When it works.** Do not allow exchanges to leave e5 inadequately defended. The d4 outpost must survive Black’s counterplay.


**The other side’s answer.** Black challenges e5 with ...f6 or removes the supporting bishop.

**French.** Source: Flores Rios, printed pp. 383–399. All coordinates below use the displayed colour orientation.

[WhiteExact "d4 e5"]

[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 383–399."]

{  }
*
```


**Required relationships**


- White’s connected d4/e5 chain faces Black’s d5/e6 chain. These squares define the locked central geometry and the natural breaks c5 and f5.


**What may move or vary**


- The c-pawns are not fixed: White c2/c3 and Black c7/c6/c5/c4 are important branches; c-pawns may exchange on d4 while a white pawn remains there.
- The f- and wing pawns may advance. A black light-squared bishop on c8 versus f5/g6/h7 changes the plans without changing the pawn chain.
- The f-pawn is a frequent attacking resource, not a requirement for the central structure to retain its identity. Plans using f4–f5 require it to be available.


**Which pawns must be absent**


- No absent wing file is required. Do not require eight pawns or original pawn identities.


**When the label changes**


- Loss of White d4 with Black’s c-pawn exchanged usually yields French II.
- ...f6 or ...f5 followed by exf6 and a piece recapture can yield French I.
- If the defining d4/e5/d5/e6 chain disappears, label the transformed structure rather than retaining an exact French III match.


### Important versions and transformations


- **C-file exchanged French III.** White may retain d4/e5 while both c-pawns have gone. The absence of pawn targets and the protection of c2 can make Black’s open file largely cosmetic. (Printed pp. 384, 387.)

- **Three successive chain bases.** The sequence ...c4 and later ...b3 shifts White’s base from d4 to c3 to b2. Each shift is a separate strategic decision, not a mandatory pawn race. (Printed pp. 397, 399.)



### White’s plans


#### Attack the e6 base with f4-f5


```chess

**Aim.** Use the space advantage to advance the f-pawn and exchange on e6, opening lines against the chain and king.


**When it works.** The d4/e5 centre must hold while the attack is prepared. Black’s bishop on h7/g6 can impede the break.


**The other side’s answer.** Black attacks d4 with ...c5 or e5 with ...f6.


#### Build the f6 wedge


```chess
[Schema "pawn-schematic/1"]
[Id "structure-21-white-2"]
[Title "Build the f6 wedge"]
[FEN "6k1/ppp2ppp/4p3/3pPP2/3P4/2PB4/PP4PP/3Q4 w - - 0 1"]

[Orientation "white"]

[Source "Flores Rios, printed pp. 383, 384, 382."]

{ [%csl Rf7,Rg7] [%cal Gf5f6,Gd1h5] }
*
```


**Aim.** Push f5-f6 when it fixes the kingside and creates real threats near g7, then bring the queen and pieces into the attack.


**When it works.** The centre must remain closed and the black king must be on the kingside. A missing light-squared bishop can make this plan toothless.


**The other side’s answer.** Black trades attackers, opens the centre, or keeps the kingside closed under adequate defence.

{ [%csl Rh7] [%cal Gd3h7,Ge3h3,Gf3g5] }
*

**Aim.** Combine Bd3, Qh5 and a rook on the third rank. Bxh7+ and Ng5 are tactical possibilities when defenders are absent.


**When it works.** A schematic Greek Gift is not proof of a winning sacrifice; king escapes, defenders and forcing replies must be calculated.


**The other side’s answer.** Black exchanges attackers or challenges the centre before the pieces arrive.


#### Use h4-h5 against a g6 hook


```chess

**Aim.** If Black recaptures ...hxg6 after an exchange of his light bishop, h4-h5 becomes a direct way to open lines.


**When it works.** A pawn on g6 and an actual kingside target are essential to this version. The f-pawn break need not remain the first priority.


**The other side’s answer.** Black may keep the king away by castling long, or strike ...f6 before the attack lands.


#### Cover c2 and d4, then ignore an unproductive c-file


```chess
[Schema "pawn-schematic/1"]
[Id "structure-21-white-5"]
[Title "Cover c2 and d4, then ignore an unproductive c-file"]
[FEN "2r5/p1r2p1p/1p2p1p1/3pP3/2nP3P/3Q1PP1/PP2RB2/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "White has covered c2 and d4; the f-pawn begins on f3 and can prepare f3–f4–f5 while Black’s c-file activity lacks an effective entry point."]
[Source "Flores Rios, printed pp. 384, 385, 387."]

{ [%csl Gc2,Gd4] [%cal Gf3f4,Gf4f5] }
*
```


**Aim.** Rooks on the c-file have little effect without an entry square or a vulnerable d4-pawn. Secure those points and proceed on the kingside.


**When it works.** Both c2 and d4 must really be defended; simply surrendering the file is not a general rule.


**The other side’s answer.** Before exchanging the c-pawns, Black can consider ...c4. Once they are gone, as in this diagram, seek an effective ...f6 break or another real target rather than assuming that occupying the c-file is enough.


#### Open the b-file if Black castles long


```chess

[Title "Open the b-file if Black castles long"]

[Side "white"]
[Caption "The arrows show one way to clear White’s b-file if Black leaves its pawn on c4. If Black instead captures ...cxb3, the recapture must be chosen carefully; a pawn remaining on b3 still blocks Rb1."]
[Source "Flores Rios, printed pp. 391, 394."]

{ [%csl Rb7] [%cal Gb2b3,Gb3c4] }

```


**Aim.** Challenge c4 with b3 or a prepared b2–b4. To use the b-file, White must remove the b-pawn from that file: for example b3xc4, or ...cxb3 followed by a suitable piece recapture and clearance.


**When it works.** The required exchanges and recapture must work tactically. The source’s b2–b4 line uses ...cxb3 en passant and Nxb3; the knight must subsequently clear the rook’s file. Check whether ...Ba4 or other pins prevent the operation.


**The other side’s answer.** Black prevents the b-file break, then uses the secure king to expand on the other wing.

**When it works.** A well-defended d4-pawn and covered entry squares make this plan ineffective. Preserve tension while assessing the targets.


**The other side’s answer.** White secures d4/c2 and shifts the fight to the kingside.

**Aim.** Advance ...c5-c4, then ...a5 and ...b5-b4. The base of White’s chain moves from d4 to c3.


**When it works.** This requires time; against a fast kingside attack Black may need long castling or immediate ...f6 counterplay.


**The other side’s answer.** White opens the b-file, prevents ...b4, or attacks faster.

**Aim.** When c4 and b4 are secure, ...b3 can move the base yet again, from c3 to b2. Major pieces and a bishop can then overload b2 or create a passed b-pawn.


**When it works.** This is a slow continuation for positions where White’s attack has been stopped. The b2-pawn must actually be harder to defend than c3.


**The other side’s answer.** White seeks a break before the chain becomes fixed or exchanges the advanced pawns.

**Aim.** With the queenside secure and the king on c8, ...f5 can do more than stop White’s expansion: follow with ...g5, pressure an advanced h-pawn, and consider ...f4–f3 to open lines against the white king.

**The other side’s answer.** White tries to open the b-file against c8, contests the f5 advance, or avoids making kingside pawn commitments that become targets.

## 22. 3–3 versus 4–2


**Miscellaneous.** Source: Flores Rios, printed pp. 400–403. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-22-mask"]
[Title "Recognition: 3–3 versus 4–2"]
[FEN "8/pp3ppp/4p3/8/8/2P5/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteFiles "a b c f g h"]
[BlackFiles "a b e f g h"]
[WhiteAbsent "d e"]
[BlackAbsent "c d"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 400–403."]

{  }
*
```


**Required relationships**


- Count pawns by wing: White has three queenside pawns and three kingside pawns; Black has two queenside pawns and four kingside pawns. The d-file is pawn-free.
- The canonical intact files are White a/b/c/f/g/h and Black a/b/e/f/g/h. The counts and open-file relationship are more fundamental than the illustrated ranks.


**What may move or vary**


- Any legal rank on the relevant file is possible; c3, e6 or b5 are stages of plans, not identity requirements.
- A capture can preserve the 3–3/4–2 counts while changing pawn islands and open files. Such a position still has the count relationship but needs its own plan qualifications.


**Which pawns must be absent**


- Neither colour has a d-file pawn. Canonically White also lacks an e-pawn and Black lacks a c-pawn.


**When the label changes**


- A pawn exchange or loss can change the numerical majorities. A new pawn on d-file removes the defining open-file feature.


*Recognition scope: This mask describes the canonical intact-file version. The broader 3–3 versus 4–2 count relationship can survive captures that change pawn files or create doubled pawns; those derived positions require separate evaluation of their islands, passed-pawn chances and open files.*


### Important versions and transformations


- **Colour reversal.** The Slav release ...e5 and dxe5 can produce this structure with the sides’ majorities reversed. Reverse the roles and directions of the plans. (Printed pp. 400.)

**Aim.** If queenside pawns disappear favourably, mobilize the four-to-three kingside majority with an active king.


**When it works.** This is an endgame phase; king activity, bishop colour and passed-pawn timing determine whether it wins.


**The other side’s answer.** White blockades, exchanges the right pawns, and seeks an active defensive setup.


### What decides between these plans


- A fresh kingside attack is often risky in this open structure; an attack already supported by active pieces is a concrete exception. The bishop pair has unusually clear scope here.

## 23. Panov structure


**Miscellaneous.** Source: Flores Rios, printed pp. 403–408. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-23-mask"]
[Title "Recognition: Panov structure"]
[FEN "8/pp2pppp/8/2Pp4/3P4/8/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteExact "c5 d4"]
[BlackExact "d5"]
[BlackFiles "e"]
[WhiteAbsent "e"]
[BlackAbsent "c"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 403–408."]

{  }
*
```


**Required relationships**


- White’s c5/d4 chain confronts a Black pawn on d5; the White e-file and Black c-file are pawn-free in the standard form.
- The advanced c-pawn creates a queenside majority and is the front of the chain; d4 is its base. This is the book’s Panov structure, not a synonym for every Panov-opening IQP.


**What may move or vary**


- Black’s e-pawn can be on e7 or e6. Wing advances and a queenside minority attack do not by themselves change the centre.
- A c-pawn on c6 or c7 is an advanced continuation of this family; the strict c5/d4 chain has changed, so mark that stage explicitly rather than pretending the support relation is unchanged.


**Which pawns must be absent**


- No White e-file pawn; no Black c-file pawn in the basic pattern.


**When the label changes**


- ...b6 and a capture on c5 can remove the advanced chain.
- A capture or advance removing d4/d5 changes the central blockade; an advanced c-passer is a derived stage.


### Important versions and transformations


- **Carlsbad to Panov.** A well-timed ...c5-c4 can convert a Carlsbad into the colour-reversed Panov family. It works best when the opponent cannot attack the new front or base of the chain. (Printed pp. 407, 408.)



### White’s plans


#### Advance b4-b5, then prepare c6


```chess
[Schema "pawn-schematic/1"]
[Id "structure-23-white-1"]
[Title "Advance b4-b5, then prepare c6"]
[FEN "8/pp2pppp/8/2PpN3/3P4/8/PP3PPP/2R5 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 403, 405."]

{ [%csl Gc6] [%cal Gb2b4,Gb4b5,Gc5c6] }
*
```


**Aim.** Support the queenside majority, gain space and create a passed c-pawn with c5-c6 at a favourable moment.


**When it works.** Do not push c6 merely because it is legal: a pawn stuck on c6 can be blockaded. Ensure the pieces can support its further advance.


**The other side’s answer.** Black attacks c5 with ...b6 or d4 with pieces before the majority rolls.


#### Use the majority to tie down defenders, then change targets


```chess
[Schema "pawn-schematic/1"]

**Required relationships**


- The central Dragon skeleton has White e4 and Black d6/e7, with White’s d-file and Black’s c-file pawn-free. Black’s g6-pawn supports the characteristic fianchetto.


**What may move or vary**


- White’s c-, f-, g- and h-pawns and Black’s a-/b-pawns may advance; castling side is a separate plan condition.
- White c4 adds a Maroczy bind, so the structures may overlap by features rather than forcing one exclusive opening label.


**Which pawns must be absent**


- No White pawn on the d-file; no Black pawn on the c-file.


**When the label changes**


- ...d5 releases the centre. ...e6 adds a Scheveningen-type centre; exd5 creates a different central pawn skeleton.
- An uncastled king or missing dark-squared bishop changes the attack even if the pawn mask still matches.


### Important versions and transformations


- **After Nxd5 and exd5.** The resulting White pawn on d5 resembles the asymmetric transformation of the Maroczy. The d5 outpost plan has changed into play with a pawn wedge. (Printed pp. 408.)

{  }
*

**Required relationships**


- White e4 faces Black’s compact d6/e6 centre. White’s d-file and Black’s c-file are pawn-free.


**What may move or vary**


- Wing pawns can advance, including White f4, Black a6/b5, or Black g5. These are plans and timing conditions, not requirements of the central mask.
- A White c4 pawn adds a Hedgehog-style bind when the rest of the arrangement fits; it need not be treated as an impossible overlap.


**Which pawns must be absent**


- No White d-file pawn; no Black c-file pawn.


**When the label changes**


- ...d5 followed by e5 produces French II; exd5 and a piece recapture can produce 3–3 versus 4–2.
- ...e5 changes the centre into Najdorf II. The same opening move order can reach several different structures.


### Important versions and transformations


- **After ...d5 and e5.** French Type II arises if White keeps the pawn on e5 and Black’s pawn reaches d5. The book’s p411 chapter-number cross-reference is a typo; French II is chapter20. (Printed pp. 411.)

- **After ...d5, exd5 and a piece recapture.** The numerical majorities can become 3–3 versus 4–2. Black’s existing b5 pawn may already favour the minority attack. (Printed pp. 411.)

- **After ...e5.** The e6 target disappears and Najdorf Type II’s d5-square and d6-pawn become the central strategic features. (Printed pp. 411.)
