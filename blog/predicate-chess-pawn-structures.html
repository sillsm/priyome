**Required relationships**


- The accepted Benko skeleton has White d5 against Black c5/d6, with White pawns on a- and b-files and no Black a- or b-file pawn. White’s c-file is pawn-free.
- The a- and b-files are half-open for Black. The absence of the queenside pawns matters more than their original identity.


**What may move or vary**


- White’s e-pawn may still be on e2/e3 or have reached e4; it is a potential central-break pawn, not required to begin on e4.
- White a4/b3 is a defensive formation within the family. The original pawn deficit and a bishop on g7 are strong contextual features, not solely pawn-mask facts.


**Which pawns must be absent**


- No White c-file pawn; no Black a- or b-file pawn in the accepted structure.


**When the label changes**


- If Black wins a queenside pawn, the exact material picture changes but the half-open-file compensation may persist.
- White e5 or f5 and central exchanges create derivative Benoni-like structures. A declined gambit need not match this mask.

**When it works.** The setup must be completed without allowing ...Na3, ...Qa5, ...c4 or tactical attacks on a4.

**Aim.** Support a kingside or central advance with f4-f5, especially when it opens useful lines or helps e5.


**When it works.** White must keep the queenside secure while the attack develops. Exchanging b for c5 without another gain can leave only an easily attacked a-pawn.


**The other side’s answer.** Black blocks the centre and keeps pressure on the half-open files.

**When it works.** The pressure must remain active; a pawn sacrifice is not automatically sufficient compensation.


**The other side’s answer.** White builds a4/b3 or gains central counterplay.

## 27. Closed Ruy Lopez


**Miscellaneous.** Source: Flores Rios, printed pp. 417–421. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-27-mask"]
[Title "Recognition: Closed Ruy Lopez"]
[FEN "8/p4ppp/3p4/1p1Pp3/2p1P3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteExact "c3 d5 e4"]
[BlackExact "c4 d6 e5"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 417–421."]

{  }
*
```


**Required relationships**


- The defining closed chains are White c3/d5/e4 against Black c4/d6/e5. The c3–c4 lock distinguishes this book’s structure from the c4–c5 lock of King’s Indian Type II.


**What may move or vary**


- The a-/b-pawns may be on several ranks; Black b5 is common but is a queenside plan stage. White’s f-/g-pawns may advance without changing the core locks.
- The name describes this particular closed pawn configuration, not every game played from the Closed Ruy Lopez opening.


**Which pawns must be absent**


- No missing file is required.


**When the label changes**


- b4 and ...cxb3 en passant can remove the c-file lock and change the queenside plans.
- Further c-pawn exchanges may leave a King’s Indian Type I-like central wedge. A capture changing d5/e4/d6/e5 changes the central identity.


### Important versions and transformations


- **After b4 and en passant.** After b2–b4 ...cxb3 en passant axb3, White’s a-file is clear and initially half-open against Black’s remaining a-pawn. Later a-pawn exchanges can make it fully open; removing the c3–c4 lock also changes the queenside plans. (Printed pp. 419, 421.)



### White’s plans


#### Maneuver a knight to f5 and push g4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-27-white-1"]
[Title "Maneuver a knight to f5 and push g4"]
[FEN "6k1/p4ppp/3p4/1p1Pp3/2p1P3/2P5/PPBN1PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 417, 419."]

{ [%csl Gf5] [%cal Gd2f1,Gf1g3,Gg3f5,Gg2g4] }
*
```


**Aim.** Route a knight through d2-f1-g3-f5, support the kingside attack with g4, and consider a sacrifice on f5 only when concretely justified.


**When it works.** Black’s defensive arrangement may control f5; a piece on f5 is a goal, not a structural entitlement.


**The other side’s answer.** Black uses ...g6/...f6 and coordinated knights, or counterattacks on the queenside.


#### Break with f4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-27-white-2"]
[Title "Break with f4"]
[FEN "6k1/p4ppp/3p4/1p1Pp3/2p1P3/2P5/PPB2PPP/5R2 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 417, 418."]

{ [%cal Gf2f4,Gf4f5] }
*
```


**Aim.** Advance f2-f4 to challenge e5 or gain kingside space, often after neutralizing the queenside.


**When it works.** The queenside must not open faster against White; the required preparation depends on the piece arrangement.


**The other side’s answer.** Black counterattacks with ...a5/...b4 or keeps a sound kingside blockade.


#### Create queenside play with b4 and a4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-27-white-3"]
[Title "Create queenside play with b4 and a4"]
[FEN "8/p4ppp/3p4/1p1Pp3/2p1P3/2P1N3/PP3PPP/R7 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "b2–b4 and a2–a4 are ways to change the queenside, not an immediate rook invasion. After b2–b4 ...cxb3 en passant axb3, White’s a-file is clear; an a-pawn advanced to a4 must instead exchange off the file before Ra1 can pass it."]
[Source "Flores Rios, printed pp. 417, 419, 421."]

{ [%csl Gc6] [%cal Gb2b4,Ga2a4] }
*
```


**Aim.** Use the d5 wedge and c6-square to support queenside play, open the a-file or attack a fixed b-pawn.


**When it works.** Unlike King’s Indian structures, White has less queenside space because c3 is blocked by c4. The plan is conditional.


**The other side’s answer.** Black avoids a premature ...c4 that allows a favourable b4 break, or keeps the queenside closed.


#### Block the queenside, then switch wings


```chess
[Schema "pawn-schematic/1"]
[Id "structure-27-white-4"]
[Title "Block the queenside, then switch wings"]
[FEN "r5k1/B4ppp/3p4/1p1Pp3/1Pp1P3/2P5/R4PPP/R7 w - - 0 1"]

[Side "white"]

[Source "Flores Rios, printed pp. 418."]

{ [%csl Ga7] [%cal Gf2f4,Gf4f5] }
*
```


**Aim.** Deny Black useful entry squares and pawn breaks, then use the time for a kingside attack. Karpov’s Ba7 blockade is one exceptional model.


**When it works.** This is a piece-dependent plan; Ba7 is not prescribed in every instance. The blockading piece must remain safe and the file must genuinely be controlled.


**The other side’s answer.** Black seeks a timely central or kingside break before becoming tied down.

#### Expand on the queenside

**Aim.** Advance ...a5 and ...b5-b4, exploiting White’s restricted c-pawn and attacking the queenside structure.


**When it works.** The advance ...c4 must be timed carefully; it can give White b4 and open favourable files.


**The other side’s answer.** White blocks the wing or exchanges pawns so the d5 wedge and c6-square become useful.


#### Gain kingside space with ...f5-f4

**Aim.** When queenside play is less promising, use ...f5 and possibly ...f4 to seize space and create threats near the king.


**When it works.** The centre must remain secure and the resulting pawn contact must favour Black’s pieces.


**The other side’s answer.** White challenges the chain with g4 or opens the queenside before the attack matures.


#### Build a kingside defensive arrangement

**The other side’s answer.** White can switch to f4 or create a second front on the queenside.

## 28. Lopez formation


**Miscellaneous.** Source: Flores Rios, printed pp. 421–423. All coordinates below use the displayed colour orientation.


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-mask"]
[Title "Recognition: Lopez formation"]
[FEN "8/pp3ppp/3p4/2p1p3/3PP3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "pattern"]
[Orientation "white"]
[WhiteExact "c3 d4 e4"]
[BlackExact "c5 d6 e5"]
[Caption "Gold: required square. Blue file: a pawn of the marked colour somewhere on that file. Red ×: no pawn of that colour anywhere on the file. Faded pawns illustrate the book’s starting arrangement; the written relationships below complete the definition."]
[Source "Flores Rios, printed pp. 421–423."]

{  }
*
```


**Required relationships**


- White c3/d4/e4 faces Black c5/d6/e5 with unresolved central tension. The c3-pawn can recapture on d4, which makes the order of exchanges important.


**What may move or vary**


- Wing pawn locations are not fixed. Their advances and piece placement determine which central transformation is favourable.
- This is a decision point connecting other structures; the exact central squares are not freely variable while retaining this particular tension pattern.


**Which pawns must be absent**


- No missing file is required.


**When the label changes**


- d5 closes the centre; captures on e5, c5 or d4 select different structures.
- After the double exchange on d4, the original Lopez mask no longer applies: White e4 and Black d6 remain as potentially vulnerable central pawns.


### Important versions and transformations


- **Six principal transformations.** The book lists closure to KID II, closure to Closed Ruy Lopez, d-pawn captures into KID-Complex relatives, an e-pawn exchange leading to asymmetric Benoni, a c-pawn exchange leading to KID I, and the double exchange on d4. These are choices governed by the pieces, not a forced sequence. (Printed pp. 421.)



### White’s plans


#### Close with d5 and then build a c4 bind


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-white-1"]
[Title "Close with d5 and then build a c4 bind"]
[FEN "8/pp3ppp/3p4/2p1p3/3PP3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 421."]

{ [%csl Gd5,Gc4] [%cal Gd4d5,Gc3c4] }
*
```


**Aim.** Advance d4-d5, then c3-c4 when possible, reaching King’s Indian Type II.


**When it works.** Check that Black cannot exploit the time needed for c4. The central transformation must suit White’s pieces.


**The other side’s answer.** Black can answer ...c4 instead, locking c3 and reaching the Closed Ruy Lopez pattern.


#### Exchange on e5 or c5


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-white-2"]
[Title "Exchange on e5 or c5"]
[FEN "8/pp3ppp/3p4/2p1p3/3PP3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption "Two alternative captures from d4 are shown. They cannot both occur in the same line."]
[Source "Flores Rios, printed pp. 421, 422."]

{ [%csl Ge5,Gc5] [%cal Gd4e5,Gd4c5] }
*
```


**Aim.** Capture dxe5 or dxc5 and assess the resulting central majority or fixed central pawn arrangement as in the King’s Indian Complex.


**When it works.** Do not select the exchange solely by pawn appearance: Black’s space and control of d5 can make the simplification comfortable for Black.


**The other side’s answer.** Black recaptures with the d6-pawn and uses the opened files and central squares.


#### Stabilize after the double exchange and attack d6


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-white-3"]
[Title "Stabilize after the double exchange and attack d6"]
[FEN "8/pp3ppp/3p4/8/4P3/2N1B3/PP3PPP/3R2K1 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "white"]
[Caption ""]
[Source "Flores Rios, printed pp. 422, 423."]

{ [%csl Rd6,Ge4] [%cal Gd1d6,Ge3d4] }
*
```


**Aim.** After Black trades both c5 and e5 pawns on d4, secure e4 and coordinate the pieces before attacking the isolated backward d6-pawn.


**When it works.** Only a stabilized position makes d6 a usable long-term target. Be3 or Bb2 may be essential to meet pressure on e4 and b2.


**The other side’s answer.** Black attacks e4 and seeks ...d5 before White finishes organizing.


### Black’s plans


#### Answer d5 with ...c4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-black-1"]
[Title "Answer d5 with ...c4"]
[FEN "8/pp3ppp/3p4/2pPp3/4P3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 421."]

{ [%csl Rc3] [%cal Rc5c4] }
*
```


**Aim.** After White closes the centre, advance the c-pawn to c4 to establish the Closed Ruy Lopez c3–c4 lock.


**When it works.** The move must not allow a favourable b4 break; compare the Closed Ruy Lopez examples.


**The other side’s answer.** White seeks b4 or a kingside attack.


#### Exchange the e-pawn on d4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-black-2"]
[Title "Exchange the e-pawn on d4"]
[FEN "8/pp3ppp/3p4/2p1p3/3PP3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 421."]

{ [%csl Gd5] [%cal Re5d4,Gc3d4,Gd4d5] }
*
```


**Aim.** After ...exd4 cxd4, a later d5 gives White an asymmetric Benoni-style centre.


**When it works.** Choose this only if the resulting Benoni plans and piece placement suit Black. White is not obliged to play d5.


**The other side’s answer.** White may keep the centre fluid or use the space gain to prepare e5.


#### Exchange the c-pawn on d4


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-black-3"]
[Title "Exchange the c-pawn on d4"]
[FEN "8/pp3ppp/3p4/2p1p3/3PP3/2P5/PP3PPP/8 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 421."]

{ [%csl Gd5] [%cal Rc5d4,Gc3d4,Gd4d5] }
*
```


**Aim.** After ...cxd4 cxd4, a later d5 gives a King’s Indian Type I centre.


**When it works.** The ...f5 counterplay and c-file control must be judged in the resulting position.


**The other side’s answer.** White can use d5 and the open c-file for queenside play.


#### Trade twice on d4 and attack before d6 becomes weak


```chess
[Schema "pawn-schematic/1"]
[Id "structure-28-black-4"]
[Title "Trade twice on d4 and attack before d6 becomes weak"]
[FEN "3r4/1b3pb1/p2p2pp/1p6/3NP3/8/PP3PPP/6K1 w - - 0 1"]
[Kind "plan"]
[Orientation "white"]
[Side "black"]
[Caption ""]
[Source "Flores Rios, printed pp. 421, 423."]

{ [%csl Re4] [%cal Rg7d4,Rb7e4,Rd6d5] }
*
```


**Aim.** Use ...cxd4 and ...exd4, or the reverse order. After White recaptures with a piece, pressure e4/b2 and prepare ...d5.


**When it works.** This works through activity and coordination; the remaining d6-pawn is a liability if White stabilizes.


**The other side’s answer.** White improves the misplaced bishop and secures e4 before attacking d6.

## Further lessons from the exercises


These pointers connect the exercises to the structural ideas above. They record strategic lessons; they are not a replacement for calculating the exercise positions.


- **Exercise 1 · Granda Zuniga – Vega.** Exchange the defender, occupy c5, and stop both central freeing breaks; then pressure c6. Reinforces the outpost/restriction plan. (Printed pp. 437.)

- **Exercise 2 · Carlsen – Radjabov.** A prepared f5 break opens a weakened kingside when Black lacks defenders. Break effectiveness depends on the pieces, not the chain alone. (Printed pp. 437.)

- **Exercise 3 · Mareco – Werjivker.** The d5 break opens lines for coordinated bishops and can win material immediately. Reinforces the active hanging-pawn break. (Printed pp. 437, 438.)

- **Exercise 4 · Zvjaginsev – Cvitan.** Use g4 against an e4/f5 chain, then g5, attacking the base before the chain grows. Additional chain-base attack beyond a routine queenside plan. (Printed pp. 438.)

- **Exercise 5 · Khairullin – Goganov.** Bxh7+ can initiate a Greek Gift when the queen, knight and f-pawn can join. Concrete tactical example; the familiar arrangement is not sufficient proof. (Printed pp. 438, 439.)

- **Exercise 6 · Iturrizaga Bonelli – Papin.** A coordinated Nxf7 sacrifice followed by Ne5 opens the king; later a passed f-pawn decides. Tactical conversion of activity in an IQP position; precise calculation remains essential. (Printed pp. 439.)

- **Exercise 7 · Naroditsky – Kamsky.** A timely ...b4 minority break gains practical initiative in a simplified position; correct defence can still draw. Do not turn a thematic plan into an unconditional winning claim. (Printed pp. 439.)

- **Exercise 8 · Leitao – Robledo.** e5 undermines a c5 knight and exposes d6; sacrifices on b5 are tactical alternatives. A backward pawn can be attacked by removing its defender rather than adding pressure. (Printed pp. 439, 440.)

- **Exercise 9 · Leitao – Di Berardino.** White can also break with d5 when the pieces are sufficiently active, opening lines before Black organizes. Important extra White plan omitted from chapter3’s opening list. (Printed pp. 440.)

- **Exercise 10 · Vuckovic – Damljanovic.** ...a4 can force queenside concessions; b4 may surrender the c-file to ...Nb3 and rook invasion. The reply to ...a4 depends on the actual entry squares. (Printed pp. 440.)

- **Exercise 11 · Braun – Polzin.** The c5 break is stronger after ...b5 if it leaves c6 vulnerable; follow with central activity and strong bishop squares. Specific timing qualification for c5. (Printed pp. 440, 441.)

- **Exercise 12 · Rosell – Nikolic.** Get the bad bishop outside with ...Ba6; only then close the queenside and consider ...g5. Close the wing after solving the bishop, not by habit. (Printed pp. 441.)

- **Exercise 13 · Dzieczkaniec – Madeja.** d5 opens the position for active pieces; Bxf7+ is a possible follow-up, but careless calculation can spoil it. Separate strategic suitability from tactical execution. (Printed pp. 441, 442.)

- **Exercise 14 · Mista – Navara.** ...Rxf3 destroys king cover and d4 support when White’s pieces are poorly placed. Reinforces the f-file exchange sacrifice. (Printed pp. 442.)

- **Exercise 15 · Akesson – Gabrielian.** e5 and a supported d6 advance can overwhelm a poorly prepared centre. The e5 break must be calculated but is structurally natural. (Printed pp. 442, 443.)

- **Exercise 16 · Cordova – Cabrera.** c5 fixes c6, shuts in the light bishop and creates d6 access; ...b6 can worsen the c6 weakness. Keeping the bishop inside changes the value of closing the centre. (Printed pp. 443.)

- **Exercise 17 · Cvek – Navara.** An active isolated-pawn side can dominate the c-file even after simplification if the opponent has not coordinated. Corrects the simplistic claim that every IQP exchange helps the defender. (Printed pp. 443.)

- **Exercise 18 · Sprenger – Navara.** ...Bc4 can exploit a lead in development and overload c2/e4 before White consolidates. C4 activity can have an immediate tactical point. (Printed pp. 444.)

- **Exercise 19 · Granda Zuniga – Latorre Lopez Moreira.** A prepared e4 break attacks the pawn duo and forces weaknesses. The defender’s central break can be stronger than passive blockade. (Printed pp. 444.)

- **Exercise 20 · Szabo – Flores Rios.** Against ...d5, cxd5 followed by e5 can be superior to exd5 or an immediate e5. The order of recaptures matters; do not treat pawn captures as interchangeable. (Printed pp. 444, 445.)

- **Exercise 21 · Harikrishna – Dominguez.** e5 in an endgame can leave d5 as a stable blockade square and allow Black’s queenside majority to run. An attacking pawn advance can become a positional concession when queens are gone. (Printed pp. 445.)

- **Exercise 22 · Landa – Ponomariov.** An a4 challenge can backfire if ...bxa4 creates a powerful passed a-pawn. Check passed-pawn consequences before routine minority/majority contact. (Printed pp. 445, 446.)

- **Exercise 23 · Kramnik – Van Wely.** Bxc5 may obtain two connected passed pawns for a piece; their advance still requires precise coordination. The material sacrifice is conditional and can be spoiled by premature d6. (Printed pp. 446.)

- **Exercise 24 · Mareco – Ivanov.** Use bishop and queen tempi to win the open b-file, then pressure d6; an advanced ...a6 pawn can provide entry points. Which rook exchanges first may determine who owns the file. (Printed pp. 447.)

- **Exercise 25 · Collins – Madeja.** Prepare ...e5 tactically with ...Qa5; the break can turn the active pawn duo into weak c-pawns. The break must be prepared; an immediate ...e5 can fail. (Printed pp. 447.)

- **Exercise 26 · Ftacnik – Cvitan.** ...Bh3 can create a last-minute mating threat even after the queenside plan succeeds; gxh3 may be necessary. A successful strategic plan does not remove the need to answer forcing threats. (Printed pp. 448.)

- **Exercise 27 · Bachmann – Britez.** c5 shuts out the b7 bishop and fixes c6, provided tactical support makes the advanced pawn safe. The tactical justification is part of the positional advance. (Printed pp. 448.)

- **Exercise 28 · Geller – Khismatullin.** Drive Nc3 away before ...d5; removing the controlling piece makes the central release effective. A threat elsewhere can prepare the structural break. (Printed pp. 449.)

- **Exercise 29 · Vasquez – Rios.** A tactical ...d5 break can destroy White’s centre before it stabilizes. Immediate opportunity matters more than a routine improving move. (Printed pp. 449.)

- **Exercise 30 · Gharamian – Mamedov.** When the usual advantage is limited, c5 and cxd6 can create a permanently weak d6-pawn. Transform into a more favourable target structure rather than insist on the original plan. (Printed pp. 450.)

- **Exercise 31 · Quintiliano – Mareco.** With a bishop on c7 and vulnerable white king cover, ...h5-h4 creates counterplay that a fianchetto-only model would miss. Important conditional Black supplement: the bishop’s actual diagonal changes the flank plan. (Printed pp. 450.)

- **Exercise 32 · Arencibia – Vera.** ...g5 attacks f4, restrains e5, and secures dark-square activity when White’s bishop is poorly placed. Important conditional Black supplement to ...b5 counterplay. (Printed pp. 450, 451.)

- **Exercise 33 · Kramnik – Polgar.** e4 and an exchange can select a Caro-Kann structure where the opponent’s light bishop is trapped. Choose the new structure by piece quality, not by its neutral pawn diagram. (Printed pp. 451.)

- **Exercise 34 · Granda Zuniga – Milos.** A sacrifice on g2 opens files and can cut the king off on the h-file. Concrete tactical finish to an established kingside attack. (Printed pp. 451, 452.)

- **Exercise 35 · Epishin – Cvitan.** Answer the mating threat with gxh3 even at material cost; automatic attacking continuation can lose immediately. Defence may require an exchange sacrifice or accepting material imbalance. (Printed pp. 452.)

- **Exercise 36 · Ehlvest – Kuipers.** ...f6 challenges the chain; automatic exf6 can enter French I before White can control e5, permitting tactical attacks. Central transformations are not equal irrespective of tempo. (Printed pp. 452.)

- **Exercise 37 · Liu Qingnan – Bu Xiangzhi.** ...b5 undermines the d5 knight’s support, opening lines and targets on the queenside. A central outpost can be attacked through a flank pawn break. (Printed pp. 453.)

- **Exercise 38 · Leitao – Diamant.** e5 followed by f5 can block Bg7 and activate White’s bishop; Black may need to return the pawn with ...e4. Returning material can restore piece activity and stop the attack. (Printed pp. 453.)

- **Exercise 39 · Kunin – Volokitin.** ...e5 while White is undeveloped can force an unfavourable IQP for White. Evaluate the destination structure with queens and piece activity included. (Printed pp. 453.)

- **Exercise 40 · Agrest – Caruana.** b4 restrains queenside expansion; after ...c4 White can use Nd4 and h5 while preserving the a-file option. Do not release tension without a reason when it can serve as a second front. (Printed pp. 453, 454.)

- **Exercise 41 · Flores Rios – Alonso.** ...a4 punishes a premature a3 when b3 lacks protection; White should prepare the supporting piece move first. The safety of the pawn formation depends on squares behind it. (Printed pp. 454.)

- **Exercise 42 · Almasi – Madeja.** Open with c5 after improving the bishop so Black’s advanced a4 pawn becomes a target; then switch to a kingside break. A restraining pawn can become weak once the centre opens. (Printed pp. 454, 455.)

- **Exercise 43 · Edouard – Cebalo.** Bxf6, Nd5 and an intermediate Nxf6+ can force doubled f-pawns in the queen exchange. A concrete tactical route to a favourable endgame; not implied by the skeleton alone. (Printed pp. 455.)

- **Exercise 44 · Gelashvili – Timman.** ...Ng4 and ...Nxf2 open the f-file; later ...d4 activates the previously bad bishop. Piece sacrifice and pawn advance cooperate to expose the king. (Printed pp. 455, 456.)

- **Exercise 45 · Lemos – Larrea.** Qb3 attacks b7 and can force a concession allowing a central tactic on d5. Pressure on a wing pawn can prepare the central exchange. (Printed pp. 456.)

- **Exercise 46 · Radjabov – Guseinov.** Choose exd5 instead of cxd5 when Black is prepared for the asymmetric Benoni but cannot achieve ...b5 or e4 control in the symmetric version. Recapture choice is a plan-selection decision. (Printed pp. 456, 457.)

- **Exercise 47 · Leitao – Barreto.** Transform a sterile centre with e4-e5; Black’s open c-file may be useless if entry squares are covered. Timely ...f6 and ...e5 are the counterplay. Reinforces flexible structure selection and entry-square evaluation. (Printed pp. 457.)

- **Exercise 48 · Cori Tello – Melkumyan.** In the version with b3 rather than c3, test whether ...a5/...b4, ...Ba6 or ...e5 are actually possible; if not, White can expand on the kingside. A familiar Carlsbad label does not guarantee a standard minority attack. (Printed pp. 458.)

- **Exercise 49 · Cardenas Garcia – Vilagra Henriquez.** An exd5 recapture can give Black a favourable simplified structure with ...f5-f4; c4 may create a target rather than useful space. The e-pawn recapture is not automatically the best way to use d5. (Printed pp. 458, 459.)

- **Exercise 50 · Peter Heine Nielsen – Roland Berzinsh.** Bxd6 and ...cxd6 turn an inaccessible c7 weakness into a d6 target; the open c-file then supports invasion. Transform the pawn target when direct pressure cannot reach it. (Printed pp. 459.)


## A plan is a proposed transformation

The recurring strategic operations are concrete: occupy a square, open a file, exchange a defender, fix a pawn, make a passed pawn, or break a chain. The name of a structure helps to propose those operations. It does not settle which one is available in the current position.

| Starting relationship | Intended change | What to inspect before committing |
|---|---|---|
| An isolated pawn | Advance it to open lines or remove the weakness. | Development, the blockade square, the good bishop and the effect of exchanges. |
| Hanging pawns | Advance one to create activity or a passer. | Whether the other pawn becomes backward and whether the opposing blockade can be maintained. |
| A minority faces a majority | Exchange pawns to leave a fixed target. | The target’s accessibility, counterplay on the other wing and whether the majority can advance first. |
| A locked chain | Attack its base or undermine its head. | Which pawn break is supported, how captures change the files, and where the kings are. |
| A space advantage | Improve pieces and preserve useful tension. | Which exchanges relieve the defender and which breaks challenge the bind. |
| A half-open file | Build pressure against the pawn at its end. | A real entry square, defenders that can be exchanged and tactical counterattacks. |
| A backward pawn or outpost | Fix the pawn; occupy or control the square in front. | Whether a pawn can expel the piece, whether an exchange helps the defender, and whether the blockade is doing useful work. |
| A central majority against a wing majority | Advance the majority that matters in this phase. | Open-file control, active pieces, the possibility of a passed pawn and the transition into an ending. |

The same move can serve different purposes. An f-pawn advance may break the opponent’s centre, open a file, restrain a pawn or prepare a kingside attack. The plan descriptions identify that purpose, because the purpose determines what would count as progress and what the opponent should prevent.

A practical reading order is: identify the pawn relationships; name the desired change; check the opponent’s fastest counterplay; calculate the forcing moves; then reassess the structure after each pawn exchange. This makes the familiar plan a candidate that can be checked on the board.

## Source, scope and editing

**Primary source:** Mauricio Flores Rios, *Chess Structures — A Grandmaster Guide*, Quality Chess, first edition, 2015. Chapter titles, canonical pawn skeletons, plans, model-game pointers and page references were checked against the supplied PDF. All explanatory prose is a new paraphrase, and the plan diagrams are original schematic illustrations.

**Coverage:** all 21 main structure chapters and all seven structures in chapter 22. Related formations, alternative recaptures, fixed-centre subtypes and plan-specific exceptions are treated within the corresponding sections. The purpose is an exhaustive atlas of the book’s structure-and-plan categories, rather than a reproduction of every game variation or every tactical diagram. The fifty exercises and their solutions were also reviewed for additional strategic mechanisms.

**A source gap:** the supplied copy jumps from printed page 215 to printed page 218. The two missing pages are in the Maroczy chapter. Their unseen game passages have not been reconstructed or attributed to the author. The chapter introduction, the remaining examples and its structural transformations are present. Printed page numbers, rather than PDF viewer indices, are used throughout; before the gap the PDF viewer index is two greater than the printed page number.

**Diagram conventions:** a recognition mask is a practical structural profile plus written relationships. It is not a claim that pawn placement alone determines the evaluation. Broad families deliberately permit advances that preserve their defining relations; rank-sensitive subtypes retain their contact squares. Schematic routes omit irrelevant pieces and intervening moves. Exact book positions are labelled and replayed with the embedded chess rules.

**Editable source:** this same HTML file contains all article prose, FENs, recognition masks, arrows, labels, source references and example moves in the Markdown block at its top. Editing that block and reloading the file changes the article. The file is self-contained and needs no network connection. The ordinary chess examples use the shared Predicate Chess renderer; the versioned pawn-schematic extension adds the incomplete boards and file-level constraints needed by this article.

  const colors = {green:'#167567',teal:'#167567',accent:'#167567',gold:'#b58740',amber:'#b58740',red:'#b36b50',blue:'#3c7d96',ink:'#152e35',G:'#167567',Y:'#b58740',R:'#b36b50',B:'#3c7d96'};
  const paint = (value, fallback = '#167567') => colors[value] || (/^#[a-fA-F0-9]{6}$/.test(value || '') ? value : fallback);
  const glyphs = {p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
  const pieceNames = {p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
  const sideName = side => side === 'w' ? 'White' : 'Black';
  const sideOf = fen => fen.split(/\s+/)[1];
  const moveKey = move => typeof move === 'string' ? move : move.uci || (move.from + move.to + (move.promotion || ''));

  function rules(fen) {
    const api = global.PredicateChessDataV1;
    if (api && typeof api.engine === 'function') return api.engine(fen);
    const Chess = api && api.Chess || global.PredicateChessRulesV1 && global.PredicateChessRulesV1.Chess || global.Chess;
    if (!Chess) throw new Error('The embedded chess rules library is unavailable.');
    return new Chess(fen);
  }

  function boardPieces(fen) {
    const pieces = [];
    fen.split(/\s+/)[0].split('/').forEach((rank, row) => {
      let file = 0;
      for (const item of rank) {
        if (/[1-8]/.test(item)) file += Number(item);
        else { pieces.push({piece:item, square:String.fromCharCode(97 + file) + (8 - row)}); file++; }
      }
    });
    return pieces;
  }

  function board(node, uid, orientation) {
    const pieces = boardPieces(node.fen), side = sideOf(node.fen), annotation = node.annotations;
    const point = square => {
      if (!/^[a-h][1-8]$/.test(square || '')) return null;
      const file = square.charCodeAt(0) - 97, rank = Number(square[1]) - 1;
      return {x:32 + (orientation === 'black' ? 7 - file : file) * 56 + 28,
        y:16 + (orientation === 'black' ? rank : 7 - rank) * 56 + 28};
    };
    const label = pieces.map(p => `${p.piece === p.piece.toUpperCase() ? 'White' : 'Black'} ${pieceNames[p.piece.toLowerCase()]} ${p.square}`).join(', ');
    let html = `<svg viewBox="0 0 500 490" role="img" aria-label="${escape(label)}. ${sideName(side)} to move. ${escape(orientation)} at bottom." xmlns="http://www.w3.org/2000/svg"><title>${escape(node.san || 'Starting position')}</title><defs><clipPath id="${uid}-clip"><rect x="32" y="16" width="448" height="448" rx="5"/></clipPath></defs><g clip-path="url(#${uid}-clip)">`;
    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) html += `<rect x="${32 + col * 56}" y="${16 + row * 56}" width="56" height="56" fill="${(row + col) % 2 ? '#8daf9e' : '#eeeede'}"/>`;
    if (/^[a-h][1-8][a-h][1-8]/.test(node.uci || '')) for (const square of [node.uci.slice(0,2), node.uci.slice(2,4)]) {
      const p = point(square); html += `<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`;
    }
    for (const mark of annotation.highlights.squares || []) {
      const item = typeof mark === 'string' ? {square:mark} : mark, p = point(item.square || item.sq);
      if (p) html += `<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${paint(item.color,'#b58740')}" fill-opacity=".12" stroke="${paint(item.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for (const p of pieces) {
      const pt = point(p.square), white = p.piece === p.piece.toUpperCase();
      html += `<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()]}</text>`;
    }
    for (const arrow of annotation.highlights.arrows || []) {
      const p = point(arrow.from), q = point(arrow.to);
      if (!p || !q) continue;
      const dx = q.x-p.x, dy = q.y-p.y, len = Math.hypot(dx,dy);
      if (!len) continue;
      const ux = dx/len, uy = dy/len, end = {x:q.x-ux*17,y:q.y-uy*17}, base = {x:end.x-ux*11,y:end.y-uy*11};
      html += `<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${paint(arrow.color)}" stroke-width="5" stroke-linecap="round" opacity=".88"/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${paint(arrow.color)}" opacity=".95"/>`;
    }
    html += '</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for (let i = 0; i < 8; i++) html += `<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(orientation==='black'?104-i:97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${orientation==='black'?i+1:8-i}</text>`;
    return html + '</svg>';
  }

  function normalizeGame(raw, source) {
    const headers = raw.headers || raw.tags || {};
    if (headers.Schema !== VERSION) throw new Error(`Unsupported Schema ${JSON.stringify(headers.Schema || '(missing)')}; expected ${VERSION}.`);
    const view = (headers.View || 'line').toLowerCase();
    if (!['line','proof'].includes(view)) throw new Error(`Unsupported View ${JSON.stringify(headers.View)}.`);
    const orientation = (headers.Orientation || 'white').toLowerCase();
    if (!['white','black'].includes(orientation)) throw new Error('Orientation must be "white" or "black".');
    const inputNodes = Array.isArray(raw.nodes) ? raw.nodes : raw.nodes instanceof Map ? Array.from(raw.nodes.values()) : Object.values(raw.nodes || {});
    const rawMap = new Map(inputNodes.map(n => [String(n.id),n]));
    const rootValue = raw.root || raw.rootId || inputNodes[0];
    const sourceRoot = typeof rootValue === 'object' ? rootValue : rawMap.get(String(rootValue));
    if (!sourceRoot) throw new Error('The PGN loader returned no starting position.');
    const nodes = [], nodeMap = new Map(), aliases = new Map(), active = new Set();
    function visit(value, parent, index) {
      const input = typeof value === 'object' ? value : rawMap.get(String(value));
      if (!input) throw new Error('The PGN tree contains an unknown child.');
      const id = String(input.id == null ? parent ? parent.id + '.' + index : 'root' : input.id);
      if (active.has(id) || nodeMap.has(id)) throw new Error(`The PGN tree reuses node ${id}.`);
      const branchIntro = (input.startingComments || []).join('\n\n');
      if (/\[%/.test(branchIntro)) throw new Error('Place board annotations after SAN; initial comments belong before the first mainline move.');
      const node = {id,fen:input.fen,san:input.san || input.move && input.move.san || null,uci:input.uci || input.move && moveKey(input.move) || null,
        ply:parent ? parent.ply+1 : 0,parent,children:[],comments:input.rawComments || input.comments || [],branchIntro,nags:input.nags || [],annotations:null};
      if (!node.fen) throw new Error(`Node ${id} has no replayed FEN.`);
      const annotationAPI = global.PredicateChessAnnotationsV1;
      if (!annotationAPI) throw new Error('The embedded PGN annotation interpreter is unavailable.');
      node.annotations = annotationAPI.parse(node.comments,{fen:node.fen,engine:rules(node.fen)});
      node.annotations.highlights ||= {squares:[],arrows:[]};
      node.annotations.facts ||= []; node.annotations.stable ||= node.annotations.invariants || [];
      node.annotations.created ||= []; node.annotations.removed ||= [];
      if (node.annotations.alias) {
        if (aliases.has(node.annotations.alias)) throw new Error(`Repeated node alias ${node.annotations.alias}.`);
        aliases.set(node.annotations.alias,node);
      }
      nodeMap.set(id,node); nodes.push(node); active.add(id);
      node.children = (input.children || []).map((child,i) => visit(child,node,i));
      active.delete(id); return node;
    }
    const root = visit(sourceRoot,null,0);
    const game = {headers,view,orientation,root,nodes,nodeMap,aliases,source,sourceId:headers.Id || `block-${++serial}`};
    if (view === 'proof') {
      if ((headers.Goal || '').toLowerCase() !== 'mate') throw new Error('Proof View currently requires Goal "mate".');
      if (!/^(white|black)$/i.test(headers.Prover || '')) throw new Error('Proof View requires Prover "white" or "black".');
      if (!/^\d+$/.test(headers.MaxPlies || '') || Number(headers.MaxPlies) > 1000) throw new Error('Proof View requires MaxPlies as an integer from 0 to 1000.');
      game.prover = headers.Prover.toLowerCase() === 'white' ? 'w' : 'b';
      game.maxPlies = Number(headers.MaxPlies);
      if (headers.OmitNode && !aliases.has(headers.OmitNode)) throw new Error(`OmitNode refers to missing node alias ${headers.OmitNode}.`);
      game.omitNode = headers.OmitNode ? aliases.get(headers.OmitNode) : null;
    }
    return game;
  }

  function state(node) {
    if (!node.positionState) {
      const engine = rules(node.fen), moves = engine.moves({verbose:true});
      node.positionState = {engine,moves,keys:new Set(moves.map(moveKey)),check:engine.isCheck(),mate:engine.isCheckmate(),side:engine.turn()};
    }
    return node.positionState;
  }

  function numberedMove(node) {
    if (!node.parent) return 'Start';
    const fields = node.parent.fen.split(/\s+/), fullmove = fields[5] || Math.floor((node.ply+1)/2);
    const symbols = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',10:'=',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+−',19:'−+'};
    const nags = node.nags.length ? ' ' + node.nags.map(n => symbols[n] || '$' + n).join(' ') : '';
    return `${fullmove}${fields[1] === 'w' ? '.' : '…'} ${node.san}${nags}`;
  }

  function factsMarkup(facts, kind) {
    if (!facts || !facts.length) return '';
    return `<ul class="pc-facts">${facts.map(fact => {
      if (typeof fact === 'string') return `<li class="pc-fact ${kind==='created'?'pc-created':kind==='removed'?'pc-absent':''}"><span>${escape(fact)}</span></li>`;
      const value = fact.value, detail = typeof value === 'boolean' ? value ? 'True' : 'False' : Array.isArray(value) ? value.join(', ') : value;
      return `<li class="pc-fact ${value===false?'pc-absent':''}"><span class="pc-label-value">${escape(fact.label || fact.predicate)}${detail == null ? '' : `: <strong>${escape(detail)}</strong>`}</span></li>`;
    }).join('')}</ul>`;
  }

  function selectedDetails(game,node,proofResult) {
    const a = node.annotations, p = state(node);
    const basic = [{label:'Side to move',value:sideName(p.side)},{label:`${sideName(p.side)} is in check`,value:p.check},
      {label:'Legal moves',value:p.moves.length}];
    if (p.mate) basic.push({label:`${sideName(p.side)} is checkmated`,value:true});
    let html = `<div class="pc-move-label">${node.parent?'After the replayed move':'At the starting node'}</div><div class="pc-move"><span class="pc-san">${node.parent?escape(numberedMove(node)):'Before'}</span><span class="pc-ply">Ply ${node.ply}</span></div>`;
    if (node.branchIntro) html += `<div class="pc-observation pc-comment-lines"><strong>Variation note.</strong> ${escape(node.branchIntro)}</div>`;
    if (a.caption) html += `<p class="pc-caption pc-comment-lines">${escape(a.caption)}</p>`;
    html += `<section class="pc-fact-section"><h4 class="pc-fact-title">Computed position facts</h4>${factsMarkup([...basic,...a.facts])}</section>`;
    for (const [key,title] of [['stable',node.parent?'What stays fixed':'Already in place'],['created','What this move creates'],['removed','What this move removes']]) {
      if (a[key].length) html += `<section class="pc-fact-section"><h4 class="pc-fact-title">${title}<span class="pc-authored-label">Author’s temporal notes</span></h4>${factsMarkup(a[key],key)}</section>`;
    }
    if (a.note || a.observation) html += `<div class="pc-observation pc-comment-lines">${escape(a.note || a.observation)}</div>`;
    if (proofResult) html += `<div class="pc-proof-node-reason"><strong>${escape(proofResult.status[0].toUpperCase()+proofResult.status.slice(1))}.</strong> ${escape(proofResult.reason)}</div>`;
    return html;
  }

  function fenMarkup(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sourceMarkup(source) { return `<details class="pc-source"><summary>Source PGN &amp; annotations</summary><pre>${escape(source)}</pre></details>`; }
  function metadata(game,includeDescription) {
    return `${includeDescription&&game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}${game.headers.Objective?`<div class="pc-metadata"><span class="pc-objective">${escape(game.headers.Objective)}</span></div>`:''}${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}`;
  }
  function metaMarkup(node,orientation) {
    return `<span class="pc-side" data-side="${sideOf(node.fen)}">${sideName(sideOf(node.fen))} to move</span><button class="pc-control pc-flip" data-action="flip" aria-label="Flip board orientation" title="${escape(orientation)} at bottom">Flip board</button>`;
  }
  const controls = '<nav class="pc-controls" aria-label="Position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav>';

  function lineWidget(mount,games,uid) {
    let gameIndex = 0, game = games[0], selected = game.root, orientation = game.orientation;
    const choices = new Map();
    const gallery = games.length > 1;
    mount.dataset.pcWidget = 'line';
    mount.innerHTML = `<header class="pc-header"><div class="pc-eyebrow">Worked positions · replayed PGN</div><h3>${escape(gallery?game.headers.GroupTitle || game.headers.Group:game.headers.Title || 'Worked position')}</h3>${(gallery?game.headers.GroupDescription:game.headers.Description)?`<p class="pc-intro">${escape(gallery?game.headers.GroupDescription:game.headers.Description)}</p>`:''}${gallery?`<div class="pc-selection"><label class="pc-select-label" for="${uid}-example">Explore</label><select id="${uid}-example" data-action="example" aria-label="Choose a tactical example">${games.map((g,i)=>`<option value="${i}">${escape(g.headers.Title || g.sourceId)}</option>`).join('')}</select></div>`:''}<div data-role="objective"></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<nav class="pc-step-nav" data-role="steps" aria-label="Positions on the selected line"></nav><div class="pc-branches" data-role="branches"></div><div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><div data-role="variations"></div><div data-role="source"></div><footer class="pc-footer">Moves are replayed from the Markdown PGN under the rules of chess. Position facts are computed from the displayed board; temporal notes are written by the author.</footer>`;
    const get = role => mount.querySelector(`[data-role="${role}"]`);
    function choose(node) {
      selected = node;
      for (let n = node; n.parent; n = n.parent) choices.set(n.parent.id,n.id);
      draw();
    }
    function nextChild(node) { return node.children.find(c => c.id === choices.get(node.id)) || node.children[0]; }
    function route() {
      const path = [], visited = new Set();
      for (let n=game.root;n && !visited.has(n.id);n=nextChild(n)) { path.push(n); visited.add(n.id); }
      return path;
    }
    function tree(node) {
      return `<li><button class="pc-node" data-node="${escape(node.id)}" aria-current="${selected===node?'true':'false'}" aria-label="Go to ${escape(numberedMove(node))}"><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-kind">${node.parent?'PLY '+node.ply:'ROOT'}</span></button>${node.children.length?`<ul class="pc-children">${node.children.map(tree).join('')}</ul>`:''}</li>`;
    }
    function draw() {
      mount.dataset.example=game.sourceId;mount.dataset.step=String(selected.ply);mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.orientation=orientation;
      get('objective').innerHTML=metadata(game,gallery);
      get('meta').innerHTML=metaMarkup(selected,orientation);
      get('board').innerHTML=board(selected,uid,orientation);
      get('detail').innerHTML=selectedDetails(game,selected);
      get('fen').innerHTML=fenMarkup(selected.fen);
      const path=route();mount.dataset.stepCount=String(path.length);
      get('steps').innerHTML=path.map(n=>`<button class="pc-step" data-node="${escape(n.id)}" ${n===selected?'aria-current="step"':''} aria-label="Go to ${escape(numberedMove(n))}">${escape(numberedMove(n))}</button>`).join('');
      get('branches').innerHTML=selected.children.length>1?`<label for="${uid}-branch">Choose the next move</label><select id="${uid}-branch" data-action="branch" aria-label="Choose the next variation">${selected.children.map(child=>`<option value="${escape(child.id)}" ${nextChild(selected)===child?'selected':''}>${escape(numberedMove(child))}</option>`).join('')}</select>`:game.nodes.length===1?'<p class="pc-empty-line">Starting position · no moves in this block</p>':'';
      const hadOpen=get('variations').querySelector('details')?.open;
      get('variations').innerHTML=game.nodes.some(n=>n.children.length>1)?`<details class="pc-source pc-branch-tree" ${hadOpen?'open':''}><summary>All lines &amp; variations</summary><div class="pc-tree pc-tree-list"><ul>${tree(game.root)}</ul></div></details>`:'';
      const sourceOpen=get('source').querySelector('details')?.open;
      get('source').innerHTML=sourceMarkup(game.source);if(sourceOpen)get('source').querySelector('details').open=true;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!selected.children.length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.node){const node=game.nodeMap.get(button.dataset.node);if(node)choose(node);return;}
      if(button.dataset.action==='previous'&&selected.parent)choose(selected.parent);
      else if(button.dataset.action==='next'&&selected.children.length)choose(nextChild(selected));
      else if(button.dataset.action==='reset'){choices.clear();choose(game.root);}
      else if(button.dataset.action==='flip'){orientation=orientation==='white'?'black':'white';draw();}
    });
    mount.addEventListener('change',event=>{
      if(event.target.matches('[data-action="example"]')){gameIndex=Number(event.target.value);game=games[gameIndex];selected=game.root;orientation=game.orientation;choices.clear();draw();}
      else if(event.target.matches('[data-action="branch"]')){choices.set(selected.id,event.target.value);draw();}
    });
    draw();mount.dataset.pcReady='true';
  }

  /* Evaluate only the authored proof tree plus an exhaustive one-ply mate test.
     A missing subtree is unresolved. Duplicate PGN edges never count as different defenses. */
  function evaluateProof(game,omitted) {
    const results=new Map();
    function visit(node) {
      if(results.has(node.id))return results.get(node.id);
      const p=state(node),remaining=game.maxPlies-node.ply;
      let result={status:'unproved',reason:'This position has no completed continuation for the objective.'};
      const finish=()=>{results.set(node.id,result);return result;};
      if(omitted&&node===game.omitNode){result.reason='This continuation has been deliberately withheld.';return finish();}
      if(node.ply>game.maxPlies){result={status:'refuted',reason:'This node is beyond the stated ply deadline.'};return finish();}
      if(p.mate){result=p.side!==game.prover?{status:'proved',reason:`Checkmate is verified at ply ${node.ply}, within the stated deadline.`}:{status:'refuted',reason:'The proving side is checkmated.'};return finish();}
      if(remaining===0){result={status:'refuted',reason:'The ply deadline has been reached without the required checkmate.'};return finish();}
      if(!p.moves.length){result={status:'refuted',reason:'There are no legal moves, and the position is not checkmate.'};return finish();}
      const groups=new Map();
      for(const child of node.children){
        if(!p.keys.has(child.uci))throw new Error(`The replayed move ${child.san || child.uci} is not a legal child of ${node.id}.`);
        if(!groups.has(child.uci))groups.set(child.uci,[]);
        groups.get(child.uci).push(visit(child));
      }
      const moveStates=new Map();
      for(const [uci,entries]of groups)moveStates.set(uci,entries.some(x=>x.status==='proved')?'proved':entries.some(x=>x.status==='refuted')?'refuted':'unproved');
      const states=Array.from(moveStates.values()),covered=states.filter(s=>s==='proved').length;
      result.total=p.keys.size;result.recorded=groups.size;result.covered=covered;
      if(p.side===game.prover){
        if(states.includes('proved')){result.status='proved';result.reason='One legal choice has a completed proof of the objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='refuted')){result.status='refuted';result.reason='Every legal choice is covered and fails the bounded objective.';}
        else if(remaining===1){
          if(node.immediateMates===undefined){
            let mates=0;
            for(const move of p.moves){const next=rules(node.fen);next.move({from:move.from,to:move.to,promotion:move.promotion});if(next.isCheckmate())mates++;}
            node.immediateMates=mates;
          }
          result.checked=p.moves.length;result.matingMoves=node.immediateMates;
          if(node.immediateMates===0){result.status='refuted';result.reason=`The complete one-ply check examined all ${p.moves.length} legal moves. Immediate mating moves: 0. The deadline cannot be met.`;}
          else result.reason=`${node.immediateMates} immediate mating move${node.immediateMates===1?' exists':'s exist'}, but no completed authored continuation proves this node.`;
        }else result.reason='The shown choices do not prove the objective. Unwritten legal choices remain unresolved.';
      }else{
        if(states.includes('refuted')){result.status='refuted';result.reason='A legal opponent reply has a completed refutation of the bounded objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='proved')){result.status='proved';result.reason=`All ${p.keys.size} distinct legal opponent replies have a completed answer.`;}
        else result.reason=`${covered} of ${p.keys.size} distinct legal opponent replies have a completed answer. Every remaining defense must still be covered.`;
      }
      return finish();
    }
    visit(game.root);
    for (const node of game.nodes) visit(node);
    return {status:results.get(game.root.id).status,results};
  }

  function proofWidget(mount,game,uid) {

let run=[];for(const node of [...sec.children]){if(node.classList.contains('plan-card'))run.push(node);else if(run.length){const grid=document.createElement('div');grid.className='plan-grid';run[0].before(grid);run.forEach(c=>grid.append(c));run=[];}}if(run.length){const grid=document.createElement('div');grid.className='plan-grid';run[0].before(grid);run.forEach(c=>grid.append(c));}
const base=sec.querySelector('.pa-diagram[data-kind="pattern"]');if(base){const lead=document.createElement('div');lead.className='structure-lead';base.before(lead);lead.append(base);const copy=document.createElement('div');copy.className='structure-rules';lead.append(copy);let n=lead.nextElementSibling;while(n&&n.tagName!=='H3'&&n.tagName!=='H2'){let next=n.nextElementSibling;copy.append(n);n=next;}}
sec.dataset.search=sec.textContent.toLowerCase();}
const toc=document.getElementById('atlas-nav');const label=document.createElement('label');label.className='nav-label';const home=document.createElement('span');home.className='nav-home';home.textContent=article.querySelector('h1')?.textContent||'Article';label.append(home);const select=document.createElement('select');select.setAttribute('aria-label','Jump to a structure');select.innerHTML='<option value="">All '+chapters.length+' structures</option>'+chapters.map(s=>'<option value="'+s.id+'">'+s.dataset.title.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</option>').join('');label.append(select);toc.append(label);const search=document.createElement('input');search.type='search';search.placeholder='Find a structure or plan…';search.setAttribute('aria-label','Filter structures and plans');toc.append(search);const count=document.createElement('span');count.className='filter-count';count.setAttribute('aria-live','polite');toc.append(count);select.addEventListener('change',()=>{const el=document.getElementById(select.value);if(el){search.value='';chapters.forEach(s=>s.hidden=false);count.textContent='';el.scrollIntoView({behavior:'smooth',block:'start'});}});search.addEventListener('input',()=>{let n=0;const term=search.value.toLowerCase().trim();for(const s of chapters){const match=!term||s.dataset.search.includes(term);s.hidden=!match;if(match)n++;}count.textContent=term?n+' / '+chapters.length:'';});
for(const a of article.querySelectorAll('a[href^="#"]'))a.addEventListener('click',()=>{search.value='';chapters.forEach(s=>s.hidden=false);count.textContent='';});
if(!chapters.length)toc.hidden=true;const title=article.querySelector('h1');if(title)document.title=title.textContent+(headings[0]?' · '+headings[0].textContent:'');
document.documentElement.dataset.ready='true';
window.AtlasVerification={chapters:chapters.length,schematics:diagrams.length,patterns:diagrams.filter(d=>d.kind==='pattern').length,plans:diagrams.filter(d=>d.kind==='plan').length,errors:article.querySelectorAll('[data-error="true"],[data-pc-error="true"]').length};
})();
