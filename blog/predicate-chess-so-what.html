# Predicate Chess

*Defensive theorems · 22 October 2026 · Atlas specification 19*

## The “So what” theorem

A knight forks a king and rook. The king has six legal moves. A conventional analysis tree can give each king move its own branch, its own capture, and its own collection of replies. The board changes six times. The idea may change only once.

**If the same plan reaches the same checked objective after several defenses, those defenses can share one explanation.**

That is the So what theorem. The opponent moves; the player can carry on anyway. The useful question is precise: which defenses leave one particular continuation and one particular stopping condition intact?

The theorem belongs to **Defensive closure**. It can cover a whole position or a subset of its defenses. A class of sixteen moves out of twenty is useful immediately. The remaining four still need their own treatment.

Three complete before-and-after comparisons below show the distinction. The first shrinks from **42 positions to 6**. The second closes **25 OPEN endpoints** by replacing an avoidable detour. The third groups **17 of 20 defenses** without adding any newly closed puzzle. [1]

> **Reading the examples.** The Before and After controls switch between complete recorded trees. Previous, Next, the variation selector, and All lines & variations navigate their boards. Legal moves, check, and the displayed board facts are computed live. Class memberships and terminal certificates are results from the audited Atlas checkpoint; this article does not rerun that certificate verifier. [1–3]

## 1. Five king moves, one capture

In [0tQT4](https://lichess.org/training/0tQT4), White starts with **41. Nxf6+**. The knight on f6 checks the king on d7 and attacks the rook on g8.

Black has six legal king moves. Five—**Kc8, Kd8, Kd6, Kc6, and Kc7**—admit the same follow-up: **42. Nxg8**. The Atlas checks the same existing certificate, *Material won; short capture replies*, after every member. The capture alone is not the stopping argument: Black may recapture the knight, so the certificate checks the retained material gain under its defined reply conditions. [2]

The representative is **41... Kd6 42. Nxg8**. The other four class members remain listed, but their branches do not each need to be stored.

### The exception explains the definition

After **41... Ke7**, White can still play **42. Nxg8+**. The knight and captured rook are the same. The capture is legal. But now Black is in check, and the selected short-capture certificate requires Black **not** to be in check.

Therefore **Ke7 stays outside this particular class**. The original mainline remains in the tree and ends under its own recorded stopping annotation. The exception does not say that Nxg8+ fails as a chess move. It says that this exact exit does not apply there. [2]

The difference is visible in the stored graph:

| 0tQT4 | Before | After |
| --- | ---: | ---: |
| Raw positions | 42 | 5 |
| Class representatives | 0 | 1 |
| Total positions | 42 | **6** |
| OPEN endpoints | 4 | **0** |

The six positions are the initial board, the board after Nxf6+, the separate Ke7 and Nxg8+ boards, and the Kd6 representative followed by Nxg8. **The representative's response counts too.** A class is not an extra imaginary move, and it does not make its two actual plies disappear. [1, 2]

## 2. The theorem, stated precisely

A **predicate** is a stated fact about a board or a bound piece. A **terminal certificate** is an existing, checked stopping condition. It might establish mate, or a particular material objective under stated reply conditions. Its conclusion is only as broad as its definition.

At a position where the opponent is to move, bind:

1. **One physical player piece.** Its identity must survive the defense.
2. **One move by that piece.** Fix the destination, any captured target, and any promotion choice.
3. **One existing exit certificate.** Keep its exact conditions and parameters.

A set of at least two legal defenses may share a So what class if, after **every** member, that same move remains legal, all declared predicates hold at their respective nodes, and that same exit certificate passes on the resulting board. [3]

The order of the claim matters:

```text
Fix Plan and Exit.
For every defense in the proposed class:
    replay the defense;
    play the same physically bound Plan;
    check the predicates and the exact Exit.
```

Let P be the entry position together with its history from the puzzle root. Let L(P) be the legal defenses. Fix the move m and certificate E, then select a set D:

```text
D ⊆ L(P),  |D| ≥ 2

For every d in D:
    d is legal at P;
    m is legal at P·d with the same physical bindings;
    the declared predicates hold on their actual boards;
    E holds at P·d·m using the original baseline and history.
```

The entry and the position after the defense must permit play to continue. The replay also rejects drawn exits under the current rules. [3]

**Proof.** Take any defense d in D. The assumptions supply a legal defense, the fixed legal continuation, and a checked exit on its resulting board. This establishes E for that defense. Since d was arbitrary, it establishes E for every member of D. Defenses in L(P) outside D remain separate obligations.

The theorem compresses a family of checked lines. Allowing every member to choose a different reply or a different certificate would describe a larger strategy tree.

### A real two-ply meta tree

The dictionary expresses the theorem as a variable PGN tree. The wildcard is the opponent's selected class member. A is the bound player piece; the concrete application supplies its move. K and k denote the player and opposing sides in this theorem's bindings. [3]

```text
{ NODE entry
  KIND root
  TURN defender
  + turn(k); piece(A)
}
x1... * ~ { NODE defense
  EDGE entry--defense
  KIND position
  TURN player
  + turn(K); piece(A)
}
x2. A ~ { NODE exit
  EDGE defense--exit
  KIND exit
  TURN defender
  + moved(A); accepted_ending
  EXIT certificate: accepted_ending
}
*
```

The root, defense, and exit map onto actual positions. **CLASS consumes no ply.** Its purpose is to name which opponent children share the two-ply pattern.

### Entry checking is only the beginning

The printed entry requires the opponent to move and the bound player piece to exist. Those are necessary entry conditions. They do not prove that the move will remain legal or meet the exit.

For 0tQT4, the concrete application is generated from the dictionary:

```text
ENTRY "So what": turn(k); piece(N).

CLASS: Main plan survives.
Representative: 41... Kd6.
Members: Kc8, Kd8, Kd6, Kc6, Kc7.
Plan: f6g8.
Exit: end-material-capture-tree.
+ turn(K); piece(A).
- none.
```

The positive predicates are checked after each defense. The absence of a negative predicate does not waive legality, piece identity, or the exit. The validator must still match the complete tree for every selected member and account for every legal defense outside it. A printed theorem name is not a proof. [3]

## 3. A fork that avoids twenty-five unfinished branches

In [0M5hf](https://lichess.org/training/0M5hf), **35. Ne6+** attacks Black's king and queen. The original mainline begins **35... Kf7 36. Nxc5**.

The earlier tree also contained a long branch after **35... Kh7**. It chose **36. Qxe7+ Qxe7 37. Nf4**. All **25 OPEN endpoints** in that puzzle lay below this detour. The new test asks whether the already available **Nxc5** plan works after Kh7 as well. It does under the selected certificate. [1, 2]

Four king moves—**Kh7, Kh6, Kf6, and Kf7**—therefore share **Nxc5** and the *Material won; short capture replies* exit. Keeping that class replaces the Kh7 detour and its unresolved descendants with a checked continuation.

## 5. What one representative actually buys

The accounting rule is:

```text
positions explored = raw positions + class representatives
```

In this Atlas, the label counts the positions retained in the concrete proof tree. The root counts. Each ordinary child counts. A class representative counts once, and its actual player response is another raw position. Continued mainline positions and explicit exceptions count too. [3]

The member list still names every covered defense. The verifier still checks every proposed member. Some existing certificates also inspect further replies. **A shorter stored proof does not by itself establish faster verification or fewer temporary boards examined.**

For a fixed Plan and Exit, the work includes generating legal defenses, testing the same move and bindings after each one, and evaluating the exit wherever those tests permit it. The certificate's own cost remains relevant.

The final audit of the accepted classes replayed **25,199 defending moves**, applied **20,555 player continuations**, and made **17,259 full certificate calls**. Those are checking-work counters, separate from the **35,895 stored positions** in the final corpus. They exclude other audit work and unsuccessful discovery runs. [1]

For human study, the gain is direct: one idea is printed once, the members are named, and the exceptions show where the idea stops working under its chosen conditions.

## 6. The corpus result

The specification-19 pass examined the existing expanded eligible defender positions and stored one-move player continuations across a **500-puzzle corpus**. Every final puzzle then passed a fresh audit with the exact verifier embedded in the resulting Atlas. [1]

| Measure | Before | After | Change |
| --- | ---: | ---: | ---: |
| OPEN endpoints | 10,556 | **6,241** | **4,315 fewer; 40.9%** |
| Raw positions | 79,638 | 34,634 | 45,004 fewer |
| Class representatives | 5 | 1,261 | 1,256 added |
| Total stored positions | 79,643 | **35,895** | **43,748 fewer; 54.9%** |
| Fully closed puzzles | 313 | **331** | **18 more** |

There are **1,256 accepted So what applications in 277 puzzles**. Of those classes, **250 cover every legal defense** at their parent and **1,006 cover a subset**. Their 15,593 covered defense edges include already closed branches, so that figure is not another count of newly closed OPENs. [1]

Ninety-one retained defender positions now have no OPEN anywhere below them where they previously had at least one. Some of those positions are ancestors of others. That is a count of position IDs, separate from the 4,315 removed endpoints.

The pass has a clear boundary. It transports **one fixed player move** after a wildcard opponent move. Longer plans need the intervening opponent replies represented in a checked strategy tree. Discovery examined 3,190 eligible defender parents; some probes stopped at their budgets, and unresolved cases stayed OPEN. These results do not claim that all remaining defenses are impossible to close. [1, 3]

## 7. A practical way to apply it

The productive order is small and explicit:

1. **Name the intended continuation.** Bind the actual piece, destination, captured target if any, and promotion choice if any.
2. **Name the result that ends this local argument.** Choose an existing certificate with its full conditions.
3. **Test the plan against each legal defense.** Record where the piece disappears, the move becomes illegal, a declared predicate fails, or the certificate is not established.
4. **Form a class from the successful members.** Keep one actual representative line and list the rest.
5. **Handle the exceptions.** The class is complete only for its own members. The parent position still needs coverage for every other legal defense.

The simple question is useful because it is demanding: **does this defense change what the player has to do to reach the stated objective?** When the answer is no for several defenses, the proof can say so once.

    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) html += `<rect x="${32 + col * 56}" y="${16 + row * 56}" width="56" height="56" fill="${(row + col) % 2 ? '#8daf9e' : '#eeeede'}"/>`;
    if (/^[a-h][1-8][a-h][1-8]/.test(node.uci || '')) for (const square of [node.uci.slice(0,2), node.uci.slice(2,4)]) {
      const p = point(square); html += `<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`;
    }
    for (const mark of annotation.highlights.squares || []) {
      const item = typeof mark === 'string' ? {square:mark} : mark, p = point(item.square || item.sq);
      if (p) html += `<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${paint(item.color,'#b58740')}" fill-opacity=".12" stroke="${paint(item.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for (const p of pieces) {
      const pt = point(p.square), white = p.piece === p.piece.toUpperCase();
      html += `<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()]}</text>`;
    }
    for (const arrow of annotation.highlights.arrows || []) {
      const p = point(arrow.from), q = point(arrow.to);
      if (!p || !q) continue;
      const dx = q.x-p.x, dy = q.y-p.y, len = Math.hypot(dx,dy);
      if (!len) continue;
      const ux = dx/len, uy = dy/len, end = {x:q.x-ux*17,y:q.y-uy*17}, base = {x:end.x-ux*11,y:end.y-uy*11};
      html += `<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${paint(arrow.color)}" stroke-width="5" stroke-linecap="round" opacity=".88"/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${paint(arrow.color)}" opacity=".95"/>`;
    }
    html += '</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for (let i = 0; i < 8; i++) html += `<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(orientation==='black'?104-i:97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${orientation==='black'?i+1:8-i}</text>`;
    return html + '</svg>';
  }

  function normalizeGame(raw, source) {
    const headers = raw.headers || raw.tags || {};
    if (headers.Schema !== VERSION) throw new Error(`Unsupported Schema ${JSON.stringify(headers.Schema || '(missing)')}; expected ${VERSION}.`);
    const view = (headers.View || 'line').toLowerCase();
    if (!['line','proof'].includes(view)) throw new Error(`Unsupported View ${JSON.stringify(headers.View)}.`);
    const orientation = (headers.Orientation || 'white').toLowerCase();
    if (!['white','black'].includes(orientation)) throw new Error('Orientation must be "white" or "black".');
    const inputNodes = Array.isArray(raw.nodes) ? raw.nodes : raw.nodes instanceof Map ? Array.from(raw.nodes.values()) : Object.values(raw.nodes || {});
    const rawMap = new Map(inputNodes.map(n => [String(n.id),n]));
    const rootValue = raw.root || raw.rootId || inputNodes[0];
    const sourceRoot = typeof rootValue === 'object' ? rootValue : rawMap.get(String(rootValue));
    if (!sourceRoot) throw new Error('The PGN loader returned no starting position.');
    const nodes = [], nodeMap = new Map(), aliases = new Map(), active = new Set();
    function visit(value, parent, index) {
      const input = typeof value === 'object' ? value : rawMap.get(String(value));
      if (!input) throw new Error('The PGN tree contains an unknown child.');
      const id = String(input.id == null ? parent ? parent.id + '.' + index : 'root' : input.id);
      if (active.has(id) || nodeMap.has(id)) throw new Error(`The PGN tree reuses node ${id}.`);
      const branchIntro = (input.startingComments || []).join('\n\n');
      if (/\[%/.test(branchIntro)) throw new Error('Place board annotations after SAN; initial comments belong before the first mainline move.');
      const node = {id,fen:input.fen,san:input.san || input.move && input.move.san || null,uci:input.uci || input.move && moveKey(input.move) || null,
        ply:parent ? parent.ply+1 : 0,parent,children:[],comments:input.rawComments || input.comments || [],branchIntro,nags:input.nags || [],annotations:null};
      if (!node.fen) throw new Error(`Node ${id} has no replayed FEN.`);
      const annotationAPI = global.PredicateChessAnnotationsV1;
      if (!annotationAPI) throw new Error('The embedded PGN annotation interpreter is unavailable.');
      node.annotations = annotationAPI.parse(node.comments,{fen:node.fen,engine:rules(node.fen)});
      node.annotations.highlights ||= {squares:[],arrows:[]};
      node.annotations.facts ||= []; node.annotations.stable ||= node.annotations.invariants || [];
      node.annotations.created ||= []; node.annotations.removed ||= [];
      if (node.annotations.alias) {
        if (aliases.has(node.annotations.alias)) throw new Error(`Repeated node alias ${node.annotations.alias}.`);
        aliases.set(node.annotations.alias,node);
      }
      nodeMap.set(id,node); nodes.push(node); active.add(id);
      node.children = (input.children || []).map((child,i) => visit(child,node,i));
      active.delete(id); return node;
    }
    const root = visit(sourceRoot,null,0);
    const game = {headers,view,orientation,root,nodes,nodeMap,aliases,source,sourceId:headers.Id || `block-${++serial}`};
    if (view === 'proof') {
      if ((headers.Goal || '').toLowerCase() !== 'mate') throw new Error('Proof View currently requires Goal "mate".');
      if (!/^(white|black)$/i.test(headers.Prover || '')) throw new Error('Proof View requires Prover "white" or "black".');
      if (!/^\d+$/.test(headers.MaxPlies || '') || Number(headers.MaxPlies) > 1000) throw new Error('Proof View requires MaxPlies as an integer from 0 to 1000.');
      game.prover = headers.Prover.toLowerCase() === 'white' ? 'w' : 'b';
      game.maxPlies = Number(headers.MaxPlies);
      if (headers.OmitNode && !aliases.has(headers.OmitNode)) throw new Error(`OmitNode refers to missing node alias ${headers.OmitNode}.`);
      game.omitNode = headers.OmitNode ? aliases.get(headers.OmitNode) : null;
    }
    return game;
  }

  function state(node) {
    if (!node.positionState) {
      const engine = rules(node.fen), moves = engine.moves({verbose:true});
      node.positionState = {engine,moves,keys:new Set(moves.map(moveKey)),check:engine.isCheck(),mate:engine.isCheckmate(),side:engine.turn()};
    }
    return node.positionState;
  }

  function numberedMove(node) {
    if (!node.parent) return 'Start';
    const fields = node.parent.fen.split(/\s+/), fullmove = fields[5] || Math.floor((node.ply+1)/2);
    const symbols = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',10:'=',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+−',19:'−+'};
    const nags = node.nags.length ? ' ' + node.nags.map(n => symbols[n] || '$' + n).join(' ') : '';
    return `${fullmove}${fields[1] === 'w' ? '.' : '…'} ${node.san}${nags}`;
  }

  function factsMarkup(facts, kind) {
    if (!facts || !facts.length) return '';
    return `<ul class="pc-facts">${facts.map(fact => {
      if (typeof fact === 'string') return `<li class="pc-fact ${kind==='created'?'pc-created':kind==='removed'?'pc-absent':''}"><span>${escape(fact)}</span></li>`;
      const value = fact.value, detail = typeof value === 'boolean' ? value ? 'True' : 'False' : Array.isArray(value) ? value.join(', ') : value;
      return `<li class="pc-fact ${value===false?'pc-absent':''}"><span class="pc-label-value">${escape(fact.label || fact.predicate)}${detail == null ? '' : `: <strong>${escape(detail)}</strong>`}</span></li>`;
    }).join('')}</ul>`;
  }

  function selectedDetails(game,node,proofResult) {
    const a = node.annotations, p = state(node);
    const basic = [{label:'Side to move',value:sideName(p.side)},{label:`${sideName(p.side)} is in check`,value:p.check},
      {label:'Legal moves',value:p.moves.length}];
    if (p.mate) basic.push({label:`${sideName(p.side)} is checkmated`,value:true});
    let html = `<div class="pc-move-label">${node.parent?'After the replayed move':'At the starting node'}</div><div class="pc-move"><span class="pc-san">${node.parent?escape(numberedMove(node)):'Before'}</span><span class="pc-ply">Ply ${node.ply}</span></div>`;
    if (node.branchIntro) html += `<div class="pc-observation pc-comment-lines"><strong>Variation note.</strong> ${escape(node.branchIntro)}</div>`;
    if (a.caption) html += `<p class="pc-caption pc-comment-lines">${escape(a.caption)}</p>`;
    html += `<section class="pc-fact-section"><h4 class="pc-fact-title">Computed position facts</h4>${factsMarkup([...basic,...a.facts])}</section>`;
    for (const [key,title] of [['stable',node.parent?'What stays fixed':'Already in place'],['created','What this move creates'],['removed','What this move removes']]) {
      if (a[key].length) html += `<section class="pc-fact-section"><h4 class="pc-fact-title">${title}<span class="pc-authored-label">Author’s temporal notes</span></h4>${factsMarkup(a[key],key)}</section>`;
    }
    if (a.note || a.observation) html += `<div class="pc-observation pc-comment-lines">${escape(a.note || a.observation)}</div>`;
    if (proofResult) html += `<div class="pc-proof-node-reason"><strong>${escape(proofResult.status[0].toUpperCase()+proofResult.status.slice(1))}.</strong> ${escape(proofResult.reason)}</div>`;
    return html;
  }

  function fenMarkup(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sourceMarkup(source) { return `<details class="pc-source"><summary>Source PGN &amp; annotations</summary><pre>${escape(source)}</pre></details>`; }
  function metadata(game,includeDescription) {
    return `${includeDescription&&game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}${game.headers.Objective?`<div class="pc-metadata"><span class="pc-objective">${escape(game.headers.Objective)}</span></div>`:''}${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}`;
  }
  function metaMarkup(node,orientation) {
    return `<span class="pc-side" data-side="${sideOf(node.fen)}">${sideName(sideOf(node.fen))} to move</span><button class="pc-control pc-flip" data-action="flip" aria-label="Flip board orientation" title="${escape(orientation)} at bottom">Flip board</button>`;
  }
  const controls = '<nav class="pc-controls" aria-label="Position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav>';

  function lineWidget(mount,games,uid) {
    let gameIndex = 0, game = games[0], selected = game.root, orientation = game.orientation;
    const choices = new Map();
    const gallery = games.length > 1;
    mount.dataset.pcWidget = 'line';
    mount.innerHTML = `<header class="pc-header"><div class="pc-eyebrow">Worked positions · replayed PGN</div><h3>${escape(gallery?game.headers.GroupTitle || game.headers.Group:game.headers.Title || 'Worked position')}</h3>${(gallery?game.headers.GroupDescription:game.headers.Description)?`<p class="pc-intro">${escape(gallery?game.headers.GroupDescription:game.headers.Description)}</p>`:''}${gallery?`<div class="pc-selection"><label class="pc-select-label" for="${uid}-example">Explore</label><select id="${uid}-example" data-action="example" aria-label="Choose a tactical example">${games.map((g,i)=>`<option value="${i}">${escape(g.headers.Title || g.sourceId)}</option>`).join('')}</select></div>`:''}<div data-role="objective"></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<nav class="pc-step-nav" data-role="steps" aria-label="Positions on the selected line"></nav><div class="pc-branches" data-role="branches"></div><div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><div data-role="variations"></div><div data-role="source"></div><footer class="pc-footer">Moves are replayed from the Markdown PGN under the rules of chess. Position facts are computed from the displayed board; temporal notes are written by the author.</footer>`;
    const get = role => mount.querySelector(`[data-role="${role}"]`);
    function choose(node) {
      selected = node;
      for (let n = node; n.parent; n = n.parent) choices.set(n.parent.id,n.id);
      draw();
    }
    function nextChild(node) { return node.children.find(c => c.id === choices.get(node.id)) || node.children[0]; }
    function route() {
      const path = [], visited = new Set();
      for (let n=game.root;n && !visited.has(n.id);n=nextChild(n)) { path.push(n); visited.add(n.id); }
      return path;
    }
    function tree(node) {
      return `<li><button class="pc-node" data-node="${escape(node.id)}" aria-current="${selected===node?'true':'false'}" aria-label="Go to ${escape(numberedMove(node))}"><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-kind">${node.parent?'PLY '+node.ply:'ROOT'}</span></button>${node.children.length?`<ul class="pc-children">${node.children.map(tree).join('')}</ul>`:''}</li>`;
    }
    function draw() {
      mount.dataset.example=game.sourceId;mount.dataset.step=String(selected.ply);mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.orientation=orientation;
      get('objective').innerHTML=metadata(game,gallery);
      get('meta').innerHTML=metaMarkup(selected,orientation);
      get('board').innerHTML=board(selected,uid,orientation);
      get('detail').innerHTML=selectedDetails(game,selected);
      get('fen').innerHTML=fenMarkup(selected.fen);
      const path=route();mount.dataset.stepCount=String(path.length);
      get('steps').innerHTML=path.map(n=>`<button class="pc-step" data-node="${escape(n.id)}" ${n===selected?'aria-current="step"':''} aria-label="Go to ${escape(numberedMove(n))}">${escape(numberedMove(n))}</button>`).join('');
      get('branches').innerHTML=selected.children.length>1?`<label for="${uid}-branch">Choose the next move</label><select id="${uid}-branch" data-action="branch" aria-label="Choose the next variation">${selected.children.map(child=>`<option value="${escape(child.id)}" ${nextChild(selected)===child?'selected':''}>${escape(numberedMove(child))}</option>`).join('')}</select>`:game.nodes.length===1?'<p class="pc-empty-line">Starting position · no moves in this block</p>':'';
      const hadOpen=get('variations').querySelector('details')?.open;
      get('variations').innerHTML=game.nodes.some(n=>n.children.length>1)?`<details class="pc-source pc-branch-tree" ${hadOpen?'open':''}><summary>All lines &amp; variations</summary><div class="pc-tree pc-tree-list"><ul>${tree(game.root)}</ul></div></details>`:'';
      const sourceOpen=get('source').querySelector('details')?.open;
      get('source').innerHTML=sourceMarkup(game.source);if(sourceOpen)get('source').querySelector('details').open=true;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!selected.children.length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.node){const node=game.nodeMap.get(button.dataset.node);if(node)choose(node);return;}
      if(button.dataset.action==='previous'&&selected.parent)choose(selected.parent);
      else if(button.dataset.action==='next'&&selected.children.length)choose(nextChild(selected));
      else if(button.dataset.action==='reset'){choices.clear();choose(game.root);}
      else if(button.dataset.action==='flip'){orientation=orientation==='white'?'black':'white';draw();}
    });
    mount.addEventListener('change',event=>{
      if(event.target.matches('[data-action="example"]')){gameIndex=Number(event.target.value);game=games[gameIndex];selected=game.root;orientation=game.orientation;choices.clear();draw();}
      else if(event.target.matches('[data-action="branch"]')){choices.set(selected.id,event.target.value);draw();}
    });
    draw();mount.dataset.pcReady='true';
  }

  /* Evaluate only the authored proof tree plus an exhaustive one-ply mate test.
     A missing subtree is unresolved. Duplicate PGN edges never count as different defenses. */
  function evaluateProof(game,omitted) {
    const results=new Map();
    function visit(node) {
      if(results.has(node.id))return results.get(node.id);
      const p=state(node),remaining=game.maxPlies-node.ply;
      let result={status:'unproved',reason:'This position has no completed continuation for the objective.'};
      const finish=()=>{results.set(node.id,result);return result;};
      if(omitted&&node===game.omitNode){result.reason='This continuation has been deliberately withheld.';return finish();}
      if(node.ply>game.maxPlies){result={status:'refuted',reason:'This node is beyond the stated ply deadline.'};return finish();}
      if(p.mate){result=p.side!==game.prover?{status:'proved',reason:`Checkmate is verified at ply ${node.ply}, within the stated deadline.`}:{status:'refuted',reason:'The proving side is checkmated.'};return finish();}
      if(remaining===0){result={status:'refuted',reason:'The ply deadline has been reached without the required checkmate.'};return finish();}
      if(!p.moves.length){result={status:'refuted',reason:'There are no legal moves, and the position is not checkmate.'};return finish();}
      const groups=new Map();
      for(const child of node.children){
        if(!p.keys.has(child.uci))throw new Error(`The replayed move ${child.san || child.uci} is not a legal child of ${node.id}.`);
        if(!groups.has(child.uci))groups.set(child.uci,[]);
        groups.get(child.uci).push(visit(child));
      }
      const moveStates=new Map();
      for(const [uci,entries]of groups)moveStates.set(uci,entries.some(x=>x.status==='proved')?'proved':entries.some(x=>x.status==='refuted')?'refuted':'unproved');
      const states=Array.from(moveStates.values()),covered=states.filter(s=>s==='proved').length;
      result.total=p.keys.size;result.recorded=groups.size;result.covered=covered;
      if(p.side===game.prover){
        if(states.includes('proved')){result.status='proved';result.reason='One legal choice has a completed proof of the objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='refuted')){result.status='refuted';result.reason='Every legal choice is covered and fails the bounded objective.';}
        else if(remaining===1){
          if(node.immediateMates===undefined){
            let mates=0;
            for(const move of p.moves){const next=rules(node.fen);next.move({from:move.from,to:move.to,promotion:move.promotion});if(next.isCheckmate())mates++;}
            node.immediateMates=mates;
          }
          result.checked=p.moves.length;result.matingMoves=node.immediateMates;
          if(node.immediateMates===0){result.status='refuted';result.reason=`The complete one-ply check examined all ${p.moves.length} legal moves. Immediate mating moves: 0. The deadline cannot be met.`;}
          else result.reason=`${node.immediateMates} immediate mating move${node.immediateMates===1?' exists':'s exist'}, but no completed authored continuation proves this node.`;
        }else result.reason='The shown choices do not prove the objective. Unwritten legal choices remain unresolved.';
      }else{
        if(states.includes('refuted')){result.status='refuted';result.reason='A legal opponent reply has a completed refutation of the bounded objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='proved')){result.status='proved';result.reason=`All ${p.keys.size} distinct legal opponent replies have a completed answer.`;}
        else result.reason=`${covered} of ${p.keys.size} distinct legal opponent replies have a completed answer. Every remaining defense must still be covered.`;
      }
      return finish();
    }
    visit(game.root);
    for (const node of game.nodes) visit(node);
    return {status:results.get(game.root.id).status,results};
  }

  function proofWidget(mount,game,uid) {
    let selected=game.root,orientation=game.orientation,omitted=false,evaluation;
    mount.dataset.pcWidget='proof';mount.dataset.example=game.sourceId;
    mount.innerHTML=`<header class="pc-header"><div class="pc-eyebrow">A bounded AND / OR proof · replayed PGN</div><h3>${escape(game.headers.Title || 'Trace every defense')}</h3>${game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}<div class="pc-proof-options"><span class="pc-objective">${escape(game.headers.Objective || `Mate within ${game.maxPlies} plies`)}</span>${game.omitNode?'<label class="pc-switch-label"><input type="checkbox" data-action="omit-defense" aria-label="Leave one defense open"><span>Leave one defense open</span></label>':''}</div>${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}<p class="pc-limits">${sideName(game.prover)} proves the objective. One choice suffices on its turn (OR); every legal opposing reply needs an answer (AND). Deadline: ${game.maxPlies} plies.</p></header><div class="pc-proof-verdict" data-role="verdict" aria-live="polite"></div><div class="pc-main pc-proof-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<div class="pc-proof-selection" data-role="selection" aria-live="polite"></div><div data-role="fen"></div></div><div class="pc-tree-panel"><div class="pc-tree-title"><span>Select a node</span><span class="pc-inline-count" data-role="count"></span></div><div class="pc-tree pc-tree-list" data-role="tree"></div><div class="pc-coverage" data-role="coverage"></div></div></div>${sourceMarkup(game.source)}<footer class="pc-footer">The proof checker verifies the replayed positions, actual checkmate, and unique legal reply coverage. It also exhausts legal moves when the proving side has one ply left. An unwritten continuation stays unproved; the PGN result and author’s notes do not establish a proof.</footer>`;
    const get=role=>mount.querySelector(`[data-role="${role}"]`);
    function hidden(node){for(let n=node.parent;n;n=n.parent)if(omitted&&n===game.omitNode)return true;return false;}
    function kind(node){const p=state(node);if(p.mate)return 'MATE';if(node.ply>=game.maxPlies)return 'BOUND';return p.side===game.prover?'OR':'AND';}
    function visibleChildren(node){return omitted&&node===game.omitNode?[]:node.children;}
    function tree(node){
      const result=evaluation.results.get(node.id)||{status:'unproved'},label=node.annotations.alias || node.id,k=kind(node),open=omitted&&node===game.omitNode;
      let subtitle=open?'Continuation withheld':state(node).mate?'Checkmate verified':k==='AND'?`${result.covered || 0} / ${state(node).keys.size} legal replies proved`:k==='OR'?'One completed choice suffices':'Ply deadline';
      const kids=visibleChildren(node);
      return `<li><button class="pc-node ${state(node).mate?'pc-leaf':''} ${open?'pc-omitted':''}" data-node="${escape(label)}" data-internal-node="${escape(node.id)}" data-proof-node-status="${result.status}" aria-current="${selected===node?'true':'false'}" aria-label="Inspect ${escape(numberedMove(node))}${open?', continuation withheld':''}"><span><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-subtitle">${escape(subtitle)}</span></span><span class="pc-node-kind">${open?'OPEN':k}</span></button>${kids.length?`<ul class="pc-children">${kids.map(tree).join('')}</ul>`:''}</li>`;
    }
    function focusDefense(){

</script>
<script data-article-module="editor">
/* Generic Predicate Chess article editor.
 * The only authored source is #pc-source (type=text/markdown).
 * renderArticle receives decoded Markdown and must rebuild #pc-article.
 * Any literal closing script token in that source is stored with an escaped slash.
 * This shell keeps no browser-storage copy and makes no network requests.
 */
(function (global) {
  'use strict';
  let current = null;
  const encode = text => String(text).replace(/<\/script/gi, match => '<\\/' + match.slice(2));
  const decode = text => String(text).replace(/<\\\/script/gi, match => '</' + match.slice(3));
  const element = (tag, attributes = {}, text) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (value !== undefined && value !== null) node.setAttribute(key, String(value));
    }
    if (text !== undefined) node.textContent = String(text);
    return node;
  };
  const slug = value => String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'article';

  function mount(options = {}) {
    if (current) return current;
    const source = document.getElementById(options.sourceId || 'pc-source');
    const article = document.getElementById(options.articleId || 'pc-article');
    if (!source || !article) throw new Error('Article editor requires #pc-source and #pc-article.');
    const render = options.render || global.renderArticle;
    if (typeof render !== 'function') throw new Error('Article editor requires renderArticle(markdown).');
    let applied = decode(source.textContent), downloaded = applied, busy = false, lastFocus = null, sections = [];

    const nav = element('nav', {class: 'pc-article-menu', 'aria-label': 'Article tools', 'data-pc-editor-ui': ''});
    const details = element('details', {class: 'pc-article-menu-details'});
    const summary = element('summary', {'aria-label': 'In this article and editing tools'});
    summary.append(element('span', {}, 'In this article'), element('span', {class: 'pc-article-menu-arrow', 'aria-hidden': 'true'}, '⌄'));
    const panel = element('div', {class: 'pc-article-menu-panel'});
    const toc = element('div', {class: 'pc-article-menu-toc'});
    const navStatus = element('p', {class: 'pc-article-menu-status', 'aria-live': 'polite'}, 'Offline article');
    const editButton = element('button', {type: 'button', 'data-pc-edit': 'open'}, 'Edit');
    const saveButton = element('button', {type: 'button', 'data-pc-edit': 'download'}, 'Download HTML');
    const navActions = element('div', {class: 'pc-article-menu-actions'});
    navActions.append(editButton, saveButton); panel.append(toc, navActions, navStatus); details.append(summary, panel); nav.append(details); document.body.append(nav);

    const dialog = element('dialog', {class: 'pc-edit-dialog', 'aria-labelledby': 'pc-edit-title', 'data-pc-editor-ui': ''});
    const header = element('div', {class: 'pc-edit-header'});
    const heading = element('h2', {id: 'pc-edit-title'}, 'Edit this article');
    const close = element('button', {class: 'pc-edit-close', type: 'button', 'aria-label': 'Close editor', 'data-pc-edit': 'close'}, '×');
    header.append(heading, close);
    const help = element('p', {class: 'pc-edit-help'}, 'Prose, boards, moves, facts, and labels all come from this Markdown. Apply changes to view the article, then download its HTML to keep the revision.');
    const tools = element('div', {class: 'pc-edit-source-tools'});
    const sectionLabel = element('label', {for: 'pc-edit-sections'}, 'Jump to');
    const sectionSelect = element('select', {id: 'pc-edit-sections', 'aria-label': 'Jump to an article section or chess block'});
    const copyButton = element('button', {type: 'button', 'data-pc-edit': 'copy-chess'}, 'Copy chess block');
    tools.append(sectionLabel, sectionSelect, copyButton);
    const textarea = element('textarea', {id: 'pc-edit-source', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'Complete article Markdown', wrap: 'off'});
    textarea.value = applied;
    textarea.setSelectionRange(0, 0);
    const status = element('p', {class: 'pc-edit-status', role: 'status', 'aria-live': 'polite'}, 'The opened HTML is the source.');
    const footer = element('div', {class: 'pc-edit-footer'});
    const revert = element('button', {type: 'button', 'data-pc-edit': 'revert', title: 'Discard only edits made since the last Apply'}, 'Revert unapplied edits');
    const apply = element('button', {type: 'button', class: 'pc-edit-primary', 'data-pc-edit': 'apply'}, 'Apply & view');
    const download = element('button', {type: 'button', 'data-pc-edit': 'download'}, 'Download HTML');
    footer.append(revert, download, apply);
    const hint = element('p', {class: 'pc-edit-keyboard'}, 'Ctrl/⌘ + Enter applies changes. Ctrl/⌘ + S downloads this HTML.');
    dialog.append(header, help, tools, textarea, status, footer, hint); document.body.append(dialog);

    function pending() { return textarea.value !== applied; }
    function changed() { return pending() || applied !== downloaded; }
    function updateControls(message) {
      revert.disabled = busy || !pending();
      for (const button of [apply, download, saveButton]) button.disabled = busy;
      download.textContent = saveButton.textContent = pending() ? 'Apply & download HTML' : 'Download HTML';
      copyButton.disabled = busy || sections[Number(sectionSelect.value)]?.kind !== 'chess';
      if (message) status.textContent = message;
      else status.textContent = pending() ? 'Draft changes are not applied yet.' : applied !== downloaded ? 'Applied changes are visible. Download HTML to keep them.' : 'The current article matches the downloaded or opened HTML.';
      navStatus.textContent = pending() ? 'Unapplied draft' : applied !== downloaded ? 'Changes ready to download' : 'Offline article';
      summary.dataset.changed = changed() ? 'true' : 'false';
    }

    function refresh() {
      toc.replaceChildren();
      const used = new Set(Array.from(document.querySelectorAll('[id]'), n => n.id));
      const headings = Array.from(article.querySelectorAll('h2, h3')).filter(h => !h.closest('.pc-widget'));
      headings.forEach((h, i) => {
        if (!h.id) { const stem = 'section-' + slug(h.textContent); let id = stem, suffix = 2; while (used.has(id)) id = stem + '-' + suffix++; h.id = id; used.add(id); }
        const a = element('a', {href: '#' + h.id, class: h.tagName === 'H3' ? 'pc-article-menu-sub' : ''}, h.textContent);
        a.addEventListener('click', () => { details.open = false; }); toc.append(a);
      });
      if (!headings.length) toc.append(element('span', {class: 'pc-article-menu-empty'}, 'Article source and download'));
    }

    function refreshSections() {
      const value = textarea.value, lines = value.split('\n'), result = [{kind: 'start', label: 'Start of article', start: 0, end: 0}], oldStart = sections[Number(sectionSelect.value)]?.start;
      let offset = 0, fence = null;
      for (const line of lines) {
        if (!fence) {
          const start = line.match(/^\s*(`{3,}|~{3,})\s*([^\s]*)\s*$/);
          if (start) fence = {char: start[1][0], length: start[1].length, language: start[2].toLowerCase(), start: offset, text: ''};
          else { const h = line.match(/^(#{1,3})\s+(.+?)\s*#*$/); if (h) result.push({kind: 'heading', label: h[2], start: offset, end: offset + line.length}); }
        } else {
          const end = line.match(/^\s*(`{3,}|~{3,})\s*$/);
          if (end && end[1][0] === fence.char && end[1].length >= fence.length) {
            if (fence.language === 'chess') {
              const title = fence.text.match(/^\[Title\s+"((?:\\.|[^"\\])*)"\]\s*$/m)?.[1] || fence.text.match(/^\[Id\s+"((?:\\.|[^"\\])*)"\]\s*$/m)?.[1] || 'Untitled chess block';
              result.push({kind: 'chess', label: 'Chess · ' + title.replace(/\\(["\\])/g, '$1'), start: fence.start, end: offset + line.length});
            }
            fence = null;
          } else fence.text += line + '\n';
        }
        offset += line.length + 1;
      }
      sections = result; sectionSelect.replaceChildren();
      result.forEach((section, index) => sectionSelect.append(element('option', {value: index}, section.label)));
      const retained = result.findIndex(s => s.start === oldStart); sectionSelect.value = String(retained >= 0 ? retained : 0); updateControls();
    }

    function focusSection() {
      const section = sections[Number(sectionSelect.value)] || sections[0];
      textarea.focus(); textarea.setSelectionRange(section.start, section.end);
      const line = textarea.value.slice(0, section.start).split('\n').length - 1;
      textarea.scrollTop = Math.max(0, line * parseFloat(getComputedStyle(textarea).lineHeight) - 60); updateControls();
    }
    function openEditor() {
      lastFocus = document.activeElement; details.open = false; refreshSections();
      dialog.showModal(); textarea.focus(); updateControls();
    }
    function closeEditor() { dialog.close(); lastFocus?.focus?.(); }

    async function applyChanges({view = false} = {}) {
      if (busy) return false;
      const text = textarea.value;
      busy = true; updateControls('Applying source…');
      try {
        await render(text);
        source.textContent = encode(text); applied = text;
        refresh(); refreshSections();
        const localErrors = article.querySelectorAll('.pc-error, [data-pc-data-error]').length;
        status.textContent = localErrors ? 'Applied. A chess block reports a local data error; its source remains editable.' : 'Applied. The article and chess sections now use this source.';
        global.dispatchEvent(new CustomEvent('pc:source-applied', {detail: {source: text}}));
        if (view) closeEditor();
        return true;
      } catch (error) {
        try { await render(applied); refresh(); } catch (_) { /* The canonical source remains intact even if the view cannot recover. */ }
        status.textContent = 'Could not apply: ' + (error?.message || String(error));
        return false;
      } finally { busy = false; updateControls(status.textContent); }
    }

    function serialize() {
      const copy = document.documentElement.cloneNode(true);
      copy.querySelectorAll('[data-pc-editor-ui]').forEach(n => n.remove());
      const target = copy.querySelector('#' + (options.sourceId || 'pc-source'));
      target.textContent = encode(applied);
      const generatedArticle = copy.querySelector('#' + (options.articleId || 'pc-article'));
      generatedArticle.replaceChildren();
      generatedArticle.removeAttribute('aria-busy'); generatedArticle.removeAttribute('data-pc-rendered');
      return '<!doctype html>\n' + copy.outerHTML + '\n';
    }
    async function downloadHtml() {
      if (busy) return false;
      if (pending() && !(await applyChanges())) return false;
      const html = serialize(), blob = new Blob([html], {type: 'text/html;charset=utf-8'}), url = URL.createObjectURL(blob);
      const link = element('a', {href: url, download: slug(document.title || article.querySelector('h1')?.textContent || 'article') + '.html'});
      link.click(); setTimeout(() => URL.revokeObjectURL(url), 30000);
      downloaded = applied; updateControls('HTML copy downloaded. Reopen that file to continue from this revision.');
      global.dispatchEvent(new CustomEvent('pc:html-downloaded', {detail: {bytes: blob.size}}));
      return true;
    }
    async function copySection() {
      const section = sections[Number(sectionSelect.value)];
      if (section?.kind !== 'chess') return;
      const text = textarea.value.slice(section.start, section.end);
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
        else { textarea.focus(); textarea.setSelectionRange(section.start, section.end); if (!document.execCommand('copy')) throw new Error('Select and copy the highlighted block.'); }
        status.textContent = 'Complete chess block copied, including its metadata and variations.';
      } catch (_) { textarea.focus(); textarea.setSelectionRange(section.start, section.end); status.textContent = 'The complete chess block is selected. Copy the selection using the device’s Copy command.'; }
    }

    editButton.addEventListener('click', openEditor); close.addEventListener('click', closeEditor);
    saveButton.addEventListener('click', () => { details.open = false; downloadHtml(); });
    download.addEventListener('click', downloadHtml); apply.addEventListener('click', () => applyChanges({view: true}));
    revert.addEventListener('click', () => { textarea.value = applied; refreshSections(); updateControls('Unapplied edits discarded. The displayed article is unchanged.'); });
    copyButton.addEventListener('click', copySection); sectionSelect.addEventListener('change', focusSection);
    let timer = null;
    textarea.addEventListener('input', () => { updateControls(); clearTimeout(timer); timer = setTimeout(refreshSections, 180); });
    textarea.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') { event.preventDefault(); applyChanges({view: true}); }
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') { event.preventDefault(); downloadHtml(); }
    });
    document.addEventListener('click', event => { if (details.open && !nav.contains(event.target)) details.open = false; });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') details.open = false; });
    global.addEventListener('beforeunload', event => { if (changed()) { event.preventDefault(); event.returnValue = ''; } });
    document.addEventListener('pc:markdown-rendered', () => refresh());
    current = Object.freeze({open: openEditor, close: closeEditor, refresh, apply: applyChanges, download: downloadHtml, serialize,
      state: () => ({appliedSource: applied, draftSource: textarea.value, pending: pending(), changed: changed(), busy, sections: sections.map(s => ({...s}))})});
    refresh(); refreshSections(); return current;
  }
  global.PredicateChessArticleEditor = Object.freeze({mount, encode, decode, get current() { return current; }});
})(window);

</script>
<script data-article-module="markdown-renderer">
/* Generic Markdown-to-article integration. All authored data lives in #pc-source. */
(function(global){
  'use strict';
  const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const decode=text=>String(text).replace(/<\\\/script/gi,match=>'</'+match.slice(3));
  const slug=text=>String(text).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'section';
  const parser=new global.marked.Marked({gfm:true,breaks:false});
  // Raw HTML is displayed as text. Authored code or comments cannot inject scripts.
  parser.use({renderer:{html(token){return escape(token.text||token.raw||'');}}});
  function renderArticle(markdown){
    const article=document.getElementById('pc-article');
    if(!article)throw Error('The article mount is missing.');
    const html=parser.parse(String(markdown));
    article.innerHTML=html;
    const ids=new Set();
    for(const heading of article.querySelectorAll('h1,h2,h3')){
      const base=slug(heading.textContent);let id=base,index=2;while(ids.has(id))id=base+'-'+index++;
      ids.add(id);heading.id=id;
    }
    document.title=article.querySelector('h1')?.textContent||'Article';
    for(const table of [...article.querySelectorAll(':scope > table')]){
      const wrap=document.createElement('div');wrap.className='pc-table-scroll';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label','Article comparison table');table.before(wrap);wrap.append(table);
    }
    for(const link of article.querySelectorAll('a[href]')){
      const href=link.getAttribute('href')||'';
      if(/^https?:/i.test(href)){link.rel='noopener noreferrer';link.target='_blank';}
      else if(!/^(?:#|mailto:)/i.test(href)){link.removeAttribute('href');}
    }
    global.PredicateChessRendererV1.render(article);
    global.PredicateChessArticleEnhancements?.mount(article);
    global.PredicateChessArticleEditor?.current?.refresh();
    document.dispatchEvent(new CustomEvent('pc:article-updated',{detail:{article}}));
    return {blocks:article.querySelectorAll('.pc-widget').length,errors:article.querySelectorAll('[data-pc-error]').length};
  }
  global.renderArticle=renderArticle;
  global.PredicateChessArticleSource=Object.freeze({decode});
})(typeof window==='undefined'?globalThis:window);

</script>
<script data-article-module="initialize">
try { renderArticle(PredicateChessArticleSource.decode(document.getElementById('pc-source').textContent)); PredicateChessArticleEditor.mount(); document.documentElement.dataset.articleReady='true'; } catch (error) { const box=document.createElement('p'); box.className='pc-article-fatal'; box.setAttribute('role','alert'); box.textContent='Article rendering failed: '+error.message; document.getElementById('pc-article').append(box); console.error(error); }
</script>
