# Predicate Chess

*Part I · Facts, proof trees, and the precondition theorem*

**Max Sills · October 5, 2026**

I've been trying to build a chess system I can actually learn. I want to look at a position, recognize a few facts, and use those facts to decide what deserves calculation. Then I want to be able to explain every step.

The project has gotten tangled. We need some truths we can go back to.

So I'm starting over at the foundation. How do the pieces move? What does it mean to attack something? What are we claiming when we say a tactic works? And what has to be true on the board before a particular tactic can happen?

The idea is to solve tactics as little proofs. A position gives us facts. A legal move takes us to another position, with another set of facts. We follow the branches until we can establish the objective we actually set out to prove.

The first theorem is going to be deliberately small. It says that certain relationships between the opponent's pieces must already exist before our move can exploit them. The useful part is being precise about which relationships, and what “before” means.

## 1. The ground floor

The movement rules are our starting axioms. Here is the short version of how the pieces move.[2]

| Piece | Movement |
| --- | --- |
| Rook | Any distance along a rank or file. |
| Bishop | Any distance along a diagonal. |
| Queen | Rook or bishop movement. |
| Knight | Two squares along one axis and one along the other; it can jump. |
| King | One square in any direction, subject to safety. |
| Pawn | Forward into an empty square; optionally two from its starting rank if clear. Captures diagonally forward. |

Sliding pieces cannot pass through occupied squares. Ordinary captures replace an enemy piece; friendly pieces cannot share a square. On its last rank, a pawn promotes to a same-color queen, rook, bishop, or knight.[2]

Two special moves need their own rules:[1]

- **Castling:** The king moves two squares toward a rook, which moves to the crossed square. Both must be unmoved, the intervening squares empty, and the king’s starting, transit, and destination squares safe.
- **En passant:** Immediately after an adjacent enemy pawn advances two squares, a pawn may capture it as if it had advanced one, subject to king safety.

**Check** means the king is attacked. A legal move must leave your king safe. **Checkmate** means check with no legal reply. No legal move without check is **stalemate**, a draw. Kings are never captured.[1]

There is a subtle distinction we need to preserve: a pinned piece still attacks squares for king safety, even when moving there would be illegal. “Attacks” and “can legally capture” are different predicates.[1]

For this project, I call the part that reads those facts the **Oracle**. It recognizes what is on the board. When I am playing, I have to learn to do that recognition myself.

## 2. A position is a collection of facts

A **predicate** is a statement we can evaluate at a position. It has to say something definite enough to be true or false.

| Predicate | The fact it records |
| --- | --- |
| White is in check | White's king is currently attacked. |
| The black queen and king share a file | Their file coordinates match. |
| There is a clear rook line from a1 to a7 | The squares strictly between the endpoints are empty. |
| The knight has a legal move to e6 | That move satisfies the movement and king-safety rules. |
| Black has no legal reply | The legal move set is empty. |
| White's material balance is at least +3 | A stated accounting convention reaches that threshold. |

“This is the best move” would require a different kind of argument. “The queen and king share a file” is something I can look at and check.

These verified facts are the local premises of the proof. We can think of them as the axioms we have available at that node. The distinction is that the rules remain fixed while the local facts change. “White is in check” can become false after one legal move. We do not change the rules to make that happen.

The Oracle can also be wrong. A proof built on a misread diagonal is only a proof of what would follow from that mistaken premise. The connection back to the actual board has to be checked.

Sometimes the useful fact is negative: the line is blocked; the knight cannot reach the fork square; the candidate leaves our king in check. I will call a fact that blocks a proposed step an **anti-predicate**. It is an explicit reason to reject that step. If the Oracle reports only selected facts, an omitted predicate is still unknown. Rejecting a move requires a checked negative, not an omission from the list.

I also want to distinguish three levels of description. Two targets may have the right **geometry**. A piece may actually **attack** them. A legal sequence may **win something**. Each is a separate claim, and each needs its own support.

## 3. What we are proving on the tree

Take a position and draw an edge for each legal move. Every edge is one **ply**: one move by one player. The position after that move is the next node.

Each node carries its position and its predicates. A complete state also needs the side to move, castling and en passant information, and any history relevant to the rules. Two identical-looking boards do not necessarily offer identical legal continuations.

Now give the tree an objective. For example:

- **Mate:** the opponent is in check and has no legal move.
- **Reach a material threshold:** our stated material balance reaches a stated number at a stated assessment point.
- **Gain material:** the balance improves by a stated amount relative to the root position.

For material accounting, I can choose pawn = 1, knight = 3, bishop = 3, rook = 5, queen = 9, with kings outside the calculation. That makes the arithmetic precise. It does not turn the arithmetic into a proof that the game is won. A position can satisfy a material predicate while allowing an immediate recapture or mate.

If I intend to claim that I *keep* the gain, my objective and continuation have to establish that too. A phrase like “the position looks quiet” needs a definition before it can close a proof. For the complete proof in this article, we will use checkmate.

### One winning leaf is only the beginning

Suppose I find a line that ends in mate. That establishes a possible sequence. It becomes a forced tactic only when I can account for the opponent's choices along the way.

At **my turn**, I need at least one move that works. At **their turn**, my claim has to survive every legal response. My continuation may be different against different responses.

That gives us an **OR** at my nodes and an **AND** at the opponent's nodes. The proof is a branching strategy: I choose a move, they choose a reply, and I have an answer for each reply.

For an exact mate objective within a remaining budget of h plies, the rules for a certificate are:

| Position or node | What closes the proof |
| --- | --- |
| The opponent is already checkmated | Accept this leaf. |
| Another game-ending result has occurred | This branch fails the mate objective. |
| The budget is exhausted without mate | This branch has not established the objective. |
| My turn | One legal child has a completed proof within h − 1 plies. |
| Opponent's turn | There is at least one legal reply, and every legal child has a completed proof within h − 1 plies. |

The requirement that replies exist prevents an empty AND from accidentally treating stalemate as success. If I exhaust a declared search budget, that also does not prove the position cannot be won. It tells me what this bounded proof has established.

Why does the certificate work? Start at its leaves, where the objective has been checked. At my nodes, I can choose the certified child. At their nodes, whichever legal reply they choose has a certified continuation. Apply that reasoning back up the finite tree and it reaches the root.

I can handle several defenses with one argument if that argument really covers all of them. A defense I have simply left out remains a hole in the proof.

## 4. The precondition theorem

Here is the version I think we can actually rely on.

> **The precondition theorem — geometry of unchanged targets.**
>
> Suppose our legal move establishes a pin, skewer, sliding-piece fork, or knight fork involving two surviving enemy pieces. Any necessary relationship that depends only on those targets' square coordinates and the attacking movement pattern must already hold in the position immediately before our move.
>
> The relevant precondition therefore exists at least one ply before our move establishes the tactical relationship.

That is a conditional theorem. It does not say every relationship involved in the finished tactic exists beforehand. The attacker may have to move. A line may have to be cleared. A pawn may promote into the attacking piece.

It says the geometry of the **unchanged enemy targets** is already there.

The reason is simple. Our move does not relocate a surviving enemy piece. If the enemy king and queen are still on the board after our move, they are on the same squares as before it. This remains true when we capture some third piece, castle, or promote.

For a little notation, let s be the parent position and s′ the position after our move. Let T mean the particular tactical relationship, and let G be its necessary target geometry. For the relevant targets:

> **T(s′) implies G(s′). Their coordinates are unchanged, so G(s′) equals G(s). Therefore T(s′) implies G(s).**

For a promotion, use the movement pattern of the resulting piece in both evaluations of G. The theorem concerns a potential relationship between the targets, so that piece need not have existed on the earlier board.

### Proof by contradiction

Assume our move establishes T, but its necessary geometry G was absent one ply earlier.

Because T now exists, G must hold in the resulting position. Yet the target pieces have not moved, and G depends only on their square coordinates and the specified movement pattern. Its value therefore cannot have changed across our move.

G would have to be both present and absent for the same coordinates. That is the contradiction.

This is the extra step that makes “one ply earlier” legitimate. Showing that a pin requires alignment proves a same-position dependency. Showing that the target coordinates are unchanged carries that dependency back to the preceding node.

## 5. What “aligned” has to mean

The theorem is only as useful as its predicates. “Aligned” needs a definition appropriate to the tactic.

### Pins and skewers: a common line

For a sliding pin or skewer, the two enemy targets share a rank, file, or diagonal compatible with the attacking piece. In the finished pattern, the attacker and the two targets occupy one line in the required order.

For an **absolute pin**, one target stands between a slider and its own king. With no other obstruction on that segment, an off-line move that leaves the slider in place would expose the king. A **relative pin** has some other valuable target behind the front piece. The movement rules alone do not establish whether moving that piece is a bad trade.

For a **skewer**, the front target is attacked and the second target lies behind it. A king in front must have its check answered, but the full proof still has to inspect legal answers. A block, capture of the attacker, or another repair may prevent the hoped-for gain.

**Contradiction proof.** Assume our move pins or skewers two surviving targets that did not share the required line in the parent position. They occupy the same two squares after our move. They therefore still do not share that line. But the alleged pin or skewer requires that line. Impossible.

What follows is a precondition for the pattern. The open path, attacker placement, move legality, and eventual gain remain separate work.

An absolute pin also does not necessarily mean the pinned piece has no legal moves. It may be able to stay on the pin line or capture the pinning piece. The exact prohibited move is the one that leaves its king attacked.

### Sliding forks: a shared firing square

For forks, ordinary straight-line alignment is too narrow.

A rook on c3 can attack a target on c7 and another on h3. Those targets share neither a rank, a file, nor a diagonal. They meet the rook along different rays.

So the right geometric predicate is: **there is a square from which this kind of piece could attack both target squares on an otherwise empty board.** I will call it a shared firing square. The actual position must also provide the appropriate clear paths; the two targets must not screen one another.

**Contradiction proof.** Suppose our sliding piece forks two unchanged targets from square x after our move, but no shared firing square existed before it. The completed fork makes x a witness: its movement pattern reaches both targets. Their squares have not changed. x was therefore a geometric witness in the parent position too. That contradicts its supposed absence.

This condition can be weak. For a rook, targets on different ranks and files have the two rectangle corners as geometric intersections. The useful additional questions are whether our rook can legally reach an intersection, whether the attack paths are clear, and whether the fork achieves the objective. The geometry theorem does not answer those questions for us.

### Knight forks: a shared jump square

For a knight, I want “knight alignment” to mean something equally concrete: **there is a board square one knight jump away from each target.**

Take the set of squares from which a knight attacks the first target. Take the corresponding set for the second. If the sets intersect, the targets have a shared jump square.

**Contradiction proof.** Suppose our knight forks two unchanged targets from x, but their jump-square sets did not intersect beforehand. After the move, x is in both sets. The target coordinates are identical before and after, so both sets are identical too. Their intersection therefore already contained x. Contradiction.

The targets must be on the same color, since every knight attack from one square lands on the opposite color. Same color alone is insufficient: two distant squares can have no shared jump square.

The knight also has to get there legally. A shared jump square does not promise a one-move route from the knight's current location, and an active fork does not by itself promise a material win.

## 6. Why the timing qualification matters

My first formulation was broader: the precondition must always exist a ply before the tactic. That claim allows a counterexample.

Put a white king on e1, a white rook on d3, a black rook on e8, and a black king on a8. White is in check along the e-file. White can answer it with **1.Re3**. The white rook and king become aligned, and the rook becomes absolutely pinned, in that same move.

The rook was never pinned *without* alignment. Alignment and pinning arose together. The statement “a pin requires alignment” remains true; the unrestricted claim that alignment always arose earlier is false.

This is why the theorem talks about our move exploiting **surviving enemy targets**. In the counterexample, the moving side relocates one of the targets. The invariant used in the proof is absent.

The distinction gives us a useful sequence when the relationship is newly created: the opponent can put their pieces into the geometry; our subsequent move can exploit it. The theorem guarantees the geometry in the position before our activation. It makes no claim about how many plies it had existed before that.

## 7. Removing the guard: what actually has to come first

The same discipline matters for removing or distracting a defender.

The familiar picture is a target attacked once and defended once. If I can remove the defender while preserving the threat, perhaps I can take the target. That is a useful pattern to look for. It does not make “exactly one attacker and exactly one defender” a universal precondition.

A target might have several attackers or defenders. A nominal defender might be pinned and unable to make the relevant recapture. And the move that removes the guard can also create the attack.

I want to separate **geometric support** from an **effective guard**. Geometric support says a friendly piece controls the target square under its movement pattern. An effective guard has a legal response to the particular contemplated capture or threat. Whether that response defeats our objective is part of the branch proof. A defender count alone cannot establish it.

The guard lemma is narrower:

> **Guard dependency.** If an event removes a particular guard's existing defensive function, that function exists immediately before the event. The resulting loss of that function must then be checked in the new position.

**Contradiction proof.** Assume we have removed an existing guard of a target, but that piece had no relevant defensive function immediately beforehand. Then the event did not remove that function. The change may have opened a line, created a fork, or improved our position in some other way, but it cannot establish the claimed removal of an existing defense. That contradicts the description of the event.

This is a dependency built into what we mean by removing an existing guard. It does **not** prove that the target was already attacked before the guard disappeared.

### The attack can switch on during the removal

Here is a concrete example from the board menu. White has a rook on d1 and knight on d4. Black has a rook on d6, knight on f5, and king on h6. White's king is on h1.

The black knight guards the rook on d6. White's knight on d4 blocks White's rook, so the black rook currently has **zero White attackers**.

White plays **1.Nxf5+**. That move captures the guard, opens the d-file, and checks the black king. The rook on d6 now has **two White attackers**: the rook on d1 and the knight on f5. After any of the four legal king replies, White can take the rook with **2.Rxd6** (with check after **1…Kg6**).

The guarding relationship came first. The attack did not have to. Several things happened in the same move, and the proof needs to allow that.

### Distraction has its own timing

If I distract a guard, I may make an offer on my move, the opponent may move the guard on theirs, and I may take the target on my next move. The relevant dependency is immediately before the guard's departure. It does not require the full pattern to have existed an arbitrary number of plies earlier.

I also have to prove the departure or handle the refusal. “They will take the bait” is an unfinished branch. If the target moves, another guard takes over, a countercheck intervenes, or a recapture is still possible, that has to be resolved before I can accept the objective.

## 8. A complete little proof

Let's use a deliberately spare position so we can see the entire argument.

White has a king on g5 and rooks on a1 and c1. Black has only a king on h8. It is White's turn. The objective is **mate within three plies**: White moves, Black replies, White mates.

Our proposed first move is **1.Ra8+**. Black has exactly two legal replies:

| Black's reply | White's continuation | Terminal fact |
| --- | --- | --- |
| 1…Kh7 | 2.Rc7# | Black is in check and has no legal move. |
| 1…Kg7 | 2.Rc7# | Black is in check and has no legal move. |

The rook on a8 controls the eighth rank. The rook arriving on c7 checks along the seventh. White's king covers the relevant escapes to the sixth rank. There is no black piece that can block or capture a rook.

Those observations explain the mate. The explicit check that the legal reply set is empty certifies each terminal node.

The two branches establish the AND at Black's turn. That closes the chosen child at White's root, so the OR at the root is satisfied. We do not need to show that Ra8+ is White's only winning move.

For the three-ply objective, a branch that still needs a fourth ply has not closed. That is the value of specifying the claim before looking at the answer.

## 9. What I can take back to the board

The precondition theorem gives me a reason to inspect relationships before calculating moves. For a named tactic against fixed targets, the absence of its necessary geometry rules out immediate activation of that tactic.

Its presence gives me something to investigate. It does not certify success.

If the geometry is absent, a longer plan can still create it. I might force a king onto a line, draw a queen onto a forkable square, or induce a defender to move. So failure of a one-ply precondition must not erase every longer idea.

That suggests a small chain of work I can keep explicit:

| Current card | Fact or result | Action and next card |
| --- | --- | --- |
| Read the relationship | A relevant line or shared attack square exists | Retain that idea; go to Test the activation. |
| Test the activation | A candidate legally establishes the named pattern | Add that child; go to Answer the defenses. |
| Test the activation | The candidate is illegal, or does not establish the pattern | Reject this candidate for that stated reason; inspect another candidate or retire this immediate idea when exhausted. |
| Answer the defenses | A reply has a completed continuation satisfying the objective | Record that defense as covered; inspect the remaining defenses. |
| Answer the defenses | A reply defeats this candidate within the stated scope | Return to Test the activation; keep the refuting branch. |
| Settle the objective | The exact terminal predicate holds and the required branches are covered | Accept the certificate. |

This is the outline of a policy we can develop. It still needs explicit rules for requesting and ordering candidates and for any grouped treatment of defenses. Those decisions belong on the cards. The Oracle supplies the board facts; the cards specify what we do with them.

What I remember between steps is also explicit: the objective, the current card, the relationship I am pursuing, the moves I have tried, the defenses I have covered, and the reason an idea failed. That is the state of the argument.

For now, the thing I want to memorize is this:

> **Find the relationship. Test the move that activates it. Account for the replies. Check the objective.**

I want a small set of claims that survive being challenged. A pin needs a line. A fork needs a shared attack square. Removing a guard requires a guard. A forced tactic requires an answer to the opponent's choices.

And whenever I say something had to happen earlier, I need to identify what stayed unchanged across the move. That is the part of the proof I was missing.

<!-- Render the top Markdown source into the empty article mount. -->
<script>
(function renderMarkdownBlog(){
  'use strict';
  const source=document.getElementById('pc-markdown');
  const article=document.getElementById('pc-article');
  if(!source||!article)return;
  const element=(tag,className,text)=>{
    const node=document.createElement(tag);
    if(className)node.className=className;
    if(text!==undefined)node.textContent=text;
    return node;
  };
  try{
    article.innerHTML=marked.parse(source.textContent.trim(),{gfm:true,breaks:false});
    const title=article.querySelector(':scope > h1');
    const possibleSubtitle=title&&title.nextElementSibling;
    const subtitle=possibleSubtitle&&possibleSubtitle.matches('p')&&possibleSubtitle.querySelector('em')?possibleSubtitle:null;
    const possibleByline=(subtitle||title)&&((subtitle||title).nextElementSibling);
    const byline=possibleByline&&possibleByline.matches('p')&&possibleByline.querySelector('strong')?possibleByline:null;
    const titleText=title?title.textContent.trim():'Article';
    const author=byline?byline.textContent.split('·')[0].trim():'';
    document.title=titleText+(author?' — '+author:'');
    document.querySelector('meta[name="description"]').setAttribute('content',subtitle?subtitle.textContent.trim():titleText);
    article.setAttribute('aria-label',titleText);
    article.querySelectorAll('table').forEach(table=>{
      const wrap=element('div','pc-table-wrap');table.replaceWith(wrap);wrap.append(table);
    });
    const sections=Array.from(article.querySelectorAll(':scope > h2'));
    sections.forEach((heading,index)=>{if(!heading.id)heading.id='pc-section-'+(index+1);});
    const topline=element('nav','pc-topline');topline.setAttribute('aria-label','Article');
    const brand=element('span','pc-topline-brand');
    const mark=element('span','pc-topline-mark');mark.setAttribute('aria-hidden','true');
    brand.append(mark,document.createTextNode(author||titleText));topline.append(brand);
    if(sections.length){
      const jump=element('a','', 'Read the article ↓');jump.href='#'+sections[0].id;topline.append(jump);
    }
    article.prepend(topline);
    if(title){
      const hero=element('header','pc-hero');title.before(hero);
      if(subtitle)hero.append(element('div','pc-kicker',subtitle.textContent.split('·')[0].trim()));
      hero.append(title);
      if(subtitle){subtitle.classList.add('pc-deck');hero.append(subtitle);}
      if(byline){byline.classList.add('pc-byline');hero.append(byline);}
      if(sections.length){
        const contents=element('details','pc-contents');
        contents.append(element('summary','', 'In this article'));
        const nav=element('nav');nav.setAttribute('aria-label','Article sections');
        sections.forEach(section=>{
          const a=element('a','',section.textContent.trim());a.href='#'+section.id;nav.append(a);
        });
        contents.append(nav);hero.after(contents);
      }
    }
    const opening=article.querySelector(':scope > p');if(opening)opening.classList.add('pc-opening');
    const sourceHeading=Array.from(article.querySelectorAll(':scope > h3')).find(h=>/source.*notes/i.test(h.textContent));
    if(sourceHeading){
      let paragraph=sourceHeading.nextElementSibling;
      while(paragraph&&paragraph.tagName==='P'){paragraph.classList.add('pc-source-note');paragraph=paragraph.nextElementSibling;}
    }
    const footer=element('footer','pc-colophon');footer.append(element('span','',titleText));
    if(byline)footer.append(element('span','',byline.textContent.trim()));article.append(footer);
    article.dataset.markdownRendered='true';
    document.dispatchEvent(new CustomEvent('pc:markdown-rendered',{detail:{article}}));
  }catch(error){
    article.replaceChildren(element('p','pc-render-error','The article could not render. Its Markdown source is at the top of this file.'));
    article.dataset.markdownError=String(error.message);
    console.error('Markdown rendering failed:',error);
  }
})();

</script>

  const colors = {green:'#167567',teal:'#167567',accent:'#167567',gold:'#b58740',amber:'#b58740',red:'#b36b50',blue:'#3c7d96',ink:'#152e35',G:'#167567',Y:'#b58740',R:'#b36b50',B:'#3c7d96'};
  const paint = (value, fallback = '#167567') => colors[value] || (/^#[a-fA-F0-9]{6}$/.test(value || '') ? value : fallback);
  const glyphs = {p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
  const pieceNames = {p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
  const sideName = side => side === 'w' ? 'White' : 'Black';
  const sideOf = fen => fen.split(/\s+/)[1];
  const moveKey = move => typeof move === 'string' ? move : move.uci || (move.from + move.to + (move.promotion || ''));

  function rules(fen) {
    const api = global.PredicateChessDataV1;
    if (api && typeof api.engine === 'function') return api.engine(fen);
    const Chess = api && api.Chess || global.PredicateChessRulesV1 && global.PredicateChessRulesV1.Chess || global.Chess;
    if (!Chess) throw new Error('The embedded chess rules library is unavailable.');
    return new Chess(fen);
  }

  function boardPieces(fen) {
    const pieces = [];
    fen.split(/\s+/)[0].split('/').forEach((rank, row) => {
      let file = 0;
      for (const item of rank) {
        if (/[1-8]/.test(item)) file += Number(item);
        else { pieces.push({piece:item, square:String.fromCharCode(97 + file) + (8 - row)}); file++; }
      }
    });
    return pieces;
  }

  function board(node, uid, orientation) {
    const pieces = boardPieces(node.fen), side = sideOf(node.fen), annotation = node.annotations;
    const point = square => {
      if (!/^[a-h][1-8]$/.test(square || '')) return null;
      const file = square.charCodeAt(0) - 97, rank = Number(square[1]) - 1;
      return {x:32 + (orientation === 'black' ? 7 - file : file) * 56 + 28,
        y:16 + (orientation === 'black' ? rank : 7 - rank) * 56 + 28};
    };
    const label = pieces.map(p => `${p.piece === p.piece.toUpperCase() ? 'White' : 'Black'} ${pieceNames[p.piece.toLowerCase()]} ${p.square}`).join(', ');
    let html = `<svg viewBox="0 0 500 490" role="img" aria-label="${escape(label)}. ${sideName(side)} to move. ${escape(orientation)} at bottom." xmlns="http://www.w3.org/2000/svg"><title>${escape(node.san || 'Starting position')}</title><defs><clipPath id="${uid}-clip"><rect x="32" y="16" width="448" height="448" rx="5"/></clipPath></defs><g clip-path="url(#${uid}-clip)">`;
    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) html += `<rect x="${32 + col * 56}" y="${16 + row * 56}" width="56" height="56" fill="${(row + col) % 2 ? '#8daf9e' : '#eeeede'}"/>`;
    if (/^[a-h][1-8][a-h][1-8]/.test(node.uci || '')) for (const square of [node.uci.slice(0,2), node.uci.slice(2,4)]) {
      const p = point(square); html += `<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`;
    }
    for (const mark of annotation.highlights.squares || []) {
      const item = typeof mark === 'string' ? {square:mark} : mark, p = point(item.square || item.sq);
      if (p) html += `<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${paint(item.color,'#b58740')}" fill-opacity=".12" stroke="${paint(item.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for (const p of pieces) {
      const pt = point(p.square), white = p.piece === p.piece.toUpperCase();
      html += `<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()]}</text>`;
    }
    for (const arrow of annotation.highlights.arrows || []) {
      const p = point(arrow.from), q = point(arrow.to);
      if (!p || !q) continue;
      const dx = q.x-p.x, dy = q.y-p.y, len = Math.hypot(dx,dy);
      if (!len) continue;
      const ux = dx/len, uy = dy/len, end = {x:q.x-ux*17,y:q.y-uy*17}, base = {x:end.x-ux*11,y:end.y-uy*11};
      html += `<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${paint(arrow.color)}" stroke-width="5" stroke-linecap="round" opacity=".88"/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${paint(arrow.color)}" opacity=".95"/>`;
    }
    html += '</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for (let i = 0; i < 8; i++) html += `<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(orientation==='black'?104-i:97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${orientation==='black'?i+1:8-i}</text>`;
    return html + '</svg>';
  }

  function normalizeGame(raw, source) {
    const headers = raw.headers || raw.tags || {};
    if (headers.Schema !== VERSION) throw new Error(`Unsupported Schema ${JSON.stringify(headers.Schema || '(missing)')}; expected ${VERSION}.`);
    const view = (headers.View || 'line').toLowerCase();
    if (!['line','proof'].includes(view)) throw new Error(`Unsupported View ${JSON.stringify(headers.View)}.`);
    const orientation = (headers.Orientation || 'white').toLowerCase();
    if (!['white','black'].includes(orientation)) throw new Error('Orientation must be "white" or "black".');
    const inputNodes = Array.isArray(raw.nodes) ? raw.nodes : raw.nodes instanceof Map ? Array.from(raw.nodes.values()) : Object.values(raw.nodes || {});
    const rawMap = new Map(inputNodes.map(n => [String(n.id),n]));
    const rootValue = raw.root || raw.rootId || inputNodes[0];
    const sourceRoot = typeof rootValue === 'object' ? rootValue : rawMap.get(String(rootValue));
    if (!sourceRoot) throw new Error('The PGN loader returned no starting position.');
    const nodes = [], nodeMap = new Map(), aliases = new Map(), active = new Set();
    function visit(value, parent, index) {
      const input = typeof value === 'object' ? value : rawMap.get(String(value));
      if (!input) throw new Error('The PGN tree contains an unknown child.');
      const id = String(input.id == null ? parent ? parent.id + '.' + index : 'root' : input.id);
      if (active.has(id) || nodeMap.has(id)) throw new Error(`The PGN tree reuses node ${id}.`);
      const branchIntro = (input.startingComments || []).join('\n\n');
      if (/\[%/.test(branchIntro)) throw new Error('Place board annotations after SAN; initial comments belong before the first mainline move.');
      const node = {id,fen:input.fen,san:input.san || input.move && input.move.san || null,uci:input.uci || input.move && moveKey(input.move) || null,
        ply:parent ? parent.ply+1 : 0,parent,children:[],comments:input.rawComments || input.comments || [],branchIntro,nags:input.nags || [],annotations:null};
      if (!node.fen) throw new Error(`Node ${id} has no replayed FEN.`);
      const annotationAPI = global.PredicateChessAnnotationsV1;
      if (!annotationAPI) throw new Error('The embedded PGN annotation interpreter is unavailable.');
      node.annotations = annotationAPI.parse(node.comments,{fen:node.fen,engine:rules(node.fen)});
      node.annotations.highlights ||= {squares:[],arrows:[]};
      node.annotations.facts ||= []; node.annotations.stable ||= node.annotations.invariants || [];
      node.annotations.created ||= []; node.annotations.removed ||= [];
      if (node.annotations.alias) {
        if (aliases.has(node.annotations.alias)) throw new Error(`Repeated node alias ${node.annotations.alias}.`);
        aliases.set(node.annotations.alias,node);
      }
      nodeMap.set(id,node); nodes.push(node); active.add(id);
      node.children = (input.children || []).map((child,i) => visit(child,node,i));
      active.delete(id); return node;
    }
    const root = visit(sourceRoot,null,0);
    const game = {headers,view,orientation,root,nodes,nodeMap,aliases,source,sourceId:headers.Id || `block-${++serial}`};
    if (view === 'proof') {
      if ((headers.Goal || '').toLowerCase() !== 'mate') throw new Error('Proof View currently requires Goal "mate".');
      if (!/^(white|black)$/i.test(headers.Prover || '')) throw new Error('Proof View requires Prover "white" or "black".');
      if (!/^\d+$/.test(headers.MaxPlies || '') || Number(headers.MaxPlies) > 1000) throw new Error('Proof View requires MaxPlies as an integer from 0 to 1000.');
      game.prover = headers.Prover.toLowerCase() === 'white' ? 'w' : 'b';
      game.maxPlies = Number(headers.MaxPlies);
      if (headers.OmitNode && !aliases.has(headers.OmitNode)) throw new Error(`OmitNode refers to missing node alias ${headers.OmitNode}.`);
      game.omitNode = headers.OmitNode ? aliases.get(headers.OmitNode) : null;
    }
    return game;
  }

  function state(node) {
    if (!node.positionState) {
      const engine = rules(node.fen), moves = engine.moves({verbose:true});
      node.positionState = {engine,moves,keys:new Set(moves.map(moveKey)),check:engine.isCheck(),mate:engine.isCheckmate(),side:engine.turn()};
    }
    return node.positionState;
  }

  function numberedMove(node) {
    if (!node.parent) return 'Start';
    const fields = node.parent.fen.split(/\s+/), fullmove = fields[5] || Math.floor((node.ply+1)/2);
    const symbols = {1:'!',2:'?',3:'!!',4:'??',5:'!?',6:'?!',10:'=',14:'⩲',15:'⩱',16:'±',17:'∓',18:'+−',19:'−+'};
    const nags = node.nags.length ? ' ' + node.nags.map(n => symbols[n] || '$' + n).join(' ') : '';
    return `${fullmove}${fields[1] === 'w' ? '.' : '…'} ${node.san}${nags}`;
  }

  function factsMarkup(facts, kind) {
    if (!facts || !facts.length) return '';
    return `<ul class="pc-facts">${facts.map(fact => {
      if (typeof fact === 'string') return `<li class="pc-fact ${kind==='created'?'pc-created':kind==='removed'?'pc-absent':''}"><span>${escape(fact)}</span></li>`;
      const value = fact.value, detail = typeof value === 'boolean' ? value ? 'True' : 'False' : Array.isArray(value) ? value.join(', ') : value;
      return `<li class="pc-fact ${value===false?'pc-absent':''}"><span class="pc-label-value">${escape(fact.label || fact.predicate)}${detail == null ? '' : `: <strong>${escape(detail)}</strong>`}</span></li>`;
    }).join('')}</ul>`;
  }

  function selectedDetails(game,node,proofResult) {
    const a = node.annotations, p = state(node);
    const basic = [{label:'Side to move',value:sideName(p.side)},{label:`${sideName(p.side)} is in check`,value:p.check},
      {label:'Legal moves',value:p.moves.length}];
    if (p.mate) basic.push({label:`${sideName(p.side)} is checkmated`,value:true});
    let html = `<div class="pc-move-label">${node.parent?'After the replayed move':'At the starting node'}</div><div class="pc-move"><span class="pc-san">${node.parent?escape(numberedMove(node)):'Before'}</span><span class="pc-ply">Ply ${node.ply}</span></div>`;
    if (node.branchIntro) html += `<div class="pc-observation pc-comment-lines"><strong>Variation note.</strong> ${escape(node.branchIntro)}</div>`;
    if (a.caption) html += `<p class="pc-caption pc-comment-lines">${escape(a.caption)}</p>`;
    html += `<section class="pc-fact-section"><h4 class="pc-fact-title">Computed position facts</h4>${factsMarkup([...basic,...a.facts])}</section>`;
    for (const [key,title] of [['stable',node.parent?'What stays fixed':'Already in place'],['created','What this move creates'],['removed','What this move removes']]) {
      if (a[key].length) html += `<section class="pc-fact-section"><h4 class="pc-fact-title">${title}<span class="pc-authored-label">Author’s temporal notes</span></h4>${factsMarkup(a[key],key)}</section>`;
    }
    if (a.note || a.observation) html += `<div class="pc-observation pc-comment-lines">${escape(a.note || a.observation)}</div>`;
    if (proofResult) html += `<div class="pc-proof-node-reason"><strong>${escape(proofResult.status[0].toUpperCase()+proofResult.status.slice(1))}.</strong> ${escape(proofResult.reason)}</div>`;
    return html;
  }

  function fenMarkup(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sourceMarkup(source) { return `<details class="pc-source"><summary>Source PGN &amp; annotations</summary><pre>${escape(source)}</pre></details>`; }
  function metadata(game,includeDescription) {
    return `${includeDescription&&game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}${game.headers.Objective?`<div class="pc-metadata"><span class="pc-objective">${escape(game.headers.Objective)}</span></div>`:''}${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}`;
  }
  function metaMarkup(node,orientation) {
    return `<span class="pc-side" data-side="${sideOf(node.fen)}">${sideName(sideOf(node.fen))} to move</span><button class="pc-control pc-flip" data-action="flip" aria-label="Flip board orientation" title="${escape(orientation)} at bottom">Flip board</button>`;
  }
  const controls = '<nav class="pc-controls" aria-label="Position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav>';

  function lineWidget(mount,games,uid) {
    let gameIndex = 0, game = games[0], selected = game.root, orientation = game.orientation;
    const choices = new Map();
    const gallery = games.length > 1;
    mount.dataset.pcWidget = 'line';
    mount.innerHTML = `<header class="pc-header"><div class="pc-eyebrow">Worked positions · replayed PGN</div><h3>${escape(gallery?game.headers.GroupTitle || game.headers.Group:game.headers.Title || 'Worked position')}</h3>${(gallery?game.headers.GroupDescription:game.headers.Description)?`<p class="pc-intro">${escape(gallery?game.headers.GroupDescription:game.headers.Description)}</p>`:''}${gallery?`<div class="pc-selection"><label class="pc-select-label" for="${uid}-example">Explore</label><select id="${uid}-example" data-action="example" aria-label="Choose a tactical example">${games.map((g,i)=>`<option value="${i}">${escape(g.headers.Title || g.sourceId)}</option>`).join('')}</select></div>`:''}<div data-role="objective"></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<nav class="pc-step-nav" data-role="steps" aria-label="Positions on the selected line"></nav><div class="pc-branches" data-role="branches"></div><div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><div data-role="variations"></div><div data-role="source"></div><footer class="pc-footer">Moves are replayed from the Markdown PGN under the rules of chess. Position facts are computed from the displayed board; temporal notes are written by the author.</footer>`;
    const get = role => mount.querySelector(`[data-role="${role}"]`);
    function choose(node) {
      selected = node;
      for (let n = node; n.parent; n = n.parent) choices.set(n.parent.id,n.id);
      draw();
    }
    function nextChild(node) { return node.children.find(c => c.id === choices.get(node.id)) || node.children[0]; }
    function route() {
      const path = [], visited = new Set();
      for (let n=game.root;n && !visited.has(n.id);n=nextChild(n)) { path.push(n); visited.add(n.id); }
      return path;
    }
    function tree(node) {
      return `<li><button class="pc-node" data-node="${escape(node.id)}" aria-current="${selected===node?'true':'false'}" aria-label="Go to ${escape(numberedMove(node))}"><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-kind">${node.parent?'PLY '+node.ply:'ROOT'}</span></button>${node.children.length?`<ul class="pc-children">${node.children.map(tree).join('')}</ul>`:''}</li>`;
    }
    function draw() {
      mount.dataset.example=game.sourceId;mount.dataset.step=String(selected.ply);mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.orientation=orientation;
      get('objective').innerHTML=metadata(game,gallery);
      get('meta').innerHTML=metaMarkup(selected,orientation);
      get('board').innerHTML=board(selected,uid,orientation);
      get('detail').innerHTML=selectedDetails(game,selected);
      get('fen').innerHTML=fenMarkup(selected.fen);
      const path=route();mount.dataset.stepCount=String(path.length);
      get('steps').innerHTML=path.map(n=>`<button class="pc-step" data-node="${escape(n.id)}" ${n===selected?'aria-current="step"':''} aria-label="Go to ${escape(numberedMove(n))}">${escape(numberedMove(n))}</button>`).join('');
      get('branches').innerHTML=selected.children.length>1?`<label for="${uid}-branch">Choose the next move</label><select id="${uid}-branch" data-action="branch" aria-label="Choose the next variation">${selected.children.map(child=>`<option value="${escape(child.id)}" ${nextChild(selected)===child?'selected':''}>${escape(numberedMove(child))}</option>`).join('')}</select>`:game.nodes.length===1?'<p class="pc-empty-line">Starting position · no moves in this block</p>':'';
      const hadOpen=get('variations').querySelector('details')?.open;
      get('variations').innerHTML=game.nodes.some(n=>n.children.length>1)?`<details class="pc-source pc-branch-tree" ${hadOpen?'open':''}><summary>All lines &amp; variations</summary><div class="pc-tree pc-tree-list"><ul>${tree(game.root)}</ul></div></details>`:'';
      const sourceOpen=get('source').querySelector('details')?.open;
      get('source').innerHTML=sourceMarkup(game.source);if(sourceOpen)get('source').querySelector('details').open=true;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!selected.children.length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.node){const node=game.nodeMap.get(button.dataset.node);if(node)choose(node);return;}
      if(button.dataset.action==='previous'&&selected.parent)choose(selected.parent);
      else if(button.dataset.action==='next'&&selected.children.length)choose(nextChild(selected));
      else if(button.dataset.action==='reset'){choices.clear();choose(game.root);}
      else if(button.dataset.action==='flip'){orientation=orientation==='white'?'black':'white';draw();}
    });
    mount.addEventListener('change',event=>{
      if(event.target.matches('[data-action="example"]')){gameIndex=Number(event.target.value);game=games[gameIndex];selected=game.root;orientation=game.orientation;choices.clear();draw();}
      else if(event.target.matches('[data-action="branch"]')){choices.set(selected.id,event.target.value);draw();}
    });
    draw();mount.dataset.pcReady='true';
  }

  /* Evaluate only the authored proof tree plus an exhaustive one-ply mate test.
     A missing subtree is unresolved. Duplicate PGN edges never count as different defenses. */
  function evaluateProof(game,omitted) {
    const results=new Map();
    function visit(node) {
      if(results.has(node.id))return results.get(node.id);
      const p=state(node),remaining=game.maxPlies-node.ply;
      let result={status:'unproved',reason:'This position has no completed continuation for the objective.'};
      const finish=()=>{results.set(node.id,result);return result;};
      if(omitted&&node===game.omitNode){result.reason='This continuation has been deliberately withheld.';return finish();}
      if(node.ply>game.maxPlies){result={status:'refuted',reason:'This node is beyond the stated ply deadline.'};return finish();}
      if(p.mate){result=p.side!==game.prover?{status:'proved',reason:`Checkmate is verified at ply ${node.ply}, within the stated deadline.`}:{status:'refuted',reason:'The proving side is checkmated.'};return finish();}
      if(remaining===0){result={status:'refuted',reason:'The ply deadline has been reached without the required checkmate.'};return finish();}
      if(!p.moves.length){result={status:'refuted',reason:'There are no legal moves, and the position is not checkmate.'};return finish();}
      const groups=new Map();
      for(const child of node.children){
        if(!p.keys.has(child.uci))throw new Error(`The replayed move ${child.san || child.uci} is not a legal child of ${node.id}.`);
        if(!groups.has(child.uci))groups.set(child.uci,[]);
        groups.get(child.uci).push(visit(child));
      }
      const moveStates=new Map();
      for(const [uci,entries]of groups)moveStates.set(uci,entries.some(x=>x.status==='proved')?'proved':entries.some(x=>x.status==='refuted')?'refuted':'unproved');
      const states=Array.from(moveStates.values()),covered=states.filter(s=>s==='proved').length;
      result.total=p.keys.size;result.recorded=groups.size;result.covered=covered;
      if(p.side===game.prover){
        if(states.includes('proved')){result.status='proved';result.reason='One legal choice has a completed proof of the objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='refuted')){result.status='refuted';result.reason='Every legal choice is covered and fails the bounded objective.';}
        else if(remaining===1){
          if(node.immediateMates===undefined){
            let mates=0;
            for(const move of p.moves){const next=rules(node.fen);next.move({from:move.from,to:move.to,promotion:move.promotion});if(next.isCheckmate())mates++;}
            node.immediateMates=mates;
          }
          result.checked=p.moves.length;result.matingMoves=node.immediateMates;
          if(node.immediateMates===0){result.status='refuted';result.reason=`The complete one-ply check examined all ${p.moves.length} legal moves. Immediate mating moves: 0. The deadline cannot be met.`;}
          else result.reason=`${node.immediateMates} immediate mating move${node.immediateMates===1?' exists':'s exist'}, but no completed authored continuation proves this node.`;
        }else result.reason='The shown choices do not prove the objective. Unwritten legal choices remain unresolved.';
      }else{
        if(states.includes('refuted')){result.status='refuted';result.reason='A legal opponent reply has a completed refutation of the bounded objective.';}
        else if(groups.size===p.keys.size&&states.every(s=>s==='proved')){result.status='proved';result.reason=`All ${p.keys.size} distinct legal opponent replies have a completed answer.`;}
        else result.reason=`${covered} of ${p.keys.size} distinct legal opponent replies have a completed answer. Every remaining defense must still be covered.`;
      }
      return finish();
    }
    visit(game.root);
    for (const node of game.nodes) visit(node);
    return {status:results.get(game.root.id).status,results};
  }

  function proofWidget(mount,game,uid) {
    let selected=game.root,orientation=game.orientation,omitted=false,evaluation;
    mount.dataset.pcWidget='proof';mount.dataset.example=game.sourceId;
    mount.innerHTML=`<header class="pc-header"><div class="pc-eyebrow">A bounded AND / OR proof · replayed PGN</div><h3>${escape(game.headers.Title || 'Trace every defense')}</h3>${game.headers.Description?`<p class="pc-intro">${escape(game.headers.Description)}</p>`:''}<div class="pc-proof-options"><span class="pc-objective">${escape(game.headers.Objective || `Mate within ${game.maxPlies} plies`)}</span>${game.omitNode?'<label class="pc-switch-label"><input type="checkbox" data-action="omit-defense" aria-label="Leave one defense open"><span>Leave one defense open</span></label>':''}</div>${game.headers.Scope?`<p class="pc-scope">${escape(game.headers.Scope)}</p>`:''}<p class="pc-limits">${sideName(game.prover)} proves the objective. One choice suffices on its turn (OR); every legal opposing reply needs an answer (AND). Deadline: ${game.maxPlies} plies.</p></header><div class="pc-proof-verdict" data-role="verdict" aria-live="polite"></div><div class="pc-main pc-proof-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div>${controls}<div class="pc-proof-selection" data-role="selection" aria-live="polite"></div><div data-role="fen"></div></div><div class="pc-tree-panel"><div class="pc-tree-title"><span>Select a node</span><span class="pc-inline-count" data-role="count"></span></div><div class="pc-tree pc-tree-list" data-role="tree"></div><div class="pc-coverage" data-role="coverage"></div></div></div>${sourceMarkup(game.source)}<footer class="pc-footer">The proof checker verifies the replayed positions, actual checkmate, and unique legal reply coverage. It also exhausts legal moves when the proving side has one ply left. An unwritten continuation stays unproved; the PGN result and author’s notes do not establish a proof.</footer>`;
    const get=role=>mount.querySelector(`[data-role="${role}"]`);
    function hidden(node){for(let n=node.parent;n;n=n.parent)if(omitted&&n===game.omitNode)return true;return false;}
    function kind(node){const p=state(node);if(p.mate)return 'MATE';if(node.ply>=game.maxPlies)return 'BOUND';return p.side===game.prover?'OR':'AND';}
    function visibleChildren(node){return omitted&&node===game.omitNode?[]:node.children;}
    function tree(node){
      const result=evaluation.results.get(node.id)||{status:'unproved'},label=node.annotations.alias || node.id,k=kind(node),open=omitted&&node===game.omitNode;
      let subtitle=open?'Continuation withheld':state(node).mate?'Checkmate verified':k==='AND'?`${result.covered || 0} / ${state(node).keys.size} legal replies proved`:k==='OR'?'One completed choice suffices':'Ply deadline';
      const kids=visibleChildren(node);
      return `<li><button class="pc-node ${state(node).mate?'pc-leaf':''} ${open?'pc-omitted':''}" data-node="${escape(label)}" data-internal-node="${escape(node.id)}" data-proof-node-status="${result.status}" aria-current="${selected===node?'true':'false'}" aria-label="Inspect ${escape(numberedMove(node))}${open?', continuation withheld':''}"><span><span class="pc-node-title">${escape(numberedMove(node))}</span><span class="pc-node-subtitle">${escape(subtitle)}</span></span><span class="pc-node-kind">${open?'OPEN':k}</span></button>${kids.length?`<ul class="pc-children">${kids.map(tree).join('')}</ul>`:''}</li>`;
    }
    function focusDefense(){
      let n=game.root;
      while(n){if(state(n).side!==game.prover&&state(n).moves.length)return n;n=n.children[0];}
      return null;
    }
    function draw(){
      if(hidden(selected))selected=game.omitNode;
      evaluation=evaluateProof(game,omitted);
      const rootResult=evaluation.results.get(game.root.id),selectedResult=evaluation.results.get(selected.id)||{status:'unproved',reason:'This continuation is not part of the visible proof.'};
      const defense=focusDefense(),defenseResult=defense&&evaluation.results.get(defense.id),covered=defenseResult?.covered || 0,total=defense?state(defense).keys.size:0;
      mount.dataset.proofStatus=evaluation.status;mount.dataset.selectedNode=selected.annotations.alias || selected.id;mount.dataset.step=String(selected.ply);mount.dataset.coveredReplies=String(covered);mount.dataset.totalReplies=String(total);mount.dataset.covered=String(covered);mount.dataset.total=String(total);mount.dataset.orientation=orientation;
      get('verdict').dataset.proofStatus=evaluation.status;
      get('verdict').innerHTML=`<span class="pc-verdict-mark" aria-hidden="true">${evaluation.status==='proved'?'✓':evaluation.status==='refuted'?'×':'?'}</span><div><div class="pc-verdict-title">The root is ${evaluation.status}</div><div class="pc-verdict-explanation">${escape(rootResult.reason)}</div></div>`;
      get('meta').innerHTML=metaMarkup(selected,orientation);get('board').innerHTML=board(selected,uid,orientation);
      get('selection').innerHTML=selectedDetails(game,selected,selectedResult);get('fen').innerHTML=fenMarkup(selected.fen);
      get('tree').innerHTML=`<ul>${tree(game.root)}</ul>`;
      get('count').textContent=`${game.nodes.length} replayed positions`;
      const selectedState=state(selected),isOpponent=selectedState.side!==game.prover;
      get('coverage').innerHTML=`<strong>Selected node: ${escape(numberedMove(selected))}.</strong> ${escape(selectedResult.reason)}${isOpponent&&selectedState.moves.length?`<br>Distinct legal replies: ${selectedState.moves.map(m=>escape(m.san)).join(', ')}.`:''}`;
      mount.querySelector('[data-action="previous"]').disabled=!selected.parent;
      mount.querySelector('[data-action="next"]').disabled=!visibleChildren(selected).length;
    }
    mount.addEventListener('click',event=>{
      const button=event.target.closest('button');if(!button||!mount.contains(button))return;
      if(button.dataset.internalNode){selected=game.nodeMap.get(button.dataset.internalNode)||selected;draw();return;}
      if(button.dataset.action==='previous'&&selected.parent)selected=selected.parent;
      else if(button.dataset.action==='next'&&visibleChildren(selected).length)selected=visibleChildren(selected)[0];
      else if(button.dataset.action==='reset')selected=game.root;
      else if(button.dataset.action==='flip')orientation=orientation==='white'?'black':'white';
      draw();
    });
    mount.addEventListener('change',event=>{if(event.target.matches('[data-action="omit-defense"]')){omitted=event.target.checked;draw();}});
    draw();mount.dataset.pcReady='true';
  }

  function errorWidget(mount,source,error) {
    const title=source.match(/^\[Title\s+"((?:\\.|[^"\\])*)"\]/m)?.[1] || source.match(/^\[Id\s+"((?:\\.|[^"\\])*)"\]/m)?.[1] || 'Chess block';
    mount.dataset.pcWidget='error';mount.dataset.pcError='true';mount.setAttribute('role','alert');
    mount.innerHTML=`<div class="pc-error"><h3 class="pc-error-title">${escape(title)} could not be rendered</h3><p class="pc-error-message">${escape(error.message || error)}</p></div>${sourceMarkup(source)}`;
  }

  function render(root) {
    root=root || document.getElementById('pc-article');if(!root)return [];
    const pageIds=new Set();
    for(const existing of root.querySelectorAll('[data-pc-source-ids]')){
      try{for(const id of JSON.parse(existing.dataset.pcSourceIds))pageIds.add(id);}catch(_){/* Ignore unrelated or externally edited attributes. */}
    }
    const entries=Array.from(root.querySelectorAll('pre > code.language-chess')).map(code=>({pre:code.parentElement,source:code.textContent}));
    for(const entry of entries){
      try{
        const api=global.PredicateChessDataV1;if(!api)throw new Error('The embedded PGN loader is unavailable.');
        const raw=typeof api.parseBlock==='function'?api.parseBlock(entry.source):api.parseGame(entry.source);
        entry.game=normalizeGame(raw,entry.source);
        const id=entry.game.headers.Id;
        if(id){
          if(pageIds.has(id))throw new Error(`Duplicate Id ${JSON.stringify(id)}. Every chess block on a page needs a distinct Id.`);
          pageIds.add(id);
        }
      }catch(error){entry.error=error;}
    }
    const rendered=[];
    for(let i=0;i<entries.length;i++){
      const entry=entries[i];if(!entry.pre.isConnected)continue;
      const mount=document.createElement('section');mount.className='pc-widget';
      if(entry.error){entry.pre.replaceWith(mount);errorWidget(mount,entry.source,entry.error);rendered.push(mount);continue;}
      const grouped=[entry],game=entry.game;
      if(game.view==='line'&&game.headers.Group){
        let previous=entry;
        while(i+1<entries.length){
          const next=entries[i+1];
          if(next.error||!next.game||next.game.view!=='line'||next.game.headers.Group!==game.headers.Group||previous.pre.nextElementSibling!==next.pre)break;
          grouped.push(next);previous=next;i++;
        }
      }
      entry.pre.replaceWith(mount);for(const removed of grouped.slice(1))removed.pre.remove();
      try{if(game.view==='proof')proofWidget(mount,game,'pc-runtime-'+(++serial));else lineWidget(mount,grouped.map(x=>x.game),'pc-runtime-'+(++serial));}
      catch(error){errorWidget(mount,grouped.map(x=>x.source).join('\n\n'),error);}
      mount.dataset.pcSourceIds=JSON.stringify(grouped.map(x=>x.game.headers.Id).filter(Boolean));
      rendered.push(mount);
    }
    return rendered;
  }
  global.PredicateChessRendererV1=Object.freeze({version:VERSION,render,evaluateProof,normalizeGame});
})(typeof window==='undefined'?globalThis:window);

</script>
<script>
(function initializePredicateChess(){
  function render(event){
    const root=event && event.detail && event.detail.article || document.getElementById('pc-article');
    if(root) PredicateChessRendererV1.render(root);
  }
  document.addEventListener('pc:markdown-rendered',render);
  render();
})();
</script>

</body>
