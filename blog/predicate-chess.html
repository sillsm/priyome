# Predicate Chess

*Part I · Facts, proof trees, and the precondition theorem*

**Max Sills · October 5, 2026**

I've been trying to build a chess system I can actually learn. I want to look at a position, recognize a few facts, and use those facts to decide what deserves calculation. Then I want to be able to explain every step.

The project has gotten tangled. We need some truths we can go back to.

So I'm starting over at the foundation. How do the pieces move? What does it mean to attack something? What are we claiming when we say a tactic works? And what has to be true on the board before a particular tactic can happen?

The idea is to solve tactics as little proofs. A position gives us facts. A legal move takes us to another position, with another set of facts. We follow the branches until we can establish the objective we actually set out to prove.

The first theorem is going to be deliberately small. It says that certain relationships between the opponent's pieces must already exist before our move can exploit them. The useful part is being precise about which relationships, and what “before” means.

## 1. The ground floor

The movement rules are our starting axioms. Here is the short version of how the pieces move.[2]

| Piece | Movement |
| --- | --- |
| Rook | Any distance along a rank or file. |
| Bishop | Any distance along a diagonal. |
| Queen | Rook or bishop movement. |
| Knight | Two squares along one axis and one along the other; it can jump. |
| King | One square in any direction, subject to safety. |
| Pawn | Forward into an empty square; optionally two from its starting rank if clear. Captures diagonally forward. |

Sliding pieces cannot pass through occupied squares. Ordinary captures replace an enemy piece; friendly pieces cannot share a square. On its last rank, a pawn promotes to a same-color queen, rook, bishop, or knight.[2]

Two special moves need their own rules:[1]

- **Castling:** The king moves two squares toward a rook, which moves to the crossed square. Both must be unmoved, the intervening squares empty, and the king’s starting, transit, and destination squares safe.
- **En passant:** Immediately after an adjacent enemy pawn advances two squares, a pawn may capture it as if it had advanced one, subject to king safety.

**Check** means the king is attacked. A legal move must leave your king safe. **Checkmate** means check with no legal reply. No legal move without check is **stalemate**, a draw. Kings are never captured.[1]

There is a subtle distinction we need to preserve: a pinned piece still attacks squares for king safety, even when moving there would be illegal. “Attacks” and “can legally capture” are different predicates.[1]

For this project, I call the part that reads those facts the **Oracle**. It recognizes what is on the board. When I am playing, I have to learn to do that recognition myself.

## 2. A position is a collection of facts

A **predicate** is a statement we can evaluate at a position. It has to say something definite enough to be true or false.

| Predicate | The fact it records |
| --- | --- |
| White is in check | White's king is currently attacked. |
| The black queen and king share a file | Their file coordinates match. |
| There is a clear rook line from a1 to a7 | The squares strictly between the endpoints are empty. |
| The knight has a legal move to e6 | That move satisfies the movement and king-safety rules. |
| Black has no legal reply | The legal move set is empty. |
| White's material balance is at least +3 | A stated accounting convention reaches that threshold. |

“This is the best move” would require a different kind of argument. “The queen and king share a file” is something I can look at and check.

These verified facts are the local premises of the proof. We can think of them as the axioms we have available at that node. The distinction is that the rules remain fixed while the local facts change. “White is in check” can become false after one legal move. We do not change the rules to make that happen.

The Oracle can also be wrong. A proof built on a misread diagonal is only a proof of what would follow from that mistaken premise. The connection back to the actual board has to be checked.

Sometimes the useful fact is negative: the line is blocked; the knight cannot reach the fork square; the candidate leaves our king in check. I will call a fact that blocks a proposed step an **anti-predicate**. It is an explicit reason to reject that step. If the Oracle reports only selected facts, an omitted predicate is still unknown. Rejecting a move requires a checked negative, not an omission from the list.

I also want to distinguish three levels of description. Two targets may have the right **geometry**. A piece may actually **attack** them. A legal sequence may **win something**. Each is a separate claim, and each needs its own support.

## 3. What we are proving on the tree

Take a position and draw an edge for each legal move. Every edge is one **ply**: one move by one player. The position after that move is the next node.

Each node carries its position and its predicates. A complete state also needs the side to move, castling and en passant information, and any history relevant to the rules. Two identical-looking boards do not necessarily offer identical legal continuations.

Now give the tree an objective. For example:

- **Mate:** the opponent is in check and has no legal move.
- **Reach a material threshold:** our stated material balance reaches a stated number at a stated assessment point.
- **Gain material:** the balance improves by a stated amount relative to the root position.

For material accounting, I can choose pawn = 1, knight = 3, bishop = 3, rook = 5, queen = 9, with kings outside the calculation. That makes the arithmetic precise. It does not turn the arithmetic into a proof that the game is won. A position can satisfy a material predicate while allowing an immediate recapture or mate.

If I intend to claim that I *keep* the gain, my objective and continuation have to establish that too. A phrase like “the position looks quiet” needs a definition before it can close a proof. For the complete proof in this article, we will use checkmate.

### One winning leaf is only the beginning

Suppose I find a line that ends in mate. That establishes a possible sequence. It becomes a forced tactic only when I can account for the opponent's choices along the way.

At **my turn**, I need at least one move that works. At **their turn**, my claim has to survive every legal response. My continuation may be different against different responses.

That gives us an **OR** at my nodes and an **AND** at the opponent's nodes. The proof is a branching strategy: I choose a move, they choose a reply, and I have an answer for each reply.

For an exact mate objective within a remaining budget of h plies, the rules for a certificate are:

| Position or node | What closes the proof |
| --- | --- |
| The opponent is already checkmated | Accept this leaf. |
| Another game-ending result has occurred | This branch fails the mate objective. |
| The budget is exhausted without mate | This branch has not established the objective. |
| My turn | One legal child has a completed proof within h − 1 plies. |
| Opponent's turn | There is at least one legal reply, and every legal child has a completed proof within h − 1 plies. |

The requirement that replies exist prevents an empty AND from accidentally treating stalemate as success. If I exhaust a declared search budget, that also does not prove the position cannot be won. It tells me what this bounded proof has established.

Why does the certificate work? Start at its leaves, where the objective has been checked. At my nodes, I can choose the certified child. At their nodes, whichever legal reply they choose has a certified continuation. Apply that reasoning back up the finite tree and it reaches the root.

I can handle several defenses with one argument if that argument really covers all of them. A defense I have simply left out remains a hole in the proof.

## 4. The precondition theorem

Here is the version I think we can actually rely on.

> **The precondition theorem — geometry of unchanged targets.**
>
> Suppose our legal move establishes a pin, skewer, sliding-piece fork, or knight fork involving two surviving enemy pieces. Any necessary relationship that depends only on those targets' square coordinates and the attacking movement pattern must already hold in the position immediately before our move.
>
> The relevant precondition therefore exists at least one ply before our move establishes the tactical relationship.

That is a conditional theorem. It does not say every relationship involved in the finished tactic exists beforehand. The attacker may have to move. A line may have to be cleared. A pawn may promote into the attacking piece.

It says the geometry of the **unchanged enemy targets** is already there.

The reason is simple. Our move does not relocate a surviving enemy piece. If the enemy king and queen are still on the board after our move, they are on the same squares as before it. This remains true when we capture some third piece, castle, or promote.

For a little notation, let s be the parent position and s′ the position after our move. Let T mean the particular tactical relationship, and let G be its necessary target geometry. For the relevant targets:

> **T(s′) implies G(s′). Their coordinates are unchanged, so G(s′) equals G(s). Therefore T(s′) implies G(s).**

For a promotion, use the movement pattern of the resulting piece in both evaluations of G. The theorem concerns a potential relationship between the targets, so that piece need not have existed on the earlier board.

### Proof by contradiction

Assume our move establishes T, but its necessary geometry G was absent one ply earlier.

Because T now exists, G must hold in the resulting position. Yet the target pieces have not moved, and G depends only on their square coordinates and the specified movement pattern. Its value therefore cannot have changed across our move.

G would have to be both present and absent for the same coordinates. That is the contradiction.

This is the extra step that makes “one ply earlier” legitimate. Showing that a pin requires alignment proves a same-position dependency. Showing that the target coordinates are unchanged carries that dependency back to the preceding node.

## 5. What “aligned” has to mean

The theorem is only as useful as its predicates. “Aligned” needs a definition appropriate to the tactic.

### Pins and skewers: a common line

For a sliding pin or skewer, the two enemy targets share a rank, file, or diagonal compatible with the attacking piece. In the finished pattern, the attacker and the two targets occupy one line in the required order.

For an **absolute pin**, one target stands between a slider and its own king. With no other obstruction on that segment, an off-line move that leaves the slider in place would expose the king. A **relative pin** has some other valuable target behind the front piece. The movement rules alone do not establish whether moving that piece is a bad trade.

For a **skewer**, the front target is attacked and the second target lies behind it. A king in front must have its check answered, but the full proof still has to inspect legal answers. A block, capture of the attacker, or another repair may prevent the hoped-for gain.

**Contradiction proof.** Assume our move pins or skewers two surviving targets that did not share the required line in the parent position. They occupy the same two squares after our move. They therefore still do not share that line. But the alleged pin or skewer requires that line. Impossible.

What follows is a precondition for the pattern. The open path, attacker placement, move legality, and eventual gain remain separate work.

An absolute pin also does not necessarily mean the pinned piece has no legal moves. It may be able to stay on the pin line or capture the pinning piece. The exact prohibited move is the one that leaves its king attacked.

### Sliding forks: a shared firing square

For forks, ordinary straight-line alignment is too narrow.

A rook on c3 can attack a target on c7 and another on h3. Those targets share neither a rank, a file, nor a diagonal. They meet the rook along different rays.

So the right geometric predicate is: **there is a square from which this kind of piece could attack both target squares on an otherwise empty board.** I will call it a shared firing square. The actual position must also provide the appropriate clear paths; the two targets must not screen one another.

**Contradiction proof.** Suppose our sliding piece forks two unchanged targets from square x after our move, but no shared firing square existed before it. The completed fork makes x a witness: its movement pattern reaches both targets. Their squares have not changed. x was therefore a geometric witness in the parent position too. That contradicts its supposed absence.

This condition can be weak. For a rook, targets on different ranks and files have the two rectangle corners as geometric intersections. The useful additional questions are whether our rook can legally reach an intersection, whether the attack paths are clear, and whether the fork achieves the objective. The geometry theorem does not answer those questions for us.

### Knight forks: a shared jump square

For a knight, I want “knight alignment” to mean something equally concrete: **there is a board square one knight jump away from each target.**

Take the set of squares from which a knight attacks the first target. Take the corresponding set for the second. If the sets intersect, the targets have a shared jump square.

**Contradiction proof.** Suppose our knight forks two unchanged targets from x, but their jump-square sets did not intersect beforehand. After the move, x is in both sets. The target coordinates are identical before and after, so both sets are identical too. Their intersection therefore already contained x. Contradiction.

The targets must be on the same color, since every knight attack from one square lands on the opposite color. Same color alone is insufficient: two distant squares can have no shared jump square.

The knight also has to get there legally. A shared jump square does not promise a one-move route from the knight's current location, and an active fork does not by itself promise a material win.

## 6. Why the timing qualification matters

My first formulation was broader: the precondition must always exist a ply before the tactic. That claim allows a counterexample.

Put a white king on e1, a white rook on d3, a black rook on e8, and a black king on a8. White is in check along the e-file. White can answer it with **1.Re3**. The white rook and king become aligned, and the rook becomes absolutely pinned, in that same move.

The rook was never pinned *without* alignment. Alignment and pinning arose together. The statement “a pin requires alignment” remains true; the unrestricted claim that alignment always arose earlier is false.

This is why the theorem talks about our move exploiting **surviving enemy targets**. In the counterexample, the moving side relocates one of the targets. The invariant used in the proof is absent.

The distinction gives us a useful sequence when the relationship is newly created: the opponent can put their pieces into the geometry; our subsequent move can exploit it. The theorem guarantees the geometry in the position before our activation. It makes no claim about how many plies it had existed before that.

## 7. Removing the guard: what actually has to come first

The same discipline matters for removing or distracting a defender.

The familiar picture is a target attacked once and defended once. If I can remove the defender while preserving the threat, perhaps I can take the target. That is a useful pattern to look for. It does not make “exactly one attacker and exactly one defender” a universal precondition.

A target might have several attackers or defenders. A nominal defender might be pinned and unable to make the relevant recapture. And the move that removes the guard can also create the attack.

I want to separate **geometric support** from an **effective guard**. Geometric support says a friendly piece controls the target square under its movement pattern. An effective guard has a legal response to the particular contemplated capture or threat. Whether that response defeats our objective is part of the branch proof. A defender count alone cannot establish it.

The guard lemma is narrower:

> **Guard dependency.** If an event removes a particular guard's existing defensive function, that function exists immediately before the event. The resulting loss of that function must then be checked in the new position.

**Contradiction proof.** Assume we have removed an existing guard of a target, but that piece had no relevant defensive function immediately beforehand. Then the event did not remove that function. The change may have opened a line, created a fork, or improved our position in some other way, but it cannot establish the claimed removal of an existing defense. That contradicts the description of the event.

This is a dependency built into what we mean by removing an existing guard. It does **not** prove that the target was already attacked before the guard disappeared.

### The attack can switch on during the removal

Here is a concrete example from the board menu. White has a rook on d1 and knight on d4. Black has a rook on d6, knight on f5, and king on h6. White's king is on h1.

The black knight guards the rook on d6. White's knight on d4 blocks White's rook, so the black rook currently has **zero White attackers**.

White plays **1.Nxf5+**. That move captures the guard, opens the d-file, and checks the black king. The rook on d6 now has **two White attackers**: the rook on d1 and the knight on f5. After any of the four legal king replies, White can take the rook with **2.Rxd6** (with check after **1…Kg6**).

The guarding relationship came first. The attack did not have to. Several things happened in the same move, and the proof needs to allow that.

### Distraction has its own timing

If I distract a guard, I may make an offer on my move, the opponent may move the guard on theirs, and I may take the target on my next move. The relevant dependency is immediately before the guard's departure. It does not require the full pattern to have existed an arbitrary number of plies earlier.

I also have to prove the departure or handle the refusal. “They will take the bait” is an unfinished branch. If the target moves, another guard takes over, a countercheck intervenes, or a recapture is still possible, that has to be resolved before I can accept the objective.

## 8. A complete little proof

Let's use a deliberately spare position so we can see the entire argument.

White has a king on g5 and rooks on a1 and c1. Black has only a king on h8. It is White's turn. The objective is **mate within three plies**: White moves, Black replies, White mates.

Our proposed first move is **1.Ra8+**. Black has exactly two legal replies:

| Black's reply | White's continuation | Terminal fact |
| --- | --- | --- |
| 1…Kh7 | 2.Rc7# | Black is in check and has no legal move. |
| 1…Kg7 | 2.Rc7# | Black is in check and has no legal move. |

The rook on a8 controls the eighth rank. The rook arriving on c7 checks along the seventh. White's king covers the relevant escapes to the sixth rank. There is no black piece that can block or capture a rook.

Those observations explain the mate. The explicit check that the legal reply set is empty certifies each terminal node.

The two branches establish the AND at Black's turn. That closes the chosen child at White's root, so the OR at the root is satisfied. We do not need to show that Ra8+ is White's only winning move.

For the three-ply objective, a branch that still needs a fourth ply has not closed. That is the value of specifying the claim before looking at the answer.

## 9. What I can take back to the board

The precondition theorem gives me a reason to inspect relationships before calculating moves. For a named tactic against fixed targets, the absence of its necessary geometry rules out immediate activation of that tactic.

Its presence gives me something to investigate. It does not certify success.

If the geometry is absent, a longer plan can still create it. I might force a king onto a line, draw a queen onto a forkable square, or induce a defender to move. So failure of a one-ply precondition must not erase every longer idea.

That suggests a small chain of work I can keep explicit:

| Current card | Fact or result | Action and next card |
| --- | --- | --- |
| Read the relationship | A relevant line or shared attack square exists | Retain that idea; go to Test the activation. |
| Test the activation | A candidate legally establishes the named pattern | Add that child; go to Answer the defenses. |
| Test the activation | The candidate is illegal, or does not establish the pattern | Reject this candidate for that stated reason; inspect another candidate or retire this immediate idea when exhausted. |
| Answer the defenses | A reply has a completed continuation satisfying the objective | Record that defense as covered; inspect the remaining defenses. |
| Answer the defenses | A reply defeats this candidate within the stated scope | Return to Test the activation; keep the refuting branch. |
| Settle the objective | The exact terminal predicate holds and the required branches are covered | Accept the certificate. |

This is the outline of a policy we can develop. It still needs explicit rules for requesting and ordering candidates and for any grouped treatment of defenses. Those decisions belong on the cards. The Oracle supplies the board facts; the cards specify what we do with them.

What I remember between steps is also explicit: the objective, the current card, the relationship I am pursuing, the moves I have tried, the defenses I have covered, and the reason an idea failed. That is the state of the argument.

For now, the thing I want to memorize is this:

> **Find the relationship. Test the move that activates it. Account for the replies. Check the objective.**

I want a small set of claims that survive being challenged. A pin needs a line. A fork needs a shared attack square. Removing a guard requires a guard. A forced tactic requires an answer to the opponent's choices.

And whenever I say something had to happen earlier, I need to identify what stayed unchanged across the move. That is the part of the proof I was missing.

  .pc-post .pc-hero::after { width: 133px; height: 133px; right: 0; top: 50px; opacity: .18; }
  .pc-post h1 { font-size: 57px; line-height: 1.04; max-width:330px; letter-spacing: -.05em; }
  .pc-post h2 { font-size:29px; margin-top:1.7em; padding-top:21px; }
  .pc-post h3 { font-size:23px; }
  .pc-post .pc-deck { font-size:19px; max-width:300px; }
  .pc-post .pc-topline { font-size:9px; letter-spacing:.11em; padding:19px 0; }
  .pc-post .pc-opening { font-size:20px; }
  .pc-post blockquote { padding:18px 20px; }
  .pc-post blockquote p { font-size:18px; }
  .pc-post table { font-size:13px; }
  .pc-post th { padding:13px 12px; font-size:10px; }
  .pc-post td { padding:13px 12px; }
  .pc-post td:first-child { min-width:96px; }
  .pc-post .pc-widget { margin-left:-6px; margin-right:-6px; }
  .pc-post .pc-byline { font-size:10px; }
}
@media print {
  .pc-post { background:white; padding:0; font-size:11pt; }
  .pc-post .pc-topline, .pc-post .pc-reading-path, .pc-post .pc-colophon { display:none; }
  .pc-post h2, .pc-post h3 { break-after:avoid; }
  .pc-post blockquote, .pc-post tr, .pc-post .pc-widget { break-inside:avoid; }
  .pc-post .pc-widget button, .pc-post .pc-widget select { color:#152e35; }
}

.pc-post .pc-contents{max-width:750px;margin:0 auto 34px;font:12px/1.6 system-ui,sans-serif;color:#456054}
.pc-post .pc-contents summary{cursor:pointer;width:max-content;border:1px solid #d1d7c9;border-radius:999px;padding:8px 15px;background:#f9f8f0;min-height:38px}
.pc-post .pc-contents nav{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.pc-post .pc-contents nav a{border:1px solid #d1d7c9;border-radius:8px;padding:8px 12px;text-decoration:none;background:#fbfaf5}
.pc-post .pc-contents a:focus-visible,.pc-post .pc-contents summary:focus-visible{outline:3px solid #b58740;outline-offset:3px}
.pc-post .pc-render-error{padding:24px;max-width:750px;margin:30px auto;border:1px solid #bd8b68}
@media print{.pc-post .pc-contents{display:none}}
</style>
</head>

<!-- Render the top Markdown source into the empty article mount. -->
<script>
(function renderMarkdownBlog(){
  'use strict';
  const source=document.getElementById('pc-markdown');
  const article=document.getElementById('pc-article');
  if(!source||!article)return;
  const element=(tag,className,text)=>{
    const node=document.createElement(tag);
    if(className)node.className=className;
    if(text!==undefined)node.textContent=text;
    return node;
  };
  try{
    article.innerHTML=marked.parse(source.textContent.trim(),{gfm:true,breaks:false});
    const title=article.querySelector(':scope > h1');
    const possibleSubtitle=title&&title.nextElementSibling;
    const subtitle=possibleSubtitle&&possibleSubtitle.matches('p')&&possibleSubtitle.querySelector('em')?possibleSubtitle:null;
    const possibleByline=(subtitle||title)&&((subtitle||title).nextElementSibling);
    const byline=possibleByline&&possibleByline.matches('p')&&possibleByline.querySelector('strong')?possibleByline:null;
    const titleText=title?title.textContent.trim():'Article';
    const author=byline?byline.textContent.split('·')[0].trim():'';
    document.title=titleText+(author?' — '+author:'');
    document.querySelector('meta[name="description"]').setAttribute('content',subtitle?subtitle.textContent.trim():titleText);
    article.setAttribute('aria-label',titleText);
    article.querySelectorAll('table').forEach(table=>{
      const wrap=element('div','pc-table-wrap');table.replaceWith(wrap);wrap.append(table);
    });
    const sections=Array.from(article.querySelectorAll(':scope > h2'));
    sections.forEach((heading,index)=>{if(!heading.id)heading.id='pc-section-'+(index+1);});
    const topline=element('nav','pc-topline');topline.setAttribute('aria-label','Article');
    const brand=element('span','pc-topline-brand');
    const mark=element('span','pc-topline-mark');mark.setAttribute('aria-hidden','true');
    brand.append(mark,document.createTextNode(author||titleText));topline.append(brand);
    if(sections.length){
      const jump=element('a','', 'Read the article ↓');jump.href='#'+sections[0].id;topline.append(jump);
    }
    article.prepend(topline);
    if(title){
      const hero=element('header','pc-hero');title.before(hero);
      if(subtitle)hero.append(element('div','pc-kicker',subtitle.textContent.split('·')[0].trim()));
      hero.append(title);
      if(subtitle){subtitle.classList.add('pc-deck');hero.append(subtitle);}
      if(byline){byline.classList.add('pc-byline');hero.append(byline);}
      if(sections.length){
        const contents=element('details','pc-contents');
        contents.append(element('summary','', 'In this article'));
        const nav=element('nav');nav.setAttribute('aria-label','Article sections');
        sections.forEach(section=>{
          const a=element('a','',section.textContent.trim());a.href='#'+section.id;nav.append(a);
        });
        contents.append(nav);hero.after(contents);
      }
    }
    const opening=article.querySelector(':scope > p');if(opening)opening.classList.add('pc-opening');
    const sourceHeading=Array.from(article.querySelectorAll(':scope > h3')).find(h=>/source.*notes/i.test(h.textContent));
    if(sourceHeading){
      let paragraph=sourceHeading.nextElementSibling;
      while(paragraph&&paragraph.tagName==='P'){paragraph.classList.add('pc-source-note');paragraph=paragraph.nextElementSibling;}
    }
    const footer=element('footer','pc-colophon');footer.append(element('span','',titleText));
    if(byline)footer.append(element('span','',byline.textContent.trim()));article.append(footer);
    article.dataset.markdownRendered='true';
    document.dispatchEvent(new CustomEvent('pc:markdown-rendered',{detail:{article}}));
  }catch(error){
    article.replaceChildren(element('p','pc-render-error','The article could not render. Its Markdown source is at the top of this file.'));
    article.dataset.markdownError=String(error.message);
    console.error('Markdown rendering failed:',error);
  }
})();

</script>

,"title":"Knight alignment means a shared jump square","kind":"knight-fork","objective":"Attack Ke8 and Qf5 with Nd6.","initialFen":"4k3/8/8/5q2/2N5/8/1P6/K7 w - - 0 1","steps":[{"fen":"4k3/8/8/5q2/2N5/8/1P6/K7 w - - 0 1","san":null,"uci":null,"caption":"From d6 a knight attacks both e8 and f5. Nc4 can legally reach that common attack square.","highlights":{"squares":["c4","d6","e8","f5"],"arrows":[{"from":"c4","to":"d6","color":"accent"},{"from":"d6","to":"e8","color":"accent"},{"from":"d6","to":"f5","color":"accent"}]},"facts":[{"label":"d6 attacks e8 by a knight jump","value":true,"type":"boolean"},{"label":"d6 attacks f5 by a knight jump","value":true,"type":"boolean"},{"label":"Nd6 is legal","value":true,"type":"boolean"},{"label":"Ke8 and Qf5 are collinear","value":false,"type":"boolean"}],"sideToMove":"white","inCheck":false,"checkmate":false,"legalMoveCount":10,"invariants":["d6 is a shared knight attack square for e8 and f5."],"created":[]},{"fen":"4k3/8/3N4/5q2/8/8/1P6/K7 b - - 1 1","san":"Nd6+","uci":"c4d6","caption":"Nd6+ realizes the fork. A knight check cannot be interposed against.","highlights":{"squares":["d6","e8","f5"],"arrows":[{"from":"d6","to":"e8","color":"accent"},{"from":"d6","to":"f5","color":"accent"}]},"facts":[{"label":"Nd6 attacks Ke8","value":true,"type":"boolean"},{"label":"Nd6 attacks Qf5","value":true,"type":"boolean"},{"label":"Black is in check","value":true,"type":"boolean"},{"label":"Legal Black replies","value":"Kf8, Kd8, Ke7, Kd7","type":"text"}],"sideToMove":"black","inCheck":true,"checkmate":false,"legalMoveCount":4,"invariants":["d6 is a shared knight attack square for e8 and f5."],"created":["Nd6 attacks Ke8 and Qf5.","Black is in check."],"removed":[]}],"scope":"The relation belongs to the two fixed targets and a possible knight square. It is not ordinary collinearity."},{"id":"guard-removal","title":"Remove the piece that makes a capture costly","kind":"guard","objective":"Remove Be7 and take Rd8.","initialFen":"3r1k2/4b 8/5N2/8/8/8/K7 b - - 0 2"},{"uci":["f8f7","d1d8"],"san":["Kf7","Rxd8"],"finalFen":"3R4/4Bk2/8/5N2/8/8/8/K7 b - - 0 2"}]},{"id":"same-move-pin","title":"Alignment and pin can appear in the same move","kind":"counterexample","objective":"Test the claim that alignment must first appear at least one ply before a pin.","initialFen":"k3r3/8/8/8/8/3R4/8/4K3 w - - 0 1","steps":[{"fen":"k3r3/8/8/8/8/3R4/8/4K3 w - - 0 1","san":null,"uci":null,"caption":"White is in check. Rd3 and Ke1 do not share any rank, file, or diagonal; the rook is not pinned.","highlights":{"squares":["d3","e1","e8"],"arrows":[{"from":"e8","to":"e1","color":"accent"},{"from":"d3","to":"e3","color":"accent"}]},"facts":[{"label":"White is in check","value":true,"type":"boolean"},{"label":"Rd3 and Ke1 are collinear","value":false,"type":"boolean"},{"label":"Rd3 is absolutely pinned","value":false,"type":"boolean"}],"sideToMove":"white","inCheck":true,"checkmate":false,"legalMoveCount":5,"invariants":["The black rook stays on e8.","The white king stays on e1."],"created":[]},{"fen":"k3r3/8/8/8/8/4R3/8/4K3 b - - 1 1","san":"Re3","uci":"d3e3","caption":"Re3 legally blocks the check. In this one move, Re3 and Ke1 become aligned on the e-file and the rook becomes pinned.","highlights":{"squares":["e3","e1","e8"],"arrows":[{"from":"e8","to":"e3","color":"accent"},{"from":"e3","to":"e1","color":"accent"}]},"facts":[{"label":"Re3 and Ke1 are collinear","value":true,"type":"boolean"},{"label":"Re3 is absolutely pinned","value":true,"type":"boolean"},{"label":"White king is attacked","value":false,"type":"boolean"}],"sideToMove":"black","inCheck":false,"checkmate":false,"legalMoveCount":14,"invariants":["The black rook stays on e8.","The white king stays on e1."],"created":["The white rook and king now share the e-file.","The white rook is absolutely pinned."],"removed":["White is no longer in check."]}],"scope":"A counterexample to the unrestricted temporal claim. It does not contradict the conditional result for an attacker-only move with both targets fixed."},{"id":"same-move-guard","title":"The attack can arrive with the guard removal","kind":"counterexample","objective":"Test whether a target must already be attacked before its guard is removed.","initialFen":"8/8/3r3k/5n2/3N4/8/8/3R3K w - - 0 1","steps":[{"fen":"8/8/3r3k/5n2/3N4/8/8/3R3K w - - 0 1","san":null,"uci":null,"caption":"Nf5 guards Rd6. White does not yet attack the rook: Nd4 blocks Rd1, and Nd4 does not attack d6.","highlights":{"squares":["d1","d4","d6","f5","h6"],"arrows":[{"from":"f5","to":"d6","color":"accent"},{"from":"d4","to":"f5","color":"accent"}]},"facts":[{"label":"White attackers of Rd6","value":0,"type":"count"},{"label":"Black defenders of Rd6","value":1,"type":"count"},{"label":"Nf5 defends Rd6","value":true,"type":"boolean"}],"sideToMove":"white","inCheck":false,"checkmate":false,"legalMoveCount":19,"invariants":["The target rook stays on d6.","The black king stays on h6."],"created":[]},{"fen":"8/8/3r3k/5N2/8/8/8/3R3K b - - 0 1","san":"Nxf5+","uci":"d4f5","caption":"Nxf5+ removes the guard, opens the rook's attack, and forks king and rook. All three relationships arrive in the same move.","highlights":{"squares":["d1","d6","f5","h6"],"arrows":[{"from":"d1","to":"d6","color":"accent"},{"from":"f5","to":"d6","color":"accent"},{"from":"f5","to":"h6","color":"accent"}]},"facts":[{"label":"White attackers of Rd6","value":2,"type":"count"},{"label":"Attacker squares","value":"d1, f5","type":"text"},{"label":"Black defenders of Rd6","value":0,"type":"count"},{"label":"Black is in check","value":true,"type":"boolean"}],"sideToMove":"black","inCheck":true,"checkmate":false,"legalMoveCount":4,"invariants":["The target rook stays on d6.","The black king stays on h6."],"created":["Rd1 attacks Rd6.","White's Nf5 also attacks Rd6.","White's Nf5 checks Kh6."],"removed":["The black knight that guarded Rd6 has been captured."]}],"scope":"All four legal king replies to Nxf5+ allow Rxd6. The needed guard-target nses leave Rxe8 available. Some allow a subsequent recapture of that rook: a geometric skewer alone is not a claim of a won game."}],"proofTree":{"title":"A complete little proof: mate in two","objective":"White forces Black's checkmate within three plies (White, Black, White).","initialFen":"7k/8/8/6K1/8/8/8/R1R5 w - - 0 1","rootId":"root","mateDepthPlies":3,"mateInMoves":2,"coverage":"One first move is proved: every legal Black reply to Ra8+ is covered (Kh7 and Kg7), and Rc7# is verified after each. A second first move, Ra2, is refuted only for the mate-in-two deadline by Kg8, after which all legal White moves were checked and none mates. Other White first moves are not assessed.","nodes":[{"id":"root","parentId":null,"fen":"7k/8/8/6K1/8/8/8/R1R5 w - - 0 1","san":null,"uci":null,"sideToMove":"white","status":"choice","children":["ra8","ra2"],"caption":"White needs one first move that forces mate by White's next turn.","legalReplyCount":null,"inCheck":false,"checkmate":false,"legalMoveCount":29,"displayedMoveCount":2,"coverage":"Only two White candidates are displayed; proving one suffices.","immediateMatingMoveCount":0},{"id":"ra8","parentId":"root","fen":"R6k/8/8/6K1/8/8/8/2R5 b - - 1 1","san":"Ra8+","uci":"a1a8","sideToMove":"black","status":"defend","children":["kh7","kg7"],"caption":"Ra8+ leaves exactly two legal replies. Both must be covered.","legalReplyCount":2,"inCheck":true,"checkmate":false,"legalMoveCount":2,"allLegalReplies":[{"uci":"h8h7","san":"Kh7"},{"uci":"h8g7","san":"Kg7"}],"allRepliesCovered":true},{"id":"kh7","parentId":"ra8","fen":"R7/7k/8/6K1/8/8/8/2R5 w - - 2 2","san":"Kh7","uci":"h8h7","sideToMove":"white","status":"choice","children":["kh7-mate"],"caption":"White can choose Rc7# in this branch.","legalReplyCount":null,"inCheck":false,"checkmate":false,"legalMoveCount":34},{"id":"kh7-mate","parentId":"kh7","fen":"R7/2R4k/8/6K1/8/8/8/8 b - - 3 2","san":"Rc7#","uci":"c1c7","sideToMove":"black","status":"mate","children":[],"caption":"Black is <script>
(() => {
  'use strict';
  const source = document.getElementById('pc-example-data');
  if (!source) return;
  let data;
  try { data = JSON.parse(source.textContent); } catch (_) { return; }
  const escape = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const colorNames = {green:'#167567',teal:'#167567',accent:'#167567',gold:'#b58740',amber:'#b58740',red:'#b36b50',blue:'#3c7d96',ink:'#152e35'};
  const color = (v, fallback='#167567') => colorNames[v] || (/^#[a-fA-F0-9]{3,8}$/.test(v || '') ? v : fallback);
  const squarePoint = square => /^[a-h][1-8]$/.test(square || '') ? {x:32 + (square.charCodeAt(0)-97)*56 + 28,y:16+(8-Number(square[1]))*56+28} : null;
  const glyphs = {p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};
  const pieceNames = {p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
  function parseFen(fen) {
    const fields = String(fen || '').trim().split(/\s+/), pieces = [];
    (fields[0] || '').split('/').forEach((rank,row) => {
      let col=0;
      for(const item of rank) {
        if(/[1-8]/.test(item)) col+=Number(item);
        else { pieces.push({piece:item,square:String.fromCharCode(97+col)+(8-row)}); col++; }
      }
    });
    return {pieces,side:fields[1] === 'b' ? 'b' : 'w'};
  }
  function annotations(step) {
    let highlights = step.highlights || [], arrows = step.arrows || [], lines = step.lines || [];
    if (!Array.isArray(highlights)) { arrows=[...arrows,...(highlights.arrows || [])];lines=[...lines,...(highlights.lines || [])]; highlights=highlights.squares || highlights.targets || []; }
    return {highlights,arrows,lines};
  }
  function board(step, uid) {
    const fen=step.fen || '', parsed=parseFen(fen), a=annotations(step), marks=[];
    const label=parsed.pieces.map(p => `${p.piece === p.piece.toUpperCase() ? 'White' : 'Black'} ${pieceNames[p.piece.toLowerCase()]} ${p.square}`).join(', ');
    let html=`<svg viewBox="0 0 500 490" role="img" aria-label="${escape(label)}. ${parsed.side==='w'?'White':'Black'} to move." xmlns="http://www.w3.org/2000/svg"><title>${escape(step.san || 'Initial position')}</title><defs><clipPath id="${uid}-clip"><rect x="32" y="16" width="448" height="448" rx="5"/></clipPath></defs><g clip-path="url(#${uid}-clip)">`;
    for(let row=0;row<8;row++) for(let col=0;col<8;col++) html+=`<rect x="${32+col*56}" y="${16+row*56}" width="56" height="56" fill="${(row+col)%2 ? '#8daf9e' : '#eeeede'}"/>`;
    const uci=String(step.uci || '');
    if (/^[a-h][1-8][a-h][1-8]/.test(uci)) for(const sq of [uci.slice(0,2),uci.slice(2,4)]) { const p=squarePoint(sq); html+=`<rect x="${p.x-28}" y="${p.y-28}" width="56" height="56" fill="#e7c277" opacity=".46"/>`; }
    for(const item of a.highlights) {
      const h=typeof item==='string'?{square:item}:item, sq=h.square || h.sq, p=squarePoint(sq);
      if(p) html+=`<rect x="${p.x-24}" y="${p.y-24}" width="48" height="48" rx="6" fill="${color(h.color,'#b58740')}" fill-opacity=".12" stroke="${color(h.color,'#b58740')}" stroke-width="2.7"/>`;
    }
    for(const item of a.lines) {
      const from=item.from || item[0], to=item.to || item[1], p=squarePoint(from), q=squarePoint(to);
      if(p&&q) html+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${color(item.color)}" stroke-width="8" opacity=".32" stroke-linecap="round" stroke-dasharray="${item.dashed?'5 7':'none'}"/>`;
    }
    for(const p of parsed.pieces) {
      const pt=squarePoint(p.square); if(!pt) continue;
      const white=p.piece===p.piece.toUpperCase();
      html+=`<text x="${pt.x}" y="${pt.y+18}" text-anchor="middle" font-family="DejaVu Sans, Noto Sans Symbols 2, Arial Unicode MS, serif" font-size="48" fill="${white?'#fffdf0':'#153239'}" stroke="${white?'#263f3d':'#102c30'}" stroke-width="${white?'.9':'.35'}" paint-order="stroke fill" aria-hidden="true">${glyphs[p.piece.toLowerCase()] || ''}</text>`;
    }
    a.arrows.forEach((item,index)=>{
      const from=item.from || item[0],to=item.to || item[1],p=squarePoint(from),q=squarePoint(to);
      if(!p||!q) return;
      const stroke=color(item.color), dx=q.x-p.x,dy=q.y-p.y,len=Math.hypot(dx,dy), ux=dx/len,uy=dy/len;
      if(!len) return;
      const end={x:q.x-ux*17,y:q.y-uy*17},base={x:end.x-ux*11,y:end.y-uy*11};
      html+=`<path d="M ${p.x+ux*12} ${p.y+uy*12} L ${end.x-ux*5} ${end.y-uy*5}" fill="none" stroke="${stroke}" stroke-width="5" stroke-linecap="round" opacity=".88" ${item.dashed?'stroke-dasharray="5 6"':''}/><polygon points="${end.x},${end.y} ${base.x-uy*6},${base.y+ux*6} ${base.x+uy*6},${base.y-ux*6}" fill="${stroke}" opacity=".95"/>`;
    });
    html+='</g><rect x="32" y="16" width="448" height="448" rx="5" fill="none" stroke="#476b5b" stroke-width="1"/>';
    for(let i=0;i<8;i++) html+=`<text x="${60+i*56}" y="484" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${String.fromCharCode(97+i)}</text><text x="17" y="${49+i*56}" text-anchor="middle" font-size="11" font-family="system-ui,sans-serif" fill="#586d61">${8-i}</text>`;
    return html+'</svg>';
  }
  function factList(facts, type='') {
    if(!facts) return '';
    const items=Array.isArray(facts)?facts:Object.entries(facts).map(([label,value])=>({label,value}));
    return `<ul class="pc-facts">${items.map(f=>{
      if(typeof f==='string') return `<li class="pc-fact ${type==='created'?'pc-created':''}"><span>${escape(f)}</span></li>`;
      const absent=f.value===false || f.truth===false || f.present===false || f.status==='absent';
      const created=f.type==='created' || f.status==='created' || f.new===true || type==='created';
      const label=f.label || f.text || f.predicate || f.name || '', detail=typeof f.value==='boolean'?(f.value?'True':'False'):f.value!==undefined?String(f.value):'';
      return `<li class="pc-fact ${absent?'pc-absent':created?'pc-created':''}"><span>${escape(label)}${detail && detail!==label?`: <strong>${escape(detail)}</strong>`:''}${f.code?`<span class="pc-fact-code">${escape(f.code)}</span>`:''}</span></li>`;
    }).join('')}</ul>`;
  }
  function fenBlock(fen) { return `<details class="pc-fen"><summary>Position FEN</summary><code>${escape(fen)}</code></details>`; }
  function sideLabel(fen) { const side=parseFen(fen).side;return `<span class="pc-side" data-side="${side}">${side==='w'?'White':'Black'} to move</span>`; }
  const legend='<div class="pc-legend"><span class="pc-key pc-key-gold">Relevant square</span><span class="pc-key pc-key-line">Move / attack relation</span></div>';
  function geometry(root, index) {
    const exampleOrder=['pin','skewer','rook-fork','knight-fork','guard-removal','same-move-pin','same-move-guard'];
    const examples=[...(data.examples || [])].sort((a,b)=>exampleOrder.indexOf(a.id)-exampleOrder.indexOf(b.id));
    if(!examples.length) {root.innerHTML='<p class="pc-error">The worked examples are missing.</p>';return;}
    let exampleIndex=0,stepIndex=0;
    root.innerHTML=`<header class="pc-header"><div class="pc-eyebrow">Worked positions · recorded legal moves</div><h3>The relationship comes into focus</h3><p class="pc-intro">Choose a motif and step through the position. The facts beside the board make the timing of each relationship explicit.</p><div class="pc-selection"><label class="pc-select-label" for="pc-example-${index}">Explore</label><select id="pc-example-${index}" data-action="example" aria-label="Choose a tactical example">${examples.map((ex,i)=>`<option value="${i}">${escape(ex.title)}</option>`).join('')}</select></div></header><div class="pc-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div><nav class="pc-controls" aria-label="Worked position navigation"><button class="pc-control" data-action="previous" aria-label="Previous position"><span aria-hidden="true">←</span> Previous</button><button class="pc-control pc-reset" data-action="reset" aria-label="Reset this example" title="Reset this example">↺</button><button class="pc-control pc-primary" data-action="next" aria-label="Next position">Next <span aria-hidden="true">→</span></button></nav><nav class="pc-step-nav" data-role="steps" aria-label="Recorded positions"></nav>${legend}<div data-role="fen"></div></div><div class="pc-detail" data-role="detail" aria-live="polite" aria-atomic="true"></div></div><footer class="pc-footer">Verified worked walkthroughs. Controls replay recorded positions; this article does not run a chess search or evaluate arbitrary moves.</footer>`;
    const get=role=>root.querySelector(`[data-role="${role}"]`);
    function render() {
      const ex=examples[exampleIndex],steps=ex.steps || [],step=steps[stepIndex];
      if(!step) return;
      root.dataset.example=ex.id || String(exampleIndex);root.dataset.step=String(stepIndex);root.dataset.stepCount=String(steps.length);
      get('meta').innerHTML=sideLabel(step.fen)+`<span class="pc-position-counter">Position ${stepIndex+1} of ${steps.length}</span>`;
      get('board').innerHTML=board(step,`pc-g${index}-${stepIndex}`);
      get('steps').innerHTML=steps.map((s,i)=>`<button class="pc-step" data-step="${i}" aria-label="Go to ${i===0?'initial position':escape(s.san || 'position '+(i+1))}" ${i===stepIndex?'aria-current="step"':''}>${i===0?'Start':escape(s.san || 'Ply '+i)}</button>`).join('');
      const initial=stepIndex===0,stable=step.invariants || step.stable || [],created=step.created || [],facts=step.facts || [];
      let detail=`<div class="pc-move-label">${initial?'At the starting node':'After the recorded move'}</div><div class="pc-move"><span class="pc-san">${initial?'Before':escape(step.san || 'Ply '+stepIndex)}</span><span class="pc-ply">${initial?'Ply 0':`Ply ${stepIndex}`}</span></div><p class="pc-caption">${escape(step.caption || ex.description || '')}</p>`;
      if(facts.length || (!Array.isArray(facts)&&Object.keys(facts).length)) detail+=`<section class="pc-fact-section"><h4 class="pc-fact-title">Facts at this node</h4>${factList(facts)}</section>`;
      if(stable.length) detail+=`<section class="pc-fact-section"><h4 class="pc-fact-title">${initial?'Already in place':'What stays fixed'}</h4>${factList(stable)}</section>`;
      if(created.length) detail+=`<section class="pc-fact-section"><h4 class="pc-fact-title">What this move creates</h4>${factList(created,'created')}</section>`;
      const observation=step.takeaway || step.observation || ex.takeaway || ex.theoremNote || ex.scope;
      if(observation) detail+=`<div class="pc-observation"><strong>What this establishes.</strong> ${escape(observation)}</div>`;
      get('detail').innerHTML=detail;get('fen').innerHTML=fenBlock(step.fen);
      root.querySelector('[data-action="previous"]').disabled=stepIndex===0;
      root.querySelector('[data-action="next"]').disabled=stepIndex===steps.length-1;
    }
    root.addEventListener('change',e=>{if(e.target.matches('[data-action="example"]')){exampleIndex=Number(e.target.value);stepIndex=0;render();}});
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b || !root.contains(b))return;
      if(b.dataset.step!==undefined){stepIndex=Number(b.dataset.step);render();root.querySelector(`[data-step="${stepIndex}"]`).focus({preventScroll:true});return;}
      if(b.dataset.action==='previous' && stepIndex>0)stepIndex--;
      if(b.dataset.action==='next' && stepIndex<(examples[exampleIndex].steps.length-1))stepIndex++;
      if(b.dataset.action==='reset')stepIndex=0;
      render();
    });
    render();root.dataset.pcReady='true';
  }
  function normalizeProof(raw) {
    const p=raw || {}, nodeMap=new Map();
    if(Array.isArray(p.nodes))p.nodes.forEach(n=>nodeMap.set(String(n.id),n));
    else if(p.nodes)Object.entries(p.nodes).forEach(([id,n])=>nodeMap.set(String(id),{id,...n}));
    const rootValue=p.rootId || p.root;
    if(typeof rootValue==='object') {
      const walk=(n,path)=>{n={...n,id:String(n.id || path)};nodeMap.set(n.id,n);n.children=(n.children||[]).map((c,i)=>typeof c==='object'?walk(c,path+'-'+i):String(c));return n.id;};
      return {...p,rootId:walk(rootValue,'root'),nodeMap};
    }
    for(const [id,n]of nodeMap) {
      n.children=(n.children || n.moves || []).map(c=>typeof c==='string'?c:typeof c==='object'?String(c.to || c.child || c.id):String(c));
    }
    return {...p,rootId:String(rootValue || nodeMap.keys().next().value || ''),nodeMap};
  }
  function proof(root,index) {
    const p=normalizeProof(data.proofTree),nodes=p.nodeMap;
    if(!nodes.size) {root.innerHTML='<p class="pc-error">The proof tree is missing.</p>';return;}
    const children=n=>(n.children||[]).map(id=>nodes.get(String(id))).filter(Boolean);
    const rootNode=nodes.get(p.rootId),defense=Array.from(nodes.values()).find(n=>n.type==='AND'||n.kind==='AND'||n.operator==='AND'||n.role==='opponent'||(children(n).length>1&&parseFen(n.fen).side==='b'));
    const defenses=defense?children(defense):[], omitBranch=String(p.omitBranchId || (defenses[defenses.length-1]||{}).id || '');
    const descendants=new Set();
    function mark(id){if(descendants.has(String(id)))return;descendants.add(String(id));const n=nodes.get(String(id));if(n)children(n).forEach(c=>mark(c.id));}
    if(omitBranch)mark(omitBranch);
    let selectedId=p.rootId,omitted=false,nodeStatuses=new Map();
    const total=Number(p.replyCount || (defense && (defense.legalReplyCount || defense.legalRepliesCount)) || defenses.length);
    root.innerHTML=`<header class="pc-header"><div class="pc-eyebrow">A bounded AND / OR proof</div><h3>${escape(p.title || 'Trace every defense')}</h3><p class="pc-intro">${escape(p.description || 'At our turn, one successful choice is enough. At the opponent’s turn, every legal defense needs an answer. Select any node to inspect its board.')}</p><div class="pc-proof-options"><span class="pc-objective">${escape(p.objective || 'Objective: checkmate')}</span><label class="pc-switch-label"><input type="checkbox" data-action="omit-defense" aria-label="Leave one defense open"><span>Leave one defense open</span></label></div></header><div class="pc-proof-verdict" data-role="verdict" aria-live="polite"></div><div class="pc-main pc-proof-main"><div class="pc-board-wrap"><div class="pc-board-meta" data-role="meta"></div><div class="pc-board" data-role="board"></div><div class="pc-proof-selection" data-role="selection" aria-live="polite"></div><div data-role="fen"></div></div><div class="pc-tree-panel"><div class="pc-tree-title"><span>Select a node</span><span class="pc-inline-count" data-role="count"></span></div><div class="pc-tree" data-role="tree"></div><div class="pc-coverage" data-role="coverage"></div></div></div><footer class="pc-footer">${escape(p.verification || 'This is a fixed, verified miniature. The tree records the chosen attacking move and every legal opponent reply at the defense node. The switch withholds one continuation to demonstrate an incomplete proof.')}</footer>`;
    const get=role=>root.querySelector(`[data-role="${role}"]`);
    function nodeKind(n){
      const k=String(n.type || n.kind || n.operator || '').toUpperCase();
      if(n.checkmate||n.mate||n.status==='mate'||n.terminal==='checkmate')return 'MATE';
      if(n.status==='horizon-fail')return 'BOUND';
      if(k==='AND'||k==='OR')return k;
      if(!children(n).length)return n.status==='failed'?'FAILED':'LEAF';
      return parseFen(n.fen).side==='w'?'OR':'AND';
    }
    // Evaluate the recorded finite proof, using three values. A missing branch
    // is unresolved. At White nodes one proved choice suffices; at Black nodes
    // every legal reply must be covered, unless one reply already refutes.
    function evaluateNode(n, active=new Set()) {
      const id=String(n.id);
      if(omitted&&id===omitBranch){nodeStatuses.set(id,'unproved');return 'unproved';}
      if(active.has(id))return 'unproved';
      let result='unproved';
      const k=nodeKind(n),kids=children(n),next=new Set(active);next.add(id);
      if(n.checkmate===true && parseFen(n.fen).side==='b')result='proved';
      else if(n.status==='horizon-fail'&&n.matingMoveCount===0&&n.lastMoveCandidatesChecked===n.legalMoveCount)result='refuted';
      else if(kids.length){
        const states=kids.map(c=>evaluateNode(c,next));
        if(k==='OR') {
          if(states.includes('proved'))result='proved';
          else if(kids.length===n.legalMoveCount&&states.every(s=>s==='refuted'))result='refuted';
        }else if(k==='AND'){
          if(states.includes('refuted'))result='refuted';
          else if((kids.length===(n.legalReplyCount ?? n.legalMoveCount))&&states.every(s=>s==='proved'))result='proved';
        }
      }
      nodeStatuses.set(id,result);return result;
    }
    function nodeTitle(n){return n.label || n.san || (String(n.id)===p.rootId?'White to move':'Position');}
    function nodeMarkup(n,path=new Set()) {
      if(path.has(String(n.id)))return '';
      const branchOpen=omitted&&String(n.id)===omitBranch,k=nodeKind(n),sub=n.subtitle || (n.status==='refuted'?`${n.legalReplyCount} legal replies · 1 refutation shown`:k==='AND'?`${n.legalReplyCount || total} legal defenses to cover`:k==='OR'?'One successful move suffices':k==='MATE'?'Checkmate verified':k==='BOUND'?'No mate on White’s next move':''),id=String(n.id),nextPath=new Set(path);nextPath.add(id);
      let html=`<li><button class="pc-node ${k==='MATE'?'pc-leaf':''} ${branchOpen?'pc-omitted':''}" data-node="${escape(id)}" data-proof-node-status="${nodeStatuses.get(id) || 'unproved'}" aria-current="${selectedId===id?'true':'false'}" aria-label="Inspect ${escape(nodeTitle(n))}${branchOpen?', continuation withheld':''}"><span><span class="pc-node-title">${escape(nodeTitle(n))}</span><span class="pc-node-subtitle">${branchOpen?'Defense exists; continuation withheld':escape(sub)}</span></span><span class="pc-node-kind">${branchOpen?'OPEN':k}</span></button>`;
      const kids=children(n);
      if(kids.length&&!branchOpen)html+=`<ul class="pc-children">${kids.map(c=>nodeMarkup(c,nextPath)).join('')}</ul>`;
      return html+'</li>';
    }
    function render() {
      if(omitted&&descendants.has(selectedId)&&selectedId!==omitBranch)selectedId=omitBranch;
      nodeStatuses=new Map();
      const selected=nodes.get(selectedId)||rootNode,status=evaluateNode(rootNode),covered=defenses.filter(n=>nodeStatuses.get(String(n.id))==='proved').length;
      root.dataset.proofStatus=status;root.dataset.selectedNode=selectedId;root.dataset.coveredReplies=String(covered);root.dataset.totalReplies=String(total);
      const verdict=get('verdict');verdict.dataset.proofStatus=status;
      verdict.innerHTML=`<span class="pc-verdict-mark" aria-hidden="true">${omitted?'?':'✓'}</span><div><div class="pc-verdict-title">${status==='proved'?'The root is proved':'The root is unproved'}</div><div class="pc-verdict-explanation">${omitted?`${covered} of ${total} legal defenses have a completed answer here. A winning leaf on another branch does not settle the open defense.`:`All ${total} legal defenses to ${escape(defense.san || 'the chosen move')} reach the objective within the recorded bound.`}</div></div>`;
      get('tree').innerHTML=`<ul>${nodeMarkup(rootNode)}</ul>`;
      get('count').textContent=`${covered} / ${total} defenses covered`;
      get('meta').innerHTML=sideLabel(selected.fen)+`<span class="pc-position-counter">${escape(nodeTitle(selected))}</span>`;
      get('board').innerHTML=board(selected,`pc-p${index}-${String(selected.id).replace(/[^a-zA-Z0-9]/g,'')}`);
      const withheld=omitted&&selectedId===omitBranch;
      const selectedSide=parseFen(selected.fen).side==='w'?'White':'Black';
      const knownFacts=selected.facts || [{label:`${selectedSide} is in check`,value:selected.inCheck},{label:`Legal ${selectedSide} moves`,value:selected.legalMoveCount}].filter(f=>f.value!==undefined);
      if(!selected.facts&&selected.checkmate)knownFacts.push({label:'Black is checkmated',value:true});
      if(!selected.facts&&selected.matingMoveCount!==undefined)knownFacts.push({label:'Immediate mating moves',value:selected.matingMoveCount});
      get('selection').innerHTML=`<div class="pc-move-label">${withheld?'An unanswered defense':nodeKind(selected)==='MATE'?'Objective reached':nodeKind(selected)==='BOUND'?'This candidate misses the deadline':'Selected proof node'}</div><p class="pc-caption">${escape(withheld?'This legal reply remains in the tree. Its continuation has been withheld, so the proof is incomplete. Turn the switch off to restore it.':selected.caption || selected.description || nodeTitle(selected))}</p>${factList(withheld?[`${selectedSide} to move; the response is still required.`]:knownFacts)}`;
      get('fen').innerHTML=fenBlock(selected.fen);
      get('coverage').innerHTML=`<strong>Opponent coverage.</strong> ${escape(p.coverage || (defense&&defense.coverage) || `The defense node has ${total} legal replies. Each displayed reply is an AND obligation.`)} ${omitted?'One obligation is deliberately left open in this view.':'Every obligation shown has its recorded continuation.'}`;
    }
    root.addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(!b||!root.contains(b))return;selectedId=b.dataset.node;render();const replacement=root.querySelector(`[data-node="${CSS.escape(selectedId)}"]`);if(replacement)replacement.focus({preventScroll:true});});
    root.addEventListener('change',e=>{if(e.target.matches('[data-action="omit-defense"]')){omitted=e.target.checked;render();}});
    render();root.dataset.pcReady='true';
  }
  function init() {document.querySelectorAll('.pc-widget[data-pc-widget]').forEach((root,i)=>{if(root.dataset.pcReady)return;try{if(root.dataset.pcWidget==='geometry')geometry(root,i);if(root.dataset.pcWidget==='proof')proof(root,i);}catch(error){root.innerHTML='<p class="pc-error">The interactive example could not initialize. The article’s written proof remains available above.</p>';root.dataset.pcError=String(error.message);}});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
