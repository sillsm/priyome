<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Priyome — Reducer</title>
<style>
  :root{ --b:#dbe3f0; --bg:#f6f7fb; --panel:#fff; --ink:#0f172a; --muted:#475569; --chip:#e0e7ff; }
  *{ box-sizing:border-box; }
  html,body{height:100%}
  body{ margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--ink); }
  #topNav{ position:sticky; top:0; z-index:5; background:rgba(255,255,255,.9); backdrop-filter: blur(8px);
    border-bottom:1px solid var(--b); padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #topNav .title{ font-weight:900; letter-spacing:.2px; }
  #topNav .right{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  #activePriyome{ padding:6px 10px; border-radius:999px; background:var(--chip); display:inline-block; font-size:12px; }

  .layout{ display:grid; grid-template-columns: 2fr 1fr; gap:10px; padding:10px; height:calc(100vh - 52px); }
  .card{ background:var(--panel); border:1px solid var(--b); border-radius:12px; overflow:hidden; min-height:0; display:flex; flex-direction:column; }
  .head{ padding:10px; border-bottom:1px solid var(--b); font-size:12px; color:var(--muted); display:flex; gap:8px; align-items:center; justify-content:space-between; }
  #boardHost{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  #boardHost .sc-shell{ margin:auto; max-width:100%; max-height:100%; }

  #setupStrip{ padding:8px 10px; border-top:1px solid var(--b); background:#f8fafc; display:flex; gap:8px; align-items:center; }
  #setupStrip[hidden]{ display:none; }

  .controls{ padding:10px; border-top:1px solid var(--b); display:flex; gap:6px; flex-wrap:wrap; }
  .controls button{ padding:8px 10px; border:1px solid var(--b); border-radius:10px; background:#fff; cursor:pointer; }

  .tabs{ display:flex; gap:6px; padding:10px; border-bottom:1px solid var(--b); flex-wrap:wrap; }
  .tab{ padding:6px 10px; border:1px solid var(--b); border-radius:10px; font-size:12px; cursor:pointer; background:#fff; user-select:none; }
  .tab.active{ background:var(--chip); }
  .pane{ display:none; padding:10px; overflow:auto; flex:1; min-height:0; }
  .pane.active{ display:block; }

  .gameCard{ border:1px solid var(--b); border-radius:10px; padding:8px; margin:6px 0; cursor:pointer; background:#fff; }
  .gameCard.active{ background:var(--chip); }

  .pill{ padding:6px 10px; border:1px solid var(--b); border-radius:999px; background:#fff; cursor:pointer; font-size:12px; }
  .pill.active{ background:var(--chip); }

  #fenBox, #pgnBox{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size:12px; color:var(--muted); width:100%; }
  #pgnBox{ height:72px; }

  #priyomeList .pr{ padding:8px; border:1px solid var(--b); border-radius:10px; background:#fff; cursor:pointer; margin-bottom:8px; }
  #priyomeList .pr:hover{ background:#f8fafc; }

  #bootErr{ display:none; padding:10px 12px; border-bottom:1px solid var(--b); background:#fff1f2; color:#7f1d1d;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  #bootErr.show{ display:block; }

  @media (max-width: 980px){
    .layout{ grid-template-columns:1fr; grid-template-rows: 60vh 40vh; height:auto; }
  }
</style>
</head>
<body>

<div id="topNav">
  <div class="title">Priyome</div>
  <div class="right">
    <span>Reducer slice</span>
    <span id="activePriyome">No Priyome</span>
  </div>
</div>

<div class="layout">
  <div class="card">
    <div id="bootErr"></div>
    <div class="head">
      <div>Study: <span id="studyName">default</span> — Game: <span id="gameName"></span></div>
      <div style="font-size:11px;color:var(--muted)">ScratchChess</div>
    </div>

    <div id="boardHost" aria-label="boardHost"></div>

    <div id="setupStrip" hidden>
      <button id="btnSetupInitial">Initial</button>
      <button id="btnSetupClear">Clear</button>
      <span style="font-size:12px;color:var(--muted)">Setup mode</span>
    </div>

    <div class="controls">
      <button id="btnPrev">◀</button>
      <button id="btnNext">▶</button>
      <button id="btnFlip">Flip</button>
      <button id="btnReset">Reset</button>
      <button id="btnSetup">Setup</button>
      <button id="btnClearMarks">Clear Marks</button>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-tab="moves">Moves</div>
      <div class="tab" data-tab="games">Games</div>
      <div class="tab" data-tab="draw">Draw</div>
      <div class="tab" data-tab="priyomes">Priyomes</div>
      <div class="tab" data-tab="errors">Errors</div>
    </div>

    <div class="pane active" id="pane-moves">
      <div style="color:var(--muted);font-size:12px">Moves placeholder.</div>
      <div style="margin-top:10px;color:var(--muted);font-size:12px">PGN (for tests)</div>
      <textarea id="pgnBox" readonly></textarea>
    </div>

    <div class="pane" id="pane-games">
      <button id="btnNewGame" style="padding:8px 10px;border:1px solid var(--b);border-radius:10px;background:#fff;cursor:pointer">+ New Game</button>
      <div id="gameList"></div>
    </div>

    <div class="pane" id="pane-draw">
      <div id="drawToolbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="pill" id="btnModeSquares">Squares</button>
        <button class="pill" id="btnModeArrows">Arrows</button>
        <button class="pill" id="btnPigR">Pig R</button>
        <button class="pill" id="btnPigG">Pig G</button>
        <button class="pill" id="btnPigB">Pig B</button>
        <button class="pill" id="btnPigY">Pig Y</button>
      </div>
      <div style="margin-top:10px;color:var(--muted);font-size:12px">
        Uses ScratchChess drawing (marks exported into PGN as [%csl]/[%cal]).
      </div>
    </div>

    <div class="pane" id="pane-priyomes">
      <div id="priyomeList">
        <div class="pr" data-priyome="greek_gift"><b>Greek Gift</b><div style="font-size:12px;color:var(--muted)">Classic sac on h7</div></div>
        <div class="pr" data-priyome="back_rank"><b>Back Rank</b><div style="font-size:12px;color:var(--muted)">Rook motifs</div></div>
      </div>
    </div>

    <div class="pane" id="pane-errors">
      Errors: <span id="errCount">0</span>
      <div id="errorLog" style="margin-top:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)"></div>
    </div>

    <div class="head">
      <div>FEN</div>
      <div id="fenBox"></div>
    </div>
  </div>
</div>

<script type="module">
import * as SC from "./scratchchess.js";

const $ = (id) => document.getElementById(id);
const bootErr = $("bootErr");
const showBootErr = (msg) => { bootErr.textContent = msg; bootErr.classList.add("show"); $("errCount").textContent = "1"; $("errorLog").textContent = msg; };

const createGame = SC.createGame ?? window.createGame;
const BoardView  = SC.BoardView  ?? window.BoardView;

if (typeof createGame !== "function" || typeof BoardView !== "function"){
  showBootErr("ScratchChess failed to load: missing createGame / BoardView exports. Check scratchchess.js exports.");
} else {
  boot();
}

function boot(){
  const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
  const EMPTY_FEN = "8/8/8/8/8/8/8/8 w - - 0 1";

  const PRIYOMES_PGN = {
    greek_gift: `[Event "Greek Gift"]\n[White ""]\n[Black ""]\n\n1. e4 {[%csl Gh7,Gg6][%cal Rh5h7]} *\n`,
    back_rank: `[Event "Back Rank"]\n[White ""]\n[Black ""]\n\n1. e4 {[%csl Rf8,Rg8,Rh8][%cal Re1e8]} *\n`
  };

  let state = { tab:"moves", errors:0, gameOrder:[], currentGameId:null, activePriyome:null };
  const REG = new Map();
  const uid6 = () => (crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(16).slice(2) + Date.now().toString(16)))
    .replace(/-/g,"").slice(0,6);

  function reduce(prev, action){
    switch(action.type){
      case "TAB": return {...prev, tab: action.tab};
      case "NEW_GAME": {
        const id = uid6();
        return {...prev, gameOrder:[id, ...prev.gameOrder], currentGameId:id, activePriyome:null};
      }
      case "SELECT_GAME":
        if (!prev.gameOrder.includes(action.id)) return prev;
        return {...prev, currentGameId: action.id, activePriyome:null};
      case "APPLY_PRIYOME":
        return {...prev, activePriyome: action.id};
      case "ERROR":
        return {...prev, errors: prev.errors + 1};
      default:
        return prev;
    }
  }

  const boardHost = $("boardHost");
  const initGame = createGame({ Event:"Boot", White:"", Black:"" });
  const board = new BoardView(boardHost, initGame, { minSizePx: 140 });

  function cg(){
    const id = state.currentGameId;
    return id ? (REG.get(id)?.game || null) : null;
  }

  function ensureGame(id){
    if (REG.has(id)) return;
    const g = createGame({ Event:id, White:"", Black:"" });
    try{ g.loadFEN?.(START_FEN); }catch{}
    try{ g.onChange?.(() => { if (state.currentGameId === id) syncUi(); }); }catch{}
    REG.set(id, {id, game:g});
  }

  function syncUi(){
    const g = cg();
    if (!g){ $("fenBox").textContent=""; $("pgnBox").value=""; $("setupStrip").hidden=true; return; }
    try{ $("fenBox").textContent = g.exportFEN?.() || ""; }catch{ $("fenBox").textContent=""; }
    try{ $("pgnBox").value = g.exportPGN?.() || ""; }catch{ $("pgnBox").value=""; }
    $("setupStrip").hidden = !(g.ui && g.ui.setup);

    const mode = g?.ui?.mode || "";
    $("btnModeSquares").classList.toggle("active", mode==="squares");
    $("btnModeArrows").classList.toggle("active", mode==="arrows");
    const pig = g?.ui?.pigment || g?.ui?.pig || "R";
    $("btnPigR").classList.toggle("active", pig==="R");
    $("btnPigG").classList.toggle("active", pig==="G");
    $("btnPigB").classList.toggle("active", pig==="B");
    $("btnPigY").classList.toggle("active", pig==="Y");
  }

  function render(){
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===state.tab));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("active", p.id==="pane-"+state.tab));
    $("errCount").textContent = String(state.errors);

    $("activePriyome").textContent = state.activePriyome ? (state.activePriyome==="greek_gift" ? "Greek Gift" : "Back Rank") : "No Priyome";
    $("gameName").textContent = state.currentGameId || "";

    const gl = $("gameList"); gl.innerHTML = "";
    for (const id of state.gameOrder){
      const d = document.createElement("div");
      d.className = "gameCard" + (id===state.currentGameId ? " active" : "");
      d.textContent = id;
      d.dataset.id = id;
      gl.appendChild(d);
    }
    syncUi();
  }

  window.__getSquareCenter = function(sq){
    const g = cg();
    const shell = boardHost.querySelector(".sc-shell") || boardHost;
    const r = shell.getBoundingClientRect();
    if (!sq || !/^[a-h][1-8]$/.test(sq)) return null;
    const file = sq.charCodeAt(0)-97;
    const rank = parseInt(sq[1],10)-1;
    const flip = !!(g && g.ui && g.ui.flip);
    const fx = flip ? (7-file) : file;
    const ry = flip ? rank : (7-rank);
    return { x: r.left + (fx+0.5)*(r.width/8), y: r.top + (ry+0.5)*(r.height/8) };
  };

  function createAndSelectGame(){
    state = reduce(state, {type:"NEW_GAME"});
    ensureGame(state.currentGameId);
    board.setGame(REG.get(state.currentGameId).game);
    try{ cg().loadFEN?.(START_FEN); }catch{}
    render();
  }

  function selectGame(id){
    state = reduce(state, {type:"SELECT_GAME", id});
    ensureGame(id);
    board.setGame(REG.get(id).game);
    render();
  }

  function applyPriyome(id){
    state = reduce(state, {type:"APPLY_PRIYOME", id});
    const g = cg();
    try{ const pgn = PRIYOMES_PGN[id] || ""; if (pgn) g.loadPGN?.(pgn); }catch{}
    render();
  }

  $("btnPrev").addEventListener("click", () => { try{ cg()?.prevMove?.(); }catch{} });
  $("btnNext").addEventListener("click", () => { try{ cg()?.nextMove?.(); }catch{} });
  $("btnFlip").addEventListener("click", () => { try{ cg()?.toggleFlip?.(); }catch{} finally { render(); } });
  $("btnReset").addEventListener("click", () => { try{ cg()?.loadFEN?.(START_FEN); }catch{} finally { render(); } });
  $("btnSetup").addEventListener("click", () => { try{ cg()?.toggleSetup?.(); }catch{} finally { render(); } });
  $("btnSetupClear").addEventListener("click", () => { try{ cg()?.loadFEN?.(EMPTY_FEN); }catch{} finally { render(); } });
  $("btnSetupInitial").addEventListener("click", () => { try{ cg()?.loadFEN?.(START_FEN); }catch{} finally { render(); } });

  $("btnModeSquares").addEventListener("click", () => { try{ const g=cg(); if (!g?.setMode) return; g.setMode(g.ui?.mode==="squares" ? "" : "squares"); }catch{} finally { render(); } });
  $("btnModeArrows").addEventListener("click", () => { try{ const g=cg(); if (!g?.setMode) return; g.setMode(g.ui?.mode==="arrows" ? "" : "arrows"); }catch{} finally { render(); } });
  $("btnClearMarks").addEventListener("click", () => { try{ cg()?.clearMarks?.(); }catch{} finally { render(); } });
  $("btnPigR").addEventListener("click", () => { try{ cg()?.setPigment?.("R"); }catch{} finally { render(); } });
  $("btnPigG").addEventListener("click", () => { try{ cg()?.setPigment?.("G"); }catch{} finally { render(); } });
  $("btnPigB").addEventListener("click", () => { try{ cg()?.setPigment?.("B"); }catch{} finally { render(); } });
  $("btnPigY").addEventListener("click", () => { try{ cg()?.setPigment?.("Y"); }catch{} finally { render(); } });

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.classList?.contains("tab") && t.dataset.tab){
      state = reduce(state, {type:"TAB", tab:t.dataset.tab});
      render();
      return;
    }
    if (t.id === "btnNewGame"){ createAndSelectGame(); return; }
    if (t.classList?.contains("gameCard") && t.dataset.id){ selectGame(t.dataset.id); return; }
    const pr = t.closest?.("[data-priyome]");
    if (pr && pr.dataset.priyome){ applyPriyome(pr.dataset.priyome); return; }
  });

  createAndSelectGame();
  createAndSelectGame();
}
</script>
</body>
</html>
