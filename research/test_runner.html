<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UI Test Runner (Table Driven)</title>
  <style>
    :root { --bg:#0b0d12; --panel:#111827; --b:rgba(255,255,255,.12); --t:#e5e7eb; --m:#9aa7c7; }
    body { margin:0; background:var(--bg); color:var(--t); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .wrap { display:grid; grid-template-columns: 1fr 1fr; gap:12px; padding:12px; height:100vh; box-sizing:border-box; }
    .card { border:1px solid var(--b); border-radius:12px; background:rgba(255,255,255,.03); overflow:hidden; }
    .head { padding:10px 12px; border-bottom:1px solid var(--b); display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    button { padding:8px 10px; border-radius:10px; border:1px solid var(--b); background:rgba(255,255,255,.06); color:var(--t); cursor:pointer; }
    iframe { width:100%; height:calc(100% - 44px); border:0; background:white; }
    .log { padding:10px 12px; height:calc(100% - 44px); overflow:auto; }
    .pass { color:#a7f3d0; }
    .fail { color:#fecaca; }
    .muted { color:var(--m); font-size:13px; }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div>
          <div class="mono">App Under Test</div>
          <div class="muted">Loaded in an iframe</div>
        </div>
        <div class="mono muted" id="status">idle</div>
      </div>
      <iframe id="appFrame" src="app.html"></iframe>
    </div>

    <div class="card">
      <div class="head">
        <div>
          <div class="mono">Test Runner</div>
          <div class="muted">Table-driven UI steps</div>
        </div>
        <div class="row">
          <button id="runBtn">Run tests</button>
          <button id="reloadBtn">Reload app</button>
        </div>
      </div>
      <div class="log mono" id="log"></div>
    </div>
  </div>

<script>
(() => {
  const frame = document.getElementById("appFrame");
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const runBtn = document.getElementById("runBtn");
  const reloadBtn = document.getElementById("reloadBtn");

  function log(line, cls="") {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = line;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(s) { statusEl.textContent = s; }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function waitForFrameReady() {
    // wait until iframe document + our app root exists
    for (let i=0;i<80;i++) {
      const doc = frame.contentDocument;
      if (doc && doc.querySelector('[data-testid="view"]')) return;
      await sleep(50);
    }
    throw new Error("iframe app not ready");
  }

  function q(sel) {
    const doc = frame.contentDocument;
    const el = doc.querySelector(sel);
    if (!el) throw new Error(`Missing element: ${sel}`);
    return el;
  }

  function text(sel) { return q(sel).textContent.trim(); }

  function click(sel) {
    const el = q(sel);
    el.dispatchEvent(new MouseEvent("click", { bubbles:true, cancelable:true, view: frame.contentWindow }));
  }

  function type(sel, value) {
    const el = q(sel);
    el.focus();
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles:true }));
  }

  async function stepExec(step) {
    const [op, ...args] = step;
    switch (op) {
      case "click": click(args[0]); break;
      case "type": type(args[0], args[1]); break;
      case "expectText": {
        const got = text(args[0]);
        const want = args[1];
        if (got !== want) throw new Error(`expectText ${args[0]} got="${got}" want="${want}"`);
        break;
      }
      case "expectContains": {
        const got = text(args[0]);
        const sub = args[1];
        if (!got.includes(sub)) throw new Error(`expectContains ${args[0]} got="${got}" missing="${sub}"`);
        break;
      }
      case "sleep": await sleep(args[0]); break;
      default:
        throw new Error(`Unknown step op: ${op}`);
    }
    // small tick to allow render
    await sleep(10);
  }

  async function runTest(t) {
    log(`\nTEST: ${t.name}`);
    // start from a clean app page each test (simple + deterministic)
    frame.contentWindow.location.reload();
    await waitForFrameReady();

    for (const s of t.steps) {
      log(`  - ${JSON.stringify(s)}`);
      await stepExec(s);
    }
  }

  // -------------------------
  // TABLE-DRIVEN TESTS
  // -------------------------
  const tests = [
    {
      name: "Navigate to Query tab and run add: 2+3",
      steps: [
        ["click", '[data-testid="tab-query"]'],
        ["type",  '[data-testid="query-input"]', "add: 2+3"],
        ["click", '[data-testid="run-btn"]'],
        ["expectText", '[data-testid="result"]', "5"],
        ["expectText", '[data-testid="error"]', ""]
      ]
    },
    {
      name: "Empty query shows error",
      steps: [
        ["click", '[data-testid="tab-query"]'],
        ["type",  '[data-testid="query-input"]', ""],
        ["click", '[data-testid="run-btn"]'],
        ["expectText", '[data-testid="result"]', ""],
        ["expectText", '[data-testid="error"]', "Enter something to query."]
      ]
    },
    {
      name: "Echo command",
      steps: [
        ["click", '[data-testid="tab-query"]'],
        ["type",  '[data-testid="query-input"]', "echo: hello world"],
        ["click", '[data-testid="run-btn"]'],
        ["expectText", '[data-testid="result"]', "hello world"]
      ]
    },
    {
      name: "Unknown command is deterministic",
      steps: [
        ["click", '[data-testid="tab-query"]'],
        ["type",  '[data-testid="query-input"]', "wat"],
        ["click", '[data-testid="run-btn"]'],
        ["expectContains", '[data-testid="result"]', "Unknown command:"]
      ]
    },
    {
      name: "Clear button resets fields",
      steps: [
        ["click", '[data-testid="tab-query"]'],
        ["type",  '[data-testid="query-input"]', "len: abcdef"],
        ["click", '[data-testid="run-btn"]'],
        ["expectText", '[data-testid="result"]', "6"],
        ["click", '[data-testid="clear-btn"]'],
        ["expectText", '[data-testid="result"]', ""],
        ["expectText", '[data-testid="error"]', ""]
      ]
    },
  ];

  async function runAll() {
    logEl.innerHTML = "";
    setStatus("running...");
    let pass = 0;
    try {
      for (const t of tests) {
        try {
          await runTest(t);
          log(`✔ PASS: ${t.name}`, "pass");
          pass++;
        } catch (err) {
          log(`✘ FAIL: ${t.name}`, "fail");
          log(String(err && err.stack ? err.stack : err), "fail");
        }
      }
    } finally {
      setStatus(`done (${pass}/${tests.length} passed)`);
    }
  }

  runBtn.addEventListener("click", runAll);
  reloadBtn.addEventListener("click", () => frame.contentWindow.location.reload());

})();
</script>
</body>
</html>
