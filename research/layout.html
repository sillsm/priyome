<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3-Panel Cards (3:1 + Max Square Board)</title>

  <!-- chessboard.js (requires jQuery) -->
  <link rel="stylesheet"
        href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <style>
    :root{
      --gap: 16px;
      --pad: 16px;
      --radius: 14px;
      --border: rgba(229,231,235,0.14);
      --bg0: #0b0f19;
      --bg1: #050712;
      --card: rgba(15,23,42,0.88);
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --shadow: 0 10px 30px rgba(0,0,0,.25);
      --nav-h: 44px;

      --top-band: 80vh;
      --p1-bar-h: 10px;
      --p1-bar-bg: rgba(156,163,175,.45);
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      color: var(--text);
    }

    .nav{
      position: sticky;
      top: 0;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(7,10,20,.65);
      border-bottom: 1px solid rgba(229,231,235,.1);
      z-index: 10;
    }

    .wrap{
      min-height: calc(100vh - var(--nav-h));
      padding: var(--pad);
      display: grid;
      gap: var(--gap);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      overflow: hidden;
    }

    /* PANEL 1 — unchanged sizing */
    .p1{
      position: relative;
    }

    .board-center{
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
    }

    .boardHost{
      width: 100%;
    }

    /* Overlay bars (layout-neutral) */
    .p1-bar{
      position: absolute;
      left: 0;
      right: 0;
      height: var(--p1-bar-h);
      background: var(--p1-bar-bg);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      font-size: 10px;
      user-select: none;
    }
    .p1-bar.top{
      top: 0;
      color: #ffffff;
      font-weight: 500;
      letter-spacing: .3px;
    }
    .p1-bar.bottom{
      bottom: 0;
    }

    /* Bottom nav buttons */
    .nav-btns{
      display: flex;
      gap: 10px;
    }
    .nav-btn{
      width: 16px;
      height: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.85);
      color: #000;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }
    .nav-btn:active{
      transform: translateY(0.5px);
    }

    /* WIDE MODE */
    @media (min-width: 900px){
      .wrap{
        grid-template-columns: 3fr 1fr;
        grid-template-rows: var(--top-band) auto;
      }
      .p1{ grid-column: 1; grid-row: 1; }
      .p2{ grid-column: 2; grid-row: 1; }
      .p3{ grid-column: 1 / span 2; grid-row: 2; }

      .p1, .p2{ min-height: var(--top-band); }
    }

    /* MOBILE MODE */
    @media (max-width: 899.98px){
      .wrap{
        grid-template-columns: 1fr;
        grid-template-rows: 60vh 40vh auto;
      }
      .p1{ min-height: 60vh; }
      .p2{ min-height: 40vh; }
      .p3{ min-height: 60vh; }
    }

    .card h2{
      margin: 0 0 10px 0;
      font-size: 15px;
    }
    .card p{
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }
  </style>
</head>

<body>
<header class="nav">
  <div class="brand">Priyome Mock</div>
</header>

<main class="wrap">

  <!-- PANEL 1 -->
  <section class="card p1">
    <div class="p1-bar top">
      tool text
    </div>

    <div class="p1-bar bottom">
      <div class="nav-btns">
        <div class="nav-btn">&lt;</div>
        <div class="nav-btn">&gt;</div>
      </div>
    </div>

    <div class="board-center">
      <div id="board1" class="boardHost"></div>
    </div>
  </section>

  <section class="card p2">
    <h2>Panel 2</h2>
    <p>Proin porttitor, orci nec nonummy molestie.</p>
  </section>

  <section class="card p3">
    <h2>Panel 3</h2>
    <p>Integer rutrum, orci vestibulum ullamcorper ultricies.</p>
  </section>

</main>

<script>
  const boardEl = document.getElementById('board1');
  const p1 = document.querySelector('.p1');
  const board1 = Chessboard('board1', 'start');

  function sizeBoardFillPanel1() {
    const rect = p1.getBoundingClientRect();
    const cs = getComputedStyle(p1);

    const padLeft = parseFloat(cs.paddingLeft) || 0;
    const padRight = parseFloat(cs.paddingRight) || 0;
    const padTop = parseFloat(cs.paddingTop) || 0;
    const padBottom = parseFloat(cs.paddingBottom) || 0;

    const availW = rect.width - padLeft - padRight;
    const availH = rect.height - padTop - padBottom;

    const side = Math.floor(Math.min(availW, availH));
    boardEl.style.width = side + 'px';
    board1.resize();
  }

  const ro = new ResizeObserver(sizeBoardFillPanel1);
  ro.observe(p1);

  requestAnimationFrame(sizeBoardFillPanel1);
  window.addEventListener('load', () => requestAnimationFrame(sizeBoardFillPanel1));
</script>

</body>
</html>
