<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reducer Test Runner</title>
<style>
  :root { --bg:#0b0d12; --panel:#111827; --b:rgba(255,255,255,.12); --t:#e5e7eb; --m:#93a4c8; }
  body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
  .wrap{display:grid;grid-template-columns: 1.2fr .8fr;gap:12px;height:100vh;padding:12px;box-sizing:border-box;}
  .card{border:1px solid var(--b);border-radius:12px;background:rgba(255,255,255,.03);overflow:hidden;min-height:0;display:flex;flex-direction:column;}
  .head{padding:10px 12px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:10px}
  iframe{width:100%;height:100%;border:0;background:white}
  .log{padding:10px 12px;overflow:auto;flex:1;font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;font-size:13px;line-height:1.35;white-space:pre-wrap}
  button{padding:8px 10px;border-radius:10px;border:1px solid var(--b);background:rgba(255,255,255,.06);color:var(--t);cursor:pointer;}
  .pass{color:#a7f3d0}
  .fail{color:#fecaca}
  .skip{color:#fde68a}
  .dim{color:rgba(229,231,235,.7)}
  .ok{color:#a7f3d0}
  .warn{color:#fde68a}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input{padding:8px 10px;border-radius:10px;border:1px solid var(--b);background:rgba(255,255,255,.06);color:var(--t);min-width:260px}
  @media (max-width: 980px){ .wrap{grid-template-columns:1fr;grid-template-rows:55vh 45vh;} }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="head">
      <div class="row">
        <b>App Under Test</b>
        <span class="dim" id="appLabel"></span>
      </div>
      <div class="row">
        <button id="reloadBtn">Reload</button>
      </div>
    </div>
    <iframe id="frame"></iframe>
  </div>

  <div class="card">
    <div class="head">
      <div class="row">
        <b>Runner</b>
        <span class="dim" id="status">idle</span>
      </div>
      <div class="row">
        <input id="appPath" placeholder="app path (default: reducer.html or ?app=...)" />
        <button id="runBtn">Run</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
(() => {
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const frame = document.getElementById('frame');
  const appInput = document.getElementById('appPath');
  const appLabel = document.getElementById('appLabel');

  const vars = Object.create(null);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function log(msg, cls="") {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function resolveArg(x){
    if (typeof x === "string" && x.startsWith("$")) return vars[x.slice(1)];
    return x;
  }

  function q(sel) {
    const el = frame.contentDocument?.querySelector(sel);
    if (!el) throw new Error(`Missing element: ${sel}`);
    return el;
  }

  async function waitFor(sel, ms=2000){
    const t0 = performance.now();
    while (performance.now() - t0 < ms){
      const el = frame.contentDocument?.querySelector(sel);
      if (el) return el;
      await sleep(25);
    }
    throw new Error(`Timeout waiting for ${sel}`);
  }

  function rect(el){ return el.getBoundingClientRect(); }

  function expectContained(childSel, parentSel, pad=0){
    const child = q(childSel);
    const parent = q(parentSel);
    const c = rect(child);
    const p = rect(parent);
    if (c.left < p.left - pad || c.top < p.top - pad || c.right > p.right + pad || c.bottom > p.bottom + pad){
      throw new Error(`Overflow: ${childSel} (${c.left.toFixed(1)},${c.top.toFixed(1)},${c.right.toFixed(1)},${c.bottom.toFixed(1)}) not within ${parentSel} (${p.left.toFixed(1)},${p.top.toFixed(1)},${p.right.toFixed(1)},${p.bottom.toFixed(1)})`);
    }
  }

  function count(sel){ return frame.contentDocument?.querySelectorAll(sel).length ?? 0; }

  async function stepExec(step){
    const [op, ...raw] = step;
    const args = raw.map(resolveArg);

    switch(op){
      case "sleep":
        await sleep(args[0]||0);
        return;

      case "waitFor":
        await waitFor(args[0], args[1] ?? 2000);
        return;

      case "click":
        q(args[0]).dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true, view: frame.contentWindow}));
        await sleep(10);
        return;

      case "expectVisible":
        await waitFor(args[0], 500);
        return;

      case "expectContains": {
        const a0 = args[0];
        const needle = String(args[1] ?? "");
        const hay = (typeof a0 === "string" && (a0.startsWith("#") || a0.startsWith(".") || a0.includes("[") ))
          ? q(a0).textContent.trim()
          : String(a0);
        if (!String(hay).includes(needle)) throw new Error(`expectContains failed: "${needle}" not in "${String(hay)}"`);
        return;
      }

      case "expectNotEqual": {
        const left = String(args[0]);
        const right = String(args[1]);
        if (left === right) throw new Error(`expectNotEqual failed: both "${left}"`);
        return;
      }

      case "storeText": {
        const el = q(args[0]);
        vars[args[1]] = (el.value != null && el.tagName === "TEXTAREA") ? el.value : el.textContent.trim();
        log(`stored $${args[1]} = ${JSON.stringify(vars[args[1]])}`, "dim");
        return;
      }

      case "countAtLeast": {
        const n = count(args[0]);
        if (n < args[1]) throw new Error(`countAtLeast failed: ${args[0]} had ${n}, need >= ${args[1]}`);
        return;
      }

      case "expectContained":
        expectContained(args[0], args[1], args[2] ?? 0);
        return;

      case "timeUnder": {
        const [budgetMs, steps] = args;
        const t0 = performance.now();
        for (const s of steps) await stepExec(s);
        const dt = performance.now() - t0;
        if (dt > budgetMs) throw new Error(`timeUnder failed: ${dt.toFixed(1)}ms > ${budgetMs}ms`);
        return;
      }

      default:
        log(`SKIP op ${op}`, "skip");
        return;
    }
  }

  // Robust parser: supports steps written across multiple lines by buffering until JSON parses.
  function parseTests(src){
    const blocks = src
      .split(/\n\s*\n/)
      .map(b => b.trim())
      .filter(Boolean);

    const tests = [];
    for (const b of blocks){
      const rawLines = b.split("\n");
      const lines = rawLines
        .map(l => l.replace(/\r/g,""))
        .map(l => l.trim())
        .filter(l => l && !l.startsWith("#"));

      if (!lines.length) continue;
      const nameLine = lines.shift();
      if (!nameLine.startsWith("TEST ")) continue;
      const name = nameLine.slice(5).trim();

      const steps = [];
      let buf = "";
      for (const line of lines){
        // If line is a lone ']' or ']]' etc, still buffer it.
        buf = buf ? (buf + "\n" + line) : line;
        try{
          const step = JSON.parse(buf);
          steps.push(step);
          buf = "";
        }catch(e){
          // Keep buffering. Only throw if this is not an "incomplete JSON" situation.
          // We'll decide at end.
        }
      }
      if (buf.trim()){
        // Give a helpful error that points at the offending buffered chunk.
        throw new Error("Could not parse JSON step (incomplete/invalid):\n" + buf);
      }

      tests.push({name, steps});
    }
    return tests;
  }

  async function loadText(path){
    const r = await fetch(path, {cache:"no-store"});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText} for ${path}`);
    return await r.text();
  }

  function getDefaultApp(){
    const u = new URL(location.href);
    return u.searchParams.get("app") || "reducer.html";
  }

  function setApp(){
    const app = appInput.value.trim() || getDefaultApp();
    appInput.value = app;
    frame.src = app;
    appLabel.textContent = app;
  }

  async function run(){
    logEl.innerHTML = "";
    for (const k of Object.keys(vars)) delete vars[k];

    statusEl.textContent = "loading tests…";
    let testsText;
    try{
      testsText = await loadText("reducertests.txt");
      log(`✔ Loaded reducertests.txt (${testsText.length} bytes)`, "ok");
      log("--- preview ---\n" + testsText.split("\n").slice(0, 16).join("\n") + "\n--- end preview ---", "dim");
    }catch(e){
      log(`✘ FAILED to load reducertests.txt: ${e}`, "fail");
      statusEl.textContent = "failed (tests not loaded)";
      return;
    }

    let tests;
    try{
      tests = parseTests(testsText);
      log(`✔ Parsed ${tests.length} TEST blocks`, tests.length ? "ok" : "warn");
    }catch(e){
      log(`✘ FAILED to parse tests: ${e.message || e}`, "fail");
      statusEl.textContent = "failed (parse error)";
      return;
    }

    statusEl.textContent = "running";
    let pass = 0;

    for (const t of tests){
      log("\nTEST: " + t.name, "dim");

      frame.contentWindow.location.reload();
      await sleep(350);

      try{
        for (const s of t.steps){
          log("  " + JSON.stringify(s));
          await stepExec(s);
        }
        log("✔ PASS " + t.name, "pass");
        pass++;
      }catch(e){
        log("✘ FAIL " + t.name, "fail");
        log(String(e && e.message ? e.message : e), "fail");
      }
    }

    statusEl.textContent = `done (${pass}/${tests.length})`;
  }

  async function runWithFreshLoad(){
    setApp();
    await new Promise(r => frame.addEventListener("load", r, {once:true}));
    await run();
  }

  document.getElementById("runBtn").addEventListener("click", runWithFreshLoad);
  document.getElementById("reloadBtn").addEventListener("click", () => frame.contentWindow.location.reload());

  // Initial load (no run)
  appInput.value = getDefaultApp();
  setApp();
  log("Ready. Click Run. Default app is reducer.html. Tests loaded from reducertests.txt.", "dim");

  // If ?autorun=1, run immediately
  const u = new URL(location.href);
  if (u.searchParams.get("autorun") === "1"){
    log("autorun=1 detected — running immediately", "ok");
    runWithFreshLoad();
  }
})();
</script>
</body>
</html>
