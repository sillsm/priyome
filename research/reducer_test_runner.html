<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reducer Test Runner</title>
<style>
  :root { --bg:#0b0d12; --panel:#111827; --b:rgba(255,255,255,.12); --t:#e5e7eb; --m:#93a4c8; }
  body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
  .wrap{display:grid;grid-template-columns: 1.2fr .8fr;gap:12px;height:100vh;padding:12px;box-sizing:border-box;}
  .card{background:var(--panel);border:1px solid var(--b);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--b);}
  .head .title{font-weight:700}
  .head .sp{flex:1}
  .btn{appearance:none;border:1px solid var(--b);background:rgba(255,255,255,.06);color:var(--t);
       padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:600}
  .btn:hover{background:rgba(255,255,255,.10)}
  .btn:active{transform:translateY(1px)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type="text"]{background:rgba(255,255,255,.06);border:1px solid var(--b);color:var(--t);
                     padding:8px 10px;border-radius:10px;min-width:220px;flex:1}
  iframe{width:100%;height:100%;border:0;background:#fff}
  .body{padding:10px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;height:100%}
  pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:10px;border-radius:12px;
      background:rgba(0,0,0,.35);border:1px solid var(--b);min-height:0;overflow:auto;flex:1}
  .hint{color:var(--m);font-size:13px;line-height:1.3}
  .pill{display:inline-flex;align-items:center;gap:8px;color:var(--m);font-size:13px}
  .ok{color:#7CFC9A}
  .bad{color:#FF8B8B}
  @media (max-width: 980px){
    .wrap{grid-template-columns:1fr;grid-template-rows: 1.1fr .9fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="title">App Under Test</div>
      <div class="sp"></div>
      <button class="btn" id="btnReload">Reload</button>
    </div>
    <div class="body" style="padding:0">
      <iframe id="appFrame" src="reducer.html"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <div class="title">Runner</div>
      <div class="sp"></div>
      <span class="pill" id="statusPill">idle</span>
      <button class="btn" id="btnCopy" title="Copy results">📋</button>
      <button class="btn" id="btnRun">Run</button>
    </div>
    <div class="body">
      <div class="row">
        <input id="appUrl" type="text" value="reducer.html" />
        <button class="btn" id="btnOpenApp">Open</button>
        <button class="btn" id="btnLoadTests">Load tests</button>
      </div>
      <div class="hint">
        Looks for <b>reducer.html</b> and <b>reducertests.txt</b> in the same folder.
        Uses an iframe and runs steps against the iframe document.
      </div>
      <pre id="log"></pre>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (sel, root=document) => root.querySelector(sel);
  const logEl = $("#log");
  const statusPill = $("#statusPill");
  const appFrame = $("#appFrame");
  const appUrl = $("#appUrl");

  const state = { vars: {}, testsText: "" };

  function setStatus(text, ok=null){
    statusPill.textContent = text;
    statusPill.className = "pill " + (ok===true ? "ok" : ok===false ? "bad" : "");
  }

  function logLine(s=""){
    logEl.textContent += s + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  function getIframeDoc(){
    const doc = appFrame.contentDocument;
    if (!doc) throw new Error("iframe doc not ready");
    return doc;
  }

  function q(sel){
    const doc = getIframeDoc();
    const el = doc.querySelector(sel);
    if (!el) throw new Error("Missing element: " + sel);
    return el;
  }

  async function waitFor(sel, ms=2000){
    const t0 = performance.now();
    while (performance.now() - t0 < ms){
      try { q(sel); return; } catch(e){}
      await sleep(50);
    }
    throw new Error("Timeout waiting for " + sel);
  }

  function isVisible(el){
    if (!el) return false;
    const st = el.ownerDocument.defaultView.getComputedStyle(el);
    if (st.display === "none" || st.visibility === "hidden" || +st.opacity === 0) return false;
    const r = el.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  function resolveVal(v){
    if (typeof v === "string" && v.startsWith("$")){
      const key = v.slice(1);
      return state.vars[key];
    }
    return v;
  }

  function elText(selOrDollar){
    if (typeof selOrDollar === "string" && selOrDollar.startsWith("$")) return resolveVal(selOrDollar) ?? "";
    const el = q(selOrDollar);
    return (el.value ?? el.textContent ?? "").toString().trim();
  }

  function expectContains(a, b){
    const hay = resolveVal(a);
    const needle = resolveVal(b);
    const hs = (hay ?? "").toString();
    const ns = (needle ?? "").toString();
    if (!hs.includes(ns)) throw new Error(`expectContains failed: "${ns}" not in "${hs}"`);
  }

  function expectNotContains(a, b){
    const hay = resolveVal(a);
    const needle = resolveVal(b);
    const hs = (hay ?? "").toString();
    const ns = (needle ?? "").toString();
    if (hs.includes(ns)) throw new Error(`expectNotContains failed: "${ns}" WAS in "${hs}"`);
  }

  function expectEqual(a, b){
    const av = resolveVal(a);
    const bv = resolveVal(b);
    if (String(av) !== String(bv)) throw new Error(`expectEqual failed: "${av}" != "${bv}"`);
  }

  function expectNotEqual(a, b){
    const av = resolveVal(a);
    const bv = resolveVal(b);
    if (String(av) === String(bv)) throw new Error(`expectNotEqual failed: both "${av}"`);
  }

  function countAtLeast(sel, n){
    const doc = getIframeDoc();
    const els = doc.querySelectorAll(sel);
    if (els.length < n) throw new Error(`countAtLeast failed: ${sel} had ${els.length}, need >= ${n}`);
  }

  function expectVisibleSel(sel){
    const el = q(sel);
    if (!isVisible(el)) throw new Error("expectVisible failed: " + sel);
  }

  function expectContained(childSel, parentSel, pad=0){
    const doc = getIframeDoc();
    const child = doc.querySelector(childSel);
    const parent = doc.querySelector(parentSel);
    if (!child) throw new Error("expectContained missing child: " + childSel);
    if (!parent) throw new Error("expectContained missing parent: " + parentSel);
    const cr = child.getBoundingClientRect();
    const pr = parent.getBoundingClientRect();
    const ok =
      cr.left >= pr.left - pad &&
      cr.top  >= pr.top  - pad &&
      cr.right <= pr.right + pad &&
      cr.bottom <= pr.bottom + pad;
    if (!ok){
      throw new Error(`expectContained failed: ${childSel} (${cr.left.toFixed(1)},${cr.top.toFixed(1)},${cr.right.toFixed(1)},${cr.bottom.toFixed(1)}) not within ${parentSel} (${pr.left.toFixed(1)},${pr.top.toFixed(1)},${pr.right.toFixed(1)},${pr.bottom.toFixed(1)}) pad=${pad}`);
    }
  }

  function clickSel(sel){
    const el = q(sel);
    el.dispatchEvent(new MouseEvent("mousedown",{bubbles:true}));
    el.dispatchEvent(new MouseEvent("mouseup",{bubbles:true}));
    el.dispatchEvent(new MouseEvent("click",{bubbles:true}));
  }

  function typeSel(sel, text){
    const el = q(sel);
    el.focus();
    el.value = text;
    el.dispatchEvent(new InputEvent("input",{bubbles:true}));
    el.dispatchEvent(new Event("change",{bubbles:true}));
  }

  // Drag by algebraic square names using the board square hitboxes if present.
  // Requires app to expose square elements with data-sq="e4" OR use SC helper window.__SC_SQUARE_CENTER(sq)
  async function dragSquare(fromSq, toSq, holdMs=200){
    const win = appFrame.contentWindow;
    const doc = getIframeDoc();

    function centerForSq(sq){
      // Preferred: app helper
      if (win && typeof win.__SC_SQUARE_CENTER === "function"){
        const p = win.__SC_SQUARE_CENTER(sq);
        if (p && typeof p.x === "number" && typeof p.y === "number") return p;
      }
      // Fallback: query [data-sq="e4"]
      const el = doc.querySelector(`[data-sq="${sq}"]`);
      if (el){
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width/2, y: r.top + r.height/2 };
      }
      throw new Error("dragSquare cannot find square center for " + sq);
    }

    const a = centerForSq(fromSq);
    const b = centerForSq(toSq);

    const target = doc.elementFromPoint(a.x, a.y) || doc.body;
    target.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,clientX:a.x,clientY:a.y,pointerId:1,pointerType:"mouse"}));
    target.dispatchEvent(new MouseEvent("mousedown",{bubbles:true,clientX:a.x,clientY:a.y}));
    await sleep(holdMs);

    doc.dispatchEvent(new PointerEvent("pointermove",{bubbles:true,clientX:b.x,clientY:b.y,pointerId:1,pointerType:"mouse"}));
    doc.dispatchEvent(new MouseEvent("mousemove",{bubbles:true,clientX:b.x,clientY:b.y}));
    await sleep(16);

    doc.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,clientX:b.x,clientY:b.y,pointerId:1,pointerType:"mouse"}));
    doc.dispatchEvent(new MouseEvent("mouseup",{bubbles:true,clientX:b.x,clientY:b.y}));
  }

  async function timeUnder(ms, steps){
    const t0 = performance.now();
    for (const st of steps){
      await stepExec(st);
    }
    const dt = performance.now() - t0;
    if (dt > ms) throw new Error(`timeUnder failed: ${dt.toFixed(1)}ms > ${ms}ms`);
  }

  function parseTests(text){
    const lines = text.split(/\r?\n/);
    const tests = [];
    let cur = null;

    function flush(){
      if (cur){
        tests.push(cur);
        cur = null;
      }
    }

    for (let i=0;i<lines.length;i++){
      const raw = lines[i];
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      if (line.startsWith("TEST ")){
        flush();
        cur = { name: line.slice(5).trim(), steps: [] };
        continue;
      }
      if (!cur) continue;
      // JSON array step
      try{
        const step = JSON.parse(line);
        cur.steps.push(step);
      } catch(e){
        throw new Error(`Bad JSON on line ${i+1}: ${line}\n${e}`);
      }
    }
    flush();
    return tests;
  }

  async function stepExec(step){
    const op = step[0];
    const a = step[1];
    const b = step[2];
    const c = step[3];

    switch(op){
      case "sleep": return sleep(+a||0);
      case "waitFor": return waitFor(a, +b||2000);
      case "click": return clickSel(a);
      case "type": return typeSel(a, b ?? "");
      case "storeText": {
        const key = b;
        const val = elText(a);
        state.vars[key] = val;
        logLine(`stored $${key} = ${JSON.stringify(val)}`);
        return;
      }
      case "expectVisible": return expectVisibleSel(a);
      case "expectContains": return expectContains(a,b);
      case "expectNotContains": return expectNotContains(a,b);
      case "expectEqual": return expectEqual(a,b);
      case "expectNotEqual": return expectNotEqual(a,b);
      case "countAtLeast": return countAtLeast(a, +b);
      case "expectContained": return expectContained(a,b, +c||0);
      case "dragSquare": return dragSquare(a,b, +c||200);
      case "timeUnder": return timeUnder(+a, b||[]);
      default:
        throw new Error("Unknown op: " + op);
    }
  }

  async function loadTests(){
    const url = "reducertests.txt?ts=" + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error("Failed to fetch reducertests.txt (" + res.status + ")");
    const txt = await res.text();
    state.testsText = txt;
    logLine(`✔ Loaded reducertests.txt (${txt.length} bytes)`);
    const tests = parseTests(txt);
    logLine(`✔ Parsed ${tests.length} TEST blocks`);
    return tests;
  }

  async function openApp(){
    const url = appUrl.value.trim() || "reducer.html";
    appFrame.src = url + (url.includes("?") ? "&" : "?") + "ts=" + Date.now();
    await new Promise((resolve) => {
      appFrame.onload = () => resolve();
    });
  }

  async function runAll(){
    logEl.textContent = "";
    setStatus("loading…");
    await openApp();
    const tests = await loadTests();

    let pass = 0;
    let fail = 0;

    for (const t of tests){
      logLine("");
      logLine(`TEST: ${t.name}`);
      for (const st of t.steps){
        logLine("  " + JSON.stringify(st));
      }
      try{
        for (const st of t.steps){
          await stepExec(st);
        }
        pass++;
        logLine(`✔ PASS ${t.name}`);
      } catch(e){
        fail++;
        logLine(`✘ FAIL ${t.name}`);
        logLine(String(e && e.message ? e.message : e));
      }
    }

    const total = pass + fail;
    setStatus(fail ? `done (${pass}/${total})` : `done (${pass}/${total})`, fail ? false : true);
  }

  async function copyResults(){
    try{
      await navigator.clipboard.writeText(logEl.textContent);
      const prev = statusPill.textContent;
      setStatus("copied ✓", true);
      setTimeout(() => setStatus(prev, null), 700);
    } catch(e){
      alert("Clipboard copy failed. Your browser may block clipboard access on file://.\nTry serving via localhost.\n\n" + e);
    }
  }

  $("#btnRun").addEventListener("click", () => runAll().catch(e => { setStatus("error", false); logLine(String(e)); }));
  $("#btnLoadTests").addEventListener("click", () => loadTests().catch(e => { setStatus("error", false); logLine(String(e)); }));
  $("#btnOpenApp").addEventListener("click", () => openApp().catch(e => { setStatus("error", false); logLine(String(e)); }));
  $("#btnReload").addEventListener("click", () => openApp().catch(e => { setStatus("error", false); logLine(String(e)); }));
  $("#btnCopy").addEventListener("click", () => copyResults());

  // auto boot: open app + load tests preview
  (async () => {
    try{
      setStatus("boot…");
      await openApp();
      await loadTests();
      setStatus("idle");
    } catch(e){
      setStatus("error", false);
      logLine(String(e));
    }
  })();
})();
</script>
</body>
</html>
