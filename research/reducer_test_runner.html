<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dual-Viewport Test Runner</title>
  <style>
    :root{
      --bg:#0b0d12; --panel:#0f172a; --card:#111827; --b:rgba(255,255,255,.14);
      --t:#e5e7eb; --m:#93a4c8; --ok:#22c55e; --bad:#ef4444; --mono: ui-monospace, Menlo, Consolas, monospace;
      --r:14px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{ margin:0; background:var(--bg); color:var(--t); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .top{
      position:sticky; top:0; z-index:10;
      background:linear-gradient(180deg,#0b0d12,#0b0d12cc);
      border-bottom:1px solid var(--b);
      padding:12px 14px;
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    }
    .title{ font-weight:900; letter-spacing:.2px; }
    .pill{ padding:5px 10px; border:1px solid var(--b); border-radius:999px; color:var(--m); font-size:12px; }
    .btn{
      border:1px solid var(--b); background:rgba(255,255,255,.06); color:var(--t);
      border-radius:12px; padding:8px 10px; cursor:pointer;
    }
    .btn.primary{ background:rgba(37,99,235,.22); border-color:rgba(37,99,235,.55); }
    select, input{
      border:1px solid var(--b); background:rgba(255,255,255,.06); color:var(--t);
      border-radius:12px; padding:8px 10px;
    }
    input{ width: min(520px, 100%); }
    .grid{
      display:grid;
      grid-template-columns: minmax(380px, 1fr) minmax(380px, 1fr) minmax(420px, 520px);
      gap:12px;
      padding:12px;
      height: calc(100vh - 64px);
      min-height:0;
    }
    @media (max-width: 1180px){
      .grid{ grid-template-columns: 1fr; height:auto; }
    }
    .card{
      border:1px solid var(--b);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-radius:var(--r);
      overflow:hidden;
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .cardHead{
      padding:10px 12px;
      border-bottom:1px solid var(--b);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background:rgba(255,255,255,.03);
    }
    .cardHead .meta{ font-size:12px; color:var(--m); font-family:var(--mono); }
    .viewportHost{
      flex:1; min-height:0;
      display:flex; align-items:center; justify-content:center;
      padding:12px;
      background:rgba(0,0,0,.18);
    }
    .vpFrame{
      position:relative;
      border:1px solid var(--b);
      border-radius:16px;
      background:#000;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .vpInner{
      position:absolute; left:0; top:0;
      transform-origin: 0 0;
      background:#000;
    }
    iframe{
      border:0;
      width:100%;
      height:100%;
      display:block;
      background:#000;
    }

    /* runner */
    .runner{
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .runnerHead{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
      padding:10px 12px;
      border-bottom:1px solid var(--b);
      background:rgba(255,255,255,.03);
    }
    .log{
      flex:1; min-height:0;
      overflow:auto;
      padding:10px 12px;
      font-family:var(--mono);
      font-size:12px;
      white-space:pre-wrap;
      background:rgba(0,0,0,.25);
    }
    .ok{ color:var(--ok); }
    .bad{ color:var(--bad); }
    .muted{ color:var(--m); }
    .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .sep{ width:1px; height:26px; background:var(--b); margin:0 4px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">Dual-Viewport Test Runner</div>
    <span class="pill">Desktop sim: <b>1200×900</b></span>
    <span class="pill">Mobile sim: <b>360×640</b></span>
    <span class="pill">Pick target → run tests</span>
  </div>

  <div class="grid">
    <!-- Desktop viewport -->
    <div class="card">
      <div class="cardHead">
        <div>
          <b>Desktop iframe</b>
          <span class="meta">fixed 1200×900 (scaled)</span>
        </div>
        <div class="meta" id="deskScaleMeta">scale: —</div>
      </div>
      <div class="viewportHost" id="deskHost">
        <div class="vpFrame" id="deskFrame">
          <div class="vpInner" id="deskInner">
            <iframe id="deskIframe" title="desktop iframe"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile viewport -->
    <div class="card">
      <div class="cardHead">
        <div>
          <b>Mobile iframe</b>
          <span class="meta">fixed 360×640 (scaled)</span>
        </div>
        <div class="meta" id="mobScaleMeta">scale: —</div>
      </div>
      <div class="viewportHost" id="mobHost">
        <div class="vpFrame" id="mobFrame">
          <div class="vpInner" id="mobInner">
            <iframe id="mobIframe" title="mobile iframe"></iframe>
          </div>
        </div>
      </div>
    </div>

    <!-- Runner -->
    <div class="card runner">
      <div class="runnerHead">
        <div class="row">
          <label class="muted" for="appUrl">App URL</label>
          <input id="appUrl" value="./reducer.html" />
          <button class="btn" id="btnLoad">Load</button>
        </div>
        <div class="row">
          <div class="sep"></div>
          <label class="muted" for="targetPick">Target</label>
          <select id="targetPick">
            <option value="desktop">Desktop iframe (1200×900)</option>
            <option value="mobile">Mobile iframe (360×640)</option>
          </select>
          <button class="btn primary" id="btnRun">Run</button>
          <button class="btn" id="btnRunAll">Run All</button>
          <button class="btn" id="btnCopy">📋 Copy results</button>
          <button class="btn" id="btnClear">Clear</button>
        </div>
        <div class="row">
          <span class="pill">Loaded: <b id="testsMeta">—</b></span>
          <span class="pill">Done: <b id="doneMeta">0/0</b></span>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

<script type="module">
/**
 * Dual iframe sizing:
 * - Each iframe content stays at a fixed "virtual" viewport (DESK_W×DESK_H or MOB_W×MOB_H).
 * - We scale the iframe container via transform so it fits in the host area.
 */
const DESK_W = 1200, DESK_H = 900;
const MOB_W  = 360,  MOB_H  = 640;

const $ = (id)=>document.getElementById(id);

const desk = {
  host: $("deskHost"), frame: $("deskFrame"), inner: $("deskInner"), iframe: $("deskIframe"), meta: $("deskScaleMeta"),
  w: DESK_W, h: DESK_H
};
const mob = {
  host: $("mobHost"), frame: $("mobFrame"), inner: $("mobInner"), iframe: $("mobIframe"), meta: $("mobScaleMeta"),
  w: MOB_W, h: MOB_H
};

function fitViewport(vp){
  const r = vp.host.getBoundingClientRect();
  const pad = 14; // safe padding inside host
  const availW = Math.max(80, r.width  - pad*2);
  const availH = Math.max(80, r.height - pad*2);

  const s = Math.min(availW / vp.w, availH / vp.h);
  const scale = Math.max(0.1, Math.min(4, s));

  // Size outer frame to scaled size (so layout uses real pixels)
  const outW = Math.round(vp.w * scale);
  const outH = Math.round(vp.h * scale);

  vp.frame.style.width = outW + "px";
  vp.frame.style.height = outH + "px";

  // Inner stays at fixed virtual size, scaled down/up
  vp.inner.style.width = vp.w + "px";
  vp.inner.style.height = vp.h + "px";
  vp.inner.style.transform = `scale(${scale})`;

  vp.meta.textContent = `scale: ${scale.toFixed(3)} • box: ${outW}×${outH}`;
}

function fitAll(){
  fitViewport(desk);
  fitViewport(mob);
}
addEventListener("resize", ()=>fitAll());
setTimeout(fitAll, 0);

/** Load both iframes to same app url */
function loadApp(){
  const url = $("appUrl").value.trim() || "./reducer.html";
  desk.iframe.src = url;
  mob.iframe.src = url;
  logLine(`✔ Loading app into both iframes: ${url}`);
}
$("btnLoad").addEventListener("click", loadApp);

// --------------------------------------
// Test runner (simple table-driven DSL)
// --------------------------------------
//
// This runner expects a local file "reducertests.txt" with blocks like:
//
// TEST: Title navbar is visible and shows app name
//   ["waitFor",".topbarWrap",2000]
//   ["expectVisible",".topbarWrap"]
//   ["expectContains",".brandTitle","Priyo"]
//
// (Same style you’ve been using.)

let TESTS = [];
let doneCount = 0;

function logLine(s, cls=""){
  const el = $("log");
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = s;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function clearLog(){ $("log").innerHTML = ""; }
function setDone(){
  $("doneMeta").textContent = `${doneCount}/${TESTS.length}`;
}

async function fetchText(url){
  const r = await fetch(url, { cache:"no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status} fetching ${url}`);
  return await r.text();
}

function parseTests(txt){
  const lines = (txt||"").split(/\r?\n/);
  const out = [];
  let cur = null;

  const push = ()=>{
    if (cur && cur.steps.length) out.push(cur);
    cur = null;
  };

  for (const raw of lines){
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith("TEST:")){
      push();
      cur = { title: line.slice(5).trim(), steps: [] };
      continue;
    }
    if (!cur) continue;
    // step line: ["cmd", ...]
    const m = line.match(/^\s*\[(.*)\]\s*$/);
    if (!m) continue;
    try{
      const arr = JSON.parse("[" + m[1] + "]");
      cur.steps.push(arr);
    }catch(e){
      // ignore parse noise
    }
  }
  push();
  return out;
}

// ---------- helpers: target iframe selection ----------
function getTarget(){
  const pick = $("targetPick").value;
  return pick === "mobile" ? mob.iframe : desk.iframe;
}
function getDoc(){
  const fr = getTarget();
  const w = fr.contentWindow;
  const d = fr.contentDocument || w?.document;
  if (!w || !d) throw new Error("Target iframe not ready.");
  return { win:w, doc:d, frame:fr };
}

function q(sel, root){
  const { doc } = getDoc();
  const r = root || doc;
  return r.querySelector(sel);
}
function qa(sel, root){
  const { doc } = getDoc();
  const r = root || doc;
  return Array.from(r.querySelectorAll(sel));
}
function assert(cond, msg){
  if (!cond) throw new Error(msg || "Assertion failed");
}
function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

async function waitFor(sel, timeout=2000){
  const t0 = performance.now();
  while (performance.now() - t0 < timeout){
    if (q(sel)) return;
    await sleep(30);
  }
  throw new Error(`Missing element: ${sel}`);
}

function isVisible(el){
  if (!el) return false;
  const st = el.ownerDocument.defaultView.getComputedStyle(el);
  if (st.display === "none" || st.visibility === "hidden" || Number(st.opacity) === 0) return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.height > 0;
}

function fireMouse(el, type){
  const r = el.getBoundingClientRect();
  const x = r.left + Math.min(10, r.width/2);
  const y = r.top + Math.min(10, r.height/2);
  el.dispatchEvent(new MouseEvent(type, { bubbles:true, cancelable:true, clientX:x, clientY:y }));
}

async function stepExec(step){
  const [cmd, ...args] = step;

  if (cmd === "waitFor"){
    const [sel, ms] = args;
    await waitFor(sel, ms ?? 2000);
    return;
  }

  if (cmd === "click"){
    const [sel] = args;
    await waitFor(sel, 2000);
    const el = q(sel);
    assert(el, `Missing element: ${sel}`);
    fireMouse(el, "mousedown");
    fireMouse(el, "mouseup");
    fireMouse(el, "click");
    return;
  }

  if (cmd === "type"){
    const [sel, text] = args;
    await waitFor(sel, 2000);
    const el = q(sel);
    assert(el, `Missing element: ${sel}`);
    el.focus?.();
    // set value like a user
    const val = String(text ?? "");
    if ("value" in el) el.value = val;
    el.dispatchEvent(new Event("input", { bubbles:true }));
    el.dispatchEvent(new Event("change", { bubbles:true }));
    return;
  }

  if (cmd === "expectVisible"){
    const [sel] = args;
    const el = q(sel);
    assert(el, `Missing element: ${sel}`);
    assert(isVisible(el), `Not visible: ${sel}`);
    return;
  }

  if (cmd === "expectContains"){
    const [sel, sub] = args;
    const el = q(sel);
    assert(el, `Missing element: ${sel}`);
    const txt = (el.textContent || "");
    assert(txt.includes(String(sub)), `Expected ${sel} to contain "${sub}"`);
    return;
  }

  if (cmd === "expectText"){
    const [sel, exact] = args;
    const el = q(sel);
    assert(el, `Missing element: ${sel}`);
    const txt = (el.textContent || "").trim();
    assert(txt === String(exact), `Expected ${sel} text == "${exact}" but got "${txt}"`);
    return;
  }

  // expectContained(childSel, parentSel, padPx)
  if (cmd === "expectContained"){
    const [childSel, parentSel, padPx] = args;
    const child = q(childSel);
    const parent = q(parentSel);
    assert(child, `Missing element: ${childSel}`);
    assert(parent, `Missing element: ${parentSel}`);
    const c = child.getBoundingClientRect();
    const p = parent.getBoundingClientRect();
    const pad = Number(padPx ?? 0);
    assert(c.left   >= p.left   - pad, `Not contained (left): ${childSel} in ${parentSel}`);
    assert(c.top    >= p.top    - pad, `Not contained (top): ${childSel} in ${parentSel}`);
    assert(c.right  <= p.right  + pad, `Not contained (right): ${childSel} in ${parentSel}`);
    assert(c.bottom <= p.bottom + pad, `Not contained (bottom): ${childSel} in ${parentSel}`);
    return;
  }

  throw new Error(`Unknown command: ${cmd}`);
}

async function runTest(test){
  logLine(`\nTEST: ${test.title}`);
  for (const step of test.steps){
    logLine(`  - ${JSON.stringify(step)}`, "muted");
    await stepExec(step);
  }
}

async function ensureTestsLoaded(){
  if (TESTS.length) return;
  const txt = await fetchText("./reducertests.txt");
  TESTS = parseTests(txt);
  $("testsMeta").textContent = `${TESTS.length} tests`;
  logLine(`✔ Loaded reducertests.txt (${txt.length} bytes)`);
  logLine(`✔ Parsed ${TESTS.length} TEST blocks`);
}

async function waitForIframeReady(fr){
  // best-effort: wait for DOMContentLoaded + at least body exists
  const t0 = performance.now();
  while (performance.now() - t0 < 8000){
    try{
      const w = fr.contentWindow;
      const d = fr.contentDocument || w?.document;
      if (d && d.readyState === "complete" && d.body) return;
    }catch(e){
      // cross-origin would land here; must be same-origin
      throw new Error("Iframe is not same-origin. Serve runner + app from the same server/origin.");
    }
    await sleep(50);
  }
  throw new Error("Timed out waiting for iframe to finish loading.");
}

async function runOne(){
  doneCount = 0;
  setDone();
  await ensureTestsLoaded();

  const fr = getTarget();
  await waitForIframeReady(fr);

  const idx = Math.max(0, Math.min(TESTS.length-1, 0));
  const t = TESTS[idx];
  try{
    await runTest(t);
    logLine(`✔ PASS ${t.title}`, "ok");
    doneCount++;
  }catch(e){
    logLine(`✘ FAIL ${t.title}`, "bad");
    logLine(String(e?.stack || e?.message || e), "bad");
  }
  setDone();
}

async function runAll(){
  doneCount = 0;
  setDone();
  await ensureTestsLoaded();

  const fr = getTarget();
  await waitForIframeReady(fr);

  for (const t of TESTS){
    try{
      await runTest(t);
      logLine(`✔ PASS ${t.title}`, "ok");
      doneCount++;
    }catch(e){
      logLine(`✘ FAIL ${t.title}`, "bad");
      logLine(String(e?.stack || e?.message || e), "bad");
    }
    setDone();
    // tiny yield so UI stays snappy
    await sleep(0);
  }
}

// Buttons
$("btnRun").addEventListener("click", runOne);
$("btnRunAll").addEventListener("click", runAll);
$("btnClear").addEventListener("click", ()=>{ clearLog(); doneCount=0; setDone(); });
$("btnCopy").addEventListener("click", async ()=>{
  const text = Array.from($("log").querySelectorAll("div")).map(d=>d.textContent).join("\n");
  try{
    await navigator.clipboard.writeText(text);
    logLine("✔ Copied results to clipboard");
  }catch(e){
    logLine("✘ Clipboard copy failed (browser permission?)", "bad");
  }
});

// Auto-load
loadApp();
fitAll();
</script>
</body>
</html>
