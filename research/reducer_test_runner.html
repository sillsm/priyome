<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reducer Test Runner</title>
<style>
  :root { --bg:#0b0d12; --b:rgba(255,255,255,.12); --t:#e5e7eb; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;}
  .wrap{
    display:grid;
    grid-template-columns: 1.2fr .8fr;
    gap:12px;
    height:100vh;
    padding:12px;
  }
  .card{
    border:1px solid var(--b);
    border-radius:12px;
    background:rgba(255,255,255,.03);
    overflow:hidden;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .head{
    padding:10px 12px;
    border-bottom:1px solid var(--b);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px
  }
  .frameWrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:stretch;
    justify-content:stretch;
    padding:0;
  }
  iframe{
    border:0;
    background:white;
    width:100%;
    height:100%;
    display:block;
  }
  .log{
    padding:10px 12px;
    overflow:auto;
    flex:1;
    min-height:0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:13px;
    line-height:1.35;
    white-space:pre-wrap
  }
  button{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--b);
    background:rgba(255,255,255,.06);
    color:var(--t);
    cursor:pointer;
  }
  .pass{color:#a7f3d0}
  .fail{color:#fecaca}
  .skip{color:#fde68a}
  .dim{color:rgba(229,231,235,.7)}
  .ok{color:#a7f3d0}
  .warn{color:#fde68a}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input{
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--b);
    background:rgba(255,255,255,.06);
    color:var(--t);
    min-width:260px
  }
  @media (max-width: 980px){
    .wrap{
      grid-template-columns:1fr;
      grid-template-rows:55vh 45vh;
      height:100vh;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="head">
      <div class="row">
        <b>App Under Test</b>
        <span class="dim" id="appLabel"></span>
      </div>
      <div class="row">
        <button id="reloadBtn">Reload</button>
      </div>
    </div>
    <div class="frameWrap">
      <iframe id="frame" title="app-under-test"></iframe>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <div class="row">
        <b>Runner</b>
        <span class="dim" id="status">idle</span>
      </div>
      <div class="row">
        <input id="appPath" placeholder="app path (default: reducer.html or ?app=...)" />
        <button id="runBtn">Run</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </div>

</div>

<script>
(() => {
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const frame = document.getElementById('frame');
  const appInput = document.getElementById('appPath');
  const appLabel = document.getElementById('appLabel');

  const vars = Object.create(null);
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function log(msg, cls="") {
    const d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function resolveArg(x){
    if (typeof x === "string" && x.startsWith("$")) return vars[x.slice(1)];
    return x;
  }

  function q(sel) {
    const el = frame.contentDocument?.querySelector(sel);
    if (!el) throw new Error(`Missing element: ${sel}`);
    return el;
  }

  async function waitFor(sel, ms=2000){
    const t0 = performance.now();
    while (performance.now() - t0 < ms){
      const el = frame.contentDocument?.querySelector(sel);
      if (el) return el;
      await sleep(25);
    }
    throw new Error(`Timeout waiting for ${sel}`);
  }

  function rect(el){ return el.getBoundingClientRect(); }

  function expectContained(childSel, parentSel, pad=0){
    const child = q(childSel);
    const parent = q(parentSel);
    const c = rect(child);
    const p = rect(parent);
    if (c.left < p.left - pad || c.top < p.top - pad || c.right > p.right + pad || c.bottom > p.bottom + pad){
      throw new Error(`Overflow: ${childSel} (${c.left.toFixed(1)},${c.top.toFixed(1)},${c.right.toFixed(1)},${c.bottom.toFixed(1)}) not within ${parentSel} (${p.left.toFixed(1)},${p.top.toFixed(1)},${p.right.toFixed(1)},${p.bottom.toFixed(1)})`);
    }
  }

  function count(sel){ return frame.contentDocument?.querySelectorAll(sel).length ?? 0; }

  function dispatchPointer(type, x, y, opts={}){
    const doc = frame.contentDocument;
    const win = frame.contentWindow;
    const el = doc.elementFromPoint(x, y);
    if (!el) throw new Error(`No element at point (${x.toFixed(1)},${y.toFixed(1)})`);
    const ev = new PointerEvent(type, {
      bubbles:true, cancelable:true, view: win,
      clientX:x, clientY:y,
      pointerId: opts.pointerId ?? 1,
      pointerType: opts.pointerType ?? "mouse",
      buttons: opts.buttons ?? (type === "pointerdown" ? 1 : 0),
      pressure: opts.pressure ?? (type === "pointerdown" ? 0.5 : 0),
      isPrimary: true
    });
    el.dispatchEvent(ev);
  }

  async function dragSquare(fromSq, toSq, durationMs=120){
    const w = frame.contentWindow;
    if (typeof w.__getSquareCenter !== "function"){
      throw new Error("App missing __getSquareCenter(sq) helper for dragSquare");
    }
    const a = w.__getSquareCenter(fromSq);
    const b = w.__getSquareCenter(toSq);
    if (!a || !b) throw new Error(`__getSquareCenter returned null for ${fromSq} or ${toSq}`);

    const steps = Math.max(4, Math.floor(durationMs / 20));
    dispatchPointer("pointerdown", a.x, a.y, {buttons:1});
    await sleep(16);
    for (let i=1;i<steps;i++){
      const t = i/(steps-1);
      dispatchPointer("pointermove", a.x + (b.x-a.x)*t, a.y + (b.y-a.y)*t, {buttons:1});
      await sleep(16);
    }
    dispatchPointer("pointerup", b.x, b.y, {buttons:0});
    await sleep(40);
  }

  async function stepExec(step){
    const [op, ...raw] = step;
    const args = raw.map(resolveArg);

    switch(op){
      case "sleep": await sleep(args[0]||0); return;
      case "waitFor": await waitFor(args[0], args[1] ?? 2000); return;
      case "click": q(args[0]).dispatchEvent(new MouseEvent("click", {bubbles:true, cancelable:true, view: frame.contentWindow})); await sleep(10); return;
      case "expectVisible": await waitFor(args[0], 500); return;

      case "expectContains": {
        const a0 = args[0];
        const needle = String(args[1] ?? "");
        const readSel = (sel) => {
          const el = q(sel);
          if (el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) return (el.value || "").trim();
          return (el.textContent || "").trim();
        };
        const hay = (typeof a0 === "string" && (a0.startsWith("#") || a0.startsWith(".") || a0.includes("[")))
          ? readSel(a0)
          : String(a0);
        if (!String(hay).includes(needle)) throw new Error(`expectContains failed: "${needle}" not in "${String(hay)}"`);
        return;
      }

      case "expectNotEqual": {
        const left = String(args[0]);
        const right = String(args[1]);
        if (left === right) throw new Error(`expectNotEqual failed: both "${left}"`);
        return;
      }

      case "storeText": {
        const el = q(args[0]);
        vars[args[1]] = (el.value != null && (el.tagName === "TEXTAREA" || el.tagName === "INPUT")) ? (el.value || "").trim() : (el.textContent || "").trim();
        log(`stored $${args[1]} = ${JSON.stringify(vars[args[1]])}`, "dim");
        return;
      }

      case "countAtLeast": {
        const n = count(args[0]);
        if (n < args[1]) throw new Error(`countAtLeast failed: ${args[0]} had ${n}, need >= ${args[1]}`);
        return;
      }

      case "expectContained": expectContained(args[0], args[1], args[2] ?? 0); return;
      case "dragSquare": await dragSquare(String(args[0]), String(args[1]), args[2] ?? 120); return;

      case "timeUnder": {
        const [budgetMs, steps] = args;
        const t0 = performance.now();
        for (const s of steps) await stepExec(s);
        const dt = performance.now() - t0;
        if (dt > budgetMs) throw new Error(`timeUnder failed: ${dt.toFixed(1)}ms > ${budgetMs}ms`);
        return;
      }

      default:
        log(`SKIP op ${op}`, "skip");
        return;
    }
  }

  function parseTests(src){
    const blocks = src.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    const tests = [];
    for (const b of blocks){
      const rawLines = b.split("\n").map(l => l.replace(/\r/g,""));
      const lines = rawLines.map(l => l.trim()).filter(l => l && !l.startsWith("#"));
      if (!lines.length) continue;
      const nameLine = lines.shift();
      if (!nameLine.startsWith("TEST ")) continue;
      const name = nameLine.slice(5).trim();

      const steps = [];
      let buf = "";
      for (const line of lines){
        buf = buf ? (buf + "\n" + line) : line;
        try{
          const step = JSON.parse(buf);
          steps.push(step);
          buf = "";
        }catch(e){
          // keep buffering
        }
      }
      if (buf.trim()) throw new Error("Could not parse JSON step (incomplete/invalid):\n" + buf);
      tests.push({name, steps});
    }
    return tests;
  }

  async function loadText(path){
    const r = await fetch(path, {cache:"no-store"});
    if (!r.ok) throw new Error(`${r.status} ${r.statusText} for ${path}`);
    return await r.text();
  }

  function getDefaultApp(){
    const u = new URL(location.href);
    return u.searchParams.get("app") || "reducer.html";
  }

  function setApp(){
    const app = appInput.value.trim() || getDefaultApp();
    appInput.value = app;
    frame.src = app;
    appLabel.textContent = app;
  }

  async function run(){
    logEl.innerHTML = "";
    for (const k of Object.keys(vars)) delete vars[k];

    statusEl.textContent = "loading tests…";
    let testsText;
    try{
      testsText = await loadText("reducertests.txt");
      log(`✔ Loaded reducertests.txt (${testsText.length} bytes)`, "ok");
      log("--- preview ---\n" + testsText.split("\n").slice(0, 18).join("\n") + "\n--- end preview ---", "dim");
    }catch(e){
      log(`✘ FAILED to load reducertests.txt: ${e}`, "fail");
      statusEl.textContent = "failed (tests not loaded)";
      return;
    }

    let tests;
    try{
      tests = parseTests(testsText);
      log(`✔ Parsed ${tests.length} TEST blocks`, tests.length ? "ok" : "warn");
    }catch(e){
      log(`✘ FAILED to parse tests: ${e.message || e}`, "fail");
      statusEl.textContent = "failed (parse error)";
      return;
    }

    statusEl.textContent = "running";
    let pass = 0;

    for (const t of tests){
      log("\nTEST: " + t.name, "dim");

      frame.contentWindow.location.reload();
      await sleep(450);

      try{
        for (const s of t.steps){
          log("  " + JSON.stringify(s));
          await stepExec(s);
        }
        log("✔ PASS " + t.name, "pass");
        pass++;
      }catch(e){
        log("✘ FAIL " + t.name, "fail");
        log(String(e && e.message ? e.message : e), "fail");
      }
    }

    statusEl.textContent = `done (${pass}/${tests.length})`;
  }

  async function runWithFreshLoad(){
    setApp();
    await new Promise(r => frame.addEventListener("load", r, {once:true}));
    await run();
  }

  document.getElementById("runBtn").addEventListener("click", runWithFreshLoad);
  document.getElementById("reloadBtn").addEventListener("click", () => frame.contentWindow.location.reload());

  appInput.value = getDefaultApp();
  setApp();
  log("Ready. Click Run. Default app is reducer.html. Tests loaded from reducertests.txt.", "dim");
})();
</script>
</body>
</html>
