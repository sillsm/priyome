<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Proof Worksheet Builder</title>
  <style>
    :root {
      --bg: #f5f6f4;
      --panel: #ffffff;
      --ink: #151b17;
      --muted: #647069;
      --line: #d7ddd9;
      --heavy: #1f2923;
      --accent: #245f45;
      --accent-soft: #e8f2ed;
      --bad: #9d2c2c;
      --bad-soft: #fff0f0;
      --ok: #1f6b3a;
      --ok-soft: #edf8f1;
      --code: #101614;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 { font-size: 17px; margin: 0; letter-spacing: -0.02em; }

    .status {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--line);
      background: var(--ok-soft);
      color: var(--ok);
    }
    .status.bad { background: var(--bad-soft); color: var(--bad); }

    main {
      display: grid;
      grid-template-columns: minmax(520px, 1fr) minmax(520px, 1fr);
      gap: 14px;
      padding: 14px;
      max-width: 1720px;
      margin: 0 auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(20, 30, 24, 0.04);
    }

    .panel h2 {
      margin: 0;
      padding: 11px 13px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      background: #fbfcfb;
    }

    .body { padding: 13px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 750;
      color: var(--muted);
      margin: 9px 0 4px;
    }

    input, textarea, select, button { font: inherit; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      background: white;
      color: var(--ink);
    }

    textarea {
      min-height: 62px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      background: white;
      cursor: pointer;
      font-weight: 700;
    }
    button.soft { background: var(--accent-soft); color: var(--accent); border-color: #bcd8cb; }
    button.danger { color: var(--bad); }

    .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .intro-box, .proof-box {
      border: 2px solid var(--heavy);
      background: #fff;
      border-radius: 8px;
      margin: 12px 0;
      overflow: hidden;
    }

    .box-head {
      background: #f0f2f1;
      border-bottom: 2px solid var(--heavy);
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 850;
    }

    .box-body { padding: 10px; }

    .worksheet-line {
      border-top: 1px solid var(--line);
      margin-top: 10px;
      padding-top: 10px;
    }

    .obs-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px;
      align-items: end;
      margin: 7px 0;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px 10px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfbfa;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--ink);
      font-weight: 650;
      font-size: 12px;
    }

    .checks input { width: auto; }

    .hint { color: var(--muted); font-size: 12px; margin-top: 5px; }

    .right-grid { display: grid; grid-template-rows: auto auto auto; gap: 14px; }
    .dual { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      color: var(--code);
      background: #fbfbfa;
      min-height: 260px;
      padding: 13px;
      overflow: auto;
    }

    .schema-editor {
      min-height: 300px;
      border: 0;
      border-radius: 0;
      background: #fbfbfa;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .errors {
      border-top: 1px solid var(--line);
      padding: 10px 13px;
      background: var(--bad-soft);
      color: var(--bad);
      display: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .errors.show { display: block; }


    .mini-board-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .mini-board-card {
      width: 138px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 6px;
      overflow: hidden;
    }

    .mini-board-title {
      font-size: 10px;
      font-weight: 850;
      color: var(--muted);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-board-host {
      width: 124px;
      height: 124px;
    }

    .mini-board-note {
      margin-top: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--muted);
      word-break: break-word;
    }

    .scratch-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .print-only { display: none; }

    @media (max-width: 1120px) {
      main, .dual { grid-template-columns: 1fr; }
      header { position: static; }
    }

    @media print {
      body { background: white; font-size: 11px; }
      header, .right-grid, .buttons, button, .hint { display: none !important; }
      main { display: block; padding: 0; max-width: none; }
      .panel { border: 0; box-shadow: none; border-radius: 0; }
      .panel h2 { display: none; }
      .body { padding: 0; }
      input, textarea, select {
        border: 0;
        border-bottom: 1px solid #111;
        border-radius: 0;
        padding: 2px 0;
        min-height: 18px;
      }
      textarea { min-height: 36px; }
      .intro-box, .proof-box { break-inside: avoid; page-break-inside: avoid; margin: 8px 0; }
      .box-head { padding: 5px 7px; }
      .box-body { padding: 7px; }
      .checks { border-color: #111; }
      .print-only { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Chess Proof Worksheet Builder</h1>
    <div id="status" class="status">Valid proof JSON</div>
  </header>

  <main>
    <section class="panel">
      <h2>Printable Worksheet / Form Builder</h2>
      <div class="body">
        <div class="intro-box">
          <div class="box-head">Intro / Theorem Setup</div>
          <div class="box-body">
            <div class="row">
              <div>
                <label>Proof title</label>
                <input id="title" value="">
              </div>
              <div>
                <label>Side to prove for</label>
                <select id="side">
                  <option value="white">white</option>
                  <option value="black">black</option>
                  <option value="side_to_move" selected>side to move</option>
                </select>
              </div>
            </div>

            <label>Initial FEN</label>
            <input id="fen" value="">
            <div id="initialFenBoardRow" class="mini-board-row"></div>
            <div id="scratchStatus" class="scratch-status">ScratchChess: loading…</div>

            <label>Claim / target result</label>
            <textarea id="claim"></textarea>

            <div class="row">
              <div>
                <label>Objective</label>
                <select id="objectiveKind">
                  <option value="eval_at_least" selected>eval at least</option>
                  <option value="mate">mate</option>
                  <option value="wins_material">wins material</option>
                  <option value="custom">custom</option>
                </select>
              </div>
              <div>
                <label>Objective value</label>
                <input id="objectiveValue" value="">
              </div>
            </div>
          </div>
        </div>

        <div class="buttons">
          <button class="soft" id="addBox">+ Proof box</button>
          <button class="soft" id="duplicateLastBox">+ Add next box from previous</button>
          <button id="clearWorksheet">Clear form</button>
          <button id="loadWorksheetExample">Load worksheet example</button>
          <button onclick="window.print()">Print worksheet</button>
        </div>

        <div id="boxes"></div>
      </div>
    </section>

    <section class="right-grid">
      <div class="dual">
        <section class="panel">
          <h2>Generated Markdown</h2>
          <pre id="markdownOut"></pre>
        </section>
        <section class="panel">
          <h2>Validated JSON</h2>
          <pre id="jsonOut"></pre>
          <div id="errors" class="errors"></div>
        </section>
      </div>
      <section class="panel">
        <h2>Reference JSON Schema</h2>
        <textarea id="schemaOut" class="schema-editor" spellcheck="false"></textarea>
      </section>
    </section>
  </main>

  <script>
    const PREDICATES = ['attacks', 'defends', 'loose', 'hanging', 'align', 'fork', 'check', 'mate_threat'];
    const REPLY_CLASSES = ['block', 'capture', 'move_king', 'capture_back', 'decline_capture', 'forced', 'other'];

    const state = {
      boxes: []
    };

    const schema = {
      $schema: 'https://json-schema.org/draft/2020-12/schema',
      title: 'ChessProofWorksheet.v1',
      type: 'object',
      required: ['title', 'side', 'claim', 'objective', 'boxes'],
      additionalProperties: false,
      properties: {
        title: { type: 'string', minLength: 1 },
        side: { enum: ['white', 'black', 'side_to_move'] },
        initialPosition: {
          type: 'object',
          required: ['fen'],
          additionalProperties: false,
          properties: { fen: { type: 'string', minLength: 1 } }
        },
        claim: { type: 'string', minLength: 1 },
        objective: {
          type: 'object',
          required: ['kind', 'value'],
          additionalProperties: false,
          properties: {
            kind: { enum: ['eval_at_least', 'mate', 'wins_material', 'custom'] },
            value: { type: 'string', minLength: 1 }
          }
        },
        boxes: { type: 'array', minItems: 1, items: { $ref: '#/$defs/proofBox' } }
      },
      $defs: {
        proofBox: {
          type: 'object',
          required: ['label', 'opponentsThreat', 'observations', 'replyClasses', 'candidateMoves', 'forcedSequences', 'conclusion', 'next'],
          additionalProperties: false,
          properties: {
            label: { type: 'string', minLength: 1 },
            headFen: { type: 'string', minLength: 1 },
            opponentsThreat: { type: 'string', minLength: 1 },
            observations: { type: 'array', minItems: 3, maxItems: 3, items: { $ref: '#/$defs/observationLine' } },
            replyClasses: { type: 'array', minItems: 1, items: { enum: ['block', 'capture', 'move_king', 'capture_back', 'decline_capture', 'forced', 'other'] } },
            candidateMoves: { $ref: '#/$defs/candidateMovesBox' },
            forcedSequences: { $ref: '#/$defs/forcedSequencesBox' },
            conclusion: { type: 'string', minLength: 1 },
            next: { type: 'string', minLength: 1 }
          }
        },
        candidateMovesBox: {
          type: 'object',
          required: ['moves'],
          additionalProperties: false,
          properties: { moves: { type: 'string', minLength: 1 } }
        },
        forcedSequencesBox: {
          type: 'object',
          required: ['sequences'],
          additionalProperties: false,
          properties: { sequences: { type: 'string', minLength: 1 } }
        },
        observationLine: {
          type: 'object',
          required: ['predicate', 'text'],
          additionalProperties: false,
          properties: {
            predicate: { enum: ['attacks', 'defends', 'loose', 'hanging', 'align', 'fork', 'check', 'mate_threat'] },
            text: { type: 'string', minLength: 1, predicateCall: true }
          }
        }
      }
    };

    const $ = id => document.getElementById(id);

    function proofFromForm() {
      const proof = {
        title: $('title').value.trim(),
        side: $('side').value,
        claim: $('claim').value.trim(),
        objective: { kind: $('objectiveKind').value, value: $('objectiveValue').value.trim() },
        boxes: state.boxes.map(b => {
          const box = {
            label: b.label.trim(),
            opponentsThreat: b.opponentsThreat.trim(),
            observations: b.observations.map(o => ({ predicate: o.predicate, text: o.text.trim() })),
            replyClasses: REPLY_CLASSES.filter(k => b.replyClasses[k]),
            candidateMoves: { moves: b.candidateMoves.moves.trim() },
            forcedSequences: { sequences: b.forcedSequences.sequences.trim() },
            conclusion: b.conclusion.trim(),
            next: b.next.trim()
          };
          if (b.headFen && b.headFen.trim()) box.headFen = b.headFen.trim();
          return box;
        })
      };
      const fen = $('fen').value.trim();
      if (fen) proof.initialPosition = { fen };
      return proof;
    }

    function markdownFor(proof) {
      const out = [];
      out.push(`# Proof: ${proof.title}`);
      out.push('', '## setup');
      out.push(`side: ${proof.side}`);
      if (proof.initialPosition) out.push(`fen: ${proof.initialPosition.fen}`);
      out.push('', '## claim', proof.claim);
      out.push('', '## objective', `${proof.objective.kind}: ${proof.objective.value}`);
      out.push('', '## worksheet boxes');
      proof.boxes.forEach((box, i) => {
        out.push('', `### box ${i + 1}: ${box.label}`);
        if (box.headFen) out.push(`head_fen: ${box.headFen}`);
        out.push(`opponents_threat: ${box.opponentsThreat}`);
        out.push('', 'observations:');
        box.observations.forEach(o => out.push(`- ${o.predicate}: ${o.text}`));
        out.push('', 'enemy_reply_classes:');
        box.replyClasses.forEach(c => out.push(`- ${c}`));
        out.push('', `candidate_moves: ${box.candidateMoves.moves}`);
        out.push(`candidate_forced_sequences: ${box.forcedSequences.sequences}`);
        out.push('', `conclusion: ${box.conclusion}`);
        out.push(`next: ${box.next}`);
      });
      return out.join('\n');
    }

    function renderBoxes() {
      const root = $('boxes');
      root.innerHTML = '';
      state.boxes.forEach((box, i) => {
        const el = document.createElement('div');
        el.className = 'proof-box';
        el.innerHTML = `
          <div class="box-head">
            <span>Proof Box ${i + 1}</span>
            <button class="danger" data-remove-box="${i}">remove</button>
          </div>
          <div class="box-body">
            <label>Box label / path name</label>
            <input data-box="${i}" data-field="label" value="${escapeHtml(box.label)}">

            <label>Head FEN for this box</label>
            <input data-box="${i}" data-field="headFen" value="${escapeHtml(box.headFen || '')}" placeholder="blank = use initial FEN">
            <div id="boxHeadBoard-${i}" class="mini-board-row"></div>

            <label>Opponent's threat</label>
            <textarea data-box="${i}" data-field="opponentsThreat">${escapeHtml(box.opponentsThreat)}</textarea>

            <div class="worksheet-line">
              <label>Three observations</label>
              ${box.observations.map((o, j) => `
                <div class="obs-row">
                  <select data-box="${i}" data-obs="${j}" data-obs-field="predicate">
                    ${PREDICATES.map(p => `<option value="${p}" ${o.predicate === p ? 'selected' : ''}>${p}</option>`).join('')}
                  </select>
                  <input data-box="${i}" data-obs="${j}" data-obs-field="text" value="${escapeHtml(o.text)}" placeholder="${predicatePlaceholder(o.predicate)}">
                </div>
              `).join('')}

              <label>Enemy reply class breakup</label>
              <div class="checks">
                ${REPLY_CLASSES.map(c => `
                  <label><input type="checkbox" data-box="${i}" data-reply="${c}" ${box.replyClasses[c] ? 'checked' : ''}> ${labelForReply(c)}</label>
                `).join('')}
              </div>
              <div class="hint">For check: block / capture / move king. For capture: capture back / decline capture.</div>
            </div>

            <label>Candidate moves</label>
            <input data-box="${i}" data-candidate-line="true" value="${escapeHtml(box.candidateMoves.moves)}" placeholder="1. Qh3+; 1. Bxh6; 1. Qxh8">


            <label>Candidate forced sequences</label>
            <input data-box="${i}" data-sequence-line="true" value="${escapeHtml(box.forcedSequences.sequences)}" placeholder="1. Qh3+ Kg1 2. Qxh8; 1. Qh3+ gxh3 2. Bxh6">
            <div class="buttons">
              <button class="soft" type="button" data-generate-sequence-boards="${i}">Generate forcing moves</button>
              <button class="soft" type="button" data-generate-mate-threats="${i}">Generate mate-in-1 threats</button>
            </div>
            <div id="sequenceBoards-${i}" class="mini-board-row"></div>
            <div id="mateThreatBoards-${i}" class="mini-board-row"></div>


            <label>Conclusion for this box</label>
            <textarea data-box="${i}" data-field="conclusion">${escapeHtml(box.conclusion)}</textarea>

            <label>Next box / coverage note</label>
            <textarea data-box="${i}" data-field="next">${escapeHtml(box.next)}</textarea>
          </div>
        `;
        root.appendChild(el);
      });
    }

    function labelForReply(c) {
      return ({ block: 'block check', capture: 'capture checker', move_king: 'move king', capture_back: 'capture back', decline_capture: 'decline capture', forced: 'forced', other: 'other' })[c];
    }

    function predicatePlaceholder(p) {
      return ({
        attacks: 'attacks(Q@h3, h8)',
        defends: 'defends(N@f4, h5)',
        loose: 'loose(r@h8)',
        hanging: 'hanging(q@d5)',
        align: 'align(r@h8, B@h3, K@h1)',
        fork: 'fork(Q@h3, K@h1, r@h8)',
        check: 'check(Qh3+)',
        mate_threat: 'mate_threat(Qxh7#)'
      })[p] || '';
    }

    function levenshtein(a, b) {
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
        }
      }
      return dp[a.length][b.length];
    }

    function nearestPredicate(name) {
      let best = null;
      let bestScore = Infinity;
      PREDICATES.forEach(p => {
        const score = levenshtein(name, p);
        if (score < bestScore) { best = p; bestScore = score; }
      });
      return bestScore <= 3 ? best : null;
    }

    function validatePredicateCall(value, declaredPredicate, path) {
      const errors = [];
      const raw = String(value || '').trim();
      const m = raw.match(new RegExp('^([a-zA-Z_][a-zA-Z0-9_]*) *[(](.*)[)]$'));
      if (!m) {
        errors.push(`${path}: observation text should be a predicate call like ${declaredPredicate}(...) but got ${JSON.stringify(raw)}.`);
        return errors;
      }
      const actual = m[1];
      if (!PREDICATES.includes(actual)) {
        const suggestion = nearestPredicate(actual);
        errors.push(`${path}: unknown predicate "${actual}" in ${JSON.stringify(raw)}.${suggestion ? ` Did you mean "${suggestion}(...)"?` : ''} Allowed predicates: ${PREDICATES.join(', ')}.`);
        return errors;
      }
      if (actual !== declaredPredicate) {
        errors.push(`${path}: dropdown says "${declaredPredicate}" but the text starts with "${actual}(...)". Make these match, or change the dropdown.`);
      }
      const args = m[2].split(',').map(s => s.trim()).filter(Boolean);
      const arity = { attacks: 2, defends: 2, loose: 1, hanging: 1, align: 3, fork: 3, check: 1, mate_threat: 1 }[actual];
      if (args.length !== arity) {
        errors.push(`${path}: ${actual}(...) expects ${arity} argument${arity === 1 ? '' : 's'}, but found ${args.length}: ${JSON.stringify(args)}.`);
      }
      return errors;
    }

    function validateWorksheetSemantics(proof) {
      const errors = [];
      proof.boxes.forEach((box, i) => {
        box.observations.forEach((obs, j) => {
          if (!obs.text.trim()) return;
          errors.push(...validatePredicateCall(obs.text, obs.predicate, `$.boxes[${i}].opponentsThreat.observations[${j}].text`));
        });
      });
      return errors;
    }

    function validateValue(value, rule, path, rootSchema) {
      const errors = [];
      const fail = msg => errors.push(`${path}: ${msg}`);
      if (rule.$ref) return validateValue(value, rootSchema.$defs[rule.$ref.replace('#/$defs/', '')], path, rootSchema);
      if (rule.enum) {
        if (!rule.enum.includes(value)) fail(`expected one of ${rule.enum.join(', ')}, but got ${JSON.stringify(value)}`);
        return errors;
      }
      if (rule.type === 'object') {
        if (!value || typeof value !== 'object' || Array.isArray(value)) return [`${path}: expected object, but got ${Array.isArray(value) ? 'array' : typeof value}`];
        (rule.required || []).forEach(k => { if (!(k in value)) fail(`missing required property "${k}"`); });
        if (rule.additionalProperties === false) Object.keys(value).forEach(k => { if (!rule.properties || !(k in rule.properties)) fail(`additional property "${k}" is not allowed by schema`); });
        Object.keys(rule.properties || {}).forEach(k => { if (k in value) errors.push(...validateValue(value[k], rule.properties[k], `${path}.${k}`, rootSchema)); });
      }
      if (rule.type === 'array') {
        if (!Array.isArray(value)) return [`${path}: expected array, but got ${typeof value}`];
        if (rule.minItems && value.length < rule.minItems) fail(`expected at least ${rule.minItems} item(s), but found ${value.length}`);
        if (rule.maxItems && value.length > rule.maxItems) fail(`expected at most ${rule.maxItems} item(s), but found ${value.length}`);
        value.forEach((item, i) => errors.push(...validateValue(item, rule.items, `${path}[${i}]`, rootSchema)));
      }
      if (rule.type === 'string') {
        if (typeof value !== 'string') return [`${path}: expected string, but got ${typeof value}`];
        if (rule.minLength && value.length < rule.minLength) fail(`expected at least ${rule.minLength} character(s), but field is blank`);
      }
      return errors;
    }

    function hasMeaningfulContent(proof) {
      return Boolean(
        proof.title ||
        proof.claim ||
        proof.objective.value ||
        proof.initialPosition ||
        proof.boxes.length
      );
    }

    function pruneBlankDraftFields(value) {
      if (Array.isArray(value)) return value.map(pruneBlankDraftFields).filter(v => {
        if (v === '') return false;
        if (Array.isArray(v)) return v.length > 0;
        if (v && typeof v === 'object') return Object.keys(v).length > 0;
        return true;
      });
      if (value && typeof value === 'object') {
        const out = {};
        Object.keys(value).forEach(k => {
          const v = pruneBlankDraftFields(value[k]);
          if (v === '') return;
          if (Array.isArray(v) && v.length === 0) return;
          if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length === 0) return;
          out[k] = v;
        });
        return out;
      }
      return value;
    }

    function validateDraftCompleteness(proof) {
      const errors = [];
      if (!hasMeaningfulContent(proof)) return errors;
      proof.boxes.forEach((box, i) => {
        const boxStarted = Boolean(
          box.label || box.headFen || box.opponentsThreat || box.conclusion || box.next ||
          box.replyClasses.length ||
          box.observations.some(o => o.text) ||
          box.candidateMoves.moves ||
          box.forcedSequences.sequences
        );
        if (!boxStarted) return;
        if (!box.replyClasses.length) errors.push(`$.boxes[${i}].opponentsThreat.replyClasses: choose at least one enemy reply class once you start using this box.`);
      });
      return errors;
    }

    function validate(proof) {
      let activeSchema;
      try { activeSchema = JSON.parse($('schemaOut').value); }
      catch (e) { return [`schema: invalid JSON: ${e.message}`]; }
      if (!hasMeaningfulContent(proof)) return [];
      return [...validateDraftCompleteness(proof), ...validateWorksheetSemantics(proof)];
    }

    function blankBox(label) {
      return {
        label,
        headFen: '',
        opponentsThreat: '',
        observations: [
          { predicate: 'check', text: '' },
          { predicate: 'loose', text: '' },
          { predicate: 'attacks', text: '' }
        ],
        replyClasses: { block: false, capture: false, move_king: false, capture_back: false, decline_capture: false, forced: false, other: false },
        candidateMoves: { moves: '' },
        forcedSequences: { sequences: '' },
        conclusion: '',
        next: ''
      };
    }

    function render() {
      const proof = proofFromForm();
      $('markdownOut').textContent = markdownFor(proof);
      $('jsonOut').textContent = JSON.stringify(proof, null, 2);
      const errors = validate(proof);
      $('errors').textContent = errors.join('\n');
      $('errors').classList.toggle('show', errors.length > 0);
      $('status').textContent = errors.length ? `${errors.length} validation error(s)` : 'Valid proof JSON';
      $('status').classList.toggle('bad', errors.length > 0);
      document.dispatchEvent(new CustomEvent('worksheet:rendered'));
    }

    function rerender() { renderBoxes(); render(); }

    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }

    document.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.box !== undefined) {
        const box = state.boxes[Number(t.dataset.box)];
        if (t.dataset.field) box[t.dataset.field] = t.value;
        if (t.dataset.obsField) box.observations[Number(t.dataset.obs)][t.dataset.obsField] = t.value;
        if (t.dataset.reply) box.replyClasses[t.dataset.reply] = t.checked;
        if (t.dataset.candidateLine) box.candidateMoves.moves = t.value;
        if (t.dataset.sequenceLine) box.forcedSequences.sequences = t.value;
      }
      render();
    });

    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.box !== undefined) {
        const box = state.boxes[Number(t.dataset.box)];
        if (!box) return;
        if (t.dataset.obsField) box.observations[Number(t.dataset.obs)][t.dataset.obsField] = t.value;
        if (t.dataset.reply) box.replyClasses[t.dataset.reply] = t.checked;
      }
      render();
    });

    document.addEventListener('click', e => {
      const t = e.target;
      if (t.id === 'addBox') {
        state.boxes.push(blankBox('new path'));
        rerender();
      }
      if (t.id === 'duplicateLastBox') {
        const prev = state.boxes[state.boxes.length - 1] || blankBox('new path');
        const copy = JSON.parse(JSON.stringify(prev));
        copy.label = `next after ${prev.label || 'previous box'}`;
        copy.candidateMoves = { moves: '' };
        copy.forcedSequences = { sequences: '' };
        copy.conclusion = '';
        copy.next = '';
        state.boxes.push(copy);
        rerender();
      }
      if (t.dataset.removeBox !== undefined) {
        state.boxes.splice(Number(t.dataset.removeBox), 1);
        rerender();
      }
      if (t.id === 'clearWorksheet') {
        $('title').value = '';
        $('side').value = 'side_to_move';
        $('fen').value = '';
        $('claim').value = '';
        $('objectiveKind').value = 'eval_at_least';
        $('objectiveValue').value = '';
        state.boxes = [];
        rerender();
      }
      if (t.id === 'loadWorksheetExample') {
        $('title').value = 'Two-reply check proof';
        $('side').value = 'side_to_move';
        $('fen').value = '';
        $('claim').value = 'Observe an alignment and a checking move. Split enemy replies. Prove each reply class reaches the same objective.';
        $('objectiveKind').value = 'wins_material';
        $('objectiveValue').value = '+2';
        state.boxes = [
          {
            label: 'root split',
            headFen: '',
            opponentsThreat: 'Qh3+',
            observations: [
              { predicate: 'align', text: 'align(r@h8, B@h3, K@h1)' },
              { predicate: 'check', text: 'check(Qh3+)' },
              { predicate: 'fork', text: 'fork(Q@h3, K@h1, r@h8)' }
            ],
            replyClasses: { block: true, capture: true, move_king: true, capture_back: false, decline_capture: false, forced: false, other: false },
            candidateMoves: { moves: '1. Qh3+' },
            forcedSequences: { sequences: '1. Qh3+ {block/capture} continue in path A; 1. Qh3+ {king move} Qxh8' },
            conclusion: 'Enemy has two practical reply classes: block/capture or king move.',
            next: 'Work out each reply class in a separate following box.'
          },
          {
            label: 'path A: block or capture',
            headFen: '',
            opponentsThreat: 'The blocker/capturer becomes removable or overloaded.',
            observations: [
              { predicate: 'attacks', text: 'attacks(B@c1, h6)' },
              { predicate: 'loose', text: 'loose(blocker@h6)' },
              { predicate: 'defends', text: 'defends(K@g1, h2)' }
            ],
            replyClasses: { block: true, capture: true, move_king: false, capture_back: false, decline_capture: false, forced: false, other: false },
            candidateMoves: { moves: '# path A candidate here' },
            forcedSequences: { sequences: '# path A line here' },
            conclusion: 'This class reaches the target result.',
            next: 'QED for path A.'
          },
          {
            label: 'path B: king move',
            headFen: '',
            opponentsThreat: 'Original fork target remains loose after king reply.',
            observations: [
              { predicate: 'loose', text: 'loose(r@h8)' },
              { predicate: 'attacks', text: 'attacks(Q@h3, h8)' },
              { predicate: 'check', text: 'check(Qh3+)' }
            ],
            replyClasses: { block: false, capture: false, move_king: true, capture_back: false, decline_capture: false, forced: false, other: false },
            candidateMoves: { moves: 'Qxh8' },
            forcedSequences: { sequences: '1. Qh3+ Kg1 2. Qxh8 wins material' },
            conclusion: 'Qxh8 wins material, so this class also reaches the target result.',
            next: 'All reply classes covered. QED.'
          }
        ];
        rerender();
      }
    });

    $('schemaOut').value = JSON.stringify(schema, null, 2);
    $('side').value = 'side_to_move';
    rerender();
  </script>

  <script type="module">
    import { createGame, BoardView } from 'https://priyomes.com/scratchchess.js';

    const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
    const statusEl = () => document.getElementById('scratchStatus');
    const setScratchStatus = (msg) => { const el = statusEl(); if (el) el.textContent = msg; };
    setScratchStatus('ScratchChess: loaded');

    function clearHost(host) {
      if (host) host.innerHTML = '';
    }

    function safeFen() {
      return String(document.getElementById('fen')?.value || '').trim();
    }

    function fenSideToMove(fen) {
      const parts = String(fen || '').trim().split(/\s+/g);
      return parts[1] === 'b' ? 'black' : 'white';
    }

    function worksheetBottomColor(fallbackFen = START_FEN) {
      // The whole worksheet uses the initial FEN orientation. If the generated
      // sequence FEN later has the other side to move, we still keep the same
      // bottom color so all miniboards are visually comparable.
      return fenSideToMove(safeFen() || fallbackFen || START_FEN);
    }

    function syncSideToMoveDefault() {
      const side = document.getElementById('side');
      if (side) side.value = 'side_to_move';
    }

    function orientGameFromFenSide(g, referenceFen) {
      const bottomColor = worksheetBottomColor(referenceFen);
      try { g.toggleFlip?.(bottomColor === 'black'); } catch {}
    }

    function makeGameFromFen(fen, title = 'Worksheet') {
      const g = createGame({ Event: title, Site: 'Worksheet' });
      try {
        if (fen) g.loadFEN?.(fen);
        orientGameFromFenSide(g, fen || START_FEN);
      } catch (e) {
        throw new Error('Could not load FEN: ' + String(e?.message || e));
      }
      return g;
    }

    function miniCard(title, fen, note = '') {
      const card = document.createElement('div');
      card.className = 'mini-board-card';
      card.dataset.fen = fen || START_FEN;
      card.dataset.title = title || 'generated position';
      card.title = 'Click to start a new proof box from this position';

      const titleEl = document.createElement('div');
      titleEl.className = 'mini-board-title';
      titleEl.textContent = title;

      const host = document.createElement('div');
      host.className = 'mini-board-host';

      const noteEl = document.createElement('div');
      noteEl.className = 'mini-board-note';
      noteEl.textContent = note || fen || '';

      card.appendChild(titleEl);
      card.appendChild(host);
      card.appendChild(noteEl);

      try {
        const g = makeGameFromFen(fen || START_FEN, title);
        g.toggleMini?.(true);
        new BoardView(host, g, { minSizePx: 90 });
      } catch (e) {
        host.textContent = String(e?.message || e);
      }
      return card;
    }

    function renderInitialFenBoard() {
      const host = document.getElementById('initialFenBoardRow');
      if (!host) return;
      clearHost(host);
      const fen = safeFen();
      if (!fen) return;
      syncSideToMoveDefault();
      const stm = fenSideToMove(fen);
      host.appendChild(miniCard(`initial FEN — ${stm} to move at bottom`, fen, fen));
    }


    function headFenForBox(boxIndex) {
      const box = state.boxes[boxIndex];
      return String((box && box.headFen) || safeFen() || START_FEN).trim();
    }

    function renderBoxHeadBoards() {
      state.boxes.forEach((box, i) => {
        const host = document.getElementById(`boxHeadBoard-${i}`);
        if (!host) return;
        clearHost(host);
        if (!box.headFen) return;
        host.appendChild(miniCard('box head FEN', box.headFen, box.headFen));
      });
    }

    function createBoxFromFen(fen, label = 'new head position', note = '') {
      const box = blankBox(label);
      box.headFen = fen;
      box.opponentsThreat = note || 'New branch from generated position.';
      state.boxes.push(box);
      rerender();
      setTimeout(() => {
        const boxes = document.querySelectorAll('.proof-box');
        const last = boxes[boxes.length - 1];
        if (last) last.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 0);
    }

    function splitSequences(text) {
      return String(text || '')
        .split(/\s*;\s*|\n+/g)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function tokenizePgnishMoves(sequence) {
      return String(sequence || '')
        .replace(/\{[^}]*\}/g, ' ')
        .replace(/\([^)]*\)/g, ' ')
        .replace(/\$\d+/g, ' ')
        .split(/\s+/g)
        .map(s => s.trim())
        .filter(Boolean)
        .filter(s => !/^\d+\.{1,3}$/.test(s))
        .filter(s => !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(s))
        .filter(s => !/^#/.test(s));
    }

    function pgnForPrefix(fen, tokens) {
      const tags = fen
        ? `[Event "Worksheet"]\n[Site "Local"]\n[SetUp "1"]\n[FEN "${fen}"]\n[Result "*"]\n\n`
        : `[Event "Worksheet"]\n[Site "Local"]\n[Result "*"]\n\n`;
      let body = '';
      for (let i = 0; i < tokens.length; i += 2) {
        const moveNo = Math.floor(i / 2) + 1;
        body += `${moveNo}. ${tokens[i]} `;
        if (tokens[i + 1]) body += `${tokens[i + 1]} `;
      }
      return tags + body.trim() + ' *';
    }

    function gameFromMovePrefix(fen, tokens) {
      const g = createGame({ Event: 'Worksheet prefix', Site: 'Local' });
      const pgn = pgnForPrefix(fen, tokens);
      g.loadPGN?.(pgn);
      try {
        // Many ScratchChess views start at root after loadPGN; walk to the end if possible.
        let guard = 0;
        while (guard++ < tokens.length + 4 && g.nextMove?.()) {}
      } catch {}
      return g;
    }

    function exportFen(g, fallbackFen) {
      try {
        const f = String(g.exportFEN?.() || '').trim();
        if (f) return f;
      } catch {}
      return fallbackFen || START_FEN;
    }

    const FILES = 'abcdefgh';

    function scratchSqName(i) {
      const f = i % 8;
      const r = 7 - Math.floor(i / 8);
      return FILES[f] + (r + 1);
    }

    function uciForMove(m, promo = '') {
      return scratchSqName(m.from) + scratchSqName(m.to) + String(promo || '').toLowerCase();
    }

    function legalMovesForPosition(g) {
      // The live ScratchChess Game exposes _allLegalMoves(color), where color is 'w' or 'b'.
      // It returns objects shaped like { from: <board index>, to: <board index> }.
      try {
        const color = g?.state?.side;
        if (color !== 'w' && color !== 'b') return [];
        const moves = g._allLegalMoves(color);
        return Array.isArray(moves) ? moves : [];
      } catch (e) {
        return [];
      }
    }

    function legalReplyCount(g) {
      return legalMovesForPosition(g).length;
    }

    function applyScratchMoveUCI(g, move) {
      const uci = uciForMove(move);
      const ok = g.makeMoveUCI?.(uci);
      if (!ok) return false;
      // ScratchChess pauses on promotion until a piece is chosen. For search, choose queen.
      if (g.state?.pendingPromotion) {
        try { g.resolvePendingPromotion?.('Q'); } catch { return false; }
      }
      return true;
    }

    function scratchSanForLastMove(g, fallbackMove) {
      try {
        const san = String(g.curNode?.san || '').trim();
        if (san) return san;
      } catch {}
      return uciForMove(fallbackMove);
    }

    function onePlyGameFromFenAndMove(fen, move) {
      const g = createGame({ Event: 'Worksheet forcing candidate', Site: 'Local' });
      g.loadFEN?.(fen || START_FEN);
      if (!applyScratchMoveUCI(g, move)) throw new Error('makeMoveUCI failed for ' + uciForMove(move));
      return g;
    }

    function generateSequenceBoards(boxIndex) {
      const host = document.getElementById(`sequenceBoards-${boxIndex}`);
      if (!host) return;
      clearHost(host);

      const fen = headFenForBox(boxIndex) || START_FEN;
      let base;
      try { base = makeGameFromFen(fen, 'forcing search root'); }
      catch (e) {
        host.appendChild(miniCard('bad FEN', START_FEN, String(e?.message || e)));
        return;
      }

      const moves = legalMovesForPosition(base);
      const forcing = [];

      for (const move of moves) {
        try {
          const after = onePlyGameFromFenAndMove(fen, move);
          const san = scratchSanForLastMove(after, move);
          const afterFen = exportFen(after, fen);
          const replies = legalReplyCount(after);
          if (replies <= 1) forcing.push({ san, uci: uciForMove(move), afterFen, replies });
        } catch (e) {
          // Keep search robust: one bad move application should not kill enumeration.
        }
      }

      const input = document.querySelector(`[data-box="${boxIndex}"][data-sequence-line]`);
      if (input) {
        input.value = forcing.map(x => x.san).join('; ');
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }

      if (!forcing.length) {
        host.appendChild(miniCard('no forcing moves', fen, `${moves.length} legal moves checked with _allLegalMoves(${base.state?.side}); none left opponent with 0 or 1 legal replies.`));
        return;
      }

      forcing.forEach((x, idx) => {
        const note = x.replies === 0 ? `${x.san} (${x.uci}): mate / 0 replies` : `${x.san} (${x.uci}): opponent has exactly 1 legal reply`;
        host.appendChild(miniCard(`${idx + 1}. ${x.san}`, x.afterFen, note));
      });
    }


    function fenWithSide(fen, color) {
      const parts = String(fen || START_FEN).trim().split(/\s+/);
      while (parts.length < 6) parts.push(parts.length === 1 ? 'w' : parts.length === 2 ? '-' : parts.length === 3 ? '-' : parts.length === 4 ? '0' : '1');
      parts[1] = color;
      return parts.join(' ');
    }

    function mateInOneMovesForColor(fen, color) {
      const g = makeGameFromFen(fenWithSide(fen, color), 'mate-in-one scan');
      const moves = legalMovesForPosition(g);
      const out = [];
      for (const move of moves) {
        try {
          const after = onePlyGameFromFenAndMove(fenWithSide(fen, color), move);
          const defender = after.state?.side;
          const replies = legalReplyCount(after);
          const isCheck = typeof after._isInCheck === 'function' ? after._isInCheck(defender) : false;
          if (replies === 0 && isCheck) {
            out.push({ san: scratchSanForLastMove(after, move), uci: uciForMove(move), afterFen: exportFen(after, fen), replies });
          }
        } catch {}
      }
      return out;
    }

    function generateMateThreats(boxIndex) {
      const host = document.getElementById(`mateThreatBoards-${boxIndex}`);
      if (!host) return;
      clearHost(host);

      const fen = headFenForBox(boxIndex) || START_FEN;
      let base;
      try { base = makeGameFromFen(fen, 'mate threat root'); }
      catch (e) {
        host.appendChild(miniCard('bad FEN', START_FEN, String(e?.message || e)));
        return;
      }

      const mover = base.state?.side;
      const candidates = legalMovesForPosition(base);
      const threats = [];

      for (const move of candidates) {
        try {
          const afterCandidate = onePlyGameFromFenAndMove(fen, move);
          const san = scratchSanForLastMove(afterCandidate, move);
          const afterFen = exportFen(afterCandidate, fen);
          const immediateThreats = mateInOneMovesForColor(afterFen, mover);
          if (!immediateThreats.length) continue;

          const replies = legalMovesForPosition(afterCandidate);
          let correctReplies = 0;
          let failingReplies = 0;
          for (const reply of replies) {
            try {
              const afterReply = onePlyGameFromFenAndMove(afterFen, reply);
              const replyFen = exportFen(afterReply, afterFen);
              const remainingMates = mateInOneMovesForColor(replyFen, mover);
              if (remainingMates.length) failingReplies++;
              else correctReplies++;
            } catch {}
          }

          if (failingReplies > 0 || replies.length === 0) {
            threats.push({ san, uci: uciForMove(move), afterFen, mateMoves: immediateThreats, replies: replies.length, correctReplies, failingReplies });
          }
        } catch {}
      }

      const input = document.querySelector(`[data-box="${boxIndex}"][data-candidate-line]`);
      if (input && threats.length) {
        input.value = threats.map(x => x.san).join('; ');
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }

      if (!threats.length) {
        host.appendChild(miniCard('no mate-in-1 threats', fen, `${candidates.length} legal moves checked; none created a mate-in-1 threat.`));
        return;
      }

      threats.forEach((x, idx) => {
        const mateList = x.mateMoves.map(m => m.san).join(', ');
        const note = `${x.san} (${x.uci}) threatens mate-in-1: ${mateList}. Replies: ${x.replies}; correct: ${x.correctReplies}; failing: ${x.failingReplies}.`;
        host.appendChild(miniCard(`${idx + 1}. ${x.san}`, x.afterFen, note));
      });
    }

    document.addEventListener('input', ev => {
      if (ev.target?.id === 'fen') renderInitialFenBoard();
    });

    document.addEventListener('worksheet:rendered', () => {
      renderInitialFenBoard();
      renderBoxHeadBoards();
    });

    document.addEventListener('click', ev => {
      const mini = ev.target.closest?.('.mini-board-card[data-fen]');
      if (mini && !ev.target.closest('button')) {
        ev.preventDefault();
        createBoxFromFen(mini.dataset.fen, `from ${mini.dataset.title || 'generated position'}`, mini.querySelector('.mini-board-note')?.textContent || '');
        return;
      }

      const btn = ev.target.closest?.('[data-generate-sequence-boards]');
      if (btn) {
        ev.preventDefault();
        generateSequenceBoards(Number(btn.dataset.generateSequenceBoards));
        return;
      }

      const mateBtn = ev.target.closest?.('[data-generate-mate-threats]');
      if (mateBtn) {
        ev.preventDefault();
        generateMateThreats(Number(mateBtn.dataset.generateMateThreats));
      }
    });

    renderInitialFenBoard();
  </script>
