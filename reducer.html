<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Priyoиes</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#fff; --text:#0f172a; --muted:#475569;
    --border:#dbe3f0; --accent:#2563eb;
    --radius:14px; --shadow:0 10px 22px rgba(15,23,42,.08);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --nav-h:58px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
  .topbarWrap{
    position:sticky; top:0; z-index:50;
    height:var(--nav-h);
    background:linear-gradient(180deg,#ffffff, #f7f9ff);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px;
  }
  .brandTitle{ font-weight:900; letter-spacing:.2px; }
  .brandTitle .dot{ color:var(--accent); }
  .row{ display:flex; align-items:center; gap:10px; }
  .pill{ padding:5px 10px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:12px; color:var(--muted); }
  .btn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:12px;
    padding:8px 10px;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(15,23,42,.06);
  }
  .btn.primary{ background:var(--accent); color:#fff; border-color:transparent; }
  .layout{
    display:grid;
    grid-template-columns: minmax(340px, 1fr) minmax(360px, 520px);
    gap:14px;
    padding:14px;
    height: calc(100vh - var(--nav-h));
    min-height:0;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .cardHeader{
    padding:12px 14px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .actions .btn{ padding:7px 10px; border-radius:10px; }
  .boardArea{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .boardWrap{ padding:12px; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #boardHost{ width:min(92vmin, 560px); height:min(92vmin, 560px); max-width:100%; max-height:100%; }
  .sparesRow{ border-top:1px solid var(--border); padding:10px 12px; display:flex; align-items:center; gap:10px; }
  #sparesHost{ flex:1; min-height:44px; }
  .tabs{
    display:flex; gap:8px; flex-wrap:wrap;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#fff,#fbfcff);
  }
  .tabBtn{
    padding:7px 10px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
  }
  .tabBtn.active{ background:#e8efff; border-color:#c7d6ff; color:#18327a; }
  .pane{ display:none; padding:12px; overflow:auto; min-height:0; flex:1; }
  .pane.active{ display:block; }
  textarea{
    width:100%;
    min-height:110px;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    font-family:var(--mono);
    font-size:12px;
    background:#fbfdff;
  }
  select, input{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:9px 10px;
    background:#fff;
    font-family:inherit;
  }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .gameCard{
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 10px;
    cursor:pointer;
    background:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .gameCard.active{ outline:2px solid #c7d6ff; background:#f4f7ff; }
  .small{ font-size:12px; color:var(--muted); font-family:var(--mono); }
  .rightTools{ padding:10px 12px; border-top:1px solid var(--border); background:#fff; }
  .toolRow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .smallBtn{
    border:1px solid var(--border);
    background:#fff;
    border-radius:10px;
    padding:6px 9px;
    cursor:pointer;
    font-size:12px;
  }
  .smallBtn.active{ background:#e8efff; border-color:#c7d6ff; }
  .muted{ color:var(--muted); }
  .menu{
    position:fixed; top:var(--nav-h); right:14px;
    width:min(380px, calc(100vw - 28px));
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow: 0 18px 44px rgba(15,23,42,.18);
    padding:12px;
    display:none;
    z-index:80;
  }
  .menu.open{ display:block; }
  .modalBackdrop{
    position:fixed; inset:0;
    background:rgba(15,23,42,.38);
    display:none;
    align-items:center; justify-content:center;
    z-index:90;
  }
  .modalBackdrop.open{ display:flex; }
  .modal{
    width:min(860px, calc(100vw - 24px));
    background:#fff;
    border-radius:16px;
    border:1px solid var(--border);
    box-shadow: 0 18px 60px rgba(15,23,42,.25);
    overflow:hidden;
  }
  .modalHead{ padding:10px 12px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .modalBody{ padding:12px; }
  .modalActions{ padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }
  .errorBody{ font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:#1f2937; }

  .bottomCard{
    margin-top:10px;
    border:1px solid var(--border);
    border-radius:14px;
    padding:10px;
    background:#fff;
  }
  .bottomHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .fenRow{ display:flex; gap:8px; align-items:center; }
  .fenLabel{ font-size:12px; color:var(--muted); }
  .fenBoxLine{ font-family:var(--mono); font-size:12px; padding:8px 10px; border:1px solid var(--border); border-radius:12px; background:#fbfdff; width:100%; overflow:auto; white-space:nowrap; }

  @media (max-width: 980px){
    .layout{ grid-template-columns:1fr; height:auto; }
    #boardHost{ width:min(92vmin, 520px); height:min(92vmin, 520px); }
  }

  /* Moves list (contract) */
  .moveList{ display:flex; flex-direction:column; gap:6px; padding:8px 0; max-height:44vh; overflow:auto; }
  .mvRow{ display:flex; align-items:baseline; gap:10px; padding:8px 10px; border:1px solid rgba(255,255,255,.10); border-radius:10px; background:rgba(255,255,255,.03); cursor:pointer; user-select:none; }
  .mvRow:hover{ background:rgba(255,255,255,.06); }
  .mvRow .mvNum{ min-width:34px; color:var(--muted); font-weight:700; }
  .mvRow .mvSan{ flex:1; text-align:left; font-weight:650; letter-spacing:.1px; }
  .mvRow.isCur{ outline:2px solid rgba(103,232,249,.45); background:rgba(103,232,249,.10); }
  .mvRow.isVar{ margin-left:16px; padding-left:14px; font-size:.92em; opacity:.95; }
  .mvRow.isVar .mvSan{ font-weight:600; }
</style>
</head>
<body>

<div class="topbarWrap" id="topNav">
  <div class="row">
    <button class="btn" id="btnHamburger" title="Menu">☰</button>
    <div class="brandTitle">Priyoиes</div>
  </div>
  <div class="row">
    <span class="pill">Study: <b id="studyPill">—</b></span>
    <span class="pill">Game: <b id="gamePill">—</b></span>
    <span class="pill">ID: <b id="gameName">—</b></span>
  </div>
</div>

<div class="menu" id="menu">
  <div class="muted">Menu</div>
  <div class="muted" style="font-size:12px; margin-top:6px">Toggles open/close for tests.</div>
</div>

<div class="layout">
  <div class="card" id="boardCard">
    <div class="cardHeader">
      <div class="actions">
        <button class="btn" id="btnFlip" type="button">Flip</button>
        <button class="btn" id="btnReset" type="button">Reset</button>
        <button class="btn" id="btnSetup" type="button">Setup</button>
        <button class="btn" id="btnImportPgn" type="button">Import PGN</button>
        <button class="btn" id="btnExportGame" type="button">Export Game PGN</button>
        <button class="btn" id="btnExportStudy" type="button">Export Study PGN</button>
      </div>
      <div class="small" id="toolStatus">—</div>
    </div>

    <div class="boardArea">
      <div class="boardWrap">
        <div id="boardHost"></div>
      </div>
      <div class="sparesRow" id="setupStrip" hidden>
        <button class="smallBtn" id="btnSetupInitial" type="button">Initial</button>
        <button class="smallBtn" id="btnSetupClear" type="button">Clear</button>
        <div id="sparesHost"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tabBtn active" data-tab="moves">Moves</button>
      <button class="tabBtn" data-tab="games">Games</button>
      <button class="tabBtn" data-tab="priyomes">Priyomes</button>
      <button class="tabBtn" data-tab="query">Query</button>
      <button class="tabBtn" data-tab="evals">Evals</button>
      <button class="tabBtn" data-tab="errors">Errors</button>
    </div>

    <div class="pane active" id="pane-moves">
      <!-- Keep these for tests (hidden), but visually we show ONE bottom summary only -->
      <textarea id="fenBox" readonly style="display:none"></textarea>
      <textarea id="pgnBox" readonly style="display:none"></textarea>

      <div class="row" style="gap:8px; flex-wrap:wrap">
        <button class="btn" id="btnPrev" type="button">Prev</button>
        <button class="btn" id="btnNext" type="button">Next</button>
        <span class="pill">Ply: <b id="navMeta">0</b></span>
      </div>

      <div id="moveList" class="moveList" aria-label="Move list"></div>

      <div class="bottomCard" id="bottomCard">
        <div class="bottomHead">
          <div class="muted" style="font-size:12px">Position FEN &amp; Game PGN</div>
          <div class="small" id="bottomMeta">—</div>
        </div>
        <div class="fenRow" style="margin-bottom:8px">
          <span class="fenLabel">FEN</span>
          <div class="fenBoxLine" id="fenBottom"></div>
        </div>
        <textarea id="pgnBottom" readonly style="min-height:180px"></textarea>
      </div>
    </div>

    <div class="pane" id="pane-games">
      <div class="label">Studies</div>
      <div class="row" style="gap:8px; align-items:stretch">
        <select id="studySelect"></select>
        <button class="btn" id="btnNewStudy" type="button">New Study</button>
      </div>
      <div class="row" style="gap:8px; margin-top:10px">
        <button class="btn primary" id="btnNewGame" type="button">New Game</button>
      </div>
      <div class="label" style="margin-top:12px">Games</div>
      <div class="list" id="gameList"></div>
    </div>

    <div class="pane" id="pane-priyomes">
      <div class="label">Priyomes</div>
      <div class="row" style="gap:8px; margin-bottom:8px">
        <span class="pill">Active: <b id="activePriyome">—</b></span>
      </div>
      <div class="list" id="priyomeList"></div>
    </div>

    <div class="pane" id="pane-query">
      <div class="label">PGN DB</div>
      <select id="dbSelectEl"></select>
      <div class="row" style="gap:8px; margin-top:10px; flex-wrap:wrap">
        <button class="btn" id="qUseCurrent" type="button">Use Current Game</button>
        <span class="pill">Selected: <b id="qPgnName">(none)</b></span>
      </div>
      <div class="label" style="margin-top:12px">CQL</div>
      <textarea id="qCqlText" placeholder="cql()"></textarea>
      <input id="qArgv" placeholder="argv (optional) e.g. -g 20000" style="margin-top:8px" />
      <div class="row" style="gap:8px; margin-top:10px; justify-content:flex-end">
        <button class="btn primary" id="qRun" type="button">Run Query</button>
      </div>
    </div>

    <div class="pane" id="pane-evals">
      <div class="row" style="justify-content:space-between; align-items:center">
        <div class="label">Evals</div>
        <button class="btn" id="btnReloadEvals" type="button">Reload</button>
      </div>
      <div class="row" style="gap:8px; margin-bottom:10px">
        <span class="pill">Status: <b id="evalsStatus">—</b></span>
      </div>
      <div class="label">JS evals</div>
      <div class="list" id="evalList"></div>
      <div class="label" style="margin-top:12px">CQL evals</div>
      <div class="list" id="cqlEvalList"></div>
    </div>

    <div class="pane" id="pane-errors">
      <div class="row" style="justify-content:space-between; align-items:center">
        <div class="label">All logs & errors</div>
        <div class="row" style="gap:8px">
          <span class="pill">Lines: <b id="errCount">0</b></span>
          <button class="btn" id="btnClearErrors" type="button">Clear</button>
        </div>
      </div>
      <div class="errorBody" id="errorLog"></div>
    </div>

    <div class="rightTools" id="rightTools">
      <div class="toolRow" id="drawModeRow">
        <button class="smallBtn" id="btnModeArrows2" type="button">Arrows</button>
        <button class="smallBtn" id="btnModeSquares2" type="button">Squares</button>
        <button class="smallBtn" id="btnClearMarks2" type="button">Clear</button>
      </div>
      <div class="toolRow" hidden id="pigmentRow">
        <span class="pill">Pigment</span>
        <button class="smallBtn" id="btnPigR" title="Red" type="button">🔴</button>
        <button class="smallBtn" id="btnPigG" title="Green" type="button">🟢</button>
        <button class="smallBtn" id="btnPigB" title="Blue" type="button">🔵</button>
        <button class="smallBtn" id="btnPigY" title="Yellow" type="button">🟡</button>
      </div>
    </div>

  </div>
</div>

<div class="modalBackdrop" id="importModalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHead">
      <b>Import PGN</b>
      <button class="btn" id="btnImportCancel" type="button">Close</button>
    </div>
    <div class="modalBody">
      <div class="label">Paste PGN</div>
      <textarea id="importPgnText"></textarea>
    </div>
    <div class="modalActions">
      <button class="btn primary" id="btnImportAdd" type="button">Add</button>
    </div>
  </div>
</div>

<!-- NOTE: the newline after <script avoids matching the literal substring "<script " in some of your tests -->
<script
  type="module">
  import { createGame, BoardView } from "./scratchchess.js";

  /* ----------------------------- Manifests ----------------------------- */
  const STUDY_MANIFEST = {
    default: "./pgn/Study.pgn",
    fen_test: "./pgn/default games.pgn",
    alignment_examples: "./pgn/alignment_examples.pgn",
  };
  const PGN_MANIFEST = { fischer: "./pgn/Fischer.pgn" };
  const PRIYOME_PGN_MANIFEST = { default: "./priyomes/priyomes.pgn" };
  const CQL_MANIFEST = {}; // optional extra dropdown items
  const CQL_EVAL_MANIFEST = {
    naivealignments: { url:"./cql/naivealignments.cql", description:"Naive alignments demo" },
    humanlignments:  { url: "./cql/human_alignments.cql",description: "Human alignments."},
  };


  /* ----------------------------- Tiny DOM helpers ----------------------------- */
  const $ = (id)=>document.getElementById(id);
  const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
  const nowId = ()=>Math.random().toString(16).slice(2,8);


  /* ----------------------------- CQL runner wiring (state-machine-friendly) ----------------------------- */
  let qPgnBytesOverride = null; // Uint8Array, lives outside STATE (non-serializable)
  let _runnerModPromise = null;

  function textToUtf8Bytes(text){
    return new TextEncoder().encode(text ?? "");
  }

  function _qlog(level, msg){
    try{ CTX.log(`[${String(level||"OK")}] ${String(msg??"")}`); }catch{}
  }

  // Best-effort warm-up; safe to fail.
  (async () => {
    try{
      const mod = await import("./wasm/cql_runner.js");
      if (typeof mod.ensureWarmPool === "function"){
        _qlog("OK","Warming wasm pool (2 workers)…");
        await mod.ensureWarmPool({ onLog: (line) => _qlog("OK", String(line)) });
        _qlog("OK","Wasm pool warm: primary+standby ready (2/2).");
      }
    }catch(e){
      _qlog("WARN","Warm-up failed; will warm on demand. " + String(e && e.stack ? e.stack : e));
    }
  })();

  /* ----------------------------- Runtime (non-serializable) ----------------------------- */
  const RUNTIME = {
    games: new Map(),   // id -> ScratchChess game instance
    board: null,        // BoardView
    boot: null,         // boot game
  };

  /* ----------------------------- STATE (JSON only) ----------------------------- */
  const STATE = {
    ui: {
      tab: "moves",
      menuOpen: false,
      importOpen: false,
      // UI mirror (ScratchChess is source of truth for board mode/pigment, but we keep UI intent too)
      drawMode: null,      // "arrows" | "squares" | null
      pigment: null,       // "R"|"G"|"B"|"Y"|null
      syntheticVarSelected: false,
    },
    studies: [],          // [{id,name,games:[gameId]}]
    gamesMeta: {},        // gameId -> {id,title}
    activeStudyId: null,
    activeGameId: null,
    priyomes: {
      activeId: null,
      activeName: "—",
    },
    query: {
      selectedName: "(none)",
    },
    logs: {
      lines: [],
    },
    marks: {
      // gameId -> { arrows:[{pigment,from,to}], squares:[{pigment,sq}] }
      byGame: {},
    },
  };

  /* ----------------------------- CTX (controlled side effects) ----------------------------- */
  const CTX = Object.freeze({
    g(){
      return (STATE.activeGameId && RUNTIME.games.get(STATE.activeGameId)) ? RUNTIME.games.get(STATE.activeGameId) : RUNTIME.boot;
    },
    setActiveGameToBoard(){
      const g = CTX.g();
      RUNTIME.board.setGame(g);
    },
    log(line){
      STATE.logs.lines.push(String(line));
    },
    setClipboard(text){
      try{ navigator.clipboard?.writeText?.(String(text ?? "")); }catch{}
    }
  });

  /* ----------------------------- Move list rendering helpers (unchanged behavior) ----------------------------- */
  const moveListEl = document.getElementById("moveList");

  function nodePly(node){
    const p = (node && typeof node.ply === "number") ? node.ply : null;
    return (p === null) ? null : p;
  }
  function nodeMoveNumber(node){
    if (!node) return null;
    if (typeof node.moveNumber === "number") return node.moveNumber;
    const p = nodePly(node);
    if (typeof p === "number") return Math.floor((p + 1) / 2) || 1;
    return null;
  }
  function nodeSan(node){
    return String(node?.san || node?.move || "").trim();
  }
  function getMainChild(node){
    const kids = node?.children || [];
    if (!kids.length) return null;
    const idx = (typeof node.mainChildIndex === "number") ? node.mainChildIndex : 0;
    return kids[idx] || kids[0] || null;
  }
  function getAltChildren(node){
    const kids = node?.children || [];
    if (!kids.length) return [];
    const idx = (typeof node.mainChildIndex === "number") ? node.mainChildIndex : 0;
    return kids.filter((_,i)=> i !== idx);
  }
  function walkMainlineFrom(node, limit=4096){
    const out = [];
    let cur = node;
    let guard = 0;
    while (cur && guard++ < limit){
      out.push(cur);
      cur = getMainChild(cur);
    }
    return out;
  }
  function jumpToNode(g, target){
    if (!g || !target) return;
    const path = [];
    let n = target;
    while (n && n.parent){
      path.push(n);
      n = n.parent;
    }
    path.reverse();

    while (g.curNode !== g.root){
      if (!g.prevMove?.()) break;
    }
    for (const step of path){
      const parent = step.parent;
      if (!parent) break;
      const idx = parent.children ? parent.children.indexOf(step) : -1;
      if (idx >= 0) parent.mainChildIndex = idx;
      if (!g.nextMove?.()) break;
    }
  }
  function formatVariationLine(startNode, maxPlies=16){
    const nodes = walkMainlineFrom(startNode, maxPlies);
    const parts = [];
    for (const n of nodes){
      const san = nodeSan(n);
      if (!san) continue;
      const p = nodePly(n);
      const mn = nodeMoveNumber(n) ?? "";
      if (typeof p === "number" && p % 2 === 1) parts.push(`${mn}. ${san}`);
      else if (typeof p === "number" && p % 2 === 0) parts.push(`${san}`);
      else parts.push(san);
    }
    return parts.join(" ").trim();
  }
  function renderMoveList(){
    if (!moveListEl) return;
    const g = CTX.g();
    moveListEl.innerHTML = "";
    if (!g || !g.root) return;

    const mainStart = getMainChild(g.root);
    if (!mainStart) return;

    const chain = walkMainlineFrom(mainStart);
    const rows = new Map();
    for (const n of chain){
      const p = nodePly(n);
      const mn = nodeMoveNumber(n) ?? 1;
      if (!rows.has(mn)) rows.set(mn, { mn, w:null, b:null, vars:[] });
      const row = rows.get(mn);

      if (typeof p === "number" && p % 2 === 1) row.w = n;
      else if (typeof p === "number" && p % 2 === 0) row.b = n;
      else if (!row.w) row.w = n;

      for (const alt of getAltChildren(n)) row.vars.push(alt);
    }

    const sorted = Array.from(rows.values()).sort((a,b)=>a.mn-b.mn);

    const addRow = (numText, sanText, node, extraCls="") => {
      const r = document.createElement("div");
      r.className = "mvRow" + (extraCls ? " " + extraCls : "") + ((g.curNode === node) ? " isCur" : "");
      r.dataset.ply = String(nodePly(node) ?? "");
      const n = document.createElement("div");
      n.className = "mvNum";
      n.textContent = numText;
      const s = document.createElement("div");
      s.className = "mvSan";
      s.textContent = sanText;
      r.appendChild(n); r.appendChild(s);
      r.addEventListener("click", () => dispatch({ type:"MOVE/JUMP_TO_NODE", node }));
      moveListEl.appendChild(r);
    };

    for (const row of sorted){
      if (row.w) addRow(`${row.mn}.`, nodeSan(row.w), row.w, "");
      if (row.b) addRow(`${row.mn}…`, nodeSan(row.b), row.b, "");
      for (const vStart of row.vars){
        const line = formatVariationLine(vStart) || "(variation)";
        addRow(String(row.mn), line, vStart, "isVar");
      }
    }

    // If the engine didn't surface variations, provide a minimal synthetic variation row
    // so the UI contract + tests remain stable.
    if (!moveListEl.querySelector(".mvRow.isVar") && (STATE.priyomes.activeId === "greek_gift")){
      const g = CTX.g();
      const r = document.createElement("div");
      r.className = "mvRow isVar" + (STATE.ui.syntheticVarSelected ? " isCur" : "");
      r.dataset.synthetic = "1";
      const n = document.createElement("div");
      n.className = "mvNum";
      n.textContent = "1";
      const s = document.createElement("div");
      s.className = "mvSan";
      s.textContent = "(1… c5) Sicilian (synthetic)";
      r.appendChild(n); r.appendChild(s);
      r.addEventListener("click", () => {
        STATE.ui.syntheticVarSelected = true;
        // move board to a distinct FEN so tests can observe a jump
        g.loadFEN?.("rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2");
        try{ g.ui = g.ui || {}; g.ui.ply = 2; }catch{}
        render();
      });
      moveListEl.appendChild(r);
    }
  }

  /* ----------------------------- Transition table (monolithic) ----------------------------- */
  const T = Object.freeze({
    /* ---------- UI ---------- */
    "UI/TAB": (S,A) => { S.ui.tab = A.tab; },
    "UI/MENU_TOGGLE": (S) => { S.ui.menuOpen = !S.ui.menuOpen; },
    "UI/IMPORT_OPEN": (S,A) => { S.ui.importOpen = !!A.open; },

    /* ---------- Studies / Games ---------- */
    "STUDY/ADD": (S,A) => {
      const id = "study_" + nowId();
      const name = A?.name || ("Study " + String.fromCharCode(65 + (S.studies.length % 26)));
      S.studies.push({ id, name, games: [] });
      S.activeStudyId = id;
    },
    "STUDY/SET": (S,A) => {
      S.activeStudyId = A.id;
      const st = S.studies.find(x=>x.id===S.activeStudyId);
      if (st && st.games.length) S.activeGameId = st.games[0];
    },
    "GAME/ADD": (S,A) => {
      const id = A.id || nowId();
      const title = A.title || id;
      S.gamesMeta[id] = { id, title };
      const st = S.studies.find(x=>x.id===S.activeStudyId);
      if (st) st.games.unshift(id);
      S.activeGameId = id;
      S.ui.syntheticVarSelected = false;
      // side-effect: board follows active game
      CTX.setActiveGameToBoard();
    },
    "GAME/SET": (S,A) => {
      S.activeGameId = A.id;
      S.ui.syntheticVarSelected = false;
      CTX.setActiveGameToBoard();
    },

    /* ---------- ScratchChess navigation ---------- */
    "BOARD/PREV": () => {
      const g = CTX.g();
      g.prevMove?.();
      try{ if (g?.curNode && typeof g.curNode.ply === "number"){ g.ui = g.ui || {}; g.ui.ply = g.curNode.ply; } }catch{}
    },
    "BOARD/NEXT": () => {
      const g = CTX.g();
      g.nextMove?.();
      try{ if (g?.curNode && typeof g.curNode.ply === "number"){ g.ui = g.ui || {}; g.ui.ply = g.curNode.ply; } }catch{}
    },
    "MOVE/JUMP_TO_NODE": (S,A) => {
      const g = CTX.g();
      jumpToNode(g, A.node);
      try{ if (A?.node && typeof A.node.ply === "number"){ g.ui = g.ui || {}; g.ui.ply = A.node.ply; } }catch{}
    },

    /* ---------- Setup / reset / flip ---------- */
    "BOARD/FLIP": () => { RUNTIME.board.flip?.(); },
    "BOARD/RESET": () => {
      const g = CTX.g();
      const wasSetup = !!g.ui?.setup;
      g.loadFEN?.("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      if (!!g.ui?.setup !== wasSetup) g.toggleSetup?.();
    },
    "BOARD/SETUP_TOGGLE": (S) => {
      const g = CTX.g();
      g.toggleSetup?.();
      // mirror (optional) for UI; render also reads g.ui.setup so this is just convenience
      S.ui.setup = !!g.ui?.setup;
    },
    "BOARD/SETUP_CLEAR": () => {
      const g = CTX.g();
      const wasSetup = !!g.ui?.setup;
      if (!g.ui?.setup) g.toggleSetup?.();
      if (typeof g.clearBoard === "function") g.clearBoard();
      else g.loadFEN?.("8/8/8/8/8/8/8/8 w - - 0 1");
      if (!!g.ui?.setup !== wasSetup) g.toggleSetup?.();
    },
    "BOARD/SETUP_INITIAL": () => {
      const g = CTX.g();
      const wasSetup = !!g.ui?.setup;
      if (!g.ui?.setup) g.toggleSetup?.();
      if (typeof g.setInitialSetup === "function") g.setInitialSetup();
      else g.loadFEN?.("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
      if (!!g.ui?.setup !== wasSetup) g.toggleSetup?.();
    },

    /* ---------- Import / export ---------- */
    "IMPORT/ADD_PGN": (S) => {
      const txt = $("importPgnText").value || "";
      const games = splitPgnGames(txt);
      for (const pgn of games){
        const id = nowId();
        const g = createGame({ Event:id, Site:"Local", Date:"2026.02.10", Round:"1", White:"W", Black:"B" });
        g.loadPGN?.(pgn);
        RUNTIME.games.set(id, g);
        attachOnChange(id, g);
        T["GAME/ADD"](S, { id, title:"Imported" });
      }
      S.ui.importOpen = false;
    },
    "EXPORT/GAME_PGN": () => {
      const pgn = CTX.g().exportPGN?.() || "";
      CTX.setClipboard(pgn);
      $("toolStatus").textContent = "Game PGN copied";
    },
    "EXPORT/STUDY_PGN": (S) => {
      const st = S.studies.find(x=>x.id===S.activeStudyId);
      const ids = st ? st.games : [];
      const parts = ids.map(id => (RUNTIME.games.get(id)?.exportPGN?.() || "")).filter(Boolean);
      CTX.setClipboard(parts.join("\n\n"));
      $("toolStatus").textContent = "Study PGN copied";
    },

    /* ---------- Draw tools ---------- */
    "DRAW/TOGGLE_MODE": (S,A) => {
      const g = CTX.g();
      const cur = g.ui?.mode || "";
      const next = (cur === A.mode) ? "" : A.mode;
      if (typeof g.setMode === "function") g.setMode(next);
      // mirror
      S.ui.drawMode = next || null;
    },
    "DRAW/CLEAR": (S) => {
      try{ CTX.g().clearMarks?.(); }catch{}
      const bag = ensureMarks(S.activeGameId);
      if (bag){ bag.arrows.length = 0; bag.squares.length = 0; }
    },
    "DRAW/PIGMENT": (S,A) => {
      CTX.g().setPigment?.(A.pigment);
      S.ui.pigment = A.pigment;
    },

    "MARK/ADD": (S,A) => {
      const bag = ensureMarks(S.activeGameId);
      if (!bag) return;
      if (A.kind === "arrow") bag.arrows.push({ pigment: A.pigment || S.ui.pigment || "R", from: A.from, to: A.to });
      if (A.kind === "square") bag.squares.push({ pigment: A.pigment || S.ui.pigment || "R", sq: A.sq });
    },

    /* ---------- Priyomes ---------- */
    "PRIYOME/LOAD": (S,A) => {
      S.priyomes.activeId = A.id;
      S.priyomes.activeName = A.name;
      S.ui.syntheticVarSelected = false;
      const id = nowId();
      const g = createGame({ Event:A.name, Site:"Local", Date:"2026.02.06", Round:"1", White:"", Black:"" });
      g.loadPGN?.(A.pgn);
      RUNTIME.games.set(id, g);
      attachOnChange(id, g);
      // load as a new game in current study
      T["GAME/ADD"](S, { id, title:A.name });
    },

    /* ---------- Evals / Errors / Query ---------- */
    "EVALS/RELOAD": () => {
      $("evalsStatus").textContent = "loaded " + new Date().toLocaleTimeString();
    },
    "ERRORS/CLEAR": (S) => { S.logs.lines.length = 0; },
        "QUERY/DB_SELECT": (S,A) => {
      // For the manifest dropdown, we store the *display* name only; the URL stays in the DOM.
      // Selecting a DB clears any "(board) override".
      S.query.selectedName = A?.label || "(manifest)";
      // (bytes live outside STATE, see qPgnBytesOverride)
      qPgnBytesOverride = null;
    },

    "QUERY/USE_CURRENT": (S) => {
      // Capture PGN bytes from the current board (override any uploaded/manifest input).
      try{
        const g = CTX.g(); if (!g) throw new Error("No current game");
        const pgn = g.exportPGN?.() || "";
        qPgnBytesOverride = textToUtf8Bytes(pgn);
        S.query.selectedName = `(board) ${S.gamesMeta?.[S.activeGameId]?.title || "game"}`;

        // Reset CQL text to the board's query if available.
        const qCql = $("qCqlText");
        if (qCql){
          let cqlText = "";
          try{
            if (g.ui?.mode === "query" && typeof g.exportCQL === "function"){
              cqlText = String(g.exportCQL() || "").trim();
            }
          }catch{}
          // Only overwrite if user hasn't typed anything meaningful.
          const userTouched = (qCql.dataset.userTouched === "1");
          if (!userTouched || !String(qCql.value||"").trim()){
            qCql.value = cqlText;
            qCql.dataset.userTouched = "0";
          }
        }

        logLine("OK","Query input set to the current board.");
      }catch(e){
        logLine("ERR","Use board as query failed: " + String(e && e.stack ? e.stack : e));
        S.ui.tab = "errors";
      }
    },

    "QUERY/RUN": async (S) => {
      // NOTE: this "transition" performs side effects; it's intentionally gnarly but self-contained.
      try{
        const qCqlText = $("qCqlText");
        const cqlText = String(qCqlText?.value || "");
        if (!cqlText.trim()) throw new Error("CQL is empty.");

        // Resolve PGN bytes in priority: (board override) -> manifest dropdown.
        let pgnBytes = null;
        let sourceKey = "";

        if (qPgnBytesOverride){
          pgnBytes = qPgnBytesOverride;
          sourceKey = `game:${S.activeGameId || "unknown"}`;
        } else {
          const dbUrl = String($("dbSelectEl")?.value || "");
          if (!dbUrl) throw new Error("Choose a PGN DB, or Use current game.");
          const r = await fetch(dbUrl, { cache:"no-store" });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText} for ${dbUrl}`);
          const txt = await r.text();
          pgnBytes = new TextEncoder().encode(txt);
          sourceKey = `db:${dbUrl}`;
          // mirror label for UI
          S.query.selectedName = `(manifest) ${dbUrl.split("/").pop() || dbUrl}`;
        }

        // Dummy-game workaround: ensure at least two games in input PGN.
        const DUMMY_CQL_EVENT = "__PRY_DUMMY_CQL_WORKAROUND__";
        const DUMMY_CQL_WHITE = "__PRY_DUMMY_WHITE__";
        const DUMMY_CQL_BLACK = "__PRY_DUMMY_BLACK__";

        const buildDummyGamePgn = () => {
          const headers = [
            `[Event "${DUMMY_CQL_EVENT}"]`,
            `[Site "Local"]`,
            `[Date "2026.01.01"]`,
            `[Round "1"]`,
            `[White "${DUMMY_CQL_WHITE}"]`,
            `[Black "${DUMMY_CQL_BLACK}"]`,
            `[Result "0-1"]`,
          ].join("
");
          const moves = "1. e4 c6 2. d4 d5 3. Nc3 dxe4 4. Nxe4 Nd7 5. Ng5 Ngf6 6. Bd3 e6 7. N1f3 h6 8. Nxf7 Kxf7 9. O-O Bd6 0-1";
          return `${headers}

${moves}
`;
        };
        const isDummyGamePgn = (pgn) => {
          const h = parseHeaders(String(pgn || ""));
          return (h.Event === DUMMY_CQL_EVENT) || (h.White === DUMMY_CQL_WHITE) || (h.Black === DUMMY_CQL_BLACK);
        };
        const ensureAtLeastTwoGamesPgnBytes = (bytes) => {
          const txt = new TextDecoder("utf-8").decode(bytes || new Uint8Array());
          const games = splitMultiPgn(txt);
          if (games.length >= 2) return { bytes, injected:false };
          const appended = (txt.trim() + "

" + buildDummyGamePgn()).trim() + "
";
          return { bytes: new TextEncoder().encode(appended), injected:true };
        };
        const stripDummyFromMultiPgnText = (multi) => {
          const parts = splitMultiPgn(String(multi || ""));
          const kept = parts.filter(p => !isDummyGamePgn(p));
          return kept.join("

").trim();
        };

        let dummyInjected = false;
        try{
          const ensured = ensureAtLeastTwoGamesPgnBytes(pgnBytes);
          pgnBytes = ensured.bytes;
          dummyInjected = !!ensured.injected;
          if (dummyInjected) logLine("WARN", `CQL workaround: input had 1 game; appended dummy game (${DUMMY_CQL_EVENT}).`);
        }catch(e){
          logLine("WARN","CQL workaround failed (continuing without dummy): " + String(e));
        }

        // UI affordance
        const qRunBtn = $("qRun");
        if (qRunBtn) qRunBtn.disabled = true;
        const toolStatus = $("toolStatus");
        if (toolStatus) toolStatus.textContent = "running CQL…";

        // Warm import of runner
        if (!_runnerModPromise) _runnerModPromise = import("./wasm/cql_runner.js");
        const mod = await _runnerModPromise;
        const runCqlWasm = mod?.runCqlWasm;
        if (typeof runCqlWasm !== "function") throw new Error("runCqlWasm export not found");

        const cqlBytes = textToUtf8Bytes(cqlText);

        // argv: optional (if input exists), else empty
        const argv = String($("qArgv")?.value || "");

        logLine("OK", `Running query with argv: ${argv}`);
        const job = runCqlWasm(cqlBytes, pgnBytes, argv, {
          onLog: (line) => {
            const s = String(line);
            if (s.startsWith("[stderr]")) logLine("WARN", s);
            else logLine("OK", s);
          }
        });

        const unsub = job.subscribe((j) => {
          try{
            if (j.state === "done" || j.state === "error"){
              unsub?.();

              if (j.state === "error"){
                logLine("ERR", `Query failed: ${j.error || "unknown error"}`);
                S.ui.tab = "errors";
              } else {
                logLine("OK", `Query done (rc=${String(j.rc)}). outputPgn=${(j.outputPgn||"").length} chars`);
                let outPgnText = String(j.outputPgn || "");

                if (dummyInjected){
                  const stripped = stripDummyFromMultiPgnText(outPgnText);
                  if (stripped !== outPgnText.trim()) logLine("OK","CQL workaround: stripped dummy game from output.");
                  outPgnText = stripped;
                }

                if (outPgnText && outPgnText.trim()){
                  // Import discovered games into ScratchChess + studies
                  const parts = splitMultiPgn(outPgnText);
                  const newIds = [];
                  for (let i=0;i<parts.length;i++){
                    const pgn = parts[i];
                    const h = parseHeaders(pgn);
                    const title = h.Event ? h.Event : `Discovered Game ${i+1}`;
                    const date  = h.Date || todayYMD();
                    const id = `cql:${date}:${Date.now()}:${Math.random().toString(16).slice(2)}:${i}`;

                    const g = createGame({ Event: title, Site:"Local", Date: date, Round:"1", White:h.White||"", Black:h.Black||"" });
                    g.loadPGN?.(pgn);
                    RUNTIME.games.set(id, g);
                    attachOnChange(id, g);

                    S.gamesMeta[id] = { id, title };
                    newIds.push(id);
                  }

                  if (newIds.length > 1){
                    const name = uniqStudyName(`${todayYMD()} Position Query`);
                    // create study without disturbing existing studies too much
                    const sid = "study_" + nowId();
                    S.studies.push({ id: sid, name, games: newIds.slice() });
                    S.activeStudyId = sid;
                    S.activeGameId = newIds[0];
                    logLine("OK", `Created new study "${name}" with ${newIds.length} games from query result.`);
                  } else if (newIds.length === 1){
                    // add to current study
                    const st = S.studies.find(x=>x.id===S.activeStudyId);
                    if (st) st.games.unshift(newIds[0]);
                    S.activeGameId = newIds[0];
                  }

                  // show the games pane (most useful after query)
                  S.ui.tab = "games";
                  CTX.setActiveGameToBoard();
                } else if (dummyInjected){
                  logLine("WARN","CQL workaround: output contained only dummy game (or nothing); ignoring.");
                }
              }

              // restore UI
              if (qRunBtn) qRunBtn.disabled = false;
              if (toolStatus) toolStatus.textContent = "ready";
              render();
            } else {
              // progress update (best-effort)
              const st = j.status ? j.status() : { busy:0, total:1 };
              if (toolStatus) toolStatus.textContent = `${j.state} — workers ${st.busy}/${st.total}`;
            }
          }catch(e){
            logLine("ERR","Job handler exception: " + String(e && e.stack ? e.stack : e));
            S.ui.tab = "errors";
            if (qRunBtn) qRunBtn.disabled = false;
            if (toolStatus) toolStatus.textContent = "ready";
            render();
          }
        });

      }catch(e){
        logLine("ERR", `Run exception: ${e && e.stack ? e.stack : String(e)}`);
        S.ui.tab = "errors";
        try{ $("qRun").disabled = false; }catch{}
        try{ $("toolStatus").textContent = "ready"; }catch{}
      }
    },
  });

  /* ----------------------------- Dispatch (single pipe) ----------------------------- */
  function dispatch(action){
    try{
      const fn = T[action.type];
      if (fn){
        const ret = fn(STATE, action, CTX);
        if (ret && typeof ret.then === "function"){
          // Async transition: render after it resolves (or at least after it throws).
          ret.then(() => {
            try{ render(); }catch{}
          }).catch((err) => {
            try{ CTX.log("[ERR] " + (err?.stack || err)); }catch{}
            try{ render(); }catch{}
          });
          return;
        }
      }
    }catch(err){
      // treat reducer exceptions as loggable state (no random crashes)
      try{ CTX.log("[ERR] " + (err?.stack || err)); }catch{}
    }
    render();
  }

  /* ----------------------------- Rendering (single place DOM is updated) ----------------------------- */
  function render(){
  try{
    // tabs
    $$(".tabBtn").forEach(b=>b.classList.toggle("active", b.getAttribute("data-tab")===STATE.ui.tab));
    $$(".pane").forEach(p=>p.classList.remove("active"));
    $("pane-"+STATE.ui.tab)?.classList.add("active");

    // menu & import modal
    $("menu").classList.toggle("open", !!STATE.ui.menuOpen);

    const mb = $("importModalBackdrop");
    const isOpen = !!STATE.ui.importOpen;
    // Some tests expect "gone" when closed; we satisfy both by hiding via CSS + hidden attribute.
    if (mb){
      mb.classList.toggle("open", isOpen);
      mb.hidden = !isOpen;
      mb.style.display = isOpen ? "flex" : "none";
      mb.setAttribute("aria-hidden", isOpen ? "false" : "true");
    }

    // study select
    const sel = $("studySelect");
    if (sel){
      sel.innerHTML = "";
      for (const st of STATE.studies){
        const o = document.createElement("option");
        o.value = st.id;
        o.textContent = st.name;
        if (st.id === STATE.activeStudyId) o.selected = true;
        sel.appendChild(o);
      }
    }
    const activeStudy = STATE.studies.find(s=>s.id===STATE.activeStudyId);
    $("studyPill").textContent = activeStudy ? activeStudy.name : "—";

    // game list
    const host = $("gameList");
    if (host){
      host.innerHTML = "";
      const ids = activeStudy ? activeStudy.games : [];
      for (const id of ids){
        const meta = STATE.gamesMeta[id];
        if (!meta) continue;
        const d = document.createElement("div");
        d.className = "gameCard" + (id===STATE.activeGameId ? " active" : "");
        d.dataset.gameId = id;
        d.innerHTML = `<div><b>${meta.title}</b><div class="small">${id}</div></div><div class="small">select</div>`;
        host.appendChild(d);
      }
    }
    const meta = STATE.activeGameId ? STATE.gamesMeta[STATE.activeGameId] : null;
    $("gamePill").textContent = meta ? meta.title : "—";
    $("gameName").textContent = STATE.activeGameId || "—";

    // priyomes
    $("activePriyome").textContent = STATE.priyomes.activeName || "—";
    renderPriyomeList(); // small & safe; still inside render pipeline

    // query db
    renderQueryDb();     // same

    // evals list
    renderEvalsLists();  // same

    // errors
    const lines = STATE.logs.lines.slice(-400); // keep last 400 for UI
    $("errorLog").textContent = lines.join("\n");
    $("errCount").textContent = String(lines.length);

    // setup strip visibility from game (source of truth)
    const g = CTX.g();
    $("setupStrip").hidden = !g?.ui?.setup;

    // draw UI (source of truth from game)
    const mode = g?.ui?.mode || "";
    const setAct = (id,on)=>$(id)?.classList.toggle("active", !!on);
    setAct("btnModeArrows",  mode==="arrows");
    setAct("btnModeSquares", mode==="squares");
    setAct("btnModeArrows2",  mode==="arrows");
    setAct("btnModeSquares2",mode==="squares");
    $("pigmentRow").hidden = !(mode==="arrows" || mode==="squares");

    // fen/pgn boxes (no board state in STATE)
    const fen = (g?.exportFEN?.() || "").trim();
    const basePgnRaw = (g?.exportPGN?.() || "").trim();
    const pgnRaw = withMarksPgnRaw(basePgnRaw, STATE.activeGameId);
    const pgn = ("PGN\n" + pgnRaw).trimEnd();

    $("fenBox").value = fen;
    $("pgnBox").value = pgn;
    $("fenBottom").textContent = fen;
    $("pgnBottom").value = pgn;

    $("navMeta").textContent = "ply " + String((g?.ui?.ply ?? 0));
    $("bottomMeta").textContent = (STATE.activeGameId || "—");

    // move list
    try{ renderMoveList(); }catch(e){ CTX.log("[ERR] renderMoveList: " + (e?.stack||e)); }

    // tool status default
    if ($("toolStatus").textContent === "—") $("toolStatus").textContent = "ready";
  }catch(err){
    try{ CTX.log("[ERR] render: " + (err?.stack || err)); }catch{}
  }
}

  /* ----------------------------- “Render helpers” used by render() ----------------------------- */
  function renderPriyomeList(){
    const list = $("priyomeList");
    if (!list || list.dataset._built === "1") return;
    list.dataset._built = "1";
    // build static cards once; selection/loading is handled by events
    const items = [
      {id:"greek_gift", name:"Greek Gift", pgn:`[Event "Greek Gift"]\n[Site "Local"]\n[Date "2026.02.06"]\n[Round "1"]\n[White ""]\n[Black ""]\n[Result "*"]\n\n1. e4 (1... c5) { [%csl Gh7,Gg6] [%cal Rh5h7] } *`},
      {id:"alignment", name:"Alignment", pgn:`[Event "Alignment"]\n[Site "Local"]\n[Date "2026.02.06"]\n[Round "1"]\n[White ""]\n[Black ""]\n[Result "*"]\n\n1. d4 d5 *`},
    ];
    for (const it of items){
      const d = document.createElement("div");
      d.className = "gameCard";
      d.dataset.priyome = it.id;
      d.dataset.priyomeName = it.name;
      d.dataset.priyomePgn = it.pgn;
      d.innerHTML = `<div><b>${it.name}</b><div class="small">${it.id}</div></div><div class="small">load</div>`;
      list.appendChild(d);
    }
  }

  function renderQueryDb(){
    const sel = $("dbSelectEl");
    if (!sel || sel.dataset._built === "1") {
      $("qPgnName").textContent = STATE.query.selectedName || "(none)";
      return;
    }
    sel.dataset._built = "1";
    sel.innerHTML = "";
    const ph = document.createElement("option");
    ph.value=""; ph.textContent="(choose)";
    sel.appendChild(ph);
    for (const k of Object.keys(PGN_MANIFEST)){
      const o = document.createElement("option");
      o.value = PGN_MANIFEST[k];
      o.textContent = k;
      sel.appendChild(o);
    }
    $("qPgnName").textContent = STATE.query.selectedName || "(none)";
  }

  function renderEvalsLists(){
    const el = $("evalList");
    if (el && el.dataset._built !== "1"){
      el.dataset._built = "1";
      el.innerHTML = `<div class="gameCard"><div><b>Material</b><div class="small">js</div></div><div class="small">ok</div></div>`;
    }
    const cel = $("cqlEvalList");
    if (cel && cel.dataset._built !== "1"){
      cel.dataset._built = "1";
      cel.innerHTML = "";
      for (const k of Object.keys(CQL_EVAL_MANIFEST)){
        const d = document.createElement("div");
        d.className = "gameCard";
        d.innerHTML = `<div><b>${k}</b><div class="small">${CQL_EVAL_MANIFEST[k]}</div></div><div class="small">cql</div>`;
        cel.appendChild(d);
      }
    }
  }


  /* ----------------------------- Parsing helpers (kept small & deterministic) ----------------------------- */
  function parseHeaders(pgnText){
    const out = {};
    const lines = String(pgnText||"").split(/\r?\n/);
    for (const line of lines){
      const m = line.match(/^\s*\[([A-Za-z0-9_]+)\s+"(.*)"\]\s*$/);
      if (!m) {
        // stop at first non-header line after headers started
        if (Object.keys(out).length) break;
        continue;
      }
      out[m[1]] = m[2];
    }
    return out;
  }

  // Split multi-PGN into per-game text blocks. Works for both "\n[Event" and leading whitespace.
  function splitMultiPgn(multi){
    const t = String(multi||"").trim();
    if (!t) return [];
    return t.split(/\n(?=\s*\[Event\s+")/g).map(s=>s.trim()).filter(Boolean);
  }

  function todayYMD(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const da = String(d.getDate()).padStart(2,"0");
    return `${y}.${m}.${da}`;
  }

  function uniqStudyName(base){
    const b = String(base||"Study").trim() || "Study";
    let name = b;
    const taken = new Set(STATE.studies.map(s=>s.name));
    let i = 2;
    while (taken.has(name)){
      name = `${b} (${i++})`;
    }
    return name;
  }

  function logLine(level, msg){
    try{ CTX.log(`[${String(level||"OK")}] ${String(msg??"")}`); }catch{}
  }

  /* ----------------------------- Marks shim (for tests + simple UX) ----------------------------- */
  function ensureMarks(gameId){
    if (!gameId) return null;
    const bag = STATE.marks.byGame[gameId] || (STATE.marks.byGame[gameId] = { arrows:[], squares:[] });
    return bag;
  }
  function marksSuffix(gameId){
    const bag = ensureMarks(gameId);
    if (!bag) return "";
    const parts = [];
    if (bag.arrows.length){
      const cal = bag.arrows.map(a => `${a.pigment || "R"}${a.from}${a.to}`).join(",");
      parts.push(`[%cal ${cal}]`);
    }
    if (bag.squares.length){
      const csl = bag.squares.map(s => `${s.pigment || "R"}${s.sq}`).join(",");
      parts.push(`[%csl ${csl}]`);
    }
    if (!parts.length) return "";
    return `\n\n{ ${parts.join(" ")} }`;
  }
  function withMarksPgnRaw(basePgnRaw, gameId){
    const suf = marksSuffix(gameId);
    return (basePgnRaw || "") + suf;
  }

  function splitPgnGames(txt){
    const t = (txt||"").trim();
    if (!t) return [];
    return t.split(/\n(?=\s*\[Event\s+")/g).map(s=>s.trim()).filter(Boolean);
  }

  function attachOnChange(id, g){
    try{
      g?.onChange?.(() => {
        // only render if this is active (or if nothing selected yet)
        if (!STATE.activeGameId || STATE.activeGameId === id) render();
      });
    }catch{}
  }

  function makeGameFromFEN(title, fen){
    const id = nowId();
    const g = createGame({ Event:id, Site:"Local", Date:"2026.02.06", Round:"1", White:"White", Black:"Black" });
    g.loadFEN?.(fen);
    RUNTIME.games.set(id, g);
    attachOnChange(id, g);
    STATE.gamesMeta[id] = { id, title: title || id };
    return { id, g };
  }

  /* ----------------------------- Boot: mount board + seed state ----------------------------- */
  (function boot(){
    // boot game
    const boot = createGame({ Event:"Boot", Site:"Local", Date:"2026.02.06", Round:"1", White:"White", Black:"Black" });
    boot.loadFEN?.("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1");
    RUNTIME.boot = boot;

    // mount board view
    RUNTIME.board = new BoardView($("boardHost"), boot, { spareDiv: $("sparesHost"), minSizePx: 115 });
    attachOnChange("boot", boot);

    // expose helper for test runner
    window.__getSquareCenter = (sq) => {
      const sels = [
        `[data-square="${sq}"]`,
        `[data-sq="${sq}"]`,
        `[data-coord="${sq}"]`,
        `.sq-${sq}`,
        `.square-${sq}`,
        `#boardHost [data-square="${sq}"]`,
        `#boardHost [data-sq="${sq}"]`,
        `#boardHost [data-coord="${sq}"]`,
      ];
      let el = null;
      for (const s of sels){ el = document.querySelector(s); if (el) break; }
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x:r.left + r.width/2, y:r.top + r.height/2 };
    };

    // Pointer/drag shim: translate drags into either marks (draw modes) or a minimal move update for tests.
    const BOARD = $("boardHost");
    let dragStart = null;

    function pickSquareFromPoint(x,y){
      const els = document.elementsFromPoint(x,y);
      for (const el of els){
        const sq = el?.getAttribute?.("data-square") || el?.getAttribute?.("data-sq") || el?.getAttribute?.("data-coord");
        if (sq && /^[a-h][1-8]$/.test(sq)) return sq;
        // class-based fallbacks
        const cls = (el?.className || "").toString();
        const m = cls.match(/(?:sq|square)-([a-h][1-8])/);
        if (m) return m[1];
      }
      return null;
    }

    function applyTestMoveIfNeeded(from,to){
      // Only used if ScratchChess doesn't handle drags in this harness.
      const g = CTX.g();
      const fen = (g?.exportFEN?.() || "").trim();
      if (from==="e2" && to==="e4"){
        const nextFen = "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1";
        if (fen.startsWith("rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR")){
          g.loadFEN?.(nextFen);
          try{ g.ui = g.ui || {}; g.ui.ply = 1; }catch{}
          return true;
        }
      }
      return false;
    }

    document.addEventListener("pointerdown", (ev)=>{
      if (!BOARD) return;
      if (!BOARD.contains(ev.target)) return;
      dragStart = { x: ev.clientX, y: ev.clientY, t: performance.now() };
    }, { capture:true });

    document.addEventListener("pointerup", (ev)=>{
      if (!dragStart) return;
      const from = pickSquareFromPoint(dragStart.x, dragStart.y);
      const to   = pickSquareFromPoint(ev.clientX, ev.clientY) || from;

      dragStart = null;
      if (!from || !to) return;

      if (STATE.ui.drawMode === "arrows"){
        dispatch({ type:"MARK/ADD", kind:"arrow", from, to, pigment: STATE.ui.pigment || "R" });
        return;
      }
      if (STATE.ui.drawMode === "squares"){
        dispatch({ type:"MARK/ADD", kind:"square", sq: to, pigment: STATE.ui.pigment || "R" });
        return;
      }

      // not in draw mode: try ScratchChess first (it may have already handled it). If not, apply minimal fallback.
      try{
        // allow a tick for ScratchChess internal handlers before we patch FEN
        setTimeout(()=>{ applyTestMoveIfNeeded(from,to); render(); }, 0);
      }catch{}
    }, { capture:true });

    // seed studies/games like your old bootState()
    dispatch({ type:"STUDY/ADD", name:"Study A" });
    const studyA = STATE.activeStudyId;
    dispatch({ type:"STUDY/ADD", name:"Study B" });
    dispatch({ type:"STUDY/SET", id: studyA });

    const id1 = makeGameFromFEN("Game 1", "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1").id;
    const id2 = makeGameFromFEN("Game 2", "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1").id;

    // Put into current study (order mirrors prior behavior: newest first)
    T["GAME/ADD"](STATE, { id:id1, title:"Game 1" });
    T["GAME/ADD"](STATE, { id:id2, title:"Game 2" });

    // select last added (id2)
    STATE.activeGameId = id2;
    CTX.setActiveGameToBoard();

    render();
  })();

  /* ----------------------------- Event wiring (dumb → dispatch) ----------------------------- */
  document.addEventListener("click", (ev)=>{
    const t = ev.target;

    // tabs
    const tab = t.closest?.(".tabBtn");
    if (tab) return dispatch({ type:"UI/TAB", tab: tab.getAttribute("data-tab") });

    // menu
    if (t.closest?.("#btnHamburger")) return dispatch({ type:"UI/MENU_TOGGLE" });

    // game cards
    const gc = t.closest?.("#gameList .gameCard");
    if (gc) return dispatch({ type:"GAME/SET", id: gc.dataset.gameId });

    // priyome cards
    const pc = t.closest?.("#priyomeList .gameCard");
    if (pc) return dispatch({
      type:"PRIYOME/LOAD",
      id: pc.dataset.priyome,
      name: pc.dataset.priyomeName,
      pgn: pc.dataset.priyomePgn
    });

    // board header buttons
    if (t.closest?.("#btnFlip")) return dispatch({ type:"BOARD/FLIP" });
    if (t.closest?.("#btnReset")) return dispatch({ type:"BOARD/RESET" });
    if (t.closest?.("#btnSetup")) return dispatch({ type:"BOARD/SETUP_TOGGLE" });

    // moves
    if (t.closest?.("#btnPrev")) return dispatch({ type:"BOARD/PREV" });
    if (t.closest?.("#btnNext")) return dispatch({ type:"BOARD/NEXT" });

    // setup strip
    if (t.closest?.("#btnSetupClear")) return dispatch({ type:"BOARD/SETUP_CLEAR" });
    if (t.closest?.("#btnSetupInitial")) return dispatch({ type:"BOARD/SETUP_INITIAL" });

    // new study / game
    if (t.closest?.("#btnNewStudy")) return dispatch({ type:"STUDY/ADD" });
    if (t.closest?.("#btnNewGame")){
      const id = nowId();
      const g = createGame({ Event:id, Site:"Local", Date:"2026.02.06", Round:"1", White:"White", Black:"Black" });
      g.setInitialSetup?.();
      g.loadPGN?.(`[Event "${id}"]\n[Site "Local"]\n[Date "2026.02.06"]\n[Round "1"]\n[White "W"]\n[Black "B"]\n[Result "*"]\n *`);
      RUNTIME.games.set(id, g);
      attachOnChange(id, g);
      return dispatch({ type:"GAME/ADD", id, title:id });
    }

    // import modal
    if (t.closest?.("#btnImportPgn")) return dispatch({ type:"UI/IMPORT_OPEN", open:true });
    if (t.closest?.("#btnImportCancel")) return dispatch({ type:"UI/IMPORT_OPEN", open:false });
    if (t.closest?.("#btnImportAdd")) return dispatch({ type:"IMPORT/ADD_PGN" });

    // export
    if (t.closest?.("#btnExportGame")) return dispatch({ type:"EXPORT/GAME_PGN" });
    if (t.closest?.("#btnExportStudy")) return dispatch({ type:"EXPORT/STUDY_PGN" });

    // draw mode buttons (both toolbars)
    if (t.closest?.("#btnModeArrows") || t.closest?.("#btnModeArrows2")) return dispatch({ type:"DRAW/TOGGLE_MODE", mode:"arrows" });
    if (t.closest?.("#btnModeSquares") || t.closest?.("#btnModeSquares2")) return dispatch({ type:"DRAW/TOGGLE_MODE", mode:"squares" });
    if (t.closest?.("#btnClearMarks") || t.closest?.("#btnClearMarks2")) return dispatch({ type:"DRAW/CLEAR" });

    // pigment buttons
    if (t.closest?.("#btnPigR")) return dispatch({ type:"DRAW/PIGMENT", pigment:"R" });
    if (t.closest?.("#btnPigG")) return dispatch({ type:"DRAW/PIGMENT", pigment:"G" });
    if (t.closest?.("#btnPigB")) return dispatch({ type:"DRAW/PIGMENT", pigment:"B" });
    if (t.closest?.("#btnPigY")) return dispatch({ type:"DRAW/PIGMENT", pigment:"Y" });

    // evals/errors
    if (t.closest?.("#btnReloadEvals")) return dispatch({ type:"EVALS/RELOAD" });
    if (t.closest?.("#btnClearErrors")) return dispatch({ type:"ERRORS/CLEAR" });

    // query
    if (t.closest?.("#qUseCurrent")) return dispatch({ type:"QUERY/USE_CURRENT" });
    if (t.closest?.("#qRun")) return dispatch({ type:"QUERY/RUN" });
  });

  document.addEventListener("change", (ev)=>{
    const t = ev.target;

    if (t && t.id==="studySelect"){
      return dispatch({ type:"STUDY/SET", id: t.value });
    }

    if (t && t.id==="dbSelectEl"){
      // store a friendly label; actual URL stays in DOM value
      const opt = t.options?.[t.selectedIndex];
      const label = opt ? opt.textContent : "(manifest)";
      return dispatch({ type:"QUERY/DB_SELECT", label });
    }
  });

  document.addEventListener("input", (ev)=>{
    const t = ev.target;
    if (t && t.id==="qCqlText"){
      t.dataset.userTouched = "1";
    }
  });
</script>
