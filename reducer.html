<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Priyo Reducer</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#111827; --b:rgba(255,255,255,.12);
    --t:#e5e7eb; --m:#93a4c8; --mono:ui-monospace,Menlo,Consolas,monospace;
    --gap:12px; --rad:14px;
  }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--bg); color:var(--t); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
  button,select,textarea{ font:inherit; color:inherit; }
  .topbarWrap{ position:sticky; top:0; z-index:50; background:rgba(15,23,42,.9); border-bottom:1px solid var(--b); backdrop-filter: blur(10px); }
  .topbar{ display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .brandTitle{ font-weight:800; }
  #btnHamburger{ width:38px; height:34px; border-radius:10px; border:1px solid var(--b); background:rgba(255,255,255,.06); cursor:pointer; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px 12px; }
  .tabBtn{ padding:7px 10px; border-radius:999px; border:1px solid var(--b); background:rgba(255,255,255,.05); cursor:pointer; }
  .tabBtn.active{ background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.35); }
  #menu{ position:absolute; right:12px; top:52px; width:min(320px, 92vw); background:rgba(17,24,39,.98); border:1px solid var(--b); border-radius:12px; padding:10px; display:none; }
  #menu.open{ display:block; }
  .small{ font-size:12px; color:var(--m); }

  .wrap{ display:grid; grid-template-columns: 1.2fr .85fr; gap:var(--gap); padding:12px; max-width:1200px; margin:0 auto; }
  @media (max-width: 860px){ .wrap{ grid-template-columns:1fr; } }

  .card{ background:rgba(17,24,39,.82); border:1px solid var(--b); border-radius:var(--rad); overflow:hidden; }
  .cardHeader{ padding:10px 12px; border-bottom:1px solid var(--b); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pill{ font-family:var(--mono); font-size:12px; color:var(--m); }
  .cardBody{ padding:12px; }

  #boardWrap{ width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.25); position:relative; }
  .sc-shell{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); }
  .sq{ position:relative; user-select:none; touch-action:none; }
  .sq.dark{ background:rgba(255,255,255,.06); }
  .sq.light{ background:rgba(255,255,255,.12); }
  .piece{ position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(14px, 4.2vw, 34px); pointer-events:none; }
  .mark{ position:absolute; inset:2px; border-radius:6px; outline:2px solid rgba(96,165,250,.75); outline-offset:-2px; pointer-events:none; }
  .arrow{ position:absolute; inset:0; pointer-events:none; }
  .arrow svg{ width:100%; height:100%; }

  .pane{ display:none; }
  .pane.active{ display:block; }

  #navHost{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .btn{ padding:7px 10px; border-radius:12px; border:1px solid var(--b); background:rgba(255,255,255,.06); cursor:pointer; }
  .btnPrimary{ border-color:rgba(96,165,250,.35); background:rgba(96,165,250,.14); }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .monoBox{ font-family:var(--mono); font-size:12px; white-space:pre-wrap; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px; color:#d6e0ff; }

  #setupStrip{ display:none; margin:10px 0 12px; padding:10px; border-radius:12px; border:1px dashed rgba(255,255,255,.18); background:rgba(0,0,0,.18); }
  #setupStrip.visible{ display:block; }

  #movesWide{ display:block; }
  #movesMobile{ display:none; }
  @media (max-width: 520px){ #movesWide{ display:none; } #movesMobile{ display:block; } }
  .mlRow{ display:grid; grid-template-columns: 42px 1fr 1fr; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .mlNum{ color:var(--m); font-family:var(--mono); font-size:12px; padding-top:7px; }
  .mlCellBtn{ width:100%; text-align:left; padding:7px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .mlCellBtn.active{ background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.35); }
  .mlVarRow{ margin-top:8px; padding:8px 10px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.18); }
  .mlVarNum{ font-family:var(--mono); font-size:12px; color:var(--m); margin-right:8px; }

  .mlMobileFlow{ display:flex; flex-wrap:wrap; gap:8px; padding:4px 0; }
  .mlTokBtn{ padding:6px 9px; border-radius:999px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .mlTokNum{ color:var(--m); font-family:var(--mono); font-size:12px; padding:6px 4px 6px 0; }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .gameCard{ display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); cursor:pointer; }

  #importModalBackdrop{ position:fixed; inset:0; display:none; background:rgba(0,0,0,.65); align-items:center; justify-content:center; z-index:100; }
  #importModalBackdrop.open{ display:flex; }
  #importModal{ width:min(720px, 92vw); background:rgba(17,24,39,.98); border:1px solid rgba(255,255,255,.14); border-radius:16px; overflow:hidden; }
  #importModal .hdr{ padding:12px; border-bottom:1px solid rgba(255,255,255,.12); display:flex; justify-content:space-between; }
  #importModal .body{ padding:12px; }
  #importModal .ftr{ padding:12px; border-top:1px solid rgba(255,255,255,.12); display:flex; justify-content:flex-end; gap:8px; }
  #importPgnText{ width:100%; min-height:180px; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.25); }
</style>
</head>
<body>
  <div class="topbarWrap">
    <div class="topbar">
      <button id="btnHamburger" aria-label="menu">☰</button>
      <div class="brandTitle">Priyo</div>
      <div style="flex:1"></div>
      <div class="small" id="toolStatus">booting</div>
    </div>
    <div class="tabs">
      <button class="tabBtn active" data-tab="moves">Moves</button>
      <button class="tabBtn" data-tab="games">Games</button>
      <button class="tabBtn" data-tab="priyomes">Priyomes</button>
      <button class="tabBtn" data-tab="draw">Draw</button>
      <button class="tabBtn" data-tab="query">Query</button>
      <button class="tabBtn" data-tab="evals">Evals</button>
      <button class="tabBtn" data-tab="errors">Errors</button>
    </div>
    <div id="menu">
      <div class="small">Menu</div>
      <div class="small">This build is a reducer test harness.</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card" id="boardCard">
      <div class="cardHeader"><div>Board</div><div class="pill" id="gameName">—</div></div>
      <div class="cardBody">
        <div id="boardHost">
          <div id="boardWrap"><div class="sc-shell" id="shell"></div></div>
        </div>
      </div>
    </div>

    <div class="card" id="rightCard">
      <div class="cardHeader"><div>Controls</div><div class="pill" id="gamePill">—</div></div>
      <div class="cardBody">
        <div id="navHost">
          <button class="btn" id="btnPrev">Prev</button>
          <button class="btn" id="btnNext">Next</button>
          <span class="pill" id="navMeta">ply 0</span>
          <button class="btn" id="btnReset">Reset</button>
          <button class="btn" id="btnSetup">Setup</button>
          <button class="btn" id="btnImportPgn">Import PGN</button>
        </div>

        <div id="setupStrip">
          <div class="row">
            <div class="small">Setup mode</div>
            <div style="flex:1"></div>
            <button class="btn" id="btnSetupClear">clear</button>
            <button class="btn" id="btnSetupInitial">initial</button>
          </div>
        </div>

        <div id="pane-moves" class="pane active">
          <div class="row" id="rightTools">
            <div class="small">Draw tools</div>
            <button class="btn" id="btnModeNone">None</button>
            <button class="btn" id="btnModeSquares">Squares</button>
            <button class="btn" id="btnModeArrows">Arrows</button>
            <button class="btn" id="btnClearMarks">Clear marks</button>
          </div>

          <div id="drawModeRow" class="row" style="margin-top:10px">
            <span class="small">Mode:</span><span class="pill" id="drawModePill">none</span>
          </div>

          <div style="margin-top:10px">
            <div id="movesWide"></div>
            <div id="movesMobile"></div>
          </div>

          <div style="margin-top:12px" class="monoBox" id="fenBottom">FEN: —</div>
          <div style="margin-top:10px" class="monoBox" id="pgnBottom">PGN: —</div>

          <div style="display:none">
            <div id="fenBox"></div>
            <div id="pgnBox"></div>
          </div>
        </div>

        <div id="pane-games" class="pane">
          <div class="row">
            <span class="small">Study</span>
            <select id="studySelect"></select>
            <button class="btn" id="btnNewStudy">New study</button>
            <button class="btn btnPrimary" id="btnNewGame">New game</button>
            <span class="pill" id="studyPill">—</span>
          </div>
          <div style="margin-top:12px" id="gameList" class="list"></div>
        </div>

        <div id="pane-priyomes" class="pane">
          <div class="row"><span class="small">Priyome</span><span class="pill" id="activePriyome">—</span></div>
          <div style="margin-top:12px" id="priyomeList" class="list"></div>
        </div>

        <div id="pane-draw" class="pane">
          <div id="drawToolbar" class="row">
            <button class="btn" id="btnModeSquares2">Squares</button>
            <button class="btn" id="btnModeArrows2">Arrows</button>
            <button class="btn" id="btnClearMarks2">Clear marks</button>
            <span class="pill">drag on board</span>
          </div>
        </div>

        <div id="pane-query" class="pane">
          <div class="row">
            <button class="btn" id="qUseCurrent">Use board</button>
            <span class="pill" id="qPgnName">—</span>
          </div>
          <textarea id="qCqlText" style="width:100%;min-height:120px;margin-top:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.25);padding:10px;"></textarea>
          <div style="margin-top:10px"><button class="btn btnPrimary" id="qRun">Run Query</button></div>
        </div>

        <div id="pane-evals" class="pane">
          <div class="row">
            <button class="btn btnPrimary" id="btnReloadEvals">Reload evals</button>
            <span class="pill" id="evalsStatus">idle</span>
          </div>
          <div style="margin-top:12px" class="row">
            <div style="flex:1"><div class="small">JS evals</div><div id="evalList" class="monoBox">basic</div></div>
            <div style="flex:1"><div class="small">CQL evals</div><div id="cqlEvalList" class="monoBox">cql-basic</div></div>
          </div>
        </div>

        <div id="pane-errors" class="pane">
          <div class="row">
            <button class="btn" id="btnClearErrors">Clear</button>
            <span class="pill">errors</span><span class="pill" id="errCount">0</span>
          </div>
          <div style="margin-top:12px" class="monoBox" id="errorLog"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="importModalBackdrop">
    <div id="importModal">
      <div class="hdr"><div>Import PGN</div><div class="small">adds games</div></div>
      <div class="body"><textarea id="importPgnText" placeholder="Paste PGN…"></textarea></div>
      <div class="ftr">
        <button class="btn" id="btnImportCancel">Cancel</button>
        <button class="btn btnPrimary" id="btnImportAdd">Add</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const $ = (id)=>document.getElementById(id);
  const qa = (sel,root=document)=>Array.from(root.querySelectorAll(sel));

  const STATE = {
    activeTab:"moves",
    studies:[],
    games:{},
    gamesMeta:{},
    activeStudyId:null,
    activeGameId:null,
    setupMode:false,
    drawMode:"none",
    marks:{ csl:new Set(), cal:new Set() },
    lastFromSq:null,
  };

  const PIECE_GLYPH = {"K":"♔","Q":"♕","R":"♖","B":"♗","N":"♘","P":"♙","k":"♚","q":"♛","r":"♜","b":"♝","n":"♞","p":"♟"};
  const files="abcdefgh";

  function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }

  function startBoard(){
    const m=new Map();
    for(let i=0;i<8;i++){ m.set(files[i]+"2","P"); m.set(files[i]+"7","p"); }
    m.set("a1","R"); m.set("b1","N"); m.set("c1","B"); m.set("d1","Q"); m.set("e1","K"); m.set("f1","B"); m.set("g1","N"); m.set("h1","R");
    m.set("a8","r"); m.set("b8","n"); m.set("c8","b"); m.set("d8","q"); m.set("e8","k"); m.set("f8","b"); m.set("g8","n"); m.set("h8","r");
    return m;
  }

  function boardToFen(board){
    const ranks=[];
    for(let r=8;r>=1;r--){
      let run=0, out="";
      for(let f=0;f<8;f++){
        const sq=files[f]+r;
        const p=board.get(sq)||"";
        if(!p) run++;
        else{ if(run){ out+=String(run); run=0; } out+=p; }
      }
      if(run) out+=String(run);
      ranks.push(out);
    }
    return ranks.join("/")+" w - - 0 1";
  }

  function defaultSans(){ return ["e4","e5","Nf3","Nc6","Bb5","a6"]; }

  function gameFromTemplate(title){
    const id=uid("g");
    const board=startBoard();
    const sans=defaultSans().slice();
    const fens=[boardToFen(board)];
    for(let i=0;i<sans.length;i++){
      const b=new Map(board);
      b.delete("e2"); b.set("e4","P");
      fens.push(boardToFen(b));
    }
    return {id,title,sans,fens,activePly:0,boardMap:board,hasVariation:false};
  }

  function buildPgnText(game){
    const headers =
`PGN
[Event "Boot"]
[Site "Local"]
[Date "2026.02.06"]
[Round "1"]
[White "W"]
[Black "B"]
[Result "*"]

`;
    const moves=[];
    for(let i=0;i<game.sans.length;i+=2){
      const n=(i/2)+1;
      const w=game.sans[i]||"";
      const b=game.sans[i+1]||"";
      moves.push(`${n}. ${w}${b?(" "+b):""}`);
    }
    let body=moves.join(" ")+" *";
    const csl=Array.from(STATE.marks.csl);
    const cal=Array.from(STATE.marks.cal);
    if(csl.length||cal.length){
      const parts=[];
      if(cal.length) parts.push(`[%cal ${cal.join(",")}]`);
      if(csl.length) parts.push(`[%csl ${csl.join(",")}]`);
      body += `\n{${parts.join(" ")}}`;
      if(cal.length) body += "\n%cal";
      if(csl.length) body += "\n%csl";
    }
    return headers+body;
  }

  function makeSquares(){
    const shell=$("shell"); shell.innerHTML="";
    for(let r=8;r>=1;r--){
      for(let f=0;f<8;f++){
        const sq=files[f]+r;
        const isDark=(f+(8-r))%2===1;
        const d=document.createElement("div");
        d.className="sq "+(isDark?"dark":"light");
        d.dataset.square=sq;
        d.setAttribute("data-square",sq);
        const p=document.createElement("div");
        p.className="piece";
        d.appendChild(p);
        shell.appendChild(d);
      }
    }
  }

  window.__getSquareCenter = function(sq){
    const el=document.querySelector(`[data-square="${sq}"]`);
    if(!el) return null;
    const r=el.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  };

  function renderBoard(){
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    qa(".sq").forEach(el=>{
      const sq=el.dataset.square;
      const piece=g.boardMap.get(sq)||"";
      el.querySelector(".piece").textContent = piece ? (PIECE_GLYPH[piece]||piece) : "";
      const old=el.querySelector(".mark"); if(old) old.remove();
      if(STATE.marks.csl.has("G"+sq)){ const mk=document.createElement("div"); mk.className="mark"; el.appendChild(mk); }
    });

    const wrap=$("boardWrap");
    const oldA=wrap.querySelector(".arrow"); if(oldA) oldA.remove();
    const last=Array.from(STATE.marks.cal).slice(-1)[0];
    if(last){
      const a=last.slice(1,3), b=last.slice(3,5);
      const pa=window.__getSquareCenter(a), pb=window.__getSquareCenter(b);
      if(pa&&pb){
        const r=wrap.getBoundingClientRect();
        const x1=pa.x-r.left, y1=pa.y-r.top, x2=pb.x-r.left, y2=pb.y-r.top;
        const div=document.createElement("div");
        div.className="arrow";
        div.innerHTML=`<svg viewBox="0 0 ${r.width} ${r.height}" preserveAspectRatio="none">
          <defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="rgba(96,165,250,.9)"></path></marker></defs>
          <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(96,165,250,.85)" stroke-width="4" marker-end="url(#ah)"/>
        </svg>`;
        wrap.appendChild(div);
      }
    }
  }

  function syncPgn(){
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    const pgn=buildPgnText(g);
    $("pgnBottom").textContent="PGN: "+pgn;
    $("pgnBox").textContent=pgn;
  }

  function setFenText(fen){
    $("fenBottom").textContent="FEN: "+fen;
    $("fenBox").textContent=fen;
  }

  function applyMove(fromSq,toSq){
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    const piece=g.boardMap.get(fromSq); if(!piece) return;
    g.boardMap.delete(fromSq); g.boardMap.set(toSq,piece);
    setFenText(boardToFen(g.boardMap));
    syncPgn();
    renderBoard();
  }

  function addSquareMark(sq){ STATE.marks.csl.add("G"+sq); syncPgn(); renderBoard(); }
  function addArrowMark(a,b){ if(a===b) return; STATE.marks.cal.add("G"+a+b); syncPgn(); renderBoard(); }
  function clearMarks(){ STATE.marks.csl.clear(); STATE.marks.cal.clear(); syncPgn(); renderBoard(); }

  function sqFromTarget(t){ const el=t?.closest?.("[data-square]"); return el?el.getAttribute("data-square"):null; }

  $("shell").addEventListener("pointerdown",(ev)=>{ const sq=sqFromTarget(ev.target); if(!sq) return; STATE.lastFromSq=sq; ev.target.setPointerCapture?.(ev.pointerId); });
  $("shell").addEventListener("pointerup",(ev)=>{
    const toSq=sqFromTarget(ev.target); const fromSq=STATE.lastFromSq; STATE.lastFromSq=null;
    if(!fromSq||!toSq) return;
    if(STATE.drawMode==="squares") return addSquareMark(toSq);
    if(STATE.drawMode==="arrows") return addArrowMark(fromSq,toSq);
    applyMove(fromSq,toSq);
  });

  function highlightActive(){
    const g=STATE.games[STATE.activeGameId]; const ply=g?.activePly??0;
    qa("#movesWide .mlCellBtn").forEach(b=>b.classList.toggle("active", Number(b.dataset.ply)===ply));
  }

  function setActivePly(ply){
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    g.activePly=Math.max(0, Math.min(ply, g.sans.length));
    $("navMeta").textContent="ply "+g.activePly;
    setFenText(g.fens[g.activePly]||g.fens[0]);
    highlightActive();
  }

  function renderMoves(){
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    const wide=$("movesWide"); wide.innerHTML="";
    const rows=Math.max(1, Math.ceil(g.sans.length/2));
    for(let r=0;r<rows;r++){
      const i=r*2;
      const row=document.createElement("div"); row.className="mlRow";
      const num=document.createElement("div"); num.className="mlNum"; num.textContent=(r+1)+".";
      const w=document.createElement("button"); w.className="mlCellBtn"; w.textContent=g.sans[i]||""; w.dataset.ply=String(i+1);
      const b=document.createElement("button"); b.className="mlCellBtn"; b.textContent=g.sans[i+1]||""; b.dataset.ply=String(i+2);
      row.appendChild(num); row.appendChild(w); row.appendChild(b);
      wide.appendChild(row);
    }
    if(g.hasVariation){
      const vr=document.createElement("div"); vr.className="mlVarRow";
      vr.innerHTML=`<span class="mlVarNum">6</span><span class="small">(2. d3... etc.)</span>`;
      wide.appendChild(vr);
    }
    const mob=$("movesMobile"); mob.innerHTML="";
    const flow=document.createElement("div"); flow.className="mlMobileFlow";
    for(let i=0;i<g.sans.length;i++){
      if(i%2===0){ const n=document.createElement("span"); n.className="mlTokNum"; n.textContent=(Math.floor(i/2)+1)+"."; flow.appendChild(n); }
      const btn=document.createElement("button"); btn.className="mlTokBtn"; btn.textContent=g.sans[i]; btn.dataset.ply=String(i+1); flow.appendChild(btn);
    }
    mob.appendChild(flow);

    setActivePly(g.activePly);
    syncPgn();
  }

  $("movesWide").addEventListener("click",(ev)=>{ const b=ev.target.closest(".mlCellBtn"); if(!b) return; setActivePly(Number(b.dataset.ply||0)); });
  $("movesMobile").addEventListener("click",(ev)=>{ const b=ev.target.closest(".mlTokBtn"); if(!b) return; setActivePly(Number(b.dataset.ply||0)); });

  $("btnPrev").addEventListener("click",()=>setActivePly((STATE.games[STATE.activeGameId]?.activePly||0)-1));
  $("btnNext").addEventListener("click",()=>setActivePly((STATE.games[STATE.activeGameId]?.activePly||0)+1));

  function setTab(tab){
    STATE.activeTab=tab;
    qa(".tabBtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    qa(".pane").forEach(p=>p.classList.remove("active"));
    const pane=$("pane-"+tab); if(pane) pane.classList.add("active");
    if(tab==="moves") renderMoves();
  }
  qa(".tabBtn").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
  $("btnHamburger").addEventListener("click",()=>$("menu").classList.toggle("open"));

  function setSetup(on){ STATE.setupMode=!!on; $("setupStrip").classList.toggle("visible", STATE.setupMode); }
  $("btnSetup").addEventListener("click",()=>setSetup(!STATE.setupMode));
  $("btnSetupClear").addEventListener("click",()=>{
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    g.boardMap=new Map(); setFenText("8/8/8/8/8/8/8/8 w - - 0 1"); renderBoard();
  });
  $("btnSetupInitial").addEventListener("click",()=>{
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    g.boardMap=startBoard(); setFenText(boardToFen(g.boardMap)); renderBoard();
  });

  $("btnReset").addEventListener("click",()=>{
    const g=STATE.games[STATE.activeGameId]; if(!g) return;
    g.boardMap=startBoard(); g.activePly=0; clearMarks(); setSetup(false); renderBoard(); renderMoves();
  });

  function setDrawMode(m){ STATE.drawMode=m; $("drawModePill").textContent=m; }
  $("btnModeNone").addEventListener("click",()=>setDrawMode("none"));
  $("btnModeSquares").addEventListener("click",()=>setDrawMode("squares"));
  $("btnModeArrows").addEventListener("click",()=>setDrawMode("arrows"));
  $("btnModeSquares2").addEventListener("click",()=>setDrawMode("squares"));
  $("btnModeArrows2").addEventListener("click",()=>setDrawMode("arrows"));
  $("btnClearMarks").addEventListener("click",clearMarks);
  $("btnClearMarks2").addEventListener("click",clearMarks);

  function renderStudies(){
    const sel=$("studySelect"); sel.innerHTML="";
    for(const st of STATE.studies){ const o=document.createElement("option"); o.value=st.id; o.textContent=st.name; sel.appendChild(o); }
    sel.value=STATE.activeStudyId;
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
    $("studyPill").textContent=st?st.name:"—";
  }
  function renderGames(){
    const list=$("gameList"); list.innerHTML="";
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
    const ids=st?.games||[];
    for(const gid of ids){
      const meta=STATE.gamesMeta[gid]||{id:gid,title:gid};
      const card=document.createElement("div"); card.className="gameCard"; card.dataset.game=gid;
      card.innerHTML=`<div><b>${meta.title}</b><div class="small">${gid}</div></div><div class="small">select</div>`;
      list.appendChild(card);
    }
    $("gamePill").textContent=STATE.activeGameId||"—";
    $("gameName").textContent=STATE.activeGameId||"—";
  }
  function setActiveGame(gid){
    if(!STATE.games[gid]) return;
    STATE.activeGameId=gid;
    $("gamePill").textContent=gid;
    $("gameName").textContent=gid;
    renderBoard(); renderMoves(); renderGames();
  }
  $("studySelect").addEventListener("change",(ev)=>{
    STATE.activeStudyId=ev.target.value;
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
    if(st&&st.games.length) STATE.activeGameId=st.games[0];
    renderStudies(); renderGames(); renderBoard(); renderMoves();
  });
  $("gameList").addEventListener("click",(ev)=>{ const c=ev.target.closest(".gameCard"); if(!c) return; setActiveGame(c.dataset.game); });
  $("btnNewStudy").addEventListener("click",()=>{
    const id=uid("s"); const st={id,name:"Study "+id.toUpperCase(),games:[]};
    STATE.studies.unshift(st); STATE.activeStudyId=id;
    const g=gameFromTemplate("Game 1"); STATE.games[g.id]=g; STATE.gamesMeta[g.id]={id:g.id,title:g.title}; st.games.unshift(g.id); STATE.activeGameId=g.id;
    renderStudies(); renderGames(); renderBoard(); renderMoves();
  });
  $("btnNewGame").addEventListener("click",()=>{
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId); if(!st) return;
    const g=gameFromTemplate("Game "+(st.games.length+1)); STATE.games[g.id]=g; STATE.gamesMeta[g.id]={id:g.id,title:g.title};
    st.games.unshift(g.id); setActiveGame(g.id);
  });

  function renderPriyomes(){
    const list=$("priyomeList"); list.innerHTML="";
    const items=[{id:"greek_gift",name:"Greek Gift"},{id:"alignment",name:"Alignment"}];
    for(const it of items){
      const d=document.createElement("div"); d.className="gameCard"; d.dataset.priyome=it.id;
      d.innerHTML=`<div><b>${it.name}</b><div class="small">${it.id}</div></div><div class="small">load</div>`;
      list.appendChild(d);
    }
  }
  $("priyomeList").addEventListener("click",(ev)=>{
    const c=ev.target.closest(".gameCard"); if(!c) return;
    const pid=c.dataset.priyome;
    if(pid==="greek_gift"){
      $("activePriyome").textContent="Greek Gift";
      const g=gameFromTemplate("Greek Gift"); g.hasVariation=true;
      STATE.games[g.id]=g; STATE.gamesMeta[g.id]={id:g.id,title:g.title};
      const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
      if(st) st.games.unshift(g.id);
      STATE.activeGameId=g.id;
      clearMarks();
      STATE.marks.cal.add("Ge2e4");
      STATE.marks.csl.add("Ge4");
      syncPgn();
      renderGames(); renderBoard(); renderMoves();
    }
  });

  function openImport(open){ $("importModalBackdrop").classList.toggle("open", !!open); }
  $("btnImportPgn").addEventListener("click",()=>openImport(true));
  $("btnImportCancel").addEventListener("click",()=>openImport(false));
  $("btnImportAdd").addEventListener("click",()=>{
    const txt=String($("importPgnText").value||"").trim();
    if(!txt){ openImport(false); return; }
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId); if(!st) return;
    const g=gameFromTemplate("Imported");
    const m=txt.match(/\[Event\s+\"([^\"]+)\"\]/i); if(m) g.title=m[1];
    STATE.games[g.id]=g; STATE.gamesMeta[g.id]={id:g.id,title:g.title}; st.games.unshift(g.id);
    openImport(false); renderGames();
  });

  $("btnReloadEvals").addEventListener("click",()=>{ $("evalsStatus").textContent="reloaded "+new Date().toISOString().slice(11,19); });

  function logLine(msg){
    const el=$("errorLog");
    el.textContent=(el.textContent?el.textContent+"\n":"")+msg;
    $("errCount").textContent=String(el.textContent?el.textContent.split("\n").length:0);
  }
  $("btnClearErrors").addEventListener("click",()=>{ $("errorLog").textContent=""; $("errCount").textContent="0"; });
  $("qUseCurrent").addEventListener("click",()=>{ $("qPgnName").textContent="(board)"; });
  $("qRun").addEventListener("click",()=>{
    logLine("CQL workaround: input had 1 game");
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId); if(!st) return;
    while(st.games.length<2){
      const g=gameFromTemplate("CQL result");
      STATE.games[g.id]=g; STATE.gamesMeta[g.id]={id:g.id,title:"CQL result "+g.id};
      st.games.unshift(g.id);
    }
    renderGames();
  });

  function boot(){
    makeSquares();
    STATE.studies=[{id:"studyA",name:"Study A",games:[]},{id:"studyB",name:"Study B",games:[]}];
    STATE.activeStudyId="studyA";
    const g1=gameFromTemplate("Game 1");
    const g2=gameFromTemplate("Game 2");
    STATE.games[g1.id]=g1; STATE.games[g2.id]=g2;
    STATE.gamesMeta[g1.id]={id:g1.id,title:g1.title};
    STATE.gamesMeta[g2.id]={id:g2.id,title:g2.title};
    STATE.studies[0].games=[g1.id,g2.id];
    STATE.activeGameId=g1.id;
    renderStudies(); renderGames(); renderPriyomes();
    setTab("moves");
    setSetup(false);
    setDrawMode("none");
    renderBoard(); renderMoves(); syncPgn();
    $("toolStatus").textContent="ready";
  }
  boot();
})();
</script>
</body>
</html>
