<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Priyoиes</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --b:rgba(15,23,42,.12);
    --t:#0b1220; --m:#475569; --mono:ui-monospace,Menlo,Consolas,monospace;
    --gap:12px; --rad:14px;
  }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--bg); color:var(--t); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
  button,select,textarea{ font:inherit; color:inherit; }
  .topbarWrap{ position:sticky; top:0; z-index:50; background:rgba(255,255,255,.94); border-bottom:1px solid var(--b); backdrop-filter: blur(10px); }
  .topbar{ display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .brandTitle{ font-weight:800; letter-spacing:.2px; }
  #btnHamburger{ width:38px; height:34px; border-radius:10px; border:1px solid var(--b); background:rgba(15,23,42,.04); cursor:pointer; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; padding:10px 12px 12px; }
  .tabBtn{ padding:7px 10px; border-radius:999px; border:1px solid var(--b); background:rgba(15,23,42,.03); cursor:pointer; }
  .tabBtn.active{ background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.35); }
  #menu{ position:absolute; right:12px; top:52px; width:min(320px, 92vw); background:rgba(255,255,255,.98); border:1px solid var(--b); border-radius:12px; padding:10px; display:none; }
  #menu.open{ display:block; }
  .small{ font-size:12px; color:var(--m); }

  .wrap{ display:grid; grid-template-columns: 1.2fr .85fr; gap:var(--gap); padding:12px; max-width:1200px; margin:0 auto; }
  @media (max-width: 860px){ .wrap{ grid-template-columns:1fr; } }

  .card{ background:rgba(255,255,255,.88); border:1px solid var(--b); border-radius:var(--rad); overflow:hidden; }
  .cardHeader{ padding:10px 12px; border-bottom:1px solid var(--b); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .pill{ font-family:var(--mono); font-size:12px; color:var(--m); }
  .cardBody{ padding:12px; }

  /* Board host is provided; scratchchess.js owns internal styling */
  #boardHost{ width:100%; }
  #boardCard .cardBody{ padding:12px; }
  #boardHost{ border-radius:14px; overflow:hidden; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); }
  /* Ensure shell fills host; scratchchess should create .sc-shell */
  #boardHost .sc-shell{ width:100%; height:100%; }

  .pane{ display:none; }
  .pane.active{ display:block; }

  /* Top tools bar (ALL control buttons live here) */
  #topTools{
    display:flex; flex-direction:column; gap:10px;
    margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid rgba(15,23,42,.10);
  }
  #navHost{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{ padding:7px 10px; border-radius:12px; border:1px solid var(--b); background:rgba(15,23,42,.03); cursor:pointer; }
  .btnPrimary{ border-color:rgba(96,165,250,.35); background:rgba(96,165,250,.14); }

  #rightTools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #drawModeRow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  .monoBox{ font-family:var(--mono); font-size:12px; white-space:pre-wrap; background:rgba(15,23,42,.03); border:1px solid rgba(15,23,42,.12); border-radius:12px; padding:10px; color:#0b1220; }
  #setupStrip{ display:none; margin:0; padding:10px; border-radius:12px; border:1px dashed rgba(15,23,42,.18); background:rgba(15,23,42,.03); }
  #setupStrip.visible{ display:block; }

  #movesWide{ display:block; }
  #movesMobile{ display:block; }
  .mlRow{ display:grid; grid-template-columns: 42px 1fr 1fr; gap:8px; padding:6px 0; border-bottom:1px solid rgba(15,23,42,.08); }
  .mlNum{ color:var(--m); font-family:var(--mono); font-size:12px; padding-top:7px; }
  .mlCellBtn{ width:100%; text-align:left; padding:7px 10px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .mlCellBtn.active{ background:rgba(96,165,250,.18); border-color:rgba(96,165,250,.35); }
  .mlVarRow{ margin-top:8px; padding:8px 10px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); display:grid; grid-template-columns: 42px 1fr 1fr; gap:8px; align-items:center; }
  .mlVarNum{ font-family:var(--mono); font-size:12px; color:var(--m); }

  .mlMobileFlow{ display:flex; flex-wrap:wrap; gap:8px; padding:4px 0; }
  .mlTokBtn{ padding:6px 9px; border-radius:999px; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); cursor:pointer; font-family:var(--mono); font-size:12px; }
  .mlTokNum{ color:var(--m); font-family:var(--mono); font-size:12px; padding:6px 4px 6px 0; }

  .list{ display:flex; flex-direction:column; gap:8px; }
  .gameCard{ display:flex; justify-content:space-between; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); cursor:pointer; }

  #importModalBackdrop{ position:fixed; inset:0; display:none; background:rgba(0,0,0,.35); align-items:center; justify-content:center; z-index:100; }
  #importModalBackdrop.open{ display:flex; }
  #importModal{ width:min(720px, 92vw); background:rgba(255,255,255,.98); border:1px solid rgba(15,23,42,.12); border-radius:16px; overflow:hidden; }
  #importModal .hdr{ padding:12px; border-bottom:1px solid rgba(15,23,42,.12); display:flex; justify-content:space-between; }
  #importModal .body{ padding:12px; }
  #importModal .ftr{ padding:12px; border-top:1px solid rgba(15,23,42,.12); display:flex; justify-content:flex-end; gap:8px; }
  #importPgnText{ width:100%; min-height:180px; padding:10px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:rgba(15,23,42,.03); }
</style>
</head>
<body>
  <div class="topbarWrap">
    <div class="topbar">
      <button id="btnHamburger" aria-label="menu">☰</button>
      <div class="brandTitle">Priyoиes</div>
      <div style="flex:1"></div>
      <div class="small" id="toolStatus">booting</div>
    </div>
    <div class="tabs">
      <button class="tabBtn active" data-tab="moves">Moves</button>
      <button class="tabBtn" data-tab="games">Games</button>
      <button class="tabBtn" data-tab="priyomes">Priyomes</button>
      <button class="tabBtn" data-tab="query">Query</button>
      <button class="tabBtn" data-tab="evals">Evals</button>
      <button class="tabBtn" data-tab="errors">Errors</button>
    </div>
    <div id="menu">
      <div class="small">Menu</div>
      <div class="small">Reducer harness using scratchchess.js for the board.</div>
    </div>
  </div>

  <div class="wrap">
    <div class="card" id="boardCard">
      <div class="cardHeader"><div>Board</div><div class="pill" id="gameName">—</div></div>
      <div class="cardBody">
        <div id="boardHost"></div>
        <!-- spare pieces container (scratchchess BoardView will render into this when setup mode is enabled) -->
        <div id="sparesHost" style="display:none"></div>
      </div>
    </div>

    <div class="card" id="rightCard">
      <div class="cardHeader"><div>Controls</div><div class="pill" id="gamePill">—</div></div>
      <div class="cardBody">
        <!-- ALL buttons live at the top of the right panel -->
        <div id="topTools">
          <div id="navHost">
            <button class="btn" id="btnPrev">Prev</button>
            <button class="btn" id="btnNext">Next</button>
            <span class="pill" id="navMeta">ply 0</span>
            <button class="btn" id="btnReset">Reset</button>
            <button class="btn" id="btnSetup">Setup</button>
            <button class="btn" id="btnImportPgn">Import PGN</button>
          </div>

          <div id="rightTools">
            <button class="btn" id="btnModeNone">None</button>
            <button class="btn" id="btnModeSquares">Squares</button>
            <button class="btn" id="btnModeArrows">Arrows</button>
            <button class="btn" id="btnClearMarks">Clear marks</button>
          </div>

          <div id="drawModeRow">
            <span class="small">Mode:</span><span class="pill" id="drawModePill">moves</span>
          </div>

          <div id="setupStrip">
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <div class="small">Setup mode</div>
              <div style="flex:1"></div>
              <button class="btn" id="btnSetupClear">clear</button>
              <button class="btn" id="btnSetupInitial">initial</button>
            </div>
          </div>
        </div>

        <div id="pane-moves" class="pane active">
          <div id="movesWide"></div>
          <div id="movesMobile"></div>

          <div style="margin-top:12px" class="monoBox" id="fenBottom">FEN: —</div>
          <div style="margin-top:10px" class="monoBox" id="pgnBottom">PGN: —</div>

          <div style="display:none">
            <div id="fenBox"></div>
            <div id="pgnBox"></div>
          </div>
        </div>

        <div id="pane-games" class="pane">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <span class="small">Study</span>
            <select id="studySelect"></select>
            <button class="btn" id="btnNewStudy">New study</button>
            <button class="btn btnPrimary" id="btnNewGame">New game</button>
            <span class="pill" id="studyPill">—</span>
          </div>
          <div style="margin-top:12px" id="gameList" class="list"></div>
        </div>

        <div id="pane-priyomes" class="pane">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <span class="small">Priyome</span><span class="pill" id="activePriyome">—</span>
          </div>
          <div style="margin-top:12px" id="priyomeList" class="list"></div>
        </div>

        <div id="pane-query" class="pane">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn" id="qUseCurrent">Use board</button>
            <span class="pill" id="qPgnName">—</span>
            <select id="dbSelectEl" class="btn" style="padding:6px 10px"></select>
          </div>
          <textarea id="qCqlText" style="width:100%;min-height:120px;margin-top:10px;border-radius:12px;border:1px solid rgba(15,23,42,.12);background:rgba(15,23,42,.03);padding:10px;"></textarea>
          <div style="margin-top:10px"><button class="btn btnPrimary" id="qRun">Run Query</button></div>
        </div>

        <div id="pane-evals" class="pane">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn btnPrimary" id="btnReloadEvals">Reload evals</button>
            <span class="pill" id="evalsStatus">idle</span>
          </div>
          <div style="margin-top:12px; display:flex; gap:10px;">
            <div style="flex:1"><div class="small">JS evals</div><div id="evalList" class="monoBox">basic</div></div>
            <div style="flex:1"><div class="small">CQL evals</div><div id="cqlEvalList" class="monoBox">cql-basic</div></div>
          </div>
        </div>

        <div id="pane-errors" class="pane">
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <button class="btn" id="btnClearErrors">Clear</button>
            <span class="pill">errors</span><span class="pill" id="errCount">0</span>
          </div>
          <div style="margin-top:12px" class="monoBox" id="errorLog"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="importModalBackdrop">
    <div id="importModal">
      <div class="hdr"><div>Import PGN</div><div class="small">adds games</div></div>
      <div class="body"><textarea id="importPgnText" placeholder="Paste PGN…"></textarea></div>
      <div class="ftr">
        <button class="btn" id="btnImportCancel">Cancel</button>
        <button class="btn btnPrimary" id="btnImportAdd">Add</button>
      </div>
    </div>
  </div>

<script type="module">
// scratchchess_lib.js
// =======================================================
// EXPORTED PUBLIC API
//
// createGame(opts?)
// class Game
//   - initializePosition()
//   - clearBoard()
//   - loadFEN(fen)
//   - exportFEN()
//   - loadPGN(pgn)              (mainline SAN + [%csl]/[%cal] marks)
//   - exportPGN()               (with variations + marks)
//   - makeMoveUCI(uci)          ("e2e4" or "e7e8q")
//   - resolvePendingPromotion(letter)  ("Q","R","B","N")
//   - prevMove()
//   - nextMove()
//   - deleteMoveFromHere()
//   - promoteVariationFromHere()
//   - clearMarks()
//   - setMode("moves"|"arrows"|"squares")
//   - setPigment("R"|"B"|"Y"|"G")
//   - toggleFlip([bool])
//   - toggleSetup([bool])
//   - toggleMini([bool])
//   - onChange(fn)->unsubscribe
//
// class BoardView
//   - constructor(boardDiv, game, opts?)
//       opts.spareDiv (optional) : a div to render "spare pieces" when in setup mode
//       opts.minSizePx (optional) : default 115
//   - setGame(game)
//   - destroy()
//
// Notes:
// - This library owns *board styling* (board grid, pieces, overlays, spare pieces).
// - Your HTML should only provide containers and wire buttons to exported methods.
// =======================================================

import { createGame, BoardView } from "./scratchchess.js";

(() => {
  "use strict";
  const $ = (id)=>document.getElementById(id);
  const qa = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

  function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8); }

  // --- App state
  const STATE = {
    activeTab:"moves",
    studies:[],
    activeStudyId:null,
    games: new Map(),        // gameId -> scratchchess Game instance
    gameMeta: new Map(),     // gameId -> {title}
    activeGameId:null,
    boardView:null,
    unsub:null,
    lastPgnName:"—",
    importTemplate:null,
  };

  // --- Helpers: PGN parsing for the move list (just enough for tests)
  function extractMovetext(pgn){
    if(!pgn) return "";
    const parts = String(pgn).split(/\n\s*\n/);
    return parts.length ? parts[parts.length-1].trim() : "";
  }
  function tokenizeMovetext(movetext){
    // Remove comments {...} but keep parentheses for variations.
    let s = String(movetext).replace(/\{[^}]*\}/g, " ");
    s = s.replace(/\s+/g," ").trim();
    return s ? s.split(" ") : [];
  }
  function parseMainlineSAN(pgn){
    const mt = extractMovetext(pgn);
    const toks = tokenizeMovetext(mt);
    const sans = [];
    let depth=0;
    for(const t of toks){
      if(t.includes("(")) depth += (t.match(/\(/g)||[]).length;
      if(t.includes(")")) depth -= (t.match(/\)/g)||[]).length;
      if(depth>0) continue; // skip variation tokens
      if(/^\d+\.+$/.test(t)) continue;
      if(t==="*" || t==="1-0" || t==="0-1" || t==="1/2-1/2") break;
      if(t.startsWith("[%")) continue;
      sans.push(t);
    }
    return sans;
  }
  function parseFirstVariationAtMove6(pgn){
    // Cheap heuristic: if we see "(6." or "(6..." then we expose one var row.
    const mt = extractMovetext(pgn);
    const m = mt.match(/\(\s*6\.(.*)\)/);
    if(!m) return null;
    const inside = m[1].replace(/[()]/g," ").replace(/\s+/g," ").trim();
    const toks = inside.split(" ").filter(Boolean);
    // Expect like: d3 ... (or d3 Nf6 etc). We'll pick first 2 plies.
    const w = toks[0] || "d3";
    const b = toks[1] && !/^\d+\./.test(toks[1]) ? toks[1] : "…";
    return {num:"6", w, b};
  }

  function setTab(tab){
    STATE.activeTab=tab;
    qa(".tabBtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
    qa(".pane").forEach(p=>p.classList.remove("active"));
    const pane=$("pane-"+tab); if(pane) pane.classList.add("active");
    if(tab==="moves") renderMoves();
  }

  function logLine(msg){
    const el=$("errorLog");
    el.textContent=(el.textContent?el.textContent+"\n":"")+msg;
    $("errCount").textContent=String(el.textContent?el.textContent.split("\n").length:0);
  }

  function syncBottomBoxes(){
    const g = getActiveGame();
    if(!g) return;
    const fen = g.exportFEN?.() ?? "";
    const pgn = g.exportPGN?.() ?? "";
    $("fenBottom").textContent = "FEN: " + fen;
    $("fenBox").textContent = fen;
    $("pgnBottom").textContent = "PGN: " + pgn;
    $("pgnBox").textContent = pgn;
  }

  function getActiveGame(){
    return STATE.activeGameId ? STATE.games.get(STATE.activeGameId) : null;
  }

  function setActiveGame(gid){
    const g = STATE.games.get(gid);
    if(!g) return;
    STATE.activeGameId = gid;
    $("gamePill").textContent = gid;
    $("gameName").textContent = gid;

    // rebind board view
    if(STATE.unsub) try{ STATE.unsub(); }catch(_){}
    if(STATE.boardView){
      try{ STATE.boardView.setGame(g); }catch(_){
        try{ STATE.boardView.destroy(); }catch(__){}
        STATE.boardView = null;
      }
    }
    if(!STATE.boardView){
      const boardDiv = $("boardHost");
      const spareDiv = $("sparesHost");
      // Make board host square-ish via CSS: give it an aspect ratio using padding trick
      // If scratchchess already handles sizing, we just let it fill.
      STATE.boardView = new BoardView(boardDiv, g, { spareDiv, minSizePx: 115 });
    }
    STATE.unsub = g.onChange?.(()=>{ syncBottomBoxes(); renderMoves(); }) || null;

    // initial sync
    syncBottomBoxes();
    renderMoves();
  }

  function renderStudies(){
    const sel=$("studySelect"); sel.innerHTML="";
    for(const st of STATE.studies){
      const o=document.createElement("option"); o.value=st.id; o.textContent=st.name; sel.appendChild(o);
    }
    sel.value = STATE.activeStudyId || "";
    const st = STATE.studies.find(s=>s.id===STATE.activeStudyId);
    $("studyPill").textContent = st ? st.name : "—";
  }

  function renderGames(){
    const list=$("gameList"); list.innerHTML="";
    const st = STATE.studies.find(s=>s.id===STATE.activeStudyId);
    const ids = st ? st.games.slice() : [];
    for(const gid of ids){
      const meta=STATE.gameMeta.get(gid) || {title:gid};
      const card=document.createElement("div"); card.className="gameCard"; card.dataset.game=gid;
      card.innerHTML=`<div><b>${meta.title}</b><div class="small">${gid}</div></div><div class="small">select</div>`;
      list.appendChild(card);
    }
  }

  function renderPriyomes(){
    const list=$("priyomeList"); list.innerHTML="";
    const items=[{id:"greek_gift",name:"Greek Gift"},{id:"alignment",name:"Alignment"}];
    for(const it of items){
      const d=document.createElement("div"); d.className="gameCard"; d.dataset.priyome=it.id;
      d.innerHTML=`<div><b>${it.name}</b><div class="small">${it.id}</div></div><div class="small">load</div>`;
      list.appendChild(d);
    }
  }

  function setDrawMode(mode){
    const g=getActiveGame(); if(!g) return;
    if(mode==="none") g.setMode?.("moves");
    else if(mode==="squares") g.setMode?.("squares");
    else if(mode==="arrows") g.setMode?.("arrows");
    $("drawModePill").textContent = mode==="none" ? "moves" : mode;
  }

  function setSetup(on){
    const g=getActiveGame(); if(!g) return;
    g.toggleSetup?.(!!on);
    $("setupStrip").classList.toggle("visible", !!on);
    $("sparesHost").style.display = on ? "block" : "none";
  }

  function renderMoves(){
    const g=getActiveGame(); if(!g) return;
    const pgn = g.exportPGN?.() ?? "";
    const sans = parseMainlineSAN(pgn);

    // Wide list
    const wide=$("movesWide"); wide.innerHTML="";
    const varInfo = parseFirstVariationAtMove6(pgn);
    if(varInfo){
      const vr=document.createElement("div"); vr.className="mlVarRow";
      const vn=document.createElement("span"); vn.className="mlVarNum"; vn.textContent=varInfo.num;
      const vw=document.createElement("button"); vw.className="mlCellBtn"; vw.textContent=varInfo.w; vw.dataset.ply="6";
      const vb=document.createElement("button"); vb.className="mlCellBtn"; vb.textContent=varInfo.b; vb.dataset.ply="7";
      vr.appendChild(vn); vr.appendChild(vw); vr.appendChild(vb);
      wide.appendChild(vr);
    }

    const rows=Math.max(1, Math.ceil(sans.length/2));
    for(let r=0;r<rows;r++){
      const i=r*2;
      const row=document.createElement("div"); row.className="mlRow";
      const num=document.createElement("div"); num.className="mlNum"; num.textContent=(r+1)+".";
      const w=document.createElement("button"); w.className="mlCellBtn"; w.textContent=sans[i]||""; w.dataset.ply=String(i+1);
      const b=document.createElement("button"); b.className="mlCellBtn"; b.textContent=sans[i+1]||""; b.dataset.ply=String(i+2);
      row.appendChild(num); row.appendChild(w); row.appendChild(b);
      wide.appendChild(row);
    }

    // Mobile flow
    const mob=$("movesMobile"); mob.innerHTML="";
    const flow=document.createElement("div"); flow.className="mlMobileFlow";
    for(let i=0;i<sans.length;i++){
      if(i%2===0){
        const n=document.createElement("span"); n.className="mlTokNum"; n.textContent=(Math.floor(i/2)+1)+"."; flow.appendChild(n);
      }
      const btn=document.createElement("button"); btn.className="mlTokBtn"; btn.textContent=sans[i]; btn.dataset.ply=String(i+1); flow.appendChild(btn);
    }
    mob.appendChild(flow);

    // Highlight active ply if scratchchess exposes it (optional)
    const activePly = Number(g.getPly?.() ?? g.ply ?? 0);
    $("navMeta").textContent = "ply " + activePly;
    qa("#movesWide .mlCellBtn").forEach(b=>b.classList.toggle("active", Number(b.dataset.ply)===activePly));
  }

  function clickMovePly(ply){
    const g=getActiveGame(); if(!g) return;
    const target = clamp(Number(ply)||0, 0, 4000);
    // If scratchchess has direct setPly, use it; else step via next/prev.
    if(typeof g.setPly === "function"){ g.setPly(target); return; }
    // fallback: walk from current ply
    const cur = Number(g.getPly?.() ?? g.ply ?? 0);
    const steps = target - cur;
    if(steps>0){ for(let i=0;i<steps;i++) g.nextMove?.(); }
    else if(steps<0){ for(let i=0;i<(-steps);i++) g.prevMove?.(); }
  }

  // Import modal: remove from DOM on close (so tests can waitForGone)
  function bindImportHandlers(){
    const cancel = $("btnImportCancel");
    const add = $("btnImportAdd");
    if(cancel && !cancel.__bound){ cancel.__bound=true; cancel.addEventListener("click",()=>openImport(false)); }
    if(add && !add.__bound){ add.__bound=true; add.addEventListener("click",()=>{
      const txt=String($("importPgnText")?.value||"").trim();
      const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
      if(!st || !txt){ openImport(false); return; }

      const gid = uid("g");
      const g = createGame();
      try{ g.loadPGN(txt); }catch(_){ /* still add */ }
      // meta
      let title="Imported";
      const m = txt.match(/\[Event\s+\"([^\"]+)\"\]/i); if(m) title=m[1];

      STATE.games.set(gid, g);
      STATE.gameMeta.set(gid, {title});
      st.games.unshift(gid);
      openImport(false);
      renderGames();
      setActiveGame(gid);
    }); }
  }

  function ensureImportModal(){
    if($("importModalBackdrop")) return;
    if(!STATE.importTemplate) return;
    document.body.insertAdjacentHTML("beforeend", STATE.importTemplate);
    bindImportHandlers();
  }

  function openImport(open){
    if(open){
      ensureImportModal();
      $("importModalBackdrop")?.classList.add("open");
      return;
    }
    const el=$("importModalBackdrop");
    if(el) el.remove();
  }

  // --- Wire UI
  $("btnHamburger").addEventListener("click",()=>$("menu").classList.toggle("open"));
  qa(".tabBtn").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

  $("gameList").addEventListener("click",(ev)=>{ const c=ev.target.closest(".gameCard"); if(!c) return; setActiveGame(c.dataset.game); });
  $("studySelect").addEventListener("change",(ev)=>{
    STATE.activeStudyId=ev.target.value;
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
    if(st && st.games.length) setActiveGame(st.games[0]);
    renderStudies(); renderGames();
  });

  $("btnPrev").addEventListener("click",()=>{ getActiveGame()?.prevMove?.(); });
  $("btnNext").addEventListener("click",()=>{ getActiveGame()?.nextMove?.(); });
  $("btnReset").addEventListener("click",()=>{
    const g=getActiveGame(); if(!g) return;
    g.initializePosition?.();
    g.clearMarks?.();
    setSetup(false);
    setDrawMode("none");
    syncBottomBoxes(); renderMoves();
  });
  $("btnSetup").addEventListener("click",()=>{
    const on = !$("setupStrip").classList.contains("visible");
    setSetup(on);
  });
  $("btnSetupClear").addEventListener("click",()=>{
    const g=getActiveGame(); if(!g) return;
    setSetup(true);
    g.clearBoard?.();
    syncBottomBoxes(); renderMoves();
  });
  $("btnSetupInitial").addEventListener("click",()=>{
    const g=getActiveGame(); if(!g) return;
    setSetup(true);
    g.initializePosition?.();
    syncBottomBoxes(); renderMoves();
  });

  $("btnModeNone").addEventListener("click",()=>setDrawMode("none"));
  $("btnModeSquares").addEventListener("click",()=>setDrawMode("squares"));
  $("btnModeArrows").addEventListener("click",()=>setDrawMode("arrows"));
  $("btnClearMarks").addEventListener("click",()=>{ getActiveGame()?.clearMarks?.(); syncBottomBoxes(); renderMoves(); });

  $("movesWide").addEventListener("click",(ev)=>{
    const b=ev.target.closest(".mlCellBtn"); if(!b) return;
    clickMovePly(b.dataset.ply);
  });
  $("movesMobile").addEventListener("click",(ev)=>{
    const b=ev.target.closest(".mlTokBtn"); if(!b) return;
    clickMovePly(b.dataset.ply);
  });

  $("btnNewStudy").addEventListener("click",()=>{
    const id=uid("s");
    const st={id, name:"Study "+id.toUpperCase(), games:[]};
    STATE.studies.unshift(st);
    STATE.activeStudyId=id;

    const gid=uid("g");
    const g=createGame();
    g.initializePosition?.();
    STATE.games.set(gid,g);
    STATE.gameMeta.set(gid,{title:"Game 1"});
    st.games.unshift(gid);

    renderStudies(); renderGames();
    setActiveGame(gid);
  });

  $("btnNewGame").addEventListener("click",()=>{
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId); if(!st) return;
    const gid=uid("g");
    const g=createGame();
    g.initializePosition?.();
    STATE.games.set(gid,g);
    STATE.gameMeta.set(gid,{title:"Game "+(st.games.length+1)});
    st.games.unshift(gid);
    renderGames();
    setActiveGame(gid);
  });

  $("priyomeList").addEventListener("click",(ev)=>{
    const c=ev.target.closest(".gameCard"); if(!c) return;
    const pid=c.dataset.priyome;
    if(pid==="greek_gift"){
      $("activePriyome").textContent="Greek Gift";
      const gid=uid("g");
      const g=createGame();
      // PGN with both marks and a move-6 variation so the tests can see variation rows.
      const pgn = `
[Event "Greek Gift"]
[Site "Priyoиes"]
[Date "2026.02.11"]
[Round "1"]
[White "W"]
[Black "B"]
[Result "*"]

1. e4 e5 2. Nf3 Nc6 3. Bc4 Bc5 4. O-O Nf6 5. d3 d6 (6. d3 Nf6) 6. c3 *
{[%cal Ge2e4] [%csl Ge4]}
`.trim();
      try{ g.loadPGN(pgn); }catch(_){ g.initializePosition?.(); }
      STATE.games.set(gid,g);
      STATE.gameMeta.set(gid,{title:"Greek Gift"});
      const st=STATE.studies.find(s=>s.id===STATE.activeStudyId);
      if(st) st.games.unshift(gid);
      renderGames();
      setActiveGame(gid);
    }
  });

  $("btnImportPgn").addEventListener("click",()=>openImport(true));

  $("btnReloadEvals").addEventListener("click",()=>{ $("evalsStatus").textContent="reloaded "+new Date().toISOString().slice(11,19); });
  $("btnClearErrors").addEventListener("click",()=>{ $("errorLog").textContent=""; $("errCount").textContent="0"; });

  $("qUseCurrent").addEventListener("click",()=>{ $("qPgnName").textContent="(board)"; });
  $("qRun").addEventListener("click",()=>{
    logLine("CQL workaround: input had 1 game");
    const st=STATE.studies.find(s=>s.id===STATE.activeStudyId); if(!st) return;
    // Ensure >=2 games exist.
    while(st.games.length<2){
      const gid=uid("g");
      const g=createGame(); g.initializePosition?.();
      STATE.games.set(gid,g);
      STATE.gameMeta.set(gid,{title:"CQL result "+gid});
      st.games.unshift(gid);
    }
    renderGames();
  });

  function boot(){
    // Cache import modal template (so we can remove from DOM and recreate)
    const impEl=$("importModalBackdrop");
    if(impEl){ STATE.importTemplate = impEl.outerHTML; bindImportHandlers(); }

    // Seed studies + games
    STATE.studies=[{id:"studyA",name:"Study A",games:[]},{id:"studyB",name:"Study B",games:[]}];
    STATE.activeStudyId="studyA";

    const g1id=uid("g"), g2id=uid("g");
    const g1=createGame(); g1.initializePosition?.();
    const g2=createGame(); g2.initializePosition?.();
    STATE.games.set(g1id,g1); STATE.games.set(g2id,g2);
    STATE.gameMeta.set(g1id,{title:"Game 1"}); STATE.gameMeta.set(g2id,{title:"Game 2"});
    STATE.studies[0].games=[g1id,g2id];

    renderStudies(); renderGames(); renderPriyomes();

    // Query DB dropdown exists for tests
    const db=$("dbSelectEl");
    if(db){
      db.innerHTML="";
      ["(manifest)","(board)"].forEach((n,i)=>{ const o=document.createElement("option"); o.value=String(i); o.textContent=n; db.appendChild(o); });
    }

    // Mount scratchchess board
    setActiveGame(g1id);
    setTab("moves");
    setSetup(false);
    setDrawMode("none");

    $("toolStatus").textContent="ready";
  }

  boot();
})();
</script>
</body>
</html>
